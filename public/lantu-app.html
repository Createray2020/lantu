<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嵐途 LAN TU · 全方位財務規劃</title>
<style>
:root{--bg:#081a2b;--panel:#0d2b45;--card:#12334f;--card2:#17406a;--line:rgba(255,255,255,.11);
 --tx:#eef2f7;--mut:#a7bacb;--mut2:#6f869c;--amber:#c99a5b;--amber2:#e0bd8b;--teal:#a9bccf;
 --blue:#a9bccf;--purple:#b7c6b0;--ok:#8fc0a3;--warn:#e08a68;--r:12px;
 --serif:"Noto Serif TC","Songti TC","PingFang TC",serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:14px}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
h1,h2,h3,h4{margin:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-right:150px;background:linear-gradient(90deg,#081a2b,#0d2b45);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:800;display:flex;align-items:center;gap:11px}
.brand:hover{opacity:.85}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt .zh{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--tx)}
.brand .bt .en{font-size:9.5px;letter-spacing:.34em;color:var(--amber2);font-weight:600}
.brand small{color:var(--mut2);font-weight:600;font-size:11px;margin-left:4px}
.spacer{flex:1}
.roleSw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.roleSw button{border:none;background:none;color:var(--mut);padding:6px 16px;border-radius:999px;font-weight:700;font-size:13px}
.roleSw button.on{background:var(--amber);color:#08202a}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.tbtn:hover{background:var(--card2)}.tbtn.amber{background:var(--amber);color:#08202a;border-color:var(--amber)}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 55px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 13px}
.side h3{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:4px 0 10px}
.clientcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
.clientcard:hover{background:var(--card2)}.clientcard.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.clientcard .nm{font-weight:700}.clientcard .mt{color:var(--mut);font-size:12px}
.clientcard .gr{position:absolute;top:9px;right:10px;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.92}
.main{padding:20px 24px;overflow:auto}
.tabbar{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabbar button{background:none;border:none;color:var(--mut);padding:9px 14px;font-weight:700;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.on{color:var(--amber);border-bottom-color:var(--amber)}
/* 資料分頁：分組導覽（B 排法＋A 視覺） */
.dgroups{border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:5px;display:flex;flex-direction:column;gap:3px}
.dgrow{display:flex;flex-wrap:wrap;align-items:center;gap:1px 3px}
.dglab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);background:#0a1a20;border:1px solid var(--line);border-radius:8px;padding:4px 11px;margin:2px 8px 2px 0;white-space:nowrap}
.dglab .dgn{font-family:var(--serif);font-size:15px;font-weight:800;line-height:1}
.dglab.exec{color:var(--mut2)}
/* 全域資料完整度列 */
.cmpl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#0a2137;border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:16px}
.cmpl .lab{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);white-space:nowrap}
.cmpl .dots{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.cmpl .dot{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.cmpl .dot i{width:7px;height:7px;border-radius:50%;background:var(--mut2);display:inline-block;font-style:normal}
.cmpl .dot.ok{color:var(--ok);border-color:rgba(143,192,163,.4)}
.cmpl .dot.ok i{background:var(--ok)}
.cmpl .dot.goal{border-style:dashed}
.cmpl .cnt{font-family:var(--serif);font-size:17px;font-weight:800;color:var(--amber2);white-space:nowrap}
.cmpl .note{width:100%;font-size:11.5px;color:var(--mut2)}
/* 人生目標卡（二態：選了＝必須達成） */
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.gcard{position:relative;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:11px;padding:11px 12px 10px;transition:.13s}
.gcard:hover{border-color:var(--amber2)}
.gcard .nm{font-weight:700;font-size:13.5px;line-height:1.35}
.gcard .sub{font-size:11px;color:var(--mut2);margin-top:3px}
.gcard.on{background:var(--amber);border-color:var(--amber);color:#08202a;box-shadow:0 2px 10px rgba(201,154,91,.22)}
.gcard.on .sub{color:rgba(8,32,42,.66)}
.gcard .ord{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;background:#08202a;color:var(--amber2);border:1.5px solid var(--amber);font-family:var(--serif);font-size:12.5px;font-weight:800;display:grid;place-items:center}
.gcard .lock{font-weight:800;color:rgba(8,32,42,.62)}
/* 必達優先序拖曳列 */
.prio{background:#0a2137;border:1px solid rgba(201,154,91,.32);border-radius:11px;padding:11px 12px;margin-bottom:12px}
.prio .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.prio .ph b{font-size:12.5px;color:var(--amber2);letter-spacing:.03em}
.prow{display:flex;flex-wrap:wrap;gap:7px}
.pitem{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 6px 5px 9px;cursor:grab;user-select:none}
.pitem.drag{opacity:.35}
.pitem.over{border-color:var(--amber2);box-shadow:0 0 0 1px var(--amber2) inset}
.pitem .n{font-family:var(--serif);font-size:14px;font-weight:800;color:var(--amber2);min-width:14px;text-align:center}
.pitem .t{font-weight:700;font-size:13px}
.pitem .g{color:var(--mut2);font-size:13px;letter-spacing:-2px}
.pitem .mv{display:flex;gap:2px}
.pitem .mv button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;width:22px;height:22px;font-size:11px;line-height:1;padding:0}
.pitem .mv button:hover{border-color:var(--amber2);color:var(--amber2)}
.pitem .x{background:none;border:none;color:var(--mut2);font-size:14px;padding:0 3px}
.pitem .go{background:rgba(143,192,163,.12);border:1px solid rgba(143,192,163,.4);color:var(--teal);border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;line-height:1.5;white-space:nowrap}
.pitem .go:hover{background:rgba(143,192,163,.24)}
.pitem .go .tb{color:var(--mut2);font-weight:400}
.goalflash{animation:goalflash 1.6s ease-out}
@keyframes goalflash{0%,40%{box-shadow:0 0 0 2px var(--amber2)}100%{box-shadow:0 0 0 2px rgba(0,0,0,0)}}
.pitem .x:hover{color:var(--warn)}
/* 未選目標的收合列 */
.folded{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mut2);font-size:12.5px;border:1px dashed rgba(201,154,91,.34);border-radius:11px;padding:10px 13px;margin-bottom:14px}
.tagMust{font-size:10.5px;font-weight:800;letter-spacing:.04em;border:1px solid currentColor;border-radius:999px;padding:1px 8px;color:var(--ok)}
.tagOff{font-size:10.5px;font-weight:800;letter-spacing:.04em;border:1px solid currentColor;border-radius:999px;padding:1px 8px;color:var(--mut2)}
.owner{font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 9px;background:rgba(169,188,207,.14);color:var(--teal);border:1px solid rgba(169,188,207,.3)}
.dgrow .dtab{background:none;border:none;color:var(--mut);padding:8px 12px;font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dgrow .dtab:hover{color:var(--tx)}
.dgrow .dtab.on{color:var(--amber);border-bottom-color:var(--amber)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.sec h4{font-size:15px;margin-bottom:12px;color:var(--amber2);display:flex;align-items:center;gap:8px}
.sec h4 .add{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:4px 11px;font-size:12.5px;font-weight:700}
.sec .hint{color:var(--mut2);font-size:12px;font-weight:400;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11.5px;font-weight:700;white-space:nowrap}
td input,td select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 7px;font-size:12.5px}
td input[type=checkbox]{width:auto;min-width:0}
/* 下拉/輸入格不再被欄位數壓縮成看不到字；表格改為可橫向捲動 */
td select{width:auto;min-width:100%}
td input{min-width:82px}
td input[type=number]{min-width:88px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw>table{min-width:100%;width:auto}
td.calc{white-space:nowrap}
/* 人生財務目標清單 ↔ 人生價值環：左右並排對照 */
.lgwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.82fr);gap:16px;align-items:start}
.lgwrap>.sec{margin-bottom:0;min-width:0}
@media(max-width:1080px){.lgwrap{grid-template-columns:minmax(0,1fr)}.lgwrap>.sec{margin-bottom:16px}}
.del{background:none;border:none;color:var(--warn);font-size:15px;padding:0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.f input,.f select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;border-top:3px solid var(--teal)}
.kpi .lb{color:var(--mut);font-size:12.5px}.kpi .vv{font-size:22px;font-weight:800;margin-top:3px}.kpi small{color:var(--mut2);font-size:11px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gau{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.gau .t{color:var(--mut);font-size:13px}.arc{width:150px;height:82px;margin:8px auto 2px}.gau .sc{font-size:26px;font-weight:800}
.gradebox{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.gradebox .g{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:.04em}
.rtable td.k{color:var(--tx);font-weight:700}.rtable code{color:var(--teal);font-family:ui-monospace,monospace;font-size:12px}
.bad{color:var(--warn);font-weight:800}.good{color:var(--ok);font-weight:800}
.bar{height:8px;background:#0a1a20;border-radius:5px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:var(--teal)}
.advcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:11px;padding:13px 15px;margin-bottom:10px}
.advcard h4{color:var(--amber2);font-size:14.5px;margin-bottom:4px}.advcard p{margin:0;color:var(--mut);font-size:13px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.muted{color:var(--mut);font-size:12.5px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.big3 .b{background:#0a1a20;border:1px solid var(--line);border-radius:10px;padding:12px}
.big3 .b .l{color:var(--mut);font-size:12px}.big3 .b .v{font-size:19px;font-weight:800;margin-top:2px}
.report{background:#fdfbf6;color:#22333a;border-radius:14px;padding:34px 38px;max-width:820px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:var(--serif)}
.report h2{color:#0d2b45;border-bottom:2px solid #c99a5b;padding-bottom:8px;margin:26px 0 12px;font-size:20px;letter-spacing:.04em}
.report h2:first-child{margin-top:0}.report table{font-size:13px}
.report th,.report td{border-bottom:1px solid #e6e0d4;color:#33414a}.report th{color:#0d2b45;background:#f2ede2}
.report .rc{background:linear-gradient(135deg,#0d2b45,#0a2138);color:#fff;padding:24px 26px;margin:-34px -38px 22px;border-radius:14px 14px 0 0;border-bottom:3px solid #c99a5b}
.report .rc .k{color:#c99a5b;letter-spacing:.28em;font-size:11px;font-weight:700}.report .rc h1{font-size:26px;margin-top:6px;letter-spacing:.06em}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;box-shadow:none;max-width:100%}}
.hero2{background:linear-gradient(120deg,#0d2b45,#0c232b);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.hero2 .k{color:var(--amber);letter-spacing:.18em;font-size:12px;font-weight:700}.hero2 h1{font-size:26px;margin:6px 0}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.big3{grid-template-columns:1fr}}

/* ===== embed 模式（單一年度版本編輯器，由 /dashboard 外殼載入）===== */
html.embed .side,html.embed-single .side{display:none!important}
html.embed .shell,html.embed-single .shell{grid-template-columns:1fr!important}
/* ===== 收支資債 四合一輸入台 ===== */
.finsum{position:sticky;top:0;z-index:15;background:rgba(8,26,43,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.finsg{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.finsg .gt{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;letter-spacing:.16em;color:var(--amber2);font-weight:800}
.finsg .cells{display:flex;gap:14px;flex-wrap:wrap;align-items:center;flex:1}
.finsg .l{color:var(--mut);font-size:11.5px}.finsg .v{font-size:18px;font-weight:800;line-height:1.2}.finsg .v.big{font-size:21px}
.finsg .op{color:var(--mut2);font-size:18px;font-weight:800;align-self:center}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.finhint{color:var(--mut);font-size:12.5px;margin:0 2px 12px}
.finquad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:1024px){.finquad{grid-template-columns:minmax(0,1fr)}.finsum{grid-template-columns:minmax(0,1fr)}}
.finpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column}
.finpanel.inc{border-top:3px solid var(--ok)}.finpanel.exp{border-top:3px solid var(--warn)}.finpanel.ast{border-top:3px solid var(--teal)}.finpanel.lia{border-top:3px solid var(--amber)}
.finph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.finph h4{font-size:15px;color:var(--tx);margin:0}
.finph .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.finph .sub{margin-left:auto;text-align:right}.finph .sub .sl{color:var(--mut);font-size:11px}.finph .sub .sv{font-size:15px;font-weight:800}
.finph .add{margin-left:10px}
.fintag{font-size:10.5px;color:var(--mut2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:400}
.fintbl{overflow-x:auto;flex:1}
td.calc{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grp td{background:#0a1a20;color:var(--amber2);font-weight:700;font-size:12px}.grp .gm{color:var(--mut);font-weight:400}
.edutog{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 2px;font-size:.86rem;color:var(--mut)}
.edutog label{display:flex;align-items:center;gap:5px;cursor:pointer}
.edulock{margin-left:4px;font-size:.66rem;padding:0 4px;border-radius:5px;background:rgba(201,154,91,.18);color:#c99a5b}
.edunow{background:rgba(143,192,163,.07)}
.edunowtag{font-size:.66rem;padding:0 5px;border-radius:5px;background:rgba(143,192,163,.18);color:#8fc0a3}
.catsel{max-width:12rem}
.finname{display:flex;align-items:center;gap:4px}
input.amtin{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dh{display:inline-block;padding:0 4px;color:var(--mut2);cursor:grab;user-select:none;font-size:13px;line-height:1;vertical-align:middle}
.dh:active{cursor:grabbing}
tr.dragging{opacity:.45}
tr.dragover td{box-shadow:inset 0 2px 0 var(--amber2)}
.sortbtn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer;margin-left:6px}
.sortbtn:hover{color:var(--amber2);border-color:var(--amber2)}
.pcard.isrider{margin-left:24px;border-left:3px solid var(--amber2)}
.pcard.isrider .phd .who::before{content:'↳ ';color:var(--amber2)}
.ridernone{margin-top:8px;text-align:center}
.bgbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.bgbox>summary{cursor:pointer;font-size:12.5px;color:var(--amber2);list-style:none}
.bgbox>summary::-webkit-details-marker{display:none}
.bgbox>summary::before{content:'▸ ';color:var(--mut2)}
.bgbox[open]>summary::before{content:'▾ '}
.bgcnt{font-size:11px;color:var(--ok);margin-left:6px}
.bggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:9px}
.bgf label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.bgf textarea{width:100%;background:var(--panel2,#0a1a20);border:1px solid var(--line);border-radius:8px;color:inherit;font:inherit;font-size:12.5px;padding:6px 8px;resize:vertical;line-height:1.5}
.bgf textarea:focus{outline:none;border-color:var(--amber2)}
.loanblk summary::-webkit-details-marker{display:none}
.dupwarn{font-size:.68rem;padding:1px 6px;border-radius:6px;background:rgba(224,138,104,.16);color:var(--warn);white-space:nowrap;margin-left:4px}
.finname .todo{flex:none;font-size:.68rem;padding:1px 5px;border-radius:6px;background:rgba(201,154,91,.16);color:#c99a5b;white-space:nowrap}
.exp-btn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 7px;font-size:12px;line-height:1.4}
.exp-btn.on{color:var(--amber2);border-color:var(--amber);background:rgba(201,154,91,.12)}
.acts{white-space:nowrap;display:flex;gap:4px;align-items:center}
.drow>td{background:#091420;padding:9px 12px 11px}
.dform{display:flex;flex-wrap:wrap;gap:9px 15px}
.dfield{display:flex;flex-direction:column;gap:2px}.dfield label{color:var(--mut);font-size:11px}
.dfield input,.dfield select{width:auto;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 7px;font-size:12.5px;min-width:118px}
.dhead{width:100%;color:var(--mut2);font-size:11px;letter-spacing:.06em;margin-bottom:2px}

 c.legacy=_fill(d.legacy,c.legacy);
 c.career=_fill(d.career,c.career);
 c.marriage=_fill(d.marriage,c.marriage);
 if(!c.riskQuiz||typeof c.riskQuiz!=='object')c.riskQuiz={ans:{}};
 if(!c.riskQuiz.ans||typeof c.riskQuiz.ans!=='object')c.riskQuiz.ans={};
 CASE_ARRAYS.forEach(function(k){if(!Array.isArray(c[k]))c[k]=[]});
 // 2026/08/20 短暫存在過的 otherNote（「其他」的明細欄）已收斂成統一的「項目」欄。
 // 那段期間存過的資料把 otherNote 搬進 name，別讓顧問填的字不見。
 ['incomes','expenses','savings','assets','liabilities'].forEach(function(k){
  c[k].forEach(function(x){
   if(!x||typeof x!=='object')return;
   if(x.name==null)x.name='';
   if(x.otherNote){if(!String(x.name).trim())x.name=x.otherNote;delete x.otherNote;}
  });
 });
 if(!c.members.length)c.members=JSON.parse(JSON.stringify(d.members));
 if(c.reportNote==null)c.reportNote='';

 try{normalizeIntent(c);}catch(e){c.intent={purposes:[],targets:[DEFAULT_TARGET],mustHave:[DEFAULT_TARGET]};}

/* ===== ENGINE ===== */
function activeCase(){return app.cases.find(function(x){return x.id===app.activeId})}
function n(v){v=Number(v);return isNaN(v)?0:v}
// 風險性資產 / 消費性負債的判定。
// 後台細類帶的旗標（risk / consumerDebt）在選類別時就寫進資料列了，優先採用；
// 舊資料沒有旗標，退回改版前的字串比對，數字不會變。
// engine.ts 有一份對照實作（engine.drift.test.ts 對拍），改這裡要一起改。
function isRiskAsset(a){if(a&&(a.risk===true||a.risk===false))return a.risk;
 return !!a&&(a.type==='股票'||a.type==='基金'||a.type==='債券'||(a.type==='不動產'&&a.mainCat==='可投資資產'));}
function isConsumerDebt(l){if(l&&(l.consumerDebt===true||l.consumerDebt===false))return l.consumerDebt;
 return !!l&&(l.mainCat==='信貸'||/信|卡|消費/.test(l.name||''));}
function sum(a,f){return (a||[]).reduce(function(s,x){return s+f(x)},0)}
function fmt(v){v=n(v);if(!isFinite(v))return '—';v=Math.round(v);return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}

// ===== 金額輸入的千分位 =====
// <input type=number> 沒辦法顯示逗號（規格就不允許），所以金額欄一律改成
// text + inputmode=numeric，自己補逗號、自己把游標留在原本那個數字上——
// 不然打到第四位數時整個字串被重寫，游標會被踢到最後面。
// 送進 set()/setLive() 前一定要過 amtRaw() 把逗號拿掉，否則 Number('1,200') = NaN → 靜默變 0。
function amtFmt(v){
 var t=String(v==null?'':v);if(t==='')return '';
 var neg=/^\s*-/.test(t);
 var d=t.replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');
 if(d==='')return neg?'-':'';
 return (neg?'-':'')+d.replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function amtRaw(v){return String(v==null?'':v).replace(/,/g,'');}
function amtKey(el){
 var before=el.value,pos=(el.selectionStart==null?before.length:el.selectionStart);
 var keep=before.slice(0,pos).replace(/[^\d]/g,'').length;
 var after=amtFmt(before);
 if(after===before)return;
 el.value=after;
 var i=0,seen=0;
 while(i<after.length&&seen<keep){if(/\d/.test(after[i]))seen++;i++;}
 try{el.setSelectionRange(i,i);}catch(e){}
}
// 把既有的 bindAttr（onchange="set(...,this.value,'num')"）改寫成金額版：
// this.value → amtRaw(this.value)，並掛上 amtKey 做即時格式化。
function bindMoney(bindAttr){
 var b=String(bindAttr||'').replace(/this\.value/g,'amtRaw(this.value)');
 if(/^\s*oninput="/.test(b))return b.replace(/^\s*oninput="/,'oninput="amtKey(this);');
 return 'oninput="amtKey(this)" '+b;
}
function moneyCell(bindAttr,val){
 return '<input type="text" inputmode="numeric" class="amtin" value="'+esc(amtFmt(val))+'" '+bindMoney(bindAttr)+'>';
}

// ===== 四張表的手動拖曳排序 =====
// 陣列順序＝顯示順序，直接存進 plan.data。把手單獨一格（⠿），
// 整列 draggable 會讓欄位裡的文字沒辦法選取。
var dragSrc=null;
function dragHandle(arr,i){
 return '<span class="dh" draggable="true" title="拖曳排序" ondragstart="rowDragStart(event,\''+arr+'\','+i+')" ondragend="rowDragEnd(event)">⠿</span>';
}
function dropAttrs(arr,i){
 return 'ondragover="rowDragOver(event)" ondrop="rowDrop(event,\''+arr+'\','+i+')"';
}
function rowDragStart(e,arr,i){
 dragSrc={arr:arr,i:i};
 try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',arr+':'+i);}catch(_){}
 var tr=e.target&&e.target.closest?e.target.closest('tr'):null;if(tr)tr.classList.add('dragging');
}
function rowDragOver(e){
 if(!dragSrc)return;
 e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){}
 var tr=e.target&&e.target.closest?e.target.closest('tr'):null;
 document.querySelectorAll('tr.dragover').forEach(function(x){x.classList.remove('dragover')});
 if(tr)tr.classList.add('dragover');
}
function rowDrop(e,arr,i){
 e.preventDefault();
 if(!dragSrc||dragSrc.arr!==arr){return rowDragEnd(e);}
 var c=activeCase();if(!c){return rowDragEnd(e);}
 var list=c[arr]||[],from=dragSrc.i,to=i;
 if(from===to||from<0||from>=list.length){return rowDragEnd(e);}
 var it=list.splice(from,1)[0];
 list.splice(to,0,it);
 dragSrc=null;
 document.querySelectorAll('tr.dragging,tr.dragover').forEach(function(x){x.classList.remove('dragging');x.classList.remove('dragover')});
 save();render();
}
function rowDragEnd(e){
 dragSrc=null;
 document.querySelectorAll('tr.dragging,tr.dragover').forEach(function(x){x.classList.remove('dragging');x.classList.remove('dragover')});
}
// 自動整理：大類（照 CAT_PARENTS 的順序）→ 細類 → 原順序 的穩定排序。
// 這是「同類型自動放一起」那顆按鈕；不自動觸發，免得顧問剛拖好的順序被洗掉。
function autoSortRows(arr,kind){
 var c=activeCase();if(!c)return;
 var f=CAT_FIELDS[kind]||{},order=CAT_PARENTS[kind]||[];
 var list=(c[arr]||[]).map(function(x,i){return [x,i]});
 list.sort(function(a,b){
  var pa=order.indexOf(a[0][f.parent]),pb=order.indexOf(b[0][f.parent]);
  if(pa<0)pa=999;if(pb<0)pb=999;
  if(pa!==pb)return pa-pb;
  var sa=String(a[0][f.sub]||''),sb=String(b[0][f.sub]||'');
  if(sa!==sb)return sa<sb?-1:1;
  return a[1]-b[1];
 });
 c[arr]=list.map(function(x){return x[0]});
 save();render();
}
function sortBtn(arr,kind){return '<button class="sortbtn" onclick="autoSortRows(\''+arr+'\',\''+kind+'\')" title="把同一個分類的項目收攏在一起">⇅ 自動整理</button>';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function pct(x){return (x*100).toFixed(2)+'%'}
function annualDebtInterest(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;return (a0>=sa)?lBal(l)*n(l.rate)/100:0})}
function annualDebtPay(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;var elapsed=(a0-sa)*12;return (a0>=sa&&(n(l.months)-elapsed)>0)?lPay(l)*12:0})}

function familyAnnualLiving(c){return sum(c.expenses,function(e){return (e.cat==='生活'||e.cat==='消費')?n(e.amount):0})}
// 父母奉養費：責任遞減圖本來就算它，需求反推卻漏了 → 2026/08 補進 lifeNeed。
function familyAnnualParentSupport(c){return sum(c.expenses,function(e){return e.cat==='孝親'?n(e.amount):0})}
// 支出側手動登錄的貸款（大類「貸款」）。負債表那邊走 annualDebtPay()，相加＝家庭貸款總支出。
function manualLoanPay(c){return sum(c.expenses,function(e){return e.cat==='貸款'?n(e.amount):0})}
// 儲蓄理財投入：不進總支出（原表就放在總支出之外），是「有效儲蓄率」的分子。
function savingInvest(c){return sum(c.savings,function(x){return n(x.amount)})}
// 資產布局（核心／衛星／短期保留／生活用）。只用於呈現，不動任何既有比率的分子分母。
function assetLayer(a){
 if(a&&a.layer)return a.layer;
 if(!a)return '核心';
 if(a.mainCat==='自用資產')return '生活用';
 return isRiskAsset(a)?'衛星':'核心';
}
function assetLayout(c){
 var out={'核心':0,'衛星':0,'短期保留':0,'生活用':0};
 (c.assets||[]).forEach(function(a){var k=assetLayer(a);if(out[k]==null)out[k]=0;out[k]+=aVal(a);});
 return out;
}
function aVal(a){return n(a.value)*(n(a.fxRate)||1)}
function aInc(a){return n(a.income)*(n(a.fxRate)||1)}
function lBal(l){return n(l.balance)*(n(l.fxRate)||1)}
function lPay(l){return n(l.pay)*(n(l.fxRate)||1)}
function assetPassive(c){return sum(c.assets,function(a){return (a.income!=null&&a.income!=='')?aInc(a):((a.type==='股票'||a.type==='基金'||a.type==='債券')?aVal(a)*n(a.ret)/100:0)})}
function liquidMovable(c){return sum(c.assets,function(a){return (a.cls==='流動'&&a.movable)?aVal(a):0})}

// 生活願望(旅遊/休閒/奢侈品) 當年支出
function lifestyleFactor(c,age,factor){var s=0;[c.travel,c.hobby,c.luxury].forEach(function(arr){(arr||[]).forEach(function(it){if(age>=n(it.start)&&age<=n(it.end))s+=n(it.amount)*(n(it.freq)||1)*factor})});return s;}
function lifestyleAnnualNow(c){return lifestyleFactor(c,n(c.profile.age),1);}
// 教育金總需求(終值)
function eduTotal(c){var g=n(c.params.tuitionGrowth)/100;
 return sum(c.education,function(e){return n(e.annual)*n(e.years)*Math.pow(1+g,n(e.startIn))})}

// 退休需求
// ===== 退休期：三段式金流 =====
// 家庭的生活/消費支出不是「某一天整批切換」——本人先退、配偶後退，中間有一段混合期。
// 權重 w = 已退休賺薪成員的支出比例合計 ÷ 全體賺薪成員的支出比例合計（0→1）：
//   家庭該年支出 = 非生活類（各自照起訖歲）＋ 工作期生活消費×(1−w) ＋ 退休期支出×w
// 舊版的錯：生活費列跑到 85 歲，retire.monthLiving 又疊一次 → 退休後的生活費被算兩次。
// 降級路徑（既有客戶不會壞）：配偶沒填退休年齡／支出比例全空 → 只剩本人一個切換點，w 直接 0→1。
function isLivingCat(cat){return cat==='生活'||cat==='消費';}
// 每位賺薪成員的退休，換算成「本人幾歲時發生」——投影的時間軸是本人年齡。
function earnerRetirePoints(c){
 var a0=n((c.profile||{}).age),out=[];
 ((c||{}).members||[]).forEach(function(m){
  if(!m||!isEarnerRole(m.role))return;
  var isP=(m.role==='本人');
  var ra=isP?n((c.profile||{}).retireAge):n(m.retireAge);
  var ma=isP?a0:n(m.age);
  if(!(ra>0))return;
  out.push({name:m.name||'',primary:isP,share:Math.max(0,n(m.expRatio)),at:a0+(ra-ma)});
 });
 return out;
}
// 某一年的「已退休權重」0~1。
function retiredWeight(c,age){
 var pts=earnerRetirePoints(c);
 if(!pts.length)return 0;
 var tot=0;pts.forEach(function(p){tot+=p.share;});
 if(tot<=0){
  // 支出比例% 沒填 → 退回「本人退休即全面切換」，不要除以零
  var p0=null;pts.forEach(function(p){if(p.primary)p0=p;});p0=p0||pts[0];
  return age>p0.at?1:0;
 }
 var done=0;pts.forEach(function(p){if(age>p.at)done+=p.share;});
 return done/tot;
}
// 退休期支出（＝賺薪成員都退休後的家庭年支出）。
// c.retireExpenses[] 有列就逐列算（可各自設起訖歲：照護費 80 歲後才上來、旅遊前十年高），
// 沒有就退回舊的 retire.monthLiving×12——既有客戶的數字不變。
function retireAnnual(c,age,inflFactor){
 var list=(c||{}).retireExpenses||[];
 var ra=n((c.profile||{}).retireAge),le=n((c.profile||{}).lifeExp)||n((c.params||{}).horizon)||999;
 if(!list.length)return n(c.retire&&c.retire.monthLiving)*12*inflFactor;
 var s=0;
 list.forEach(function(e){
  var st=n(e.startAge)||ra, en=n(e.endAge)||le;
  if(age<st||age>en)return;
  s+=n(e.amount)*(e.infl===false?1:inflFactor);
 });
 return s;
}
// 工作期側的家庭支出：非生活類照舊，生活＋消費只算「還沒退休的那部分」。
function workPhaseExpense(c,age,inflFactor,w){
 var s=0;
 ((c||{}).expenses||[]).forEach(function(e){
  if(age<n(e.start)||age>n(e.end))return;
  var v=n(e.amount)*(e.infl?inflFactor:1);
  s+=isLivingCat(e.cat)?v*(1-w):v;
 });
 return s;
}

function retireNeed(c){
 var r=c.retire||{},age=n(c.profile.age),ra=n(c.profile.retireAge),le=n(c.profile.lifeExp);
 var infl=n(c.params.inflation)/100, g=n(r.retireInflation)/100, rr=n(r.retireReturn)/100;
 var years=Math.max(0,ra-age), m=Math.max(0,le-ra);
 // 分子改吃「退休期支出表」：退休當年的家庭年支出（終值）。沒填明細表就退回 monthLiving。
 var hasList=!!((c.retireExpenses||[]).length);
 var annualFV=hasList?retireAnnual(c,ra,Math.pow(1+infl,years)):n(r.monthLiving)*12*Math.pow(1+infl,years);
 var monthFV=annualFV/12;
 var total;
 if(hasList){
  // 退休期支出可以逐列設起訖歲（照護費 80 歲後才上來、旅遊只到 75），
  // 年金封閉式公式吃不到這種分段 → 逐年折現加總。
  // 註：金額一律相同時，這個迴圈的結果與下面的封閉式完全等價。
  // 第 k+1 期在退休後第 k+1 年年底 → 對應年齡 ra+1+k（與封閉式年金的期數定義一致，
  // 也與 projection() 的「age > 退休年齡才計退休期支出」對得上）。
  total=0;
  for(var k=0;k<m;k++){
   total+=retireAnnual(c,ra+1+k,Math.pow(1+infl,years)*Math.pow(1+g,k))/Math.pow(1+rr,k+1);
  }
 }
 else if(Math.abs(rr-g)<1e-6){total=annualFV*m/(1+rr);}
 else{total=annualFV*(1-Math.pow((1+g)/(1+rr),m))/(rr-g);}
 var prepared=sum(r.prepared,function(p){return n(p.amount)});
 return {years:years,余年:m,monthFV:monthFV,total:total,prepared:prepared,gap:Math.max(0,total-prepared)};
}

// 壽險/醫療 需求反推 (per member in needs)
function lifeNeed(c,nd){
 var famLiving=familyAnnualLiving(c);
 var need=n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100*famLiving*n(nd.protectYears)
   + familyAnnualParentSupport(c)*n(nd.protectYears)
   + sum(c.liabilities,function(l){return lBal(l)}) + eduTotal(c) + n(nd.funeral) + n(nd.estateTax);
 var existing=existingCover(c,nd.member,'壽險');
 var liquid=liquidMovable(c);
 return Math.max(0,need - existing - liquid);
}
function medicalDailyNeed(nd){return n(nd.room)+n(nd.selfPay)+n(nd.nursing)}
function memberDep(c,name){var m=(c.members||[]).find(function(x){return x.name===name});return m?n(m.depRatio):100}
var POLICY_MAP={'壽險':'life','意外傷殘':'accident','住院醫療':'medical','醫療雜費':'medMisc','薪資補償':'incomeComp','初次罹癌':'firstCancer','癌症住院':'cancerHosp','重病給付':'critical','每月照護':'monthCare'};
function existingCover(c,member,kind){
 var fromCov=sum(c.coverages,function(cv){return (cv.member===member&&kindNorm(cv.kind)===kindNorm(kind))?(n(cv.comm)+n(cv.social)):0});
 var f=POLICY_MAP[kind];var fromPol=f?sum(c.policies,function(p){return p.insured===member?n(p[f]):0}):0;
 return fromCov+fromPol;
}

// 綜合保障缺口: 需求(反推 or 直接) - 已有
function coverageGaps(c){
 var rows=[];
 (c.needs||[]).forEach(function(nd){
  var map={
   '壽險':lifeNeed(c,nd),
   '意外傷殘':n(nd.disability),
   '住院醫療':medicalDailyNeed(nd),
   '醫療雜費':n(nd.miscDaily),
   '薪資補償':n(nd.incomeComp),
   '初次罹癌':n(nd.firstCancer),
   '癌症住院':n(nd.cancerHosp),
   '重病給付':n(nd.critical),
   '每月照護':n(nd.monthCare)
  };
  Object.keys(map).forEach(function(k){
   var need=map[k],ex=existingCover(c,nd.member,k);
   // 已備來源擴充：本人的壽險一次性需求，可由家庭流動資產支應
   if(k==='壽險'&&nd.member===(primaryMember(c)||{}).name)ex+=liquidMovable(c);
   rows.push({member:nd.member,kind:k,need:need,have:ex,gap:need-ex});
  });
 });
 return rows;
}
function totalGap(c){return sum(coverageGaps(c),function(g){return Math.max(0,g.gap)})}

// ===== 保障準備度（以「毛需求」計算，避免與缺口反推重複扣抵） =====
function grossLifeNeed(c,nd){var famLiving=familyAnnualLiving(c);
 return n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100*famLiving*n(nd.protectYears)
  +familyAnnualParentSupport(c)*n(nd.protectYears)
  +sum(c.liabilities,function(l){return lBal(l)})+eduTotal(c)+n(nd.funeral)+n(nd.estateTax);}
function coverageReadiness(c){var out=[],pm=(primaryMember(c)||{}).name;
 (c.needs||[]).forEach(function(nd){
  var defs=[['壽險',grossLifeNeed(c,nd),existingCover(c,nd.member,'壽險')+(nd.member===pm?liquidMovable(c):0)],
   ['意外傷殘',n(nd.disability),existingCover(c,nd.member,'意外傷殘')],
   ['住院醫療',medicalDailyNeed(nd),existingCover(c,nd.member,'住院醫療')],
   ['醫療雜費',n(nd.miscDaily),existingCover(c,nd.member,'醫療雜費')],
   ['薪資補償',n(nd.incomeComp),existingCover(c,nd.member,'薪資補償')],
   ['初次罹癌',n(nd.firstCancer),existingCover(c,nd.member,'初次罹癌')],

 var a0=n(c.profile.age)||40,aEnd=n(c.params.horizon)||85,years=Math.max(0,aEnd-a0+1);
 var bR=n(c.params.invReturn),sR=n(c.params.invReturnStd),bI=n(c.params.inflation),sI=n(c.params.inflationStd),bG=n(c.params.salaryGrowth),sG=n(c.params.salaryStd);
 var liquid0=sum(c.assets,function(a){return a.cls==='流動'?aVal(a):0});
 var passive=assetPassive(c);
 var workBase=sum(c.incomes,function(i){return i.type==='工作'?n(i.amount):0});
 var edu=[];var g0=n(c.params.tuitionGrowth)/100;
 (c.education||[]).forEach(function(e){var s=a0+n(e.startIn);for(var yy=0;yy<n(e.years);yy++){edu[s+yy]=(edu[s+yy]||0)+n(e.annual)*Math.pow(1+g0,n(e.startIn)+yy)}});
 var matrix=[],finals=[],neg=0;
 for(var s=0;s<N;s++){var invest=liquid0,cumI=1,cumG=1,broke=false,traj=[];
  for(var age=a0;age<=aEnd;age++){var t=age-a0;
   var ret=gauss(rng,bR,sR)/100,infl=gauss(rng,bI,sI)/100,sg=gauss(rng,bG,sG)/100;
   var work=(function(){var w=0;c.incomes.forEach(function(i){if(i.type==='工作'&&age>=n(i.start)&&age<=n(i.end))w+=n(i.amount)*cumG});return w})();
   var other=sum(c.incomes,function(i){return (i.type!=='工作'&&i.type!=='理財'&&age>=n(i.start)&&age<=n(i.end))?n(i.amount):0});
   var fin=sum(c.incomes,function(i){return (i.type==='理財'&&age>=n(i.start)&&age<=n(i.end))?n(i.amount):0})+passive;
   var income=work+other+fin;
   var wMC=retiredWeight(c,age);

   var debt=sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;var el=(age-sa)*12;return (age>=sa&&(n(l.months)-el)>0)?lPay(l)*12:0});

 // p 分位：索引要用 (len-1) 內插，用 floor(p*len) 在小樣本會把 P90 取成最大值。

  return a[Math.min(a.length-1,Math.max(0,Math.round(p*(a.length-1))))]}

function health(c){
 var m=metrics(c),savingRate=m.save/(m.incTotal||1);
 var reserve=Math.min(1,(m.liquid/(m.monthExp||1))/n(c.params.emergencyMonths||6));
 var cs=n((c.credit&&c.credit.score))||n(c.profile.credit);var credit=cs>=200?Math.min(1,Math.max(0,(cs-200)/600)):0;
 var dr=m.debtTotal/(m.assetTotal||1);var debtBal=dr<0.2?1:Math.max(0,1-(dr-0.2)/0.6);
 var need=totalGap(c),needBase=sum(coverageGaps(c),function(g){return g.need})||1;
 var riskCover=Math.max(0,1-need/needBase);
 var balScore=savingRate>=0?1:Math.max(0,1+savingRate);
 var safety=Math.round((balScore*25+reserve*15+credit*15+debtBal*15+riskCover*30));
 var freedom=Math.round(Math.min(1,m.incFinancial/(m.expTotal||1))*100);
 var vision=Math.round(Math.min(1,m.net/(m.visionNeed||1))*100);
 var grade=(safety<60||balScore<1)?'D':(freedom<20?'C':(vision<60?'B':'A'));
 return {safety:safety,freedom:freedom,vision:vision,grade:grade,
  raw:{balScore:balScore,reserve:reserve,credit:credit,debtBal:debtBal,riskCover:riskCover},
  parts:{收支平衡:Math.round(balScore*100),預備金:Math.round(reserve*100),信用:Math.round(credit*100),負債平衡:Math.round(debtBal*100),風險保全:Math.round(riskCover*100)}};
}

// 關係以 parentA / parentB 指向另一位成員的 mid（穩定 id，刪成員不會錯位）；
// 沒設定時給合理預設：子女＝本人＋配偶。世代由角色決定，有設父母者一律排到父母的下一代。
// ⚠️ 不能用 uid()：它是 performance.now() 截位，同一輪迴圈連續呼叫會撞號（實測三位成員拿到同一個 id，
//    整個族譜疊成一張卡）。這裡用獨立序號＋亂數，並順手把已經撞號的舊資料重新編號。
var _midSeq=0;
function newMid(){_midSeq++;return 'm'+Date.now().toString(36)+'-'+_midSeq.toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36);}
function ensureMemberIds(c){
 var seen={};
 (c.members||[]).forEach(function(m){
  if(!m||typeof m!=='object')return;

  seen[m.mid]=1;
 });

}
function memberByMid(c,mid){return (c.members||[]).filter(function(m){return m.mid===mid})[0]||null;}
function primaryIdx(c){var ms=c.members||[];for(var i=0;i<ms.length;i++)if(ms[i].role==='本人')return i;return 0;}
function spouseMember(c){return (c.members||[]).filter(function(m){return m.role==='配偶'})[0]||null;}
function memberLabel(c,m,i){var nm=(i===primaryIdx(c))?((c.profile||{}).name||m.name||'本人'):(m.name||'（未命名）');return nm;}
function effParents(c,m){
 var out=[];
 if(m.parentA){var a=memberByMid(c,m.parentA);if(a&&a!==m)out.push(a);}
 if(m.parentB){var b=memberByMid(c,m.parentB);if(b&&b!==m&&out.indexOf(b)<0)out.push(b);}
 if(!m.parentA&&!m.parentB&&m.role==='子女'){
  var ms=c.members||[],pm=ms[primaryIdx(c)],sp=spouseMember(c);
  if(pm&&pm!==m)out.push(pm);
  if(sp&&sp!==m)out.push(sp);

}

 ms.forEach(function(m,i){
  var r=(i===pi)?'本人':(m.role||'其他');
  gen[m.mid]=(r==='父'||r==='母'||r==='長輩')?0:(r==='子女')?2:1;
 });
 for(var pass=0;pass<3;pass++){
  ms.forEach(function(m){
   var ps=effParents(c,m);if(!ps.length)return;
   var mx=0;ps.forEach(function(x){mx=Math.max(mx,gen[x.mid]||0)});

 var W=150,H=64,GX=20,GY=58,PAD=14;
 var rows={};ms.forEach(function(m,i){var g=gen[m.mid]||0;(rows[g]=rows[g]||[]).push({m:m,i:i});});
 var gks=Object.keys(rows).map(Number).sort(function(a,b){return a-b});
 var maxCols=0;gks.forEach(function(g){maxCols=Math.max(maxCols,rows[g].length)});
 var totalW=PAD*2+maxCols*W+(maxCols-1)*GX;
 var totalH=PAD*2+gks.length*H+(gks.length-1)*GY;
 var pos={};
 gks.forEach(function(g,gi){
  var arr=rows[g],rw=arr.length*W+(arr.length-1)*GX,x0=(totalW-rw)/2,y=PAD+gi*(H+GY);
  arr.forEach(function(o,ci){pos[o.m.mid]={x:x0+ci*(W+GX),y:y};});
 });
 // 連線：由父母卡片底部中點 → 子女卡片頂部中點（直角折線）

   if(xs.length>1)links+='<line x1="'+Math.min.apply(null,xs)+'" y1="'+py.toFixed(1)+'" x2="'+Math.max.apply(null,xs)+'" y2="'+py.toFixed(1)+'" stroke="'+line+'" stroke-width="1.4"/>';

 });
 var cards=ms.map(function(m,i){

// 社會保險老年給付 + 勞退新制 概算（供退休已備參考；非精算，可手動覆寫）
// 依「本人」的投保類型分流：勞保系 → 勞保老年年金 B式 1.55% ＋ 勞退新制；
// 國民年金 → A式(0.65%＋加計)／B式(1.3%) 擇優、無勞退提繳；公保/軍保/農保/無 → 不試算。
var LABOR_LIKE_INS=['勞保','職業工會','就業保險','勞工職業災害保險'];
// 社會保險老年給付＋勞退新制概算。
// 年資＝已投保年資（過去）＋ 到退休還會投保的年數（未來）。
// ⚠️ 2026/08 修正：已投保年資(worked)改版前沒有輸入欄位、永遠是 0，
//    等於把客戶過去投保的十幾二十年整段丟掉；現在成員卡有「勞保起保年月／已投保年資」。
// ⚠️ 勞退同時修正：未來提繳只複利 future 年，過去的部分是「專戶餘額」滾存到退休。
// ⚠️ 勞保老年年金改 A/B 式擇優，並加上「未滿 15 年只能領老年一次金」的門檻。
// src/lib/engine.ts 有一份對照實作（engine.drift.test.ts 對拍），改這裡要一起改。
function insuredYearsOf(m){var w=n(m&&m.worked);return w>0?w:ymYears(m&&m.insStart);}
// 'YYYY-MM' → 到今天為止的年資（取到小數一位）。格式不對或起算日在未來一律回 0。
function ymYears(ym){
 if(!ym||!/^\d{4}-\d{2}$/.test(ym))return 0;
 var y=+ym.slice(0,4),mo=+ym.slice(5,7);if(mo<1||mo>12)return 0;
 var d=new Date(),v=(d.getFullYear()-y)+((d.getMonth()+1-mo)/12);
 return v<=0?0:Math.floor(v*10)/10;
}
function estimateSocialPension(c){
 var pm=primaryMember(c)||{};var ins=n(pm.insSalary);
 var insType=pm.insType||'勞保';
 var age=n(c.profile.age),ra=n(c.profile.retireAge);
 var past=insuredYearsOf(pm);
 var future=Math.max(0,ra-age);
 var years=Math.max(0,past+future);
 var r=c.retire||{};var rr=n(r.retireReturn)/100||0.04;var m=Math.max(0,n(c.profile.lifeExp)-ra);
 var kind=(LABOR_LIKE_INS.indexOf(insType)>=0)?'labor':(insType==='國民年金'?'np':'other');
 var out={kind:kind,insType:insType,ins:ins,pensionBase:0,years:years,past:past,future:future,
  monthly:0,lump:0,fund:0,fundNow:0,fundNew:0,fundEstimated:false,pensionPast:0,
  total:0,npA:0,npB:0,insA:0,insB:0,pick:'',eligible:false,onceMonths:0};
 var pv=function(annual){return (rr>0)?annual*(1-Math.pow(1+rr,-m))/rr:annual*m;};
 if(kind==='np'){
  out.ins=ins>0?ins:NP_INSURED_MONTHLY;
  if(years<=0)return out;
  out.npA=out.ins*years*NP_RATE_A+NP_BONUS_A;   // A式：0.65% ＋ 加計金額
  out.npB=out.ins*years*NP_RATE_B;              // B式：1.3%
  out.pick=(out.npA>=out.npB)?'A':'B';
  out.eligible=true;                            // 國保老年年金沒有 15 年門檻
  out.monthly=Math.max(out.npA,out.npB);
  out.lump=pv(out.monthly*12);
  out.fund=0;                                   // 國保無雇主提繳，沒有勞退新制
  out.total=out.lump;
  return out;
 }
 if(kind!=='labor')return out;                  // 公保/軍保/農保/健保眷屬/退休/無：不概算
 out.pensionBase=laborPensionSalary(n(pm.monthlySalary)||n((c.profile||{}).monthlySalary)||ins);
 var g=LABOR_PENSION_FUND_RATE,annualContrib=out.pensionBase*0.06*12;
 out.pensionPast=n(pm.pensionYears)||ymYears(pm.pensionStart);
 var bal=n(pm.pensionBalance);
 if(bal<=0&&out.pensionPast>0&&annualContrib>0){
  bal=(g>0)?annualContrib*(Math.pow(1+g,out.pensionPast)-1)/g:annualContrib*out.pensionPast;
  out.fundEstimated=true;                       // 專戶餘額是回推的，UI 要提醒去勞保局查實際值
 }
 out.fundNow=bal*Math.pow(1+g,future);
 out.fundNew=(g>0)?annualContrib*(Math.pow(1+g,future)-1)/g:annualContrib*future;
 out.fund=out.fundNow+out.fundNew;
 if(ins>0&&years>0){
  out.insA=ins*years*LABOR_INS_ANNUITY_RATE_A+LABOR_INS_ANNUITY_BONUS_A;
  out.insB=ins*years*LABOR_INS_ANNUITY_RATE;
  out.eligible=years>=LABOR_ANNUITY_MIN_YEARS;
  if(out.eligible){
   out.pick=(out.insA>=out.insB)?'A':'B';
   out.monthly=Math.max(out.insA,out.insB);
   out.lump=pv(out.monthly*12);
  }else{
   out.onceMonths=Math.floor(years);            // 老年一次金：每滿 1 年發 1 個月
   out.lump=ins*out.onceMonths;
  }
 }
 out.total=out.lump+out.fund;
 return out;
}

// 資料仍然存回原本的 c.education[]（欄位只增不改），引擎的 eduTotal / projection 不用動：
//   annual = 學雜費 + (含補習才藝 ? 補習才藝 : 0) + (含撫養費 ? 撫養費 : 0)
//   years  = 該學段還要供給幾年、startIn = 幾年後開始
// 新增欄位：mid(對應家庭成員)、stage、schoolType、tuition/extra/care、auto(自動產生)、lock(手動鎖定的欄位)
function eduStageDefs(){
 return eduCostList().map(function(x){return {stage:x.stage,startAge:n(x.startAge),years:n(x.years)}})
  .sort(function(a,b){return a.startAge-b.startAge});
}
function eduStageOfAge(age){
 var l=eduStageDefs();
 for(var i=0;i<l.length;i++){var e=l[i].startAge+l[i].years;
  if(age>=l[i].startAge&&age<e)return {stage:l[i].stage,startAge:l[i].startAge,years:l[i].years,remainYears:e-Math.floor(age),current:true};}
 return null;
}
// 從現在起還沒念完的學段，供給到 top（期望最高學歷）為止；payTo＝支付學雜費至幾歲（0/空＝不限）。
function eduRemainingStages(age,top,payTo){
 var l=eduStageDefs(),ti=-1;
 for(var k=0;k<l.length;k++)if(l[k].stage===top)ti=k;
 var cut=(ti>=0)?ti:l.length-1;
 var a=Math.max(0,Math.floor(n(age))),cap=n(payTo),out=[];
 for(var i=0;i<=cut;i++){
  var s=l[i],end=s.startAge+s.years;
  if(a>=end)continue;                                   // 已念完
  var from=Math.max(a,s.startAge),to=end;
  if(cap>0)to=Math.min(to,cap);                         // 只供給到指定歲數
  var rem=to-from;
  if(rem<=0)continue;
  out.push({stage:s.stage,startAge:s.startAge,years:s.years,startIn:Math.max(0,s.startAge-a),remainYears:rem,current:a>=s.startAge});
 }
 return out;
}
function eduDefaultAmounts(stage,schoolType){
 var p=eduCostOf(stage)||{};
 var t=(schoolType==='海外')?n(p.overseasTuition):(schoolType==='私立'?n(p.privateTuition):n(p.publicTuition));
 return {tuition:t,extra:n(p.extraFee),care:n(p.careFee)};
}
function eduRowTotal(e){
 return n(e.tuition)+(e.withExtra?n(e.extra):0)+(e.withCare?n(e.care):0);
}
function eduChildren(c){
 ensureMemberIds(c);
 return (c.members||[]).map(function(m,i){return {m:m,i:i}}).filter(function(x){return (x.m.role||'')==='子女'});
}
function eduChildAge(m){var a=m.birth?ageFromBirth(m.birth):null;return n(a!=null&&a!==''?a:m.age);}
// 依孩子的年齡與期望學歷，把 c.education 裡屬於這個孩子的自動列對齊；
// 手動改過的金額（lock）與手動加的列（auto!==true）一律保留。
// 舊資料保護：既有客戶的 education 是顧問一列一列填的。
// 如果直接自動生成各學段，會跟舊列雙重計算，教育金總需求瞬間翻倍而且沒人看得出來。
// 所以自動帶入是「每個孩子各自的開關」（m.eduAuto）：
//   - 這份案子完全沒有舊的教育金列（新客戶）→ 預設開啟，顧問一進來就看到推算結果。
//   - 有舊列 → 預設關閉，卡片上出現按鈕請顧問自己決定要不要換成自動推算。
function eduHasLegacy(c){return (c.education||[]).some(function(e){return e.auto!==true})}
function eduAutoDefaults(c){
 var legacy=eduHasLegacy(c);
 eduChildren(c).forEach(function(x){if(x.m.eduAuto===undefined)x.m.eduAuto=!legacy;});
}
function enableEduAuto(mi){
 var c=activeCase();if(!c)return;var m=(c.members||[])[mi];if(!m)return;
 m.eduAuto=true;syncEduChild(c,m);save();render();
}
function disableEduAuto(mi){
 var c=activeCase();if(!c)return;var m=(c.members||[])[mi];if(!m)return;
 m.eduAuto=false;
 c.education=(c.education||[]).filter(function(e){return !(e.mid===m.mid&&e.auto===true)});
 save();render();
}
function syncEduChild(c,m){
 c.education=c.education||[];
 if(!m.eduAuto)return c;
 var top=m.eduTop||'大學',age=eduChildAge(m);
 var want=eduRemainingStages(age,top,m.eduPayTo);
 var wantKey={};want.forEach(function(w){wantKey[w.stage]=w});
 // 移除已不需要的自動列（念完了、或超出期望學歷）
 c.education=c.education.filter(function(e){
  if(e.mid!==m.mid||e.auto!==true)return true;
  return !!wantKey[e.stage];
 });
 var byStage={};
 c.education.forEach(function(e){if(e.mid===m.mid&&e.auto===true)byStage[e.stage]=e});
 want.forEach(function(w){
  var e=byStage[w.stage];
  if(!e){e={mid:m.mid,auto:true,lock:{},stage:w.stage,schoolType:'公立'};c.education.push(e);}
  e.lock=e.lock||{};
  e.child=memberLabel(c,m,-1)||'子女';
  e.startIn=w.startIn;e.years=w.remainYears;
  e.withExtra=!!m.eduExtra;e.withCare=!!m.eduCare;
  var d=eduDefaultAmounts(w.stage,e.schoolType||'公立');
  if(!e.lock.tuition)e.tuition=d.tuition;
  if(!e.lock.extra)e.extra=d.extra;
  if(!e.lock.care)e.care=d.care;
  e.annual=eduRowTotal(e);
 });
 return c;
}
function syncEduAll(c){eduAutoDefaults(c);eduChildren(c).forEach(function(x){syncEduChild(c,x.m)});return c;}
// 手動列（沒有 mid 的舊資料）也要有 annual；舊資料 annual 本來就有，不動。
function eduIdxOf(c,mid,stage){

 for(var i=0;i<l.length;i++)if(l[i].mid===mid&&l[i].stage===stage)return i;

}

 if(!e.lock.tuition)e.tuition=d.tuition;
 if(!e.lock.extra)e.extra=d.extra;
 if(!e.lock.care)e.care=d.care;

function setEduAmt(mid,stage,field,val,live){
 var c=activeCase();if(!c)return;var i=eduIdxOf(c,mid,stage);if(i<0)return;
 var e=c.education[i];e[field]=n(val);e.lock=e.lock||{};e.lock[field]=1;
 e.annual=eduRowTotal(e);
 if(live){syncDerived();liveSave();}else{save();render();}
}

// 關注議題＝沒有時間軸的財務課題；人生目標＝有時間軸、要花錢的事件（選了＝必須達成）。

 ['職涯規劃','intent','意圖/生涯','轉職・創業'],

 ['傳承規劃','intent','意圖/生涯','繼承人・金額','傳承']];
var TARGETS=TARGET_META.map(function(x){return x[0]});

var BASE_TABS=[['family','家庭 / 參數'],['finance','收支資債'],['coverage','保障中心'],['credit','信用/海外'],['tax','稅賦']];
function targetMeta(t){for(var i=0;i<TARGET_META.length;i++)if(TARGET_META[i][0]===t)return TARGET_META[i];return null}

// 舊值遷移對照（2026-08-16 三區塊整併前的資料）
var PURPOSE_TO_TARGETS={'想買車、買房，進行置產':['購車規劃','購屋規劃']};
var TARGET_TO_PURPOSES={'人生模擬':[ALL_SIM]};
function uniqArr(a){var o=[],s={};a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x)}});return o}

// 冪等地把 intent 正規化到新模型（遷移舊字串、丟掉不存在的選項、mustHave 與 targets 合成同一組有序集合）。
function normalizeIntent(c){
 var it=c.intent=c.intent||{purposes:[],targets:[],mustHave:[]};
 var purposes=uniqArr(Array.isArray(it.purposes)?it.purposes:[]);
 var targets=uniqArr(Array.isArray(it.targets)?it.targets:[]);
 var must=uniqArr(Array.isArray(it.mustHave)?it.mustHave:[]);
 var addT=[],addP=[];
 purposes=purposes.filter(function(p){if(PURPOSE_TO_TARGETS[p]){addT=addT.concat(PURPOSE_TO_TARGETS[p]);return false}return true});
 targets=targets.concat(addT);must=must.concat(addT);
 function mapT(a){return a.filter(function(t){if(TARGET_TO_PURPOSES[t]){addP=addP.concat(TARGET_TO_PURPOSES[t]);return false}return true})}
 targets=mapT(targets);must=mapT(must);purposes=purposes.concat(addP);
 purposes=uniqArr(purposes).filter(function(p){return PURPOSES.indexOf(p)>=0});
 targets=uniqArr(targets).filter(function(t){return TARGETS.indexOf(t)>=0});
 must=uniqArr(must).filter(function(t){return TARGETS.indexOf(t)>=0});
 var union=uniqArr(must.concat(targets));
 var ordered=must.filter(function(t){return union.indexOf(t)>=0});
 var rest=union.filter(function(t){return ordered.indexOf(t)<0}).sort(function(a,b){return TARGETS.indexOf(a)-TARGETS.indexOf(b)});
 it.purposes=purposes;it.mustHave=ordered.concat(rest);it.targets=it.mustHave.slice();
 return it;
}
// 目標是否已選（＝必須達成）
function targetOn(c,t){return ((c.intent||{}).mustHave||[]).indexOf(t)>=0}

function togglePurpose(val){var c=activeCase();var it=normalizeIntent(c);var i=it.purposes.indexOf(val);
 if(i<0){it.purposes.push(val);if(val===ALL_SIM){it.mustHave=TARGETS.slice();it.targets=TARGETS.slice()}}
 else it.purposes.splice(i,1);
 save();render()}

// 目標二態切換：選了＝必達（推到優先序最後），取消＝移除（資料保留、仍列入模擬）
function toggleTarget(t){var c=activeCase();var it=normalizeIntent(c);var i=it.mustHave.indexOf(t);
 if(i<0){it.mustHave.push(t);seedGoalRow(c,t)}
 else{
  if(t===DEFAULT_TARGET&&!confirm('退休幾乎是必然會發生的。\n取消後，人生模擬將不會列入退休金需求。\n\n確定取消嗎？'))return;
  it.mustHave.splice(i,1);
  var pi=it.purposes.indexOf(ALL_SIM);if(pi>=0)it.purposes.splice(pi,1);
 }
 it.targets=it.mustHave.slice();save();render()}

function moveTarget(i,d){var c=activeCase();var it=normalizeIntent(c);var j=i+d;
 if(j<0||j>=it.mustHave.length)return;
 var x=it.mustHave[i];it.mustHave[i]=it.mustHave[j];it.mustHave[j]=x;
 it.targets=it.mustHave.slice();save();render()}

function dropTarget(from,to){var c=activeCase();var it=normalizeIntent(c);
 if(from===to||from<0||to<0||from>=it.mustHave.length||to>=it.mustHave.length)return;
 var x=it.mustHave.splice(from,1)[0];it.mustHave.splice(to,0,x);
 it.targets=it.mustHave.slice();save();render()}

 var rows=[
  {t:'退休生活規劃',k:'退休缺口',v:fmt(rn.gap)+' 元'},

 var rank=function(r){var i=r.t?must.indexOf(r.t):-1;return i<0?999:i};

 return rows.map(function(r){var i=r.t?must.indexOf(r.t):-1;

  return '<tr><td class="k">'+r.k+tag+'</td><td>'+r.v+'</td></tr>';
 }).join('')}

function tabFilled(c,tab){
 if(tab==='family')return ((c.members||[]).length>0)||!!(c.profile||{}).age;
 if(tab==='finance')return ((c.incomes||[]).length+(c.expenses||[]).length+(c.assets||[]).length+(c.liabilities||[]).length)>0;
 if(tab==='coverage')return ((c.policies||[]).length+(c.coverages||[]).length)>0;
 if(tab==='credit')return n((c.credit||{}).cards)>0||!!(c.credit||{}).score||(c.overseas||{}).hasAssets==='是';
 if(tab==='tax')return !!(c.taxParams&&Object.keys(c.taxParams).length)&&(n((c.taxParams||{}).dependents)>0||!!(c.taxParams||{}).married||n((c.taxParams||{}).houseAssessed)>0||n((c.taxParams||{}).otherDeduction)>0);
 if(tab==='retire')return n((c.profile||{}).retireAge)>0&&(n((c.retire||{}).monthLiving)>0||((c.retireExpenses||[]).length>0));
 if(tab==='education')return ((c.education||[]).length>0)||((c.children||[]).length>0);
 if(tab==='goals')return (c.goals||[]).some(function(g){return n(g.present)>0});
 if(tab==='intent')return n((c.legacy||{}).heirs)>0||(c.career||{}).plan!=='無'||(c.marriage||{}).plan==='是';
 if(tab==='lifestyle')return ((c.travel||[]).length+(c.hobby||[]).length+(c.luxury||[]).length)>0;
 return false;
}

function valuesWheelSVG(c,theme){var gs=(c.lifeGoals||[]).filter(function(g){return g.name});

 var dark=theme!=='light';

 var txt=dark?'#eef2f7':'#0d2b45',sub=dark?'#a7bacb':'#5a6b72',ring=dark?'rgba(255,255,255,.13)':'rgba(0,0,0,.1)',ring2=dark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)';
 var PAL=['#c99a5b','#7f97ac','#8ba888','#b07d3d','#5a7186','#cbb488','#9c7bb0','#6f9f8a'];

 });

 });
 // 面積：把各點連成多邊形，重要度高的方向自然被撐大
 var poly='<polygon points="'+pts.map(function(q){return q.x.toFixed(1)+','+q.y.toFixed(1)}).join(' ')+'" fill="'+(dark?'rgba(201,154,91,.13)':'rgba(163,129,74,.13)')+'" stroke="'+(dark?'rgba(201,154,91,.5)':'rgba(163,129,74,.5)')+'" stroke-width="1.2" stroke-linejoin="round"/>';

   '<circle cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="'+(3.5+q.imp*0.9).toFixed(1)+'" fill="'+q.col+'"/>'+
   '<text x="'+lx.toFixed(1)+'" y="'+(ly+dy).toFixed(1)+'" fill="'+txt+'" font-size="11.5" font-weight="700" text-anchor="'+anchor+'">'+esc(trunc(q.g.name,8))+'</text>'+
   '<text x="'+lx.toFixed(1)+'" y="'+(ly+dy+13).toFixed(1)+'" fill="'+sub+'" font-size="10" text-anchor="'+anchor+'">重要度 '+q.imp+'</text>';
 }).join('');
 // 核心圓：實心、最後才畫，蓋在輻線與面積之上（線條不可以壓過「人生價值」）
 var hub='<circle cx="'+cx+'" cy="'+cy+'" r="'+(HUB+5)+'" fill="'+(dark?'#0a2137':'#e3ebf0')+'" opacity=".9"/>'+

 var svg='<svg viewBox="0 0 '+VW+' '+VH+'" width="100%" style="max-width:'+VW+'px;height:auto;display:block;margin:0 auto" preserveAspectRatio="xMidYMid meet">'+rings+poly+spokes+hub+'</svg>';

}

// ===== 保障中心：地圖 + 產險涵蓋 + 健檢報告 =====
function isEarnerRole(r){return r==='本人'||r==='配偶';}
function polSum(c,member,fields){return sum(c.policies||[],function(p){return p.insured===member?fields.reduce(function(s,f){return s+n(p[f]);},0):0;});}
function memberHasSub(c,member,subs){return (c.policies||[]).some(function(p){return p.insured===member&&subs.indexOf(p.subtype)>=0;});}
function hhHasSub(c,subs){return (c.policies||[]).some(function(p){return subs.indexOf(p.subtype)>=0;});}
function covSignals(c){
 var hasCar=hhHasSub(c,['汽車強制','汽車第三人責任','汽車車體','汽車竊盜','機車強制','機車第三人'])||(c.assets||[]).some(function(a){return /車/.test((a.type||'')+(a.name||''));});
 var hasHouse=(c.liabilities||[]).some(function(l){return l.mainCat==='房貸';})||(c.assets||[]).some(function(a){return /房|宅|不動產|自住/.test((a.type||'')+(a.name||''));})||hhHasSub(c,['住宅火險','地震險']);
 var isOwner=(c.profile&&c.profile.jobType==='企業主')||(c.members||[]).some(function(m){return m.jobType==='企業主';});
 var goesAbroad=((c.travel||[]).some(function(t){return t.cat==='國外';}))||(c.overseas&&(c.overseas.hasAssets==='是'||c.overseas.identity==='是'));
 return {hasCar:hasCar,hasHouse:hasHouse,isOwner:isOwner,goesAbroad:goesAbroad};
}
function propertyChecklist(c){
 var s=covSignals(c),rows=[];
 function due(subs){var p=(c.policies||[]).filter(function(x){return subs.indexOf(x.subtype)>=0&&x.termEnd;})[0];return p?p.termEnd:'';}
 if(s.hasCar){var third=hhHasSub(c,['汽車第三人責任','機車第三人']);rows.push({scene:'有汽/機車',should:'強制險＋第三人責任＋車體',key:'car',status:third?'have':'miss',adeq:third?'檢視第三人責任是否增額至超額責任':'僅強制險，建議加保第三人/車體',due:due(['汽車第三人責任','汽車車體','汽車強制','機車強制','機車第三人'])});}
 else rows.push({scene:'有汽/機車',should:'強制險＋第三人責任＋車體',key:'car',status:'thin',adeq:'如有車輛，建議完整投保',due:''});
 if(s.hasHouse){var fire=hhHasSub(c,['住宅火險']),quake=hhHasSub(c,['地震險']);rows.push({scene:'有自住房',should:'住宅火險＋地震(基本/超額)',key:'house',status:fire?'have':'miss',adeq:quake?'地震已保，可評估超額地震':'建議加保地震(基本+超額)',due:due(['住宅火險','地震險'])});}
 else rows.push({scene:'有自住房',should:'住宅火險＋地震',key:'house',status:'thin',adeq:'如有自住房，建議投保',due:''});
 var trip=hhHasSub(c,['旅平險','海外突發疾病']);rows.push({scene:'旅遊/出國',should:'旅平險＋海外突發疾病',key:'travel',status:trip?'have':(s.goesAbroad?'miss':'thin'),adeq:s.goesAbroad?'常出國，建議每趟或年約投保':'出國前投保',due:''});
 if(s.isOwner){var biz=hhHasSub(c,['商業火險','公共意外','雇主責任']);rows.push({scene:'企業主',should:'商業火險＋公共意外/雇主責任',key:'biz',status:biz?'have':'miss',adeq:'營業場所財損與員工職災責任',due:due(['商業火險','公共意外','雇主責任'])});}
 var liab=hhHasSub(c,['個人責任','居家綜合']);rows.push({scene:'家庭日常',should:'個人責任/居家綜合',key:'personal',status:liab?'have':'thin',adeq:'日常致第三人賠償責任',due:''});
 return rows;
}
function coverageMatrix(c){
 var members=c.members||[];
 var rd=coverageReadiness(c);
 function rdRatio(member,kind){var o=rd.filter(function(x){return x.member===member&&x.kind===kind;})[0];return o?o.ratio:null;}
 var pc=propertyChecklist(c);
 function pcStatus(key){var r=pc.filter(function(x){return x.key===key;})[0];if(!r)return 'n';return r.status==='have'?'g':r.status==='miss'?'r':'y';}
 var sig=covSignals(c);
 var HCOLS=[
  {lb:'壽險',kind:'壽險',fields:['life'],app:function(m){return isEarnerRole(m.role);}},
  {lb:'醫療',kind:'住院醫療',fields:['medical'],app:function(){return true;}},
  {lb:'意外',kind:'意外險',fields:['accident'],app:function(){return true;}},
  {lb:'癌症',kind:null,fields:['firstCancer','cancerHosp'],app:function(){return true;}},
  {lb:'重疾',kind:'重病給付',fields:['critical'],app:function(){return true;}},
  {lb:'長照/失能',kind:'每月照護',fields:['monthCare'],app:function(m){return m.role!=='子女';}},
  {lb:'年金',kind:null,fields:[],sub:['年金'],app:function(m){return isEarnerRole(m.role);}}
 ];
 var PCOLS=[['汽/機車','car'],['住宅','house'],['責任',sig.isOwner?'biz':'personal'],['旅平','travel']];
 var rows=members.map(function(m,idx){
  var isPrimary=(m.role==='本人')||(idx===0&&!members.some(function(x){return x.role==='本人';}));
  var cells=HCOLS.map(function(col){
   if(!col.app(m))return {s:'n'};
   var have=col.fields.length?polSum(c,m.name,col.fields):(memberHasSub(c,m.name,col.sub||[])?1:0);
   if(have<=0)return {s:'r'};
   var ratio=col.kind?rdRatio(m.name,col.kind):null;
   if(ratio!=null&&ratio<0.6)return {s:'y'};
   return {s:'g'};
  });
  var pcells=PCOLS.map(function(pcx){return isPrimary?{s:pcStatus(pcx[1])}:{s:'n'};});
  return {name:m.name,role:isPrimary?'本人':(m.role||''),cells:cells.concat(pcells)};
 });
 return {cols:HCOLS.map(function(x){return x.lb;}).concat(PCOLS.map(function(x){return x[0];})),rows:rows};
}
function coverageCheckup(c){
 var totPrem=sum(c.policies||[],function(p){return n(p.premium);});
 var ct=crossTable(c);var income=n(ct.incTotal);
 var premRatio=income>0?totPrem/income:0;
 var lifeTotal=sum(c.policies||[],function(p){return n(p.life);});
 var rd=coverageReadiness(c);
 var humanGaps=rd.filter(function(o){return o.need>0&&o.ratio<1;}).map(function(o){return {member:o.member,kind:o.kind,ratio:o.ratio};}).sort(function(a,b){return a.ratio-b.ratio;});
 var pc=propertyChecklist(c);var propMiss=pc.filter(function(r){return r.status==='miss';});
 var dupMap={},dups=[];(c.policies||[]).forEach(function(p){if(!p.insured||!p.subtype)return;var k=p.insured+'|'+p.subtype;dupMap[k]=(dupMap[k]||0)+1;});
 Object.keys(dupMap).forEach(function(k){if(dupMap[k]>1){var a=k.split('|');dups.push(a[0]+' 的 '+a[1]+'（'+dupMap[k]+' 張）');}});
 var now=new Date();var nowM=now.getFullYear()*12+now.getMonth();
 var due=[];(c.policies||[]).forEach(function(p){if(p.bigCat==='產物'&&p.termEnd){var mch=(''+p.termEnd).match(/(\d{3,4})\D+(\d{1,2})/);if(mch){var yy=+mch[1];if(yy<1911)yy+=1911;/* 民國年 */var months=(yy*12+(+mch[2]-1))-nowM;if(months<=4&&months>=-2)due.push({name:p.name||p.subtype,when:p.termEnd,months:months});}}});
 return {totPrem:totPrem,income:income,premRatio:premRatio,lifeTotal:lifeTotal,lifeVsIncome:income>0?lifeTotal/income:0,humanGaps:humanGaps,propMiss:propMiss,dups:dups,due:due};
}

// 保障中心的衍生區（KPI／全家保障地圖／產險涵蓋／健檢報告）抽成獨立函式，

 var covPct=applic?Math.round(green/applic*100):0,dueN=ck.due.length;

 var cellHTML=function(s){var m={g:['g','✓'],y:['y','△'],r:['r','✕'],n:['n','—']}[s];return '<span class="cell '+m[0]+'">'+m[1]+'</span>';};
 var mrows=mtx.rows.map(function(r){return '<tr><td class="mem">'+esc(r.name||'—')+(r.role?' · '+esc(r.role):'')+'</td>'+r.cells.map(function(cl){return '<td>'+cellHTML(cl.s)+'</td>';}).join('')+'</tr>';}).join('')||'<tr><td class="muted" style="padding:12px">尚無成員</td></tr>';

function deathProjection(c,mb){var base=projection(c),a0=n(c.profile.age),infl=n(c.params.inflation)/100,ret=n(c.params.invReturn)/100;
 var liquid0=sum(c.assets,function(a){return a.cls==='流動'?aVal(a):0});
 var lump=existingCover(c,mb.name,'壽險');
 var funeral=sum((c.needs||[]),function(nd){return nd.member===mb.name?n(nd.funeral):0});
 var premium=sum((c.policies||[]),function(p){return p.insured===mb.name?n(p.premium):0});
 var expRatio=n(mb.expRatio)/100;
 // 財務獨立歲：其他被撫養成員到達獨立歲後，其支出比例份額自家庭生活費移除（責任遞減）
 var deps=(c.members||[]).filter(function(x){return x.name!==mb.name&&x.indepAge!==''&&x.indepAge!=null&&n(x.expRatio)>0;});
 var asset=liquid0,rows=[],depletedAge=null;
 base.rows.forEach(function(br,i){var age=br.age,t=age-a0;
  var mWork=sum(c.incomes,function(inc){return (inc.owner===mb.name&&inc.type==='工作'&&age>=n(inc.start)&&age<=n(inc.end))?n(inc.amount)*Math.pow(1+n(inc.growth)/100,t):0;});
  var hLiving=sum(c.expenses,function(e){return (e.cat==='生活'&&age>=n(e.start)&&age<=n(e.end))?n(e.amount)*(e.infl?Math.pow(1+infl,t):1):0;});
  var indepFrac=0;deps.forEach(function(d){if(n(d.age)+t>=n(d.indepAge))indepFrac+=n(d.expRatio)/100;});
  var removeFrac=Math.min(1,expRatio+indepFrac);
  var totalOut=br.income-br.bal;
  var income=br.income-mWork+(i===0?lump:0);
  var expense=Math.max(0,totalOut-(hLiving+n(br.goal))*removeFrac-premium)+(i===0?funeral:0);
  asset=(asset>0?asset*(1+ret):asset)+(income-expense);
  if(depletedAge===null&&asset<0)depletedAge=age;
  rows.push({age:age,income:income,expense:expense,asset:asset});
 });
 return {rows:rows,depletedAge:depletedAge,protectYears:depletedAge?depletedAge-a0:null};
}

   app.cases.map(function(x){return '<option value="'+x.id+'" '+(x.id===app.activeId?'selected':'')+'>'+esc(x.profile.name)+'</option>'}).join('')+'</select></div>':'';
 return '<div class="main" style="max-width:960px;margin:0 auto">'+picker+'<div class="tabbar">'+tb+'</div>'+body+'</div>';
}
document.querySelectorAll('#roleSw button').forEach(function(b){b.onclick=function(){app.role=b.dataset.r;app.activeTab=b.dataset.r==='client'?'analysis':'data';render()}});
(function(){
  var EMBED=/[?&]embed=1/.test(location.search);
  if(!EMBED){load();render();return;}
  // role=client → 客戶端唯讀檢視（財務儀表／規劃報告）；否則教練端編輯。
  var CLIENT=/[?&]role=client/.test(location.search);
  document.documentElement.classList.add('embed');
  if(CLIENT){var _rs=document.getElementById('roleSw');if(_rs)_rs.style.display='none';}
  document.querySelectorAll('.top .tbtn').forEach(function(b){if(/匯出|匯入/.test(b.textContent||''))b.style.display='none';});
  // embed 模式＝單一年度版本編輯器，只該有一筆 case；把側欄的新增/切換客戶關掉，
  // 否則 save() 推的與畫面上正在編的會是不同筆，使用者的輸入會被靜默覆蓋掉。
  document.documentElement.classList.add('embed-single');
  // 同源限制：只接受父層 origin 的訊息，也只往父層 origin 送。
  // 舊版入口只比對 e.source、出口用 '*'，任何第三方網站 iframe 這份檔案就能收走整份客戶財務資料。
  var PARENT_ORIGIN=(function(){
    try{
      var ref=document.referrer;
      if(ref){var u=new URL(ref);return u.origin;}
    }catch(e){}
    return location.origin;
  })();
  function toParent(msg){try{parent.postMessage(msg,PARENT_ORIGIN);}catch(e){}}
  // embed：save() 不寫 localStorage，改把「目前正在編輯的那一筆」回傳父層（父層存回 DB）；客戶唯讀不回存。
  save=function(){try{var cur=activeCase();if(!CLIENT&&cur)toParent({type:'lantu:save',data:cur});}catch(e){}};
  var inited=false;
  window.addEventListener('message',function(e){
    if(e.source!==parent)return;
    if(e.origin&&PARENT_ORIGIN&&e.origin!==PARENT_ORIGIN)return;
    var m=e.data;if(!m||m.type!=='lantu:init')return;
    var c=migrateCase(m.data||{});
    app.cases=[c];app.activeId=c.id;app.role=CLIENT?'client':'coach';app.activeTab=CLIENT?'analysis':'data';
    inited=true;render();
  });
  toParent({type:'lantu:ready'});
  setTimeout(function(){if(!inited)render();},1500);
})();
</script>
<script>
/* 全組織品牌 Logo：載入時抓 /api/brand，有上傳就換掉頂欄標記；報告書封面於產生時讀 window.LANTU_BRAND。*/
(function(){
  window.LANTU_BRAND=window.LANTU_BRAND||null;
  function applyMark(logoUrl){
    var m=document.getElementById('brandMark');
    if(m&&logoUrl){
      m.innerHTML='<img src="'+logoUrl+'" alt="嵐途 LAN TU" style="height:34px;width:auto;max-width:180px;object-fit:contain;display:block"/>';
    }
  }
  try{
    fetch('/api/brand',{cache:'no-store'})
      .then(function(r){return r&&r.ok?r.json():null;})
      .then(function(b){ if(!b)return; window.LANTU_BRAND=b; applyMark(b.logoUrl); })
      .catch(function(){});
  }catch(e){}
})();

/* 收支資債細類字典 + 教育費用參數：後台 /admin/categories 維護，這裡載入時抓一次。
   抓不到就沿用內建的 CAT_FALLBACK / EDU_COST_FALLBACK —— 選項會少一點，但畫面不會壞。
   抓到之後重畫一次，讓已經渲染出來的下拉換成完整清單。 */
(function(){
  window.LANTU_CATS=window.LANTU_CATS||null;
  window.LANTU_EDU_COSTS=window.LANTU_EDU_COSTS||null;
  try{
    fetch('/api/finance-categories',{cache:'no-store'})
      .then(function(r){return r&&r.ok?r.json():null;})
      .then(function(d){
        if(!d)return;
        if(d.cats)window.LANTU_CATS=d.cats;
        if(d.edu&&d.edu.length)window.LANTU_EDU_COSTS=d.edu;
        try{ if(typeof render==='function')render(); }catch(e){}
      })
      .catch(function(){});
  }catch(e){}
})();
</script>
