<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嵐途 LAN TU · 全方位財務規劃</title>
<style>
:root{--bg:#081a2b;--panel:#0d2b45;--card:#12334f;--card2:#17406a;--line:rgba(255,255,255,.11);
 --tx:#eef2f7;--mut:#a7bacb;--mut2:#6f869c;--amber:#c99a5b;--amber2:#e0bd8b;--teal:#a9bccf;
 --blue:#a9bccf;--purple:#b7c6b0;--ok:#8fc0a3;--warn:#e08a68;--r:12px;
 --serif:"Noto Serif TC","Songti TC","PingFang TC",serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:14px}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
h1,h2,h3,h4{margin:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-right:150px;background:linear-gradient(90deg,#081a2b,#0d2b45);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:800;display:flex;align-items:center;gap:11px}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt .zh{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--tx)}
.brand .bt .en{font-size:9.5px;letter-spacing:.34em;color:var(--amber2);font-weight:600}
.brand small{color:var(--mut2);font-weight:600;font-size:11px;margin-left:4px}
.spacer{flex:1}
.roleSw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.roleSw button{border:none;background:none;color:var(--mut);padding:6px 16px;border-radius:999px;font-weight:700;font-size:13px}
.roleSw button.on{background:var(--amber);color:#08202a}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.tbtn:hover{background:var(--card2)}.tbtn.amber{background:var(--amber);color:#08202a;border-color:var(--amber)}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 55px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 13px}
.side h3{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:4px 0 10px}
.clientcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
.clientcard:hover{background:var(--card2)}.clientcard.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.clientcard .nm{font-weight:700}.clientcard .mt{color:var(--mut);font-size:12px}
.clientcard .gr{position:absolute;top:10px;right:11px;font-weight:800;font-size:16px}
.main{padding:20px 24px;overflow:auto}
.tabbar{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabbar button{background:none;border:none;color:var(--mut);padding:9px 14px;font-weight:700;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.on{color:var(--amber);border-bottom-color:var(--amber)}
/* 資料分頁：分組導覽（B 排法＋A 視覺） */
.dgroups{border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:5px;display:flex;flex-direction:column;gap:3px}
.dgrow{display:flex;flex-wrap:wrap;align-items:center;gap:1px 3px}
.dglab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);background:#0a1a20;border:1px solid var(--line);border-radius:8px;padding:4px 11px;margin:2px 8px 2px 0;white-space:nowrap}
.dglab .dgn{font-family:var(--serif);font-size:15px;font-weight:800;line-height:1}
.dglab.exec{color:var(--mut2)}
.dgrow .dtab{background:none;border:none;color:var(--mut);padding:8px 12px;font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dgrow .dtab:hover{color:var(--tx)}
.dgrow .dtab.on{color:var(--amber);border-bottom-color:var(--amber)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.sec h4{font-size:15px;margin-bottom:12px;color:var(--amber2);display:flex;align-items:center;gap:8px}
.sec h4 .add{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:4px 11px;font-size:12.5px;font-weight:700}
.sec .hint{color:var(--mut2);font-size:12px;font-weight:400;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11.5px;font-weight:700;white-space:nowrap}
td input,td select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 7px;font-size:12.5px}
td input[type=checkbox]{width:auto}
.del{background:none;border:none;color:var(--warn);font-size:15px;padding:0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.f input,.f select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;border-top:3px solid var(--teal)}
.kpi .lb{color:var(--mut);font-size:12.5px}.kpi .vv{font-size:22px;font-weight:800;margin-top:3px}.kpi small{color:var(--mut2);font-size:11px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gau{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.gau .t{color:var(--mut);font-size:13px}.arc{width:150px;height:82px;margin:8px auto 2px}.gau .sc{font-size:26px;font-weight:800}
.gradebox{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.gradebox .g{font-size:44px;font-weight:800;line-height:1}
.rtable td.k{color:var(--tx);font-weight:700}.rtable code{color:var(--teal);font-family:ui-monospace,monospace;font-size:12px}
.bad{color:var(--warn);font-weight:800}.good{color:var(--ok);font-weight:800}
.bar{height:8px;background:#0a1a20;border-radius:5px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:var(--teal)}
.advcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:11px;padding:13px 15px;margin-bottom:10px}
.advcard h4{color:var(--amber2);font-size:14.5px;margin-bottom:4px}.advcard p{margin:0;color:var(--mut);font-size:13px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.muted{color:var(--mut);font-size:12.5px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.big3 .b{background:#0a1a20;border:1px solid var(--line);border-radius:10px;padding:12px}
.big3 .b .l{color:var(--mut);font-size:12px}.big3 .b .v{font-size:19px;font-weight:800;margin-top:2px}
.report{background:#fdfbf6;color:#22333a;border-radius:14px;padding:34px 38px;max-width:820px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:var(--serif)}
.report h2{color:#0d2b45;border-bottom:2px solid #c99a5b;padding-bottom:8px;margin:26px 0 12px;font-size:20px;letter-spacing:.04em}
.report h2:first-child{margin-top:0}.report table{font-size:13px}
.report th,.report td{border-bottom:1px solid #e6e0d4;color:#33414a}.report th{color:#0d2b45;background:#f2ede2}
.report .rc{background:linear-gradient(135deg,#0d2b45,#0a2138);color:#fff;padding:24px 26px;margin:-34px -38px 22px;border-radius:14px 14px 0 0;border-bottom:3px solid #c99a5b}
.report .rc .k{color:#c99a5b;letter-spacing:.28em;font-size:11px;font-weight:700}.report .rc h1{font-size:26px;margin-top:6px;letter-spacing:.06em}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;box-shadow:none;max-width:100%}}
.hero2{background:linear-gradient(120deg,#0d2b45,#0c232b);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.hero2 .k{color:var(--amber);letter-spacing:.18em;font-size:12px;font-weight:700}.hero2 h1{font-size:26px;margin:6px 0}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.big3{grid-template-columns:1fr}}

/* ===== embed 模式（單一年度版本編輯器，由 /dashboard 外殼載入）===== */
html.embed .side{display:none!important}
html.embed .shell{grid-template-columns:1fr!important}
/* ===== 收支資債 四合一輸入台 ===== */
.finsum{position:sticky;top:0;z-index:15;background:rgba(8,26,43,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.finsg{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.finsg .gt{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;letter-spacing:.16em;color:var(--amber2);font-weight:800}
.finsg .cells{display:flex;gap:14px;flex-wrap:wrap;align-items:center;flex:1}
.finsg .l{color:var(--mut);font-size:11.5px}.finsg .v{font-size:18px;font-weight:800;line-height:1.2}.finsg .v.big{font-size:21px}
.finsg .op{color:var(--mut2);font-size:18px;font-weight:800;align-self:center}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.finhint{color:var(--mut);font-size:12.5px;margin:0 2px 12px}
.finquad{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1024px){.finquad{grid-template-columns:1fr}.finsum{grid-template-columns:1fr}}
.finpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column}
.finpanel.inc{border-top:3px solid var(--ok)}.finpanel.exp{border-top:3px solid var(--warn)}.finpanel.ast{border-top:3px solid var(--teal)}.finpanel.lia{border-top:3px solid var(--amber)}
.finph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.finph h4{font-size:15px;color:var(--tx);margin:0}
.finph .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.finph .sub{margin-left:auto;text-align:right}.finph .sub .sl{color:var(--mut);font-size:11px}.finph .sub .sv{font-size:15px;font-weight:800}
.finph .add{margin-left:10px}
.fintag{font-size:10.5px;color:var(--mut2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:400}
.fintbl{overflow-x:auto;flex:1}
td.calc{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grp td{background:#0a1a20;color:var(--amber2);font-weight:700;font-size:12px}.grp .gm{color:var(--mut);font-weight:400}
.exp-btn{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:1px 7px;font-size:12px;line-height:1.4}
.exp-btn.on{color:var(--amber2);border-color:var(--amber);background:rgba(201,154,91,.12)}
.acts{white-space:nowrap;display:flex;gap:4px;align-items:center}
.drow>td{background:#091420;padding:9px 12px 11px}
.dform{display:flex;flex-wrap:wrap;gap:9px 15px}
.dfield{display:flex;flex-direction:column;gap:2px}.dfield label{color:var(--mut);font-size:11px}
.dfield input,.dfield select{width:auto;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 7px;font-size:12.5px;min-width:118px}
.dhead{width:100%;color:var(--mut2);font-size:11px;letter-spacing:.06em;margin-bottom:2px}
.finfoot{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut2)}
</style>
</head>

function activeCase(){return app.cases.find(function(x){return x.id===app.activeId})}
function n(v){v=Number(v);return isNaN(v)?0:v}
function sum(a,f){return (a||[]).reduce(function(s,x){return s+f(x)},0)}
function fmt(v){v=Math.round(n(v));return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function pct(x){return (x*100).toFixed(2)+'%'}
function annualDebtInterest(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;return (a0>=sa)?lBal(l)*n(l.rate)/100:0})}
function annualDebtPay(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;var elapsed=(a0-sa)*12;return (a0>=sa&&(n(l.months)-elapsed)>0)?lPay(l)*12:0})}

function familyAnnualLiving(c){return sum(c.expenses,function(e){return (e.cat==='生活'||e.cat==='消費')?n(e.amount):0})}
function aVal(a){return n(a.value)*(n(a.fxRate)||1)}
function aInc(a){return n(a.income)*(n(a.fxRate)||1)}
function lBal(l){return n(l.balance)*(n(l.fxRate)||1)}
function lPay(l){return n(l.pay)*(n(l.fxRate)||1)}
function assetPassive(c){return sum(c.assets,function(a){return (a.income!=null&&a.income!=='')?aInc(a):((a.type==='股票'||a.type==='基金'||a.type==='債券')?aVal(a)*n(a.ret)/100:0)})}
function liquidMovable(c){return sum(c.assets,function(a){return (a.cls==='流動'&&a.movable)?aVal(a):0})}

// 生活願望(旅遊/休閒/奢侈品) 當年支出
function lifestyleFactor(c,age,factor){var s=0;[c.travel,c.hobby,c.luxury].forEach(function(arr){(arr||[]).forEach(function(it){if(age>=n(it.start)&&age<=n(it.end))s+=n(it.amount)*(n(it.freq)||1)*factor})});return s;}
function lifestyleAnnualNow(c){return lifestyleFactor(c,n(c.profile.age),1);}
// 教育金總需求(終值)
function eduTotal(c){var g=n(c.params.tuitionGrowth)/100;
 return sum(c.education,function(e){return n(e.annual)*n(e.years)*Math.pow(1+g,n(e.startIn))})}

// 退休需求
function retireNeed(c){
 var r=c.retire||{},age=n(c.profile.age),ra=n(c.profile.retireAge),le=n(c.profile.lifeExp);
 var infl=n(c.params.inflation)/100, g=n(r.retireInflation)/100, rr=n(r.retireReturn)/100;
 var years=Math.max(0,ra-age), m=Math.max(0,le-ra);
 var monthFV=n(r.monthLiving)*Math.pow(1+infl,years);
 var annualFV=monthFV*12;
 var total;
 if(Math.abs(rr-g)<1e-6){total=annualFV*m/(1+rr);}
 else{total=annualFV*(1-Math.pow((1+g)/(1+rr),m))/(rr-g);}
 var prepared=sum(r.prepared,function(p){return n(p.amount)});
 return {years:years,余年:m,monthFV:monthFV,total:total,prepared:prepared,gap:Math.max(0,total-prepared)};
}

// 壽險/醫療 需求反推 (per member in needs)
function lifeNeed(c,nd){
 var famLiving=familyAnnualLiving(c);
 var need=n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100*famLiving*n(nd.protectYears)
   + sum(c.liabilities,function(l){return n(l.balance)}) + eduTotal(c) + n(nd.funeral) + n(nd.estateTax);
 var existing=existingCover(c,nd.member,'壽險');
 var liquid=liquidMovable(c);
 return Math.max(0,need - existing - liquid);
}
function medicalDailyNeed(nd){return n(nd.room)+n(nd.selfPay)+n(nd.nursing)}
function memberDep(c,name){var m=(c.members||[]).find(function(x){return x.name===name});return m?n(m.depRatio):100}
var POLICY_MAP={'壽險':'life','意外險':'accident','住院醫療':'medical','初次罹癌':'firstCancer','癌症住院':'cancerHosp','重病給付':'critical','每月照護':'monthCare'};
function existingCover(c,member,kind){
 var fromCov=sum(c.coverages,function(cv){return (cv.member===member&&cv.kind===kind)?(n(cv.comm)+n(cv.social)):0});
 var f=POLICY_MAP[kind];var fromPol=f?sum(c.policies,function(p){return p.insured===member?n(p[f]):0}):0;
 return fromCov+fromPol;
}

// 綜合保障缺口: 需求(反推 or 直接) - 已有
function coverageGaps(c){
 var rows=[];
 (c.needs||[]).forEach(function(nd){
  var map={
   '壽險':lifeNeed(c,nd),
   '住院醫療':medicalDailyNeed(nd),
   '初次罹癌':n(nd.firstCancer),
   '癌症住院':n(nd.cancerHosp),
   '重病給付':n(nd.critical),
   '每月照護':n(nd.monthCare)
  };
  Object.keys(map).forEach(function(k){
   var need=map[k],ex=existingCover(c,nd.member,k);
   // 已備來源擴充：本人的壽險一次性需求，可由家庭流動資產支應
   if(k==='壽險'&&nd.member===(primaryMember(c)||{}).name)ex+=liquidMovable(c);
   rows.push({member:nd.member,kind:k,need:need,have:ex,gap:need-ex});
  });
 });
 return rows;
}
function totalGap(c){return sum(coverageGaps(c),function(g){return Math.max(0,g.gap)})}

// ===== 保障準備度（以「毛需求」計算，避免與缺口反推重複扣抵） =====
function grossLifeNeed(c,nd){var famLiving=familyAnnualLiving(c);
 return n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100*famLiving*n(nd.protectYears)
  +sum(c.liabilities,function(l){return lBal(l)})+eduTotal(c)+n(nd.funeral)+n(nd.estateTax);}
function coverageReadiness(c){var out=[],pm=(primaryMember(c)||{}).name;
 (c.needs||[]).forEach(function(nd){
  var defs=[['壽險',grossLifeNeed(c,nd),existingCover(c,nd.member,'壽險')+(nd.member===pm?liquidMovable(c):0)],
   ['住院醫療',medicalDailyNeed(nd),existingCover(c,nd.member,'住院醫療')],
   ['初次罹癌',n(nd.firstCancer),existingCover(c,nd.member,'初次罹癌')],
   ['癌症住院',n(nd.cancerHosp),existingCover(c,nd.member,'癌症住院')],
   ['重病給付',n(nd.critical),existingCover(c,nd.member,'重病給付')],
   ['每月照護',n(nd.monthCare),existingCover(c,nd.member,'每月照護')]];
  defs.forEach(function(d){out.push({member:nd.member,kind:d[0],need:d[1],have:d[2],ratio:d[1]>0?d[2]/d[1]:1});});
 });return out;}
function coverageReadinessByKind(c){var by={},ord=[];coverageReadiness(c).forEach(function(o){if(!by[o.kind]){by[o.kind]={kind:o.kind,need:0,have:0};ord.push(o.kind);}by[o.kind].need+=o.need;by[o.kind].have+=o.have;});
 return ord.map(function(k){var o=by[k];o.ratio=o.need>0?o.have/o.need:1;return o;});}
function coverageReadinessHTML(c,theme){var rd=coverageReadinessByKind(c).filter(function(o){return o.need>0||o.have>0});
 if(!rd.length)return theme==='light'?'<p style="color:#5a6b72">尚未於「保障需求」分頁建立需求。</p>':'<div style="color:#a7bacb;font-size:12px">尚未於「保障需求」分頁建立需求。</div>';
 if(theme==='light')return '<table><tr><th>險種</th><th>需求</th><th>已備</th><th>準備度</th></tr>'+rd.map(function(o){var p=Math.round(o.ratio*100),col=p>=100?'#3f7d54':p>=60?'#b5852f':'#b05a4a';return '<tr><td>'+o.kind+'</td><td>'+fmt(o.need)+'</td><td>'+fmt(o.have)+'</td><td style="color:'+col+';font-weight:700">'+p+'%</td></tr>';}).join('')+'</table>';
 return '<div class="gauges">'+rd.map(function(o){return gauge(o.kind+' 準備度',Math.min(100,Math.round(o.ratio*100)));}).join('')+'</div>';}

// ===== 責任遞減缺口投影（身故責任隨年遞減 vs 已備保障） =====
function responsibilityProjection(c,nd){var a0=n(c.profile.age),g=n(c.params.tuitionGrowth)/100;
 var py=Math.max(1,n(nd.protectYears)||20);
 var depR=n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100;
 var livingShare=depR*familyAnnualLiving(c);
 var parentAnnual=sum(c.expenses,function(e){return e.cat==='孝親'?n(e.amount):0});
 var funeral=n(nd.funeral)+n(nd.estateTax);
 var edu=c.education||[],liabs=c.liabilities||[];
 var coverage=existingCover(c,nd.member,'壽險')+((primaryMember(c)||{}).name===nd.member?liquidMovable(c):0);
 var rows=[];
 for(var t=0;t<=py;t++){
  var living=livingShare*Math.max(0,py-t);
  var parents=parentAnnual*Math.max(0,py-t);
  var eduRem=sum(edu,function(e){var s=n(e.startIn),yy=n(e.years),an=n(e.annual),cnt=0;for(var k=0;k<yy;k++){if(s+k>=t)cnt++;}return an*Math.pow(1+g,s)*cnt;});
  var loanRem=sum(liabs,function(l){var bal=lBal(l),mo=n(l.months);if(mo<=0)return bal;return bal*Math.max(0,Math.min(1,(mo-t*12)/mo));});
  var total=living+parents+eduRem+loanRem+funeral;
  rows.push({t:t,age:a0+t,living:living,parents:parents,edu:eduRem,loan:loanRem,funeral:funeral,total:total,coverage:coverage,gap:Math.max(0,total-coverage)});
 }
 return {rows:rows,coverage:coverage,member:nd.member};}
function respGapSVG(rp,theme){var rows=rp.rows;if(!rows.length)return '';
 var dark=theme!=='light',AX=dark?'#6f869c':'#5a6b72',GRID=dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)',TICK=dark?'#71858c':'#8a9aa2';
 var W=760,H=250,pL=58,pR=16,pT=16,pB=28,plotW=W-pL-pR,plotH=H-pT-pB;
 var vMax=Math.max.apply(null,rows.map(function(r){return Math.max(r.total,r.coverage)}).concat([1]))||1;
 function X(i){return pL+(rows.length>1?i/(rows.length-1):0)*plotW}
 function Y(v){return pT+plotH-(v/vMax)*plotH}
 var bw=Math.max(3,Math.min(16,plotW/rows.length*0.62));
 var comps=[['living','#5b93d6','生活責任'],['parents','#5cc08a','父母孝養'],['edu','#e0bd8b','教育責任'],['loan','#b7a1d6','貸款餘額'],['funeral','#8a9aa2','最後費用']];
 var bars=rows.map(function(r,i){var x=X(i)-bw/2,acc=0,seg='';comps.forEach(function(cp){var v=r[cp[0]];if(v<=0)return;var y0=Y(acc+v),h=Y(acc)-Y(acc+v);acc+=v;seg+='<rect x="'+x.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.4,h).toFixed(1)+'" fill="'+cp[1]+'"/>';});return seg;}).join('');
 var covLine=rows.map(function(r,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(r.coverage).toFixed(1);}).join(' ');
 var grid='',gL='';for(var k=0;k<=4;k++){var y=pT+plotH*k/4;grid+='<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="'+GRID+'"/>';gL+='<text x="'+(pL-6)+'" y="'+(y+3).toFixed(1)+'" fill="'+AX+'" font-size="9" text-anchor="end">'+cfAxis(vMax-vMax*k/4)+'</text>';}
 var ticks='',step=Math.max(1,Math.ceil(rows.length/12));for(var i2=0;i2<rows.length;i2+=step)ticks+='<text x="'+X(i2).toFixed(1)+'" y="'+(H-9)+'" fill="'+TICK+'" font-size="9" text-anchor="middle">'+rows[i2].age+'</text>';
 var covC=dark?'#ef6f6f':'#c0392b';
 var leg=comps.map(function(cp){return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><span style="width:11px;height:11px;border-radius:2px;background:'+cp[1]+';display:inline-block"></span>'+cp[2]+'</span>';}).join('')+'<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:0;border-top:2px dashed '+covC+';display:inline-block"></span>已備保障</span>';
 return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+grid+bars+'<path d="'+covLine+'" fill="none" stroke="'+covC+'" stroke-width="2" stroke-dasharray="5 3"/>'+gL+ticks+'</svg><div style="font-size:12px;color:'+AX+';margin-top:6px">'+leg+'</div>';}
function respGapCharts(c,theme){var nds=c.needs||[];if(!nds.length)return theme==='light'?'<p style="color:#5a6b72">尚未建立保障需求，無法產生責任遞減圖。</p>':'<div style="color:#a7bacb;font-size:12px">尚未建立保障需求。</div>';
 var hc=theme==='light'?'#0d2b45':'var(--amber2)';
 return nds.map(function(nd){var rp=responsibilityProjection(c,nd);return '<div style="margin:10px 0"><div style="color:'+hc+';font-weight:700;font-size:13px;margin-bottom:4px">責任遞減缺口圖 – '+esc(nd.member)+'（保障年數 '+(n(nd.protectYears)||20)+' 年）</div>'+respGapSVG(rp,theme)+'</div>';}).join('');}

function propertyGaps(c){
 return (c.goals||[]).filter(function(g){return g.type==='購屋'||g.type==='置產'}).map(function(g){
  var years=n(g.start)-n(c.profile.age);
  var fv=n(g.present)*Math.pow(1+n(g.appreciation)/100,Math.max(0,years));
  var loan=fv*n(g.loanRatio)/100;

  return {name:g.name,fv:fv,loan:loan,gap:gap};
 });

function metrics(c){
 var incTotal=sum(c.incomes,function(i){return n(i.amount)});
 var passive=assetPassive(c);
 var incFinancial=sum(c.incomes,function(i){return i.type==='理財'?n(i.amount):0})+passive;
 var living=familyAnnualLiving(c);
 var tax=sum(c.expenses,function(e){return e.cat==='稅賦'?n(e.amount):0});
 var ins=sum(c.expenses,function(e){return e.cat==='保險'?n(e.amount):0});
 var expTotal=sum(c.expenses,function(e){return n(e.amount)})+annualDebtPay(c);
 var cash=sum(c.assets,function(a){return (a.type==='現金'||a.type==='定存')?aVal(a):0});
 var liquid=sum(c.assets,function(a){return a.cls==='流動'?aVal(a):0});
 var assetTotal=sum(c.assets,function(a){return aVal(a)});
 var debtTotal=sum(c.liabilities,function(l){return lBal(l)});
 var net=assetTotal-debtTotal, save_=incTotal-expTotal, interest=annualDebtInterest(c), monthExp=expTotal/12;
 var proj=projection(c);
 return {incTotal:incTotal,incFinancial:incFinancial,living:living,tax:tax,ins:ins,expTotal:expTotal,cash:cash,liquid:liquid,
  assetTotal:assetTotal,debtTotal:debtTotal,net:net,save:save_,interest:interest,monthExp:monthExp,visionNeed:proj.totalOutflow,proj:proj};
}
// 協會標準財務比率體檢：收支流量 13 項 + 資產負債 11 項，各附官方理想值與紅黃綠燈判定。
function ratios(c){var m=metrics(c),r={};
 var inc=m.incTotal||1, at=m.assetTotal||1;
 // 收支流量子聚合
 var incWork=sum(c.incomes,function(i){return i.type==='工作'?n(i.amount):0});
 var livingCore=sum(c.expenses,function(e){return e.cat==='生活'?n(e.amount):0});
 var discretionary=sum(c.expenses,function(e){return (e.cat==='消費'||e.cat==='其他')?n(e.amount):0});
 var rent=sum(c.expenses,function(e){return (e.cat==='生活'&&/租/.test(e.name||''))?n(e.amount):0});
 var insAll=sum(c.expenses,function(e){return e.cat==='保險'?n(e.amount):0});
 var social=sum(c.expenses,function(e){return (e.cat==='保險'&&/(勞保|健保|勞健保|社會|國保|國民年金)/.test(e.name||''))?n(e.amount):0});
 var premium=Math.max(0,insAll-social);

/* ===== 稅賦 ===== */
// ===== 稅制常數（每年檢視更新，單點維護）=====
// 綜所稅級距 [淨額上限, 稅率, 累進差額]；適用 2025 年度(2026 申報)。來源：財政部綜所稅稅率級距表。逐年調整時只改此處。
var TAX_BR=[[590000,0.05,0],[1330000,0.12,41300],[2660000,0.2,147700],[4980000,0.3,413700],[1e15,0.4,911700]];
// 遺產稅級距 [課稅淨額上限, 稅率, 累進差額]；免稅額另見下方 estateTax()。逐年調整時只改此處。
var EST_BR=[[56210000,0.10,0],[112420000,0.15,2810500],[1e15,0.20,8431500]];
// 綜所稅免稅額/標準扣除/薪資特別扣除見 incomeTax()（exempt/stdDed/salarySpecial）；遺產稅免稅額見 estateTax()（13,330,000）。同屬每年檢視項。
function bracket(x,br){for(var i=0;i<br.length;i++){if(x<=br[i][0])return {rate:br[i][1],ded:br[i][2],tax:Math.max(0,x*br[i][1]-br[i][2])}}return{rate:0,ded:0,tax:0}}
function incomeTax(c){
 var tp=c.taxParams||{};
 var salary=sum(c.incomes,function(i){return i.type==='工作'?n(i.amount):0});
 var people=1+(tp.married?1:0)+n(tp.dependents);
 var salaryEarners=(c.members||[]).filter(function(m){return n(m.insSalary)>0}).length||1;
 var exempt=97000*people;
 var stdDed=tp.married?262000:131000;
 var salarySpecial=Math.min(salary,218000*salaryEarners);
 var net=Math.max(0,salary-exempt-stdDed-salarySpecial-n(tp.otherDeduction));
 var b=bracket(net,TAX_BR);
 return {salary:salary,exempt:exempt,stdDed:stdDed,salarySpecial:salarySpecial,net:net,rate:b.rate,ded:b.ded,tax:b.tax,people:people};
}
function estateTax(c,netOverride){
 var net=(netOverride!=null)?netOverride:metrics(c).net;
 var exempt=13330000, base=Math.max(0,net-exempt-n((c.taxParams||{}).otherDeduction));
 var b=bracket(base,EST_BR);
 return {base:base,rate:b.rate,tax:b.tax};
}
function propertyTax(c){var tp=c.taxParams||{};var house=n(tp.houseAssessed)*0.012,land=n(tp.landAssessed)*0.002,car=n(tp.carTax);return {house:house,land:land,car:car,total:house+land+car}}
function legacyNeed(c){var lg=c.legacy||{};return n(lg.heirs)*n(lg.perHeirCash)}
/* ===== 資產配置 ===== */
function allocInfo(c){var al=(c.plan&&c.plan.allocations)||[];
 var totalPct=sum(al,function(a){return n(a.pct)});
 var wRet=totalPct?sum(al,function(a){return n(a.pct)*n(a.ret)})/totalPct:0;
 return {list:al,totalPct:totalPct,wRet:wRet};
}
/* ===== 規劃前後對照 ===== */
function scenario(c){
 var after=JSON.parse(JSON.stringify(c));
 after.profile.retireAge=n(c.profile.retireAge)+n((c.plan||{}).retireDelay);
 // 延後退休：延長工作收入到新退休年齡
 after.incomes.forEach(function(i){if(i.type==='工作'&&n(i.end)<after.profile.retireAge)i.end=after.profile.retireAge});
 var before={metrics:metrics(c),retire:retireNeed(c),health:health(c),estate:estateTax(c),incomeTax:incomeTax(c)};
 var mAfter=metrics(after);
 var netAfter=mAfter.net-n((c.plan||{}).movableToOverseas); // 資產移轉降低境內帳面淨值(遺產稅基)
 var after2={metrics:mAfter,retire:retireNeed(after),health:health(after),estate:estateTax(after,netAfter),incomeTax:incomeTax(after)};
 return {before:before,after:after2};
}

function crossTable(c){var m=metrics(c);
 var incWork=sum(c.incomes,function(i){return i.type==='工作'?n(i.amount):0});
 var incFin=sum(c.incomes,function(i){return i.type==='理財'?n(i.amount):0});
 var incOther=sum(c.incomes,function(i){return i.type==='其他'?n(i.amount):0});
 var expLive=sum(c.expenses,function(e){return (e.cat==='生活'||e.cat==='消費')?n(e.amount):0});
 var expTax=m.tax, expIns=m.ins, expOther=sum(c.expenses,function(e){return ['生活','消費','稅賦','保險'].indexOf(e.cat)<0?n(e.amount):0});
 var aSelf=sum(c.assets,function(a){return a.cls==='固定'?aVal(a):0});
 var aInv=sum(c.assets,function(a){return a.cls==='流動'?aVal(a):0});
 var dCons=sum(c.liabilities,function(l){return (l.mainCat==='信貸'||/信|卡|消費/.test(l.name))?lBal(l):0});
 var dInv=m.debtTotal-dCons;
 return {incWork:incWork,incFin:incFin,incOther:incOther,incTotal:m.incTotal,expLive:expLive,expTax:expTax,expIns:expIns,expOther:expOther+annualDebtPay(c),expTotal:m.expTotal,
  aSelf:aSelf,aInv:aInv,aTotal:m.assetTotal,dCons:dCons,dInv:dInv,dTotal:m.debtTotal,net:m.net,monthBal:(m.incTotal-m.expTotal)/12};
}

// 勞保老年年金 + 勞退新制 概算（供退休已備參考；非精算，可手動覆寫）
function estimateLaborPension(c){
 var pm=primaryMember(c)||{};var ins=n(pm.insSalary);
 var age=n(c.profile.age),ra=n(c.profile.retireAge);
 var years=Math.max(0,n(pm.worked)+Math.max(0,ra-age));
 var r=c.retire||{};var rr=n(r.retireReturn)/100||0.04;var m=Math.max(0,n(c.profile.lifeExp)-ra);
 if(ins<=0||years<=0)return {ins:ins,years:years,monthly:0,lump:0,fund:0,total:0};
 var monthly=ins*years*0.0155;                 // 勞保老年年金 B式 1.55%
 var annual=monthly*12;
 var lump=(rr>0)?annual*(1-Math.pow(1+rr,-m))/rr:annual*m;  // 退休時之年金現值
 var g=0.03, annualContrib=ins*0.06*12;         // 勞退：雇主月提繳6%、基金概估年化3%
 var fund=(g>0)?annualContrib*(Math.pow(1+g,years)-1)/g:annualContrib*years;
 return {ins:ins,years:years,monthly:monthly,lump:lump,fund:fund,total:lump+fund};
}
function addLaborPensionPrepared(){var c=activeCase();var e=estimateLaborPension(c);if(e.total<=0)return;

 c.retire.prepared.push({item:'勞保老年年金(概算)',age:ra,amount:Math.round(e.lump),method:'一次領'});
 c.retire.prepared.push({item:'勞退新制(概算)',age:ra,amount:Math.round(e.fund),method:'一次領'});
 save();render();
}

function setRiskAns(qi,oi){var c=activeCase();if(!c.riskQuiz)c.riskQuiz={ans:{}};c.riskQuiz.ans[qi]=oi;save();render();}
function applyRiskToParams(){var c=activeCase();var rp=riskProfile(c);if(!rp)return;c.params.invReturn=rp.tier.rr;c.params.invReturnStd=rp.tier.std;save();render();}

 var result;

   '<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px"><div>建議投資報酬率 <b style="color:var(--amber2)">'+t.rr+'%</b></div><div>建議報酬標準差 <b>'+t.std+'%</b></div></div>'+
   '<div style="color:var(--mut);font-size:12.5px;margin-top:6px">配置方向：'+esc(t.alloc)+'</div>'+

 } else {

 }
 return '<div class="sec"><h4>投資風險屬性測驗（KYC）</h4><div class="hint">依 12 題結果評定風險承受度，作為建議投資報酬率與蒙地卡羅波動度的依據。可一鍵套用至規劃參數。</div></div>'+result+qs+result;

function groupedTable(c,title,arr,list,cols,ownerKey,valFn,hint){
 var cur=app.ownerView||'全家';

 if(cur!=='全家')idxList=idxList.filter(function(p){return (p[0][ownerKey]||'')===cur});

 var body=order.map(function(o){var sub=0;
  var rows=idxList.filter(function(p){return (p[0][ownerKey]||'(未指定)')===o}).map(function(p){var x=p[0],idx=p[1];sub+=n(valFn(x));

function clientView(){var c=activeCase();if(!c)return '<div style="padding:60px;text-align:center;color:var(--mut)">尚無資料</div>';

 var view=app.activeTab==='report'?'report':'analysis';
 var tb=[['analysis','我的財務儀表'],['report','我的規劃報告']].map(function(t){return '<button data-tab="'+t[0]+'" class="'+(view===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');
 var body;
 if(view==='report')body=reportHTML(c);
 else{var kp=[['淨資產',fmt(m.net)],['財務健康等級',h.grade],['退休缺口',fmt(rn.gap)],['資產轉負',proj.turnNeg?proj.turnNeg+' 歲':'無']]
   .map(function(k){return '<div class="kpi"><div class="lb">'+k[0]+'</div><div class="vv">'+k[1]+'</div></div>'}).join('');
  var gau=[['財務安全度',h.safety],['財務自由度',h.freedom],['願景達成度',h.vision]].map(function(g){return gauge(g[0],g[1])}).join('');
  var rtC=function(s){return s==='good'?'var(--ok)':s==='warn'?'var(--amber2)':s==='bad'?'var(--warn)':'var(--mut)'};
  var rt=Object.keys(r).map(function(k){var x=r[k];return '<tr><td class="k">'+k+'</td><td style="color:'+rtC(x.status)+';font-weight:800">'+x.v+'</td><td class="muted" style="font-size:12px">'+x.ideal+'</td></tr>'}).join('');
  body='<div class="hero2"><div class="k">MY FINANCIAL DASHBOARD</div><h1>'+esc(c.profile.name)+'，您好</h1><div class="muted">您目前的財務健康等級 <b style="color:'+gradeColor(h.grade)+'">'+h.grade+'</b>。</div></div>'+
   '<div class="kpis">'+kp+'</div><div class="sec"><h4>財務健康度</h4><div class="gauges">'+gau+'</div></div>'+
   '<div class="sec"><h4>我的財務指標</h4><table class="rtable">'+rt+'</table></div>'+
   cashflowCharts(proj);}
 var picker=app.cases.length>1?'<div style="margin-bottom:14px">檢視對象：<select onchange="app.activeId=this.value;render()" style="background:#0a1a20;color:#e9f0f2;border:1px solid var(--line);border-radius:8px;padding:6px 10px">'+
   app.cases.map(function(x){return '<option value="'+x.id+'" '+(x.id===app.activeId?'selected':'')+'>'+esc(x.profile.name)+'</option>'}).join('')+'</select></div>':'';
 return '<div class="main" style="max-width:960px;margin:0 auto">'+picker+'<div class="tabbar">'+tb+'</div>'+body+'</div>';
}
document.querySelectorAll('#roleSw button').forEach(function(b){b.onclick=function(){app.role=b.dataset.r;app.activeTab=b.dataset.r==='client'?'analysis':'data';render()}});
(function(){
  var EMBED=/[?&]embed=1/.test(location.search);
  if(!EMBED){load();render();return;}
  document.documentElement.classList.add('embed');
  document.querySelectorAll('.top .tbtn').forEach(function(b){if(/匯出|匯入/.test(b.textContent||''))b.style.display='none';});
  // embed：save() 不寫 localStorage，改把整份 case 回傳父層（父層存回 DB）
  save=function(){try{if(app.cases&&app.cases[0])parent.postMessage({type:'lantu:save',data:app.cases[0]},'*');}catch(e){}};
  var inited=false;
  window.addEventListener('message',function(e){
    if(e.source!==parent)return;
    var m=e.data;if(!m||m.type!=='lantu:init')return;
    var c=m.data||{};if(!c.id)c.id=uid();
    app.cases=[c];app.activeId=c.id;app.role='coach';app.activeTab='data';
    inited=true;render();
  });
  try{parent.postMessage({type:'lantu:ready'},'*');}catch(e){}
  setTimeout(function(){if(!inited)render();},1500);
})();
</script>
<script>
/* 全組織品牌 Logo：載入時抓 /api/brand，有上傳就換掉頂欄標記；報告書封面於產生時讀 window.LANTU_BRAND。*/
(function(){
  window.LANTU_BRAND=window.LANTU_BRAND||null;
  function applyMark(logoUrl){
    var m=document.getElementById('brandMark');
    if(m&&logoUrl){
      m.innerHTML='<img src="'+logoUrl+'" alt="嵐途 LAN TU" style="height:34px;width:auto;max-width:180px;object-fit:contain;display:block"/>';
    }
  }
  try{
    fetch('/api/brand',{cache:'no-store'})
      .then(function(r){return r&&r.ok?r.json():null;})
      .then(function(b){ if(!b)return; window.LANTU_BRAND=b; applyMark(b.logoUrl); })
      .catch(function(){});
  }catch(e){}
})();
