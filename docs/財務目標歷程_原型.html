<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>嵐途 LAN TU · 全方位財務規劃</title>
<style>
:root{--bg:#081a2b;--panel:#0d2b45;--card:#12334f;--card2:#17406a;--line:rgba(255,255,255,.11);
 --tx:#eef2f7;--mut:#a7bacb;--mut2:#6f869c;--amber:#c99a5b;--amber2:#e0bd8b;--teal:#a9bccf;
 --blue:#a9bccf;--purple:#b7c6b0;--ok:#8fc0a3;--warn:#e08a68;--r:12px;
 --serif:"Noto Serif TC","Songti TC","PingFang TC",serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.6;font-size:14px}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}
h1,h2,h3,h4{margin:0}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-right:150px;background:linear-gradient(90deg,#081a2b,#0d2b45);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.brand{font-weight:800;display:flex;align-items:center;gap:11px}
.brand:hover{opacity:.85}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt .zh{font-family:var(--serif);font-size:18px;letter-spacing:.14em;color:var(--tx)}
.brand .bt .en{font-size:9.5px;letter-spacing:.34em;color:var(--amber2);font-weight:600}
.brand small{color:var(--mut2);font-weight:600;font-size:11px;margin-left:4px}
.spacer{flex:1}
.roleSw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.roleSw button{border:none;background:none;color:var(--mut);padding:6px 16px;border-radius:999px;font-weight:700;font-size:13px}
.roleSw button.on{background:var(--amber);color:#08202a}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.tbtn:hover{background:var(--card2)}.tbtn.amber{background:var(--amber);color:#08202a;border-color:var(--amber)}
.shell{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 55px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 13px}
.side h3{font-size:12px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:4px 0 10px}
.clientcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
.clientcard:hover{background:var(--card2)}.clientcard.on{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber) inset}
.clientcard .nm{font-weight:700}.clientcard .mt{color:var(--mut);font-size:12px}
.clientcard .gr{position:absolute;top:9px;right:10px;font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.92}
.main{padding:20px 24px;overflow:auto}
.tabbar{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabbar button{background:none;border:none;color:var(--mut);padding:9px 14px;font-weight:700;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button.on{color:var(--amber);border-bottom-color:var(--amber)}
/* 資料分頁：分組導覽（B 排法＋A 視覺） */
.dgroups{border-bottom:1px solid var(--line);margin-bottom:16px;padding-bottom:5px;display:flex;flex-direction:column;gap:3px}
.dgrow{display:flex;flex-wrap:wrap;align-items:center;gap:1px 3px}
.dglab{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);background:#0a1a20;border:1px solid var(--line);border-radius:8px;padding:4px 11px;margin:2px 8px 2px 0;white-space:nowrap}
.dglab .dgn{font-family:var(--serif);font-size:15px;font-weight:800;line-height:1}
.dglab.exec{color:var(--mut2)}
/* 全域資料完整度列 */
.cmpl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#0a2137;border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-bottom:16px}
.cmpl .lab{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--amber);white-space:nowrap}
.cmpl .dots{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.cmpl .dot{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.cmpl .dot i{width:7px;height:7px;border-radius:50%;background:var(--mut2);display:inline-block;font-style:normal}
.cmpl .dot.ok{color:var(--ok);border-color:rgba(143,192,163,.4)}
.cmpl .dot.ok i{background:var(--ok)}
.cmpl .dot.goal{border-style:dashed}
.cmpl .cnt{font-family:var(--serif);font-size:17px;font-weight:800;color:var(--amber2);white-space:nowrap}
.cmpl .note{width:100%;font-size:11.5px;color:var(--mut2)}
/* 人生目標卡（二態：選了＝必須達成） */
.gwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.gcard{position:relative;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:11px;padding:11px 12px 10px;transition:.13s}
.gcard:hover{border-color:var(--amber2)}
.gcard .nm{font-weight:700;font-size:13.5px;line-height:1.35}
.gcard .sub{font-size:11px;color:var(--mut2);margin-top:3px}
.gcard.on{background:var(--amber);border-color:var(--amber);color:#08202a;box-shadow:0 2px 10px rgba(201,154,91,.22)}
.gcard.on .sub{color:rgba(8,32,42,.66)}
.gcard .ord{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;background:#08202a;color:var(--amber2);border:1.5px solid var(--amber);font-family:var(--serif);font-size:12.5px;font-weight:800;display:grid;place-items:center}
.gcard .lock{font-weight:800;color:rgba(8,32,42,.62)}
/* 必達優先序拖曳列 */
.prio{background:#0a2137;border:1px solid rgba(201,154,91,.32);border-radius:11px;padding:11px 12px;margin-bottom:12px}
.prio .ph{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.prio .ph b{font-size:12.5px;color:var(--amber2);letter-spacing:.03em}
.prow{display:flex;flex-wrap:wrap;gap:7px}
.pitem{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 6px 5px 9px;cursor:grab;user-select:none}
.pitem.drag{opacity:.35}
.pitem.over{border-color:var(--amber2);box-shadow:0 0 0 1px var(--amber2) inset}
.pitem .n{font-family:var(--serif);font-size:14px;font-weight:800;color:var(--amber2);min-width:14px;text-align:center}
.pitem .t{font-weight:700;font-size:13px}
.pitem .g{color:var(--mut2);font-size:13px;letter-spacing:-2px}
.pitem .mv{display:flex;gap:2px}
.pitem .mv button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;width:22px;height:22px;font-size:11px;line-height:1;padding:0}
.pitem .mv button:hover{border-color:var(--amber2);color:var(--amber2)}
.pitem .x{background:none;border:none;color:var(--mut2);font-size:14px;padding:0 3px}
.pitem .go{background:rgba(143,192,163,.12);border:1px solid rgba(143,192,163,.4);color:var(--teal);border-radius:6px;font-size:11px;font-weight:700;padding:2px 7px;line-height:1.5;white-space:nowrap}
.pitem .go:hover{background:rgba(143,192,163,.24)}
.pitem .go .tb{color:var(--mut2);font-weight:400}
.goalflash{animation:goalflash 1.6s ease-out}
@keyframes goalflash{0%,40%{box-shadow:0 0 0 2px var(--amber2)}100%{box-shadow:0 0 0 2px rgba(0,0,0,0)}}
.pitem .x:hover{color:var(--warn)}
/* 未選目標的收合列 */
.folded{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--mut2);font-size:12.5px;border:1px dashed rgba(201,154,91,.34);border-radius:11px;padding:10px 13px;margin-bottom:14px}
.tagMust{font-size:10.5px;font-weight:800;letter-spacing:.04em;border:1px solid currentColor;border-radius:999px;padding:1px 8px;color:var(--ok)}
.tagOff{font-size:10.5px;font-weight:800;letter-spacing:.04em;border:1px solid currentColor;border-radius:999px;padding:1px 8px;color:var(--mut2)}
.owner{font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 9px;background:rgba(169,188,207,.14);color:var(--teal);border:1px solid rgba(169,188,207,.3)}
.dgrow .dtab{background:none;border:none;color:var(--mut);padding:8px 12px;font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.dgrow .dtab:hover{color:var(--tx)}
.dgrow .dtab.on{color:var(--amber);border-bottom-color:var(--amber)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
/* ── 分析頁模組（可收合、可排序）2026/08/22 ── */
.anbar .anbarhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.anbar .anbarhead b{font-size:13px;color:var(--amber2)}
.anbar .anbarhead .hint{font-size:11.5px}
.anchips{display:flex;flex-wrap:wrap;gap:6px}
.anchip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 5px 3px 11px;cursor:grab;user-select:none;font-size:12.5px}
.anchip b{font-weight:700;cursor:pointer}
.anchip b:hover{color:var(--amber2)}
.anchip i{font-style:normal;width:18px;height:18px;line-height:17px;text-align:center;border-radius:50%;border:1px solid var(--line);color:var(--mut2);font-size:11px;cursor:pointer}
.anchip i:hover{border-color:var(--amber2);color:var(--amber2)}
.anchip.off{opacity:.45}
.anchip.off b{text-decoration:line-through}
.anchip.drag{opacity:.35}
.anchip.over{border-color:var(--amber2);box-shadow:0 0 0 1px var(--amber2) inset}
.anmod{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.anmod>summary{list-style:none;cursor:pointer;padding:12px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.anmod>summary::-webkit-details-marker{display:none}
.anmod>summary::before{content:'▸';color:var(--amber2);font-size:12px;transition:transform .15s}
.anmod[open]>summary::before{transform:rotate(90deg)}
.anmod>summary:hover{background:rgba(255,255,255,.02)}
.anmod>summary .ant{font-size:15px;font-weight:800;color:var(--amber2)}
.anmod>summary .hint{font-weight:400}
.anmod[open]>summary{border-bottom:1px solid var(--line)}
.anbody{padding:14px 18px 16px}
.anbody>.sec{background:transparent;border:none;padding:0;margin-bottom:14px}
.anbody>.sec:last-child{margin-bottom:0}
.sec h4{font-size:15px;margin-bottom:12px;color:var(--amber2);display:flex;align-items:center;gap:8px}
.sec h4 .add{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--teal);border-radius:8px;padding:4px 11px;font-size:12.5px;font-weight:700}
.sec .hint{color:var(--mut2);font-size:12px;font-weight:400;margin-left:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11.5px;font-weight:700;white-space:nowrap}
td input,td select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:7px;padding:5px 7px;font-size:12.5px}
td input[type=checkbox]{width:auto;min-width:0}
/* 下拉/輸入格不再被欄位數壓縮成看不到字；表格改為可橫向捲動 */
td select{width:auto;min-width:100%}
td input{min-width:82px}
td input[type=number]{min-width:88px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw>table{min-width:100%;width:auto}
td.calc{white-space:nowrap}
/* 人生財務目標清單 ↔ 人生價值環：左右並排對照 */
.lgwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.82fr);gap:16px;align-items:start}
.lgwrap>.sec{margin-bottom:0;min-width:0}
@media(max-width:1080px){.lgwrap{grid-template-columns:minmax(0,1fr)}.lgwrap>.sec{margin-bottom:16px}}
.del{background:none;border:none;color:var(--warn);font-size:15px;padding:0 4px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.f label{display:block;color:var(--mut);font-size:12px;margin-bottom:3px}
.f input,.f select{width:100%;background:#0a1a20;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;border-top:3px solid var(--teal)}
.kpi .lb{color:var(--mut);font-size:12.5px}.kpi .vv{font-size:22px;font-weight:800;margin-top:3px}.kpi small{color:var(--mut2);font-size:11px}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gau{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:center}
.gau .t{color:var(--mut);font-size:13px}.arc{width:150px;height:82px;margin:8px auto 2px}.gau .sc{font-size:26px;font-weight:800}
.gradebox{display:inline-flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 20px}
.gradebox .g{font-size:26px;font-weight:800;line-height:1.25;letter-spacing:.04em}
.rtable td.k{color:var(--tx);font-weight:700}.rtable code{color:var(--teal);font-family:ui-monospace,monospace;font-size:12px}
.bad{color:var(--warn);font-weight:800}.good{color:var(--ok);font-weight:800}
.bar{height:8px;background:#0a1a20;border-radius:5px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:var(--teal)}
.advcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:11px;padding:13px 15px;margin-bottom:10px}
.advcard h4{color:var(--amber2);font-size:14.5px;margin-bottom:4px}.advcard p{margin:0;color:var(--mut);font-size:13px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:16px}
.muted{color:var(--mut);font-size:12.5px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.big3 .b{background:#0a1a20;border:1px solid var(--line);border-radius:10px;padding:12px}
.big3 .b .l{color:var(--mut);font-size:12px}.big3 .b .v{font-size:19px;font-weight:800;margin-top:2px}
.report{background:#fdfbf6;color:#22333a;border-radius:14px;padding:34px 38px;max-width:820px;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.4);font-family:var(--serif)}
.report h2{color:#0d2b45;border-bottom:2px solid #c99a5b;padding-bottom:8px;margin:26px 0 12px;font-size:20px;letter-spacing:.04em}
.report h2:first-child{margin-top:0}.report table{font-size:13px}
.report th,.report td{border-bottom:1px solid #e6e0d4;color:#33414a}.report th{color:#0d2b45;background:#f2ede2}
.report .rc{background:linear-gradient(135deg,#0d2b45,#0a2138);color:#fff;padding:24px 26px;margin:-34px -38px 22px;border-radius:14px 14px 0 0;border-bottom:3px solid #c99a5b}
.report .rc .k{color:#c99a5b;letter-spacing:.28em;font-size:11px;font-weight:700}.report .rc h1{font-size:26px;margin-top:6px;letter-spacing:.06em}
.pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700}
@media print{body *{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;box-shadow:none;max-width:100%}.report h2{break-after:avoid;page-break-after:avoid}.report table{break-inside:auto}.report tr{break-inside:avoid;page-break-inside:avoid}.report details{break-inside:avoid-page}.report details>summary{list-style:none;color:#0d2b45}}
.hero2{background:linear-gradient(120deg,#0d2b45,#0c232b);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.hero2 .k{color:var(--amber);letter-spacing:.18em;font-size:12px;font-weight:700}.hero2 h1{font-size:26px;margin:6px 0}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line)}.big3{grid-template-columns:1fr}}

/* ===== embed 模式（單一年度版本編輯器，由 /dashboard 外殼載入）===== */
html.embed .side,html.embed-single .side{display:none!important}
html.embed .shell,html.embed-single .shell{grid-template-columns:1fr!important}
/* ===== 收支資債 四合一輸入台 ===== */
.finsum{position:sticky;top:0;z-index:15;background:rgba(8,26,43,.94);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.finsg{display:flex;gap:10px;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.finsg .gt{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;letter-spacing:.16em;color:var(--amber2);font-weight:800}
.finsg .cells{display:flex;gap:14px;flex-wrap:wrap;align-items:center;flex:1}
.finsg .l{color:var(--mut);font-size:11.5px}.finsg .v{font-size:18px;font-weight:800;line-height:1.2}.finsg .v.big{font-size:21px}
.finsg .op{color:var(--mut2);font-size:18px;font-weight:800;align-self:center}
.pos{color:var(--ok)}.neg{color:var(--warn)}
.finhint{color:var(--mut);font-size:12.5px;margin:0 2px 12px}
.finquad{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media(max-width:1024px){.finquad{grid-template-columns:minmax(0,1fr)}.finsum{grid-template-columns:minmax(0,1fr)}}
.finpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column}
.finpanel.inc{border-top:3px solid var(--ok)}.finpanel.exp{border-top:3px solid var(--warn)}.finpanel.ast{border-top:3px solid var(--teal)}.finpanel.lia{border-top:3px solid var(--amber)}
.finph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.finph h4{font-size:15px;color:var(--tx);margin:0}
.finph .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.finph .sub{margin-left:auto;text-align:right}.finph .sub .sl{color:var(--mut);font-size:11px}.finph .sub .sv{font-size:15px;font-weight:800}
.finph .add{margin-left:10px}
.fintag{font-size:10.5px;color:var(--mut2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:400}
.fintbl{overflow-x:auto;flex:1}
td.calc{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.grp td{background:#0a1a20;color:var(--amber2);font-weight:700;font-size:12px}.grp .gm{color:var(--mut);font-weight:400}
.edutog{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 2px;font-size:.86rem;color:var(--mut)}
.edutog label{display:flex;align-items:center;gap:5px;cursor:pointer}
.edulock{margin-left:4px;font-size:.66rem;padding:0 4px;border-radius:5px;background:rgba(201,154,91,.18);color:#c99a5b}
.edunow{background:rgba(143,192,163,.07)}
.edunowtag{font-size:.66rem;padding:0 5px;border-radius:5px;background:rgba(143,192,163,.18);color:#8fc0a3}
.catsel{max-width:12rem}
.finname{display:flex;align-items:center;gap:4px}
input.amtin{text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dh{display:inline-block;padding:0 4px;color:var(--mut2);cursor:grab;user-select:none;font-size:13px;line-height:1;vertical-align:middle}
.dh:active{cursor:grabbing}
tr.dragging{opacity:.45}
tr.dragover td{box-shadow:inset 0 2px 0 var(--amber2)}
/* ===== 調整方案 v2 ===== */
:root{--gap2:#ef6f6f}
.v2big .b .v{font-family:var(--serif);font-size:24px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.v2big .b.hero{border-left:3px solid var(--amber)}
.vtwrap svg{display:block}
.vttip{position:absolute;pointer-events:none;background:#04121e;border:1px solid var(--line);border-radius:8px;

function catSelect(kind,cur,onchangeAttr){
 var list=catList(kind),order=[],map={};
 list.forEach(function(x){if(!map[x.parent]){map[x.parent]=[];order.push(x.parent)}map[x.parent].push(x)});

 order.forEach(function(g){
  html+='<optgroup label="'+esc(g)+'">'+map[g].map(function(x){
   return '<option '+(x.label===cur?'selected':'')+'>'+esc(x.label)+'</option>';
  }).join('')+'</optgroup>';
 });
 if(cur&&!found)html+='<optgroup label="（已停用/舊值）"><option selected>'+esc(cur)+'</option></optgroup>';

}

var JOB_TEXT_FIELDS=[['jobCompany','公司名稱','可留空'],['jobTitle','職務','具體在做什麼，例：產線品保工程師']];
function ensureJobText(o){if(!o)return o;if(o.jobCompany==null)o.jobCompany='';if(o.jobTitle==null)o.jobTitle='';if(o.jobNote==null)o.jobNote='';return o;}

 pm.insSalary=isNoEmployerJob(c.profile.jobType)?NP_INSURED_MONTHLY:laborInsSalary(c.profile.monthlySalary);}

// 引擎對 c.profile / c.params / 13 個陣列完全沒有防護，缺任何一個都會在 render() 丟例外 → 整頁白畫面。
var CASE_SCHEMA_VERSION=2;

function _fill(dflt,cur){var o={};Object.keys(dflt||{}).forEach(function(k){o[k]=dflt[k]});Object.keys(cur||{}).forEach(function(k){if(cur[k]!==undefined)o[k]=cur[k]});return o;}
function migrateCase(c){
 if(!c||typeof c!=='object'||Array.isArray(c))c={};
 var d=newCase();
 if(!c.id)c.id=uid();
 c.profile=_fill(d.profile,c.profile);
 c.params=_fill(d.params,c.params);
 c.retire=_fill(d.retire,c.retire);
 if(!Array.isArray(c.retire.prepared))c.retire.prepared=[];
 c.plan=_fill(d.plan,c.plan);
 if(!Array.isArray(c.plan.allocations))c.plan.allocations=[];
 if(!Array.isArray(c.plan.invest))c.plan.invest=[];
 if(!Array.isArray(c.plan.protect))c.plan.protect=[];
 if(!Array.isArray(c.plan.trials))c.plan.trials=[];
 migrateAlloc(c);   // 舊的 allocations（比例%）搬進新的 invest（本金/年投入），只跑一次
 c.taxParams=_fill(d.taxParams,c.taxParams);
 c.credit=_fill(d.credit,c.credit);
 c.overseas=_fill(d.overseas,c.overseas);
 c.legacy=_fill(d.legacy,c.legacy);
 // 這兩個欄位以前經由 'sel:true,false' 存成字串，正規化成真的 boolean（預設開）。
 c.legacy.on=boolish(c.legacy.on,true);
 c.legacy.feedEstate=boolish(c.legacy.feedEstate,true);
 c.career=_fill(d.career,c.career);
 c.marriage=_fill(d.marriage,c.marriage);
 if(!c.riskQuiz||typeof c.riskQuiz!=='object')c.riskQuiz={ans:{}};
 if(!c.riskQuiz.ans||typeof c.riskQuiz.ans!=='object')c.riskQuiz.ans={};
 if(!c.bizGate||typeof c.bizGate!=='object')c.bizGate={ans:{}};
 if(!c.bizGate.ans||typeof c.bizGate.ans!=='object')c.bizGate.ans={};
 CASE_ARRAYS.forEach(function(k){if(!Array.isArray(c[k]))c[k]=[]});
 // 願景選定閘（2026/08/24）：舊資料沒有 on 欄位 → 一律補 true。
 // ⚠️ 這一段是「既有客戶數字一位不動」的保證，不要拿掉。
 ['goals','travel','hobby','luxury'].forEach(function(k){
  c[k].forEach(function(x){if(x&&typeof x==='object'&&x.on==null)x.on=true});
 });
 // 2026/08/20 短暫存在過的 otherNote（「其他」的明細欄）已收斂成統一的「項目」欄。
 // 那段期間存過的資料把 otherNote 搬進 name，別讓顧問填的字不見。
 ['incomes','expenses','savings','assets','liabilities'].forEach(function(k){
  c[k].forEach(function(x){
   if(!x||typeof x!=='object')return;
   if(x.name==null)x.name='';
   if(x.otherNote){if(!String(x.name).trim())x.name=x.otherNote;delete x.otherNote;}
  });
 });
 if(!c.members.length)c.members=JSON.parse(JSON.stringify(d.members));
 if(c.reportNote==null)c.reportNote='';
 if(c.bizReportNote==null)c.bizReportNote='';
 ensureJobFields(c);
 c.members.forEach(function(m){if(m&&(m.role==='本人'||m.role==='配偶'))ensureMemberJob(m);});
 ensureMemberIds(c);
 migrateCompanies(c);
 try{normalizeIntent(c);}catch(e){c.intent={purposes:[],targets:[DEFAULT_TARGET],mustHave:[DEFAULT_TARGET]};}
 c.schemaVersion=CASE_SCHEMA_VERSION;
 return c;
}
// c.company（單一物件、9 欄）→ c.companies[]。冪等：只在陣列還空、且舊物件真的有填東西時搬一次。
// 舊的 ownerLoan 是一個沒有方向的數字，方向未知時一律當「我借公司」（負債方，最常見的那個方向），
// 並在備註標明是舊資料轉入，讓教練回頭確認。
function migrateCompanies(c){
 if(!Array.isArray(c.companies))c.companies=[];
 ['bizYears','vat401','reconcile','ownerLoans','guarantees','bizAssets','channels','compScenarios'].forEach(function(k){if(!Array.isArray(c[k]))c[k]=[]});
 if(!c.bizRisk||typeof c.bizRisk!=='object')c.bizRisk={};
 if(!c.auditNotes||typeof c.auditNotes!=='object')c.auditNotes={};
 if(!c.bizExit||typeof c.bizExit!=='object')c.bizExit={};
 if(!c.bizExit.deboss||typeof c.bizExit.deboss!=='object')c.bizExit.deboss={};
 var old=c.company;
 var filled=old&&typeof old==='object'&&(String(old.name||'').trim()||n(old.annualRevenue)||n(old.netProfit)||n(old.ownerLoan)||String(old.taxId||'').trim());
 if(!c.companies.length&&filled){
  var co=newCompany();
  ['name','taxId','industry','role','note'].forEach(function(k){if(old[k]!=null)co[k]=old[k]});
  co.sharePct=n(old.sharePct)||100;co.annualRevenue=n(old.annualRevenue);co.netProfit=n(old.netProfit);
  c.companies.push(co);
  if(n(old.ownerLoan))c.ownerLoans.push({cid:co.cid,dir:'我借公司',amount:n(old.ownerLoan),hasNote:'否',interest:'否',crossYear:'是',note:'舊版「負責人往來」轉入，方向待確認'});
 }
 // 工作類別已經填「企業主」但還沒有公司列 → 補一列空的，否則第 ④ 群點進去是空的
 var mems=(c.members||[]);
 var isBiz=(c.profile||{}).jobType==='企業主'||mems.some(function(m){return m&&m.jobType==='企業主'});
 if(isBiz&&!c.companies.length)c.companies.push(newCompany());
 c.companies.forEach(function(co){if(co&&!co.cid)co.cid=cid();});
 // 有公司列＝企業主體開啟（既有企業主客戶不用再手動開一次）

 }

/* ===== ENGINE ===== */
function activeCase(){return app.cases.find(function(x){return x.id===app.activeId})}
function n(v){v=Number(v);return isNaN(v)?0:v}
// 風險性資產 / 消費性負債的判定。
// 後台細類帶的旗標（risk / consumerDebt）在選類別時就寫進資料列了，優先採用；
// 舊資料沒有旗標，退回改版前的字串比對，數字不會變。
// engine.ts 有一份對照實作（engine.drift.test.ts 對拍），改這裡要一起改。
function isRiskAsset(a){if(a&&(a.risk===true||a.risk===false))return a.risk;
 return !!a&&(a.type==='股票'||a.type==='基金'||a.type==='債券'||(a.type==='不動產'&&a.mainCat==='可投資資產'));}
function isConsumerDebt(l){if(l&&(l.consumerDebt===true||l.consumerDebt===false))return l.consumerDebt;
 return !!l&&(l.mainCat==='信貸'||/信|卡|消費/.test(l.name||''));}
function sum(a,f){return (a||[]).reduce(function(s,x){return s+f(x)},0)}
function fmt(v){v=n(v);if(!isFinite(v))return '—';v=Math.round(v);return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g,',')}

// ===== 金額輸入的千分位 =====
// <input type=number> 沒辦法顯示逗號（規格就不允許），所以金額欄一律改成
// text + inputmode=numeric，自己補逗號、自己把游標留在原本那個數字上——
// 不然打到第四位數時整個字串被重寫，游標會被踢到最後面。
// 送進 set()/setLive() 前一定要過 amtRaw() 把逗號拿掉，否則 Number('1,200') = NaN → 靜默變 0。
function amtFmt(v){
 var t=String(v==null?'':v);if(t==='')return '';
 var neg=/^\s*-/.test(t);
 var d=t.replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'');
 if(d==='')return neg?'-':'';
 return (neg?'-':'')+d.replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function amtRaw(v){return String(v==null?'':v).replace(/,/g,'');}
function amtKey(el){
 var before=el.value,pos=(el.selectionStart==null?before.length:el.selectionStart);
 var keep=before.slice(0,pos).replace(/[^\d]/g,'').length;
 var after=amtFmt(before);
 if(after===before)return;
 el.value=after;
 var i=0,seen=0;
 while(i<after.length&&seen<keep){if(/\d/.test(after[i]))seen++;i++;}
 try{el.setSelectionRange(i,i);}catch(e){}
}
// 把既有的 bindAttr（onchange="set(...,this.value,'num')"）改寫成金額版：
// this.value → amtRaw(this.value)，並掛上 amtKey 做即時格式化。
function bindMoney(bindAttr){
 var b=String(bindAttr||'').replace(/this\.value/g,'amtRaw(this.value)');
 if(/^\s*oninput="/.test(b))return b.replace(/^\s*oninput="/,'oninput="amtKey(this);');
 return 'oninput="amtKey(this)" '+b;
}
function moneyCell(bindAttr,val){
 return '<input type="text" inputmode="numeric" class="amtin" value="'+esc(amtFmt(val))+'" '+bindMoney(bindAttr)+'>';
}

// ===== 四張表的手動拖曳排序 =====
// 陣列順序＝顯示順序，直接存進 plan.data。把手單獨一格（⠿），
// 整列 draggable 會讓欄位裡的文字沒辦法選取。
var dragSrc=null;
function dragHandle(arr,i){
 return '<span class="dh" draggable="true" title="拖曳排序" ondragstart="rowDragStart(event,\''+arr+'\','+i+')" ondragend="rowDragEnd(event)">⠿</span>';
}
function dropAttrs(arr,i){
 return 'ondragover="rowDragOver(event)" ondrop="rowDrop(event,\''+arr+'\','+i+')"';
}
function rowDragStart(e,arr,i){
 dragSrc={arr:arr,i:i};
 try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',arr+':'+i);}catch(_){}
 var tr=e.target&&e.target.closest?e.target.closest('tr'):null;if(tr)tr.classList.add('dragging');
}
function rowDragOver(e){
 if(!dragSrc)return;
 e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){}
 var tr=e.target&&e.target.closest?e.target.closest('tr'):null;
 document.querySelectorAll('tr.dragover').forEach(function(x){x.classList.remove('dragover')});
 if(tr)tr.classList.add('dragover');
}
function rowDrop(e,arr,i){
 e.preventDefault();
 if(!dragSrc||dragSrc.arr!==arr){return rowDragEnd(e);}
 var c=activeCase();if(!c){return rowDragEnd(e);}
 var list=c[arr]||[],from=dragSrc.i,to=i;
 if(from===to||from<0||from>=list.length){return rowDragEnd(e);}
 var it=list.splice(from,1)[0];
 list.splice(to,0,it);
 dragSrc=null;
 document.querySelectorAll('tr.dragging,tr.dragover').forEach(function(x){x.classList.remove('dragging');x.classList.remove('dragover')});
 save();render();
}
function rowDragEnd(e){
 dragSrc=null;
 document.querySelectorAll('tr.dragging,tr.dragover').forEach(function(x){x.classList.remove('dragging');x.classList.remove('dragover')});
}
// 自動整理：大類（照 CAT_PARENTS 的順序）→ 細類 → 原順序 的穩定排序。
// 這是「同類型自動放一起」那顆按鈕；不自動觸發，免得顧問剛拖好的順序被洗掉。
function autoSortRows(arr,kind){
 var c=activeCase();if(!c)return;
 var f=CAT_FIELDS[kind]||{},order=CAT_PARENTS[kind]||[];
 var list=(c[arr]||[]).map(function(x,i){return [x,i]});
 list.sort(function(a,b){
  var pa=order.indexOf(a[0][f.parent]),pb=order.indexOf(b[0][f.parent]);
  if(pa<0)pa=999;if(pb<0)pb=999;
  if(pa!==pb)return pa-pb;
  var sa=String(a[0][f.sub]||''),sb=String(b[0][f.sub]||'');
  if(sa!==sb)return sa<sb?-1:1;
  return a[1]-b[1];
 });
 c[arr]=list.map(function(x){return x[0]});
 save();render();
}
function sortBtn(arr,kind){return '<button class="sortbtn" onclick="autoSortRows(\''+arr+'\',\''+kind+'\')" title="把同一個分類的項目收攏在一起">⇅ 自動整理</button>';}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function pct(x){return (x*100).toFixed(2)+'%'}
function annualDebtInterest(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;return (a0>=sa)?lBal(l)*n(l.rate)/100:0})}
function annualDebtPay(c){var a0=n(c.profile.age);return sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;var elapsed=(a0-sa)*12;return (a0>=sa&&(n(l.months)-elapsed)>0)?lPay(l)*12:0})}

function familyAnnualLiving(c){return sum(c.expenses,function(e){return (e.cat==='生活'||e.cat==='消費')?n(e.amount):0})}
// 父母奉養費：責任遞減圖本來就算它，需求反推卻漏了 → 2026/08 補進 lifeNeed。
function familyAnnualParentSupport(c){return sum(c.expenses,function(e){return e.cat==='孝親'?n(e.amount):0})}
// 支出側手動登錄的貸款（大類「貸款」）。負債表那邊走 annualDebtPay()，相加＝家庭貸款總支出。
function manualLoanPay(c){return sum(c.expenses,function(e){return e.cat==='貸款'?n(e.amount):0})}
// 儲蓄理財投入：不進總支出（原表就放在總支出之外），是「有效儲蓄率」的分子。
function savingInvest(c){return sum(c.savings,function(x){return n(x.amount)})}
// 資產布局（核心／衛星／短期保留／生活用）。只用於呈現，不動任何既有比率的分子分母。
function assetLayer(a){
 if(a&&a.layer)return a.layer;
 if(!a)return '核心';
 if(a.mainCat==='自用資產')return '生活用';
 return isRiskAsset(a)?'衛星':'核心';
}
function assetLayout(c){
 var out={'核心':0,'衛星':0,'短期保留':0,'生活用':0};
 (c.assets||[]).forEach(function(a){var k=assetLayer(a);if(out[k]==null)out[k]=0;out[k]+=aVal(a);});
 return out;
}
function aVal(a){return n(a.value)*(n(a.fxRate)||1)}
function aInc(a){return n(a.income)*(n(a.fxRate)||1)}
function lBal(l){return n(l.balance)*(n(l.fxRate)||1)}
function lPay(l){return n(l.pay)*(n(l.fxRate)||1)}
function assetPassive(c){return sum(c.assets,function(a){return (a.income!=null&&a.income!=='')?aInc(a):((a.type==='股票'||a.type==='基金'||a.type==='債券')?aVal(a)*n(a.ret)/100:0)})}
function liquidMovable(c){return sum(c.assets,function(a){return (a.cls==='流動'&&a.movable)?aVal(a):0})}

// 生活願望(旅遊/休閒/奢侈品) 當年支出
// ---------- 願景選定閘 ----------
// 財務規劃的第一步是「先選定要執行哪些願景」，沒選的完全不進計算：
// 不進一生需求、不上時間軸、也不會被壓縮槓桿動到。
// ⚠️⚠️ 一定要用 `on!==false` 判斷，不可以寫成 `!!x.on`：
//     舊資料完全沒有 on 欄位（undefined），必須視為「已選定」，
//     否則既有客戶的願景會在改版當下全部消失、缺口一夜歸零。
function visionOn(x){return !x||x.on!==false}

function lifestyleFactor(c,age,factor){var s=0;[c.travel,c.hobby,c.luxury].forEach(function(arr){(arr||[]).forEach(function(it){if(!visionOn(it))return;if(age>=n(it.start)&&age<=n(it.end))s+=n(it.amount)*(n(it.freq)||1)*factor})});return s;}
function lifestyleAnnualNow(c){return lifestyleFactor(c,n(c.profile.age),1);}
// 教育金總需求(終值)
function eduTotal(c){var g=n(c.params.tuitionGrowth)/100;
 return sum(c.education,function(e){return n(e.annual)*n(e.years)*Math.pow(1+g,n(e.startIn))})}

// 退休需求
// ===== 退休期：三段式金流 =====
// 家庭的生活/消費支出不是「某一天整批切換」——本人先退、配偶後退，中間有一段混合期。
// 權重 w = 已退休賺薪成員的支出比例合計 ÷ 全體賺薪成員的支出比例合計（0→1）：
//   家庭該年支出 = 非生活類（各自照起訖歲）＋ 工作期生活消費×(1−w) ＋ 退休期支出×w
// 舊版的錯：生活費列跑到 85 歲，retire.monthLiving 又疊一次 → 退休後的生活費被算兩次。
// 降級路徑（既有客戶不會壞）：配偶沒填退休年齡／支出比例全空 → 只剩本人一個切換點，w 直接 0→1。
function isLivingCat(cat){return cat==='生活'||cat==='消費';}
// 每位賺薪成員的退休，換算成「本人幾歲時發生」——投影的時間軸是本人年齡。
function earnerRetirePoints(c){
 var a0=n((c.profile||{}).age),out=[];
 ((c||{}).members||[]).forEach(function(m){
  if(!m||!isEarnerRole(m.role))return;
  var isP=(m.role==='本人');
  var ra=isP?n((c.profile||{}).retireAge):n(m.retireAge);
  var ma=isP?a0:n(m.age);
  if(!(ra>0))return;
  out.push({name:m.name||'',primary:isP,share:Math.max(0,n(m.expRatio)),at:a0+(ra-ma)});
 });
 return out;
}
// 某一年的「已退休權重」0~1。
function retiredWeight(c,age){
 var pts=earnerRetirePoints(c);
 if(!pts.length)return 0;
 var tot=0;pts.forEach(function(p){tot+=p.share;});
 if(tot<=0){
  // 支出比例% 沒填 → 退回「本人退休即全面切換」，不要除以零
  var p0=null;pts.forEach(function(p){if(p.primary)p0=p;});p0=p0||pts[0];
  return age>p0.at?1:0;
 }
 var done=0;pts.forEach(function(p){if(age>p.at)done+=p.share;});
 return done/tot;
}
// 退休期支出（＝賺薪成員都退休後的家庭年支出）。
// c.retireExpenses[] 有列就逐列算（可各自設起訖歲：照護費 80 歲後才上來、旅遊前十年高），
// 沒有就退回舊的 retire.monthLiving×12——既有客戶的數字不變。
function retireAnnual(c,age,inflFactor){
 var list=(c||{}).retireExpenses||[];
 var ra=n((c.profile||{}).retireAge),le=n((c.profile||{}).lifeExp)||n((c.params||{}).horizon)||999;
 if(!list.length)return n(c.retire&&c.retire.monthLiving)*12*inflFactor;
 var s=0;
 list.forEach(function(e){
  var st=n(e.startAge)||ra, en=n(e.endAge)||le;
  if(age<st||age>en)return;
  s+=n(e.amount)*(e.infl===false?1:inflFactor);
 });
 return s;
}
// 工作期側的家庭支出：非生活類照舊，生活＋消費只算「還沒退休的那部分」。
function workPhaseExpense(c,age,inflFactor,w){
 var s=0;
 ((c||{}).expenses||[]).forEach(function(e){
  if(age<n(e.start)||age>n(e.end))return;
  var v=n(e.amount)*(e.infl?inflFactor:1);
  s+=isLivingCat(e.cat)?v*(1-w):v;
 });
 return s;
}

function retireNeed(c){
 var r=c.retire||{},age=n(c.profile.age),ra=n(c.profile.retireAge),le=n(c.profile.lifeExp);
 var infl=n(c.params.inflation)/100, g=n(r.retireInflation)/100, rr=n(r.retireReturn)/100;
 var years=Math.max(0,ra-age), m=Math.max(0,le-ra);
 // 分子改吃「退休期支出表」：退休當年的家庭年支出（終值）。沒填明細表就退回 monthLiving。
 var hasList=!!((c.retireExpenses||[]).length);
 var annualFV=hasList?retireAnnual(c,ra,Math.pow(1+infl,years)):n(r.monthLiving)*12*Math.pow(1+infl,years);
 var monthFV=annualFV/12;
 var total;
 if(hasList){
  // 退休期支出可以逐列設起訖歲（照護費 80 歲後才上來、旅遊只到 75），
  // 年金封閉式公式吃不到這種分段 → 逐年折現加總。
  // 註：金額一律相同時，這個迴圈的結果與下面的封閉式完全等價。
  // 第 k+1 期在退休後第 k+1 年年底 → 對應年齡 ra+1+k（與封閉式年金的期數定義一致，
  // 也與 projection() 的「age > 退休年齡才計退休期支出」對得上）。
  total=0;
  for(var k=0;k<m;k++){
   total+=retireAnnual(c,ra+1+k,Math.pow(1+infl,years)*Math.pow(1+g,k))/Math.pow(1+rr,k+1);
  }
 }
 else if(Math.abs(rr-g)<1e-6){total=annualFV*m/(1+rr);}
 else{total=annualFV*(1-Math.pow((1+g)/(1+rr),m))/(rr-g);}
 var prepared=sum(r.prepared,function(p){return n(p.amount)});
 return {years:years,余年:m,monthFV:monthFV,total:total,prepared:prepared,gap:Math.max(0,total-prepared)};
}

// 壽險/醫療 需求反推 (per member in needs)
// ⚠️⚠️ 這一支回的是「淨缺口」，不是「需求」。
// 毛需求在 grossLifeNeed()，這裡再扣掉已備壽險與家庭可變現流動資產。
// 絕對不可以把它拿去當 coverageGaps() / coverageCheckupRows() 的 need——
// 那兩支自己還會再扣一次已備，已備被扣兩次，壽險缺口會整個消失
// （2026/08/24 實測示範案：需求被報成 324 萬、已備 1,448 萬，缺口 −1,123 萬＝「無缺口」，
//  但同一份資料的保障準備度是 82%、五欄表說還差 324 萬）。
function lifeNeed(c,nd){
 return Math.max(0,grossLifeNeed(c,nd) - existingCover(c,nd.member,'壽險') - liquidMovable(c));
}
function medicalDailyNeed(nd){return n(nd.room)+n(nd.selfPay)+n(nd.nursing)}
function memberDep(c,name){var m=(c.members||[]).find(function(x){return x.name===name});return m?n(m.depRatio):100}
var POLICY_MAP={'壽險':'life','意外傷殘':'accident','住院醫療':'medical','醫療雜費':'medMisc','薪資補償':'incomeComp','初次罹癌':'firstCancer','癌症住院':'cancerHosp','重病給付':'critical','每月照護':'monthCare'};
function existingCover(c,member,kind){
 var fromCov=sum(c.coverages,function(cv){return (cv.member===member&&kindNorm(cv.kind)===kindNorm(kind))?(n(cv.comm)+n(cv.social)):0});
 var f=POLICY_MAP[kind];var fromPol=f?sum(c.policies,function(p){return p.insured===member?n(p[f]):0}):0;
 return fromCov+fromPol;
}

// 調整動作提供的保額。⚠️ 只算啟用中的，而且要同時對到「成員」與「險種」。
// 動作沒指定成員時算在主要成員身上（教練最常排的就是本人的家庭責任保障）。
function actionCover(c,member,kind){
 var pm=(primaryMember(c)||{}).name;
 return sum(planActionsOn(c),function(a){
  if(a.cat!=='insure')return 0;
  if((a.coverKind||'壽險')!==kind)return 0;
  return (((a.member||'').trim()||pm)===member)?n(a.cover):0;
 });
}
// 綜合保障缺口＝毛需求 − 毛已備。
// ⚠️ 壽險走 grossLifeNeed()，與 coverageReadiness()／coverageCheckupRows() 同一條分子；
//    三處的「需求」必須是同一個數字，coverageGap.test.ts 釘住。
function coverageGaps(c){
 var rows=[];
 (c.needs||[]).forEach(function(nd){
  var map={
   '壽險':grossLifeNeed(c,nd),
   '意外傷殘':n(nd.disability),
   '住院醫療':medicalDailyNeed(nd),
   '醫療雜費':n(nd.miscDaily),
   '薪資補償':n(nd.incomeComp),
   '初次罹癌':n(nd.firstCancer),
   '癌症住院':n(nd.cancerHosp),
   '重病給付':n(nd.critical),
   '每月照護':n(nd.monthCare)
  };
  Object.keys(map).forEach(function(k){
   var need=map[k],ex=existingCover(c,nd.member,k);
   // 已備來源擴充：本人的壽險一次性需求，可由家庭流動資產支應
   if(k==='壽險'&&nd.member===(primaryMember(c)||{}).name)ex+=liquidMovable(c);
   // 調整動作裡的保障類：保額算進「已備」。
   // ⚠️ 不接這一條的話，買保險在試算上永遠只是「保費讓缺口變大」，
   //    教練排了保障動作卻看到情況更糟——那是錯的訊號。
   ex+=actionCover(c,nd.member,k);
   rows.push({member:nd.member,kind:k,need:need,have:ex,gap:need-ex});
  });
 });
 return rows;
}
function totalGap(c){return sum(coverageGaps(c),function(g){return Math.max(0,g.gap)})}

// ===== 保單檢查報告：HAVE vs NEED vs 狀況 vs 調整方向 =====
// 2026/08/24 對齊 insure80 的五欄比對表（項目｜現在保單 HAVE｜現在需求 NEED｜狀況｜調整方向 READJUST）。
// 刻意只做「比對與判定」三張表（保費／保障／$領回）——給付明細那 90+ 項屬於「呈現」，
// 走 policyBenefitRows()／benefitsByGroup()，不進這裡的比對，也不進 coverageGaps()。
// 為什麼不把 KINDS 從 9 擴到 90：coverageGaps() 的長度是 needs.length × KINDS.length，
// 下游 totalGap／health 的 riskCover／advice／報告書全部吃它；而 needs 那張表也會從 15 欄變 90 欄。
// insure80 自己的健檢也只比三項，生命資產表才是 90+ 項——兩者本來就是兩套東西。
var CHECKUP_BAND=10;      // %：|have−need|÷need 落在此帶內視為「適中」
var TRIANGLE_RISK=10;     // 理財金三角：保障型保費佔年收入 %
var TRIANGLE_INVEST=30;   // 理財金三角：理財型保費佔年收入 %
// 後台 /admin/categories「保單健檢」群組（走 bizTaxParams 同一張表）一存就覆蓋。
function applyCheckupParams(values){
 if(!values||typeof values!=='object')return;
 var setters={CHECKUP_BAND:function(x){CHECKUP_BAND=x},TRIANGLE_RISK:function(x){TRIANGLE_RISK=x},TRIANGLE_INVEST:function(x){TRIANGLE_INVEST=x}};
 Object.keys(setters).forEach(function(k){
  var x=Number(values[k]);
  if(isFinite(x)&&values[k]!==null&&values[k]!==undefined&&values[k]!=='')setters[k](x);
 });
}
var CHECKUP_LABEL={low:'偏低',high:'偏高',mid:'適中'};
// need 為 0 時：有保額＝偏高（買了不需要的），沒保額＝適中（沒需求也沒買，不必動）。
function checkupState(have,need,band){
 var b=(band==null?CHECKUP_BAND:n(band))/100;
 have=n(have);need=n(need);
 if(need<=0)return have>0?'high':'mid';
 var r=(have-need)/need;
 return r>b?'high':(r<-b?'low':'mid');
}
function checkupRow(item,have,need,unit,band){
 var st=checkupState(have,need,band);
 return {item:item,have:n(have),need:n(need),unit:unit||'元',state:st,label:CHECKUP_LABEL[st],
  delta:st==='mid'?0:Math.abs(n(need)-n(have)),
  dir:st==='low'?'可增加':(st==='high'?'可減少':'不須調整')};
}

// ── 保費類型：保障歸保障、理財歸理財 ──
// 舊保單沒有 premiumType 欄位，由險種細分推；教練可在保單卡上覆寫。
var INVEST_SUBS=['增額/儲蓄壽險','投資型壽險','年金'];
function premiumType(p){
 if(p&&p.premiumType)return p.premiumType;
 return (p&&INVEST_SUBS.indexOf(p.subtype)>=0)?'理財型':'保障型';
}
function policyActive(p){return !!p&&p.status!=='失效'&&p.status!=='停效';}
function annualPremiumBy(c,type){
 return sum(c.policies,function(p){return (policyActive(p)&&premiumType(p)===type)?n(p.premium):0;});
}
// 1 保費：兩列。NEED 走理財金三角佔家庭年收入的比例。
function premiumCheckup(c){
 var inc=n((crossTable(c)||{}).incTotal);
 var prot=annualPremiumBy(c,'保障型'),inv=annualPremiumBy(c,'理財型');
 return {income:inc,total:prot+inv,protect:prot,invest:inv,
  ratio:inc>0?(prot+inv)/inc:0,
  rows:[checkupRow('保障型保費',prot,inc*TRIANGLE_RISK/100),
        checkupRow('理財型保費',inv,inc*TRIANGLE_INVEST/100)]};
}

// 2 保障：依險種跨成員加總後套五欄。
// ⚠️⚠️ 這裡刻意**不能**直接用 coverageGaps 的 need：
// lifeNeed() 回的是「已經扣掉已備與流動資產之後的淨缺口」，而 have 是毛的已備。
// 拿淨需求去對毛已備，壽險會被判成「偏高、可減少 1,123 萬」——但客戶其實還差 324 萬。
// 五欄表一定要毛對毛，所以壽險走 grossLifeNeed()（與 coverageReadiness 同一條式子）。
function coverageCheckupRows(c){
 var by={},ord=[],pm=(primaryMember(c)||{}).name;
 (c.needs||[]).forEach(function(nd){
  var map={
   '壽險':grossLifeNeed(c,nd),
   '意外傷殘':n(nd.disability),
   '住院醫療':medicalDailyNeed(nd),
   '醫療雜費':n(nd.miscDaily),
   '薪資補償':n(nd.incomeComp),
   '初次罹癌':n(nd.firstCancer),
   '癌症住院':n(nd.cancerHosp),
   '重病給付':n(nd.critical),
   '每月照護':n(nd.monthCare)
  };
  Object.keys(map).forEach(function(k){
   var have=existingCover(c,nd.member,k);
   if(k==='壽險'&&nd.member===pm)have+=liquidMovable(c);
   // 調整動作的保障類保額也算「已備」——與 coverageGaps 同一套語意（見 actionCover 的註解）。
   have+=actionCover(c,nd.member,k);
   if(!by[k]){by[k]={need:0,have:0};ord.push(k);}
   by[k].need+=map[k];by[k].have+=have;
  });
 });
 return ord.map(function(k){
  var o=by[k];
  var u=(k==='住院醫療'||k==='癌症住院')?'元/日':((k==='每月照護'||k==='薪資補償')?'元/月':'元');
  return checkupRow(k,o.have,o.need,u);
 });
}

// ── $領回：保單可領回的五個型別 ──
// 逐張保單自己帶 paybacks[]，因為「哪一張保單、什麼時候、領給誰」是保單的屬性，不是家庭的。
var PAYBACK_TYPES=['$生存','$滿期','$祝壽','$年金','$投資'];
function policyPaybacks(c){
 var out=[];
 (c.policies||[]).forEach(function(p,pi){
  (p.paybacks||[]).forEach(function(b,bi){
   out.push({pi:pi,bi:bi,policy:p.name||p.subtype||'（未命名保單）',insurer:p.insurer||'',
    type:b.type||'$生存',receiver:b.receiver||p.insured||'',
    ageFrom:n(b.ageFrom),ageTo:n(b.ageTo)||n(b.ageFrom),
    freq:n(b.freq),amount:n(b.amount),note:b.note||''});
  });
 });
 return out;
}
// 一筆領回在 [a1,a2] 這段年齡內可領到的合計。freq>0＝每 freq 年領一次。
function paybackInSpan(b,a1,a2){
 if(b.freq>0){var t=0;for(var a=b.ageFrom;a<=b.ageTo;a+=b.freq){if(a>=a1&&a<=a2)t+=b.amount;}return t;}
 return (b.ageFrom>=a1&&b.ageFrom<=a2)?b.amount:0;
}
function paybackTotal(b){return paybackInSpan(b,-1e9,1e9);}
function policyPaybackBetween(c,a1,a2){
 if(!(n(a2)>=n(a1)))return 0;
 return sum(policyPaybacks(c),function(b){return paybackInSpan(b,n(a1),n(a2));});
}
// 3 $領回：退休養老金一列 ＋ 每個「選定」的理財目標一列。
function paybackCheckupRows(c){
 var rows=[],A=n(c.profile&&c.profile.age);
 var rt=retireNeed(c);
 if(rt&&n(rt.total)>0){
  var rA=n(c.profile.retireAge)||65,lA=n(c.profile.lifeExp)||85;
  var rr=checkupRow('退休養老金',n(rt.prepared)+policyPaybackBetween(c,rA,lA),n(rt.total),'元');
  rr.span=rA+'~'+lA+' 歲';rows.push(rr);
 }
 (c.goals||[]).forEach(function(g){
  if(g.on===false)return;
  var s=n(g.start)||A,e=n(g.end)||s;
  var times=(n(g.freq)>0&&e>s)?Math.floor((e-s)/n(g.freq))+1:1;
  var r=checkupRow(g.name||g.type||'（未命名目標）',n(g.prepared)+policyPaybackBetween(c,s,e),n(g.present)*Math.max(1,times),'元');
  r.span=s+'~'+e+' 歲';rows.push(r);
 });
 return rows;
}

// ── 保費排程：生效日 ＋ 繳別 → 各年／各月 ──
// effDate 在 2026/08/24 之前只是一個純字串、沒有進過任何計算，這裡開始 parse 它。
// 民國年（三碼）自動 +1911，因為保單登錄實務上兩種寫法都有。
function effYear(p){var m=String((p&&p.effDate)||'').match(/(\d{3,4})/);if(!m)return 0;var y=+m[1];return y<1911?y+1911:y;}
function effMonth(p){var m=String((p&&p.effDate)||'').match(/\d{3,4}\D+(\d{1,2})/);return m?(+m[1]||0):0;}
var PAY_MODES=['年繳','半年繳','季繳','月繳'];
var PAY_TIMES={'年繳':1,'半年繳':2,'季繳':4,'月繳':12};
function payTimes(mode){return PAY_TIMES[mode||'年繳']||1;}
function premiumPerPay(p){return n(p&&p.premium)/payTimes(p&&p.payMode);}
// 繳費月份：以生效日的月份起算，依繳別平均分佈。
function premiumMonths(p){
 var m0=effMonth(p);if(!m0)return [];
 var t=payTimes(p.payMode),step=12/t,out=[];
 for(var i=0;i<t;i++)out.push(((m0-1+step*i)%12)+1);
 return out.sort(function(a,b){return a-b;});
}
// 繳費年期留空＝視為仍在繳（多數終身險登錄時不會填到期年）。
function payingInYear(p,year){
 if(!policyActive(p))return false;
 var y0=effYear(p);if(!y0||year<y0)return false;
 var yrs=n(p.payYears);
 return yrs>0?(year<y0+yrs):true;
}
function premiumByYear(c,fromYear,years){
 var out=[],N=Math.max(1,n(years)||1);
 for(var i=0;i<N;i++){
  var y=n(fromYear)+i,tot=0,prot=0,inv=0;
  (c.policies||[]).forEach(function(p){
   if(!payingInYear(p,y))return;
   var a=n(p.premium);tot+=a;
   if(premiumType(p)==='理財型')inv+=a;else prot+=a;
  });
  out.push({year:y,total:tot,protect:prot,invest:inv});
 }
 return out;
}
function premiumByMonth(c,year){
 var out=[];for(var m=1;m<=12;m++)out.push({month:m,amount:0});
 (c.policies||[]).forEach(function(p){
  if(!payingInYear(p,n(year)))return;
  var per=premiumPerPay(p);
  premiumMonths(p).forEach(function(mm){out[mm-1].amount+=per;});
 });
 return out;
}
function premiumByPayer(c){
 var by={},ord=[];
 (c.policies||[]).forEach(function(p){
  if(!policyActive(p))return;
  var k=p.owner||p.insured||'（未指定）';
  if(!by[k]){by[k]={payer:k,total:0,count:0};ord.push(k);}
  by[k].total+=n(p.premium);by[k].count++;
 });
 return ord.map(function(k){return by[k];});
}

// ── 生命資產表：給付明細（只呈現，不比對）──
var BENEFIT_GROUPS=['壽險','意外','住院醫療','防癌','失能長照','其他'];
function policyBenefitRows(c,member){
 var out=[];
 (c.policies||[]).forEach(function(p){
  if(member&&p.insured!==member)return;
  if(!policyActive(p))return;
  (p.benefits||[]).forEach(function(b){
   out.push({group:(BENEFIT_GROUPS.indexOf(b.group)>=0?b.group:'其他'),item:b.item||'',
    amount:n(b.amount),unit:b.unit||'元',
    policy:p.name||p.subtype||'',insurer:p.insurer||'',insured:p.insured||''});
  });
 });
 return out;
}
function benefitsByGroup(c,member){
 var rows=policyBenefitRows(c,member),by={};
 BENEFIT_GROUPS.forEach(function(g){by[g]=[];});
 rows.forEach(function(r){by[r.group].push(r);});
 return BENEFIT_GROUPS.map(function(g){return {group:g,rows:by[g]};}).filter(function(x){return x.rows.length>0;});
}

// ── 解約金與主約效益分析 ──
// 解約金是唯一需要人工逐年輸入的數列（保險公司給的附表），一律記「保單年度末」的金額。
// 保單年度：自保單生效日起的第一年為第 1 保單年度；年度末＝保單周年日的前一日。
function policyYearAt(p,calYear){var y0=effYear(p);return y0?Math.max(0,n(calYear)-y0+1):0;}
function surrenderAt(p,polYear){
 var r=((p&&p.surrender)||[]).filter(function(x){return n(x.year)===n(polYear);})[0];
 return r?n(r.amount):0;
}
// 主約效益分析：累計已繳保費 vs（身故給付＋可領回），用倍數說話。
function masterAnalysis(c,calYear){
 var Y=n(calYear);
 return (c.policies||[]).filter(function(p){return p.policyKind!=='附約';}).map(function(p){
  var polY=policyYearAt(p,Y);
  var yrs=n(p.payYears);
  var paid=polY>0?n(p.premium)*(yrs>0?Math.min(polY,yrs):polY):0;
  var sur=surrenderAt(p,polY)||n(p.cashValue);
  var back=sum(p.paybacks||[],function(b){return paybackTotal({freq:n(b.freq),ageFrom:n(b.ageFrom),ageTo:n(b.ageTo)||n(b.ageFrom),amount:n(b.amount)});});
  return {name:p.name||p.subtype||'',insurer:p.insurer||'',insured:p.insured||'',
   effDate:p.effDate||'',polYear:polY,paid:paid,death:n(p.life),surrender:sur,payback:back,
   ratio:paid>0?(n(p.life)+back)/paid:0};
 });
}


// ===== 保障準備度（以「毛需求」計算，避免與缺口反推重複扣抵） =====
function grossLifeNeed(c,nd){var famLiving=familyAnnualLiving(c);
 return n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100*famLiving*n(nd.protectYears)
  +familyAnnualParentSupport(c)*n(nd.protectYears)
  +sum(c.liabilities,function(l){return lBal(l)})+eduTotal(c)+n(nd.funeral)+n(nd.estateTax)
  +guaranteeFor(c,nd.member);}
function coverageReadiness(c){var out=[],pm=(primaryMember(c)||{}).name;
 (c.needs||[]).forEach(function(nd){
  var defs=[['壽險',grossLifeNeed(c,nd),existingCover(c,nd.member,'壽險')+(nd.member===pm?liquidMovable(c):0)],
   ['意外傷殘',n(nd.disability),existingCover(c,nd.member,'意外傷殘')],
   ['住院醫療',medicalDailyNeed(nd),existingCover(c,nd.member,'住院醫療')],
   ['醫療雜費',n(nd.miscDaily),existingCover(c,nd.member,'醫療雜費')],
   ['薪資補償',n(nd.incomeComp),existingCover(c,nd.member,'薪資補償')],
   ['初次罹癌',n(nd.firstCancer),existingCover(c,nd.member,'初次罹癌')],
   ['癌症住院',n(nd.cancerHosp),existingCover(c,nd.member,'癌症住院')],
   ['重病給付',n(nd.critical),existingCover(c,nd.member,'重病給付')],
   ['每月照護',n(nd.monthCare),existingCover(c,nd.member,'每月照護')]];
  defs.forEach(function(d){out.push({member:nd.member,kind:d[0],need:d[1],have:d[2],ratio:d[1]>0?d[2]/d[1]:1});});
 });return out;}
function coverageReadinessByKind(c){var by={},ord=[];coverageReadiness(c).forEach(function(o){if(!by[o.kind]){by[o.kind]={kind:o.kind,need:0,have:0};ord.push(o.kind);}by[o.kind].need+=o.need;by[o.kind].have+=o.have;});
 return ord.map(function(k){var o=by[k];o.ratio=o.need>0?o.have/o.need:1;return o;});}
function coverageReadinessHTML(c,theme){var rd=coverageReadinessByKind(c).filter(function(o){return o.need>0||o.have>0});
 if(!rd.length)return theme==='light'?'<p style="color:#5a6b72">尚未於「保障需求」分頁建立需求。</p>':'<div style="color:#a7bacb;font-size:12px">尚未於「保障需求」分頁建立需求。</div>';
 if(theme==='light')return '<table><tr><th>險種</th><th>需求</th><th>已備</th><th>準備度</th></tr>'+rd.map(function(o){var p=Math.round(o.ratio*100),col=p>=100?'#3f7d54':p>=60?'#b5852f':'#b05a4a';return '<tr><td>'+o.kind+'</td><td>'+fmt(o.need)+'</td><td>'+fmt(o.have)+'</td><td style="color:'+col+';font-weight:700">'+p+'%</td></tr>';}).join('')+'</table>';
 return '<div class="gauges">'+rd.map(function(o){return gauge(o.kind+' 準備度',Math.min(100,Math.round(o.ratio*100)));}).join('')+'</div>';}

// ===== 責任遞減缺口投影（身故責任隨年遞減 vs 已備保障） =====
function responsibilityProjection(c,nd){var a0=n(c.profile.age),g=n(c.params.tuitionGrowth)/100;
 var py=Math.max(1,n(nd.protectYears)||20);
 var depR=n(nd.depRatioOverride!=null?nd.depRatioOverride:memberDep(c,nd.member))/100;
 var livingShare=depR*familyAnnualLiving(c);
 var parentAnnual=sum(c.expenses,function(e){return e.cat==='孝親'?n(e.amount):0});
 // 連帶保證是「不隨時間遞減」的一層責任——債務沒清償前，簽下去的金額一直都在。
 // 併進 funeral 這一條水平線，圖上就看得出責任遞減之後仍然墊高的那一段。
 var funeral=n(nd.funeral)+n(nd.estateTax)+guaranteeFor(c,nd.member);
 var edu=c.education||[],liabs=c.liabilities||[];
 var coverage=existingCover(c,nd.member,'壽險')+((primaryMember(c)||{}).name===nd.member?liquidMovable(c):0);
 var rows=[];
 for(var t=0;t<=py;t++){
  var living=livingShare*Math.max(0,py-t);
  var parents=parentAnnual*Math.max(0,py-t);
  var eduRem=sum(edu,function(e){var s=n(e.startIn),yy=n(e.years),an=n(e.annual),cnt=0;for(var k=0;k<yy;k++){if(s+k>=t)cnt++;}return an*Math.pow(1+g,s)*cnt;});
  var loanRem=sum(liabs,function(l){var bal=lBal(l),mo=n(l.months);if(mo<=0)return bal;return bal*Math.max(0,Math.min(1,(mo-t*12)/mo));});
  var total=living+parents+eduRem+loanRem+funeral;
  rows.push({t:t,age:a0+t,living:living,parents:parents,edu:eduRem,loan:loanRem,funeral:funeral,total:total,coverage:coverage,gap:Math.max(0,total-coverage)});
 }
 return {rows:rows,coverage:coverage,member:nd.member};}
function respGapSVG(rp,theme){var rows=rp.rows;if(!rows.length)return '';
 var dark=theme!=='light',AX=dark?'#6f869c':'#5a6b72',GRID=dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.08)',TICK=dark?'#71858c':'#8a9aa2';
 var W=760,H=250,pL=58,pR=16,pT=16,pB=28,plotW=W-pL-pR,plotH=H-pT-pB;
 var vMax=Math.max.apply(null,rows.map(function(r){return Math.max(r.total,r.coverage)}).concat([1]))||1;
 function X(i){return pL+(rows.length>1?i/(rows.length-1):0)*plotW}
 function Y(v){return pT+plotH-(v/vMax)*plotH}
 var bw=Math.max(3,Math.min(16,plotW/rows.length*0.62));
 var comps=[['living','#5b93d6','生活責任'],['parents','#5cc08a','父母孝養'],['edu','#e0bd8b','教育責任'],['loan','#b7a1d6','貸款餘額'],['funeral','#8a9aa2','最後費用']];
 var bars=rows.map(function(r,i){var x=X(i)-bw/2,acc=0,seg='';comps.forEach(function(cp){var v=r[cp[0]];if(v<=0)return;var y0=Y(acc+v),h=Y(acc)-Y(acc+v);acc+=v;seg+='<rect x="'+x.toFixed(1)+'" y="'+y0.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0.4,h).toFixed(1)+'" fill="'+cp[1]+'"/>';});return seg;}).join('');
 var covLine=rows.map(function(r,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(r.coverage).toFixed(1);}).join(' ');
 var grid='',gL='';for(var k=0;k<=4;k++){var y=pT+plotH*k/4;grid+='<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="'+GRID+'"/>';gL+='<text x="'+(pL-6)+'" y="'+(y+3).toFixed(1)+'" fill="'+AX+'" font-size="9" text-anchor="end">'+cfAxis(vMax-vMax*k/4)+'</text>';}
 var ticks='',step=Math.max(1,Math.ceil(rows.length/12));for(var i2=0;i2<rows.length;i2+=step)ticks+='<text x="'+X(i2).toFixed(1)+'" y="'+(H-9)+'" fill="'+TICK+'" font-size="9" text-anchor="middle">'+rows[i2].age+'</text>';
 var covC=dark?'#ef6f6f':'#c0392b';
 var leg=comps.map(function(cp){return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><span style="width:11px;height:11px;border-radius:2px;background:'+cp[1]+';display:inline-block"></span>'+cp[2]+'</span>';}).join('')+'<span style="display:inline-flex;align-items:center;gap:5px"><span style="width:14px;height:0;border-top:2px dashed '+covC+';display:inline-block"></span>已備保障</span>';
 return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+grid+bars+'<path d="'+covLine+'" fill="none" stroke="'+covC+'" stroke-width="2" stroke-dasharray="5 3"/>'+gL+ticks+'</svg><div style="font-size:12px;color:'+AX+';margin-top:6px">'+leg+'</div>';}
function respGapCharts(c,theme){var nds=c.needs||[];if(!nds.length)return theme==='light'?'<p style="color:#5a6b72">尚未建立保障需求，無法產生責任遞減圖。</p>':'<div style="color:#a7bacb;font-size:12px">尚未建立保障需求。</div>';
 var hc=theme==='light'?'#0d2b45':'var(--amber2)';
 return nds.map(function(nd){var rp=responsibilityProjection(c,nd);return '<div style="margin:10px 0"><div style="color:'+hc+';font-weight:700;font-size:13px;margin-bottom:4px">責任遞減缺口圖 – '+esc(nd.member)+'（保障年數 '+(n(nd.protectYears)||20)+' 年）</div>'+respGapSVG(rp,theme)+'</div>';}).join('');}

// ── 聯徵信用評分級距對照（可展開）── 資料依據：聯徵中心「個人信用評分判讀」＋銀行授信實務分級
var CREDIT_BANDS=[
 [751,800,'信用優良','屬少數族群；信貸／房貸的利率與額度條件最佳，審核最寬鬆'],
 [651,750,'信用良好','大多數銀行可順利過件，實際條件再看收入、負債比與職業穩定度'],
 [551,650,'信用普通','過件與否取決於其他條件（年資、收入、擔保品），利率偏中高'],
 [401,550,'信用偏弱','多數銀行難以核貸，通常需補強擔保品或轉向次要金融機構'],
 [200,400,'信用不佳','視為高風險，一般銀行多不承作，應優先處理不良紀錄']
];
function creditScoreOf(c){return n((c.credit||{}).score)||n((c.profile||{}).credit);}
function creditBandOf(s){s=n(s);if(!(s>=200&&s<=800))return null;for(var i=0;i<CREDIT_BANDS.length;i++){if(s>=CREDIT_BANDS[i][0]&&s<=CREDIT_BANDS[i][1])return CREDIT_BANDS[i];}return null;}
function creditBandInner(score){
 var s=n(score),has=(s>=200&&s<=800),b=has?creditBandOf(s):null;
 var head=has
  ?'<div style="margin-bottom:8px;font-weight:800;color:var(--amber2)">目前 '+s+' 分 → '+(s===200?'固定 200 分（多為有不良紀錄者，非實際評分）':(b?b[2]:'—'))+'</div>'
  :'<div style="margin-bottom:8px;color:var(--mut);font-size:12.5px">尚未填入分數；填入 200–800 後，這裡會自動標出所在級距。</div>';
 var rows=CREDIT_BANDS.map(function(r){
  var on=!!(b&&b===r);
  var hl=on?'background:rgba(201,154,91,.16)':'';
  return '<tr style="'+hl+'"><td class="k" style="white-space:nowrap'+(on?';color:var(--amber2)':'')+'">'+(on?'▶ ':'')+r[0]+'–'+r[1]+' 分</td>'+
   '<td style="font-weight:700'+(on?';color:var(--amber2)':'')+'">'+r[2]+'</td>'+
   '<td style="color:var(--mut);font-size:12.5px">'+r[3]+'</td></tr>';
 }).join('');
 var tbl='<table class="rtable"><tr><td class="k">分數區間</td><td class="k">定位</td><td class="k">銀行授信實務上的意義</td></tr>'+rows+'</table>';
 var note='<div class="hint" style="display:block;margin:8px 0 0;line-height:1.6">⚠️ 上表為銀行授信實務的參考分級。聯徵中心並未公布「分數區間 → 人數占比」的固定對照表；信用報告上附的是個人化的「百分位區間」——官方定義為「您的分數相較於整體給分樣本所處之高低相對位置」，例如落在 70%~80% 區間，代表至少高過 70% 的人；該區間僅提供給有實際評分者，且每季更新一次。</div>';
 var special='<div style="margin-top:12px"><div class="subhd">報告上的三種揭露結果</div>'+
  '<table class="rtable">'+
  '<tr><td class="k" style="white-space:nowrap">XXX 分</td><td>實際評分，介於 200–800 分，另附百分位區間。</td></tr>'+
  '<tr><td class="k" style="white-space:nowrap">固定 200 分</td><td>曾有不良紀錄（逾期、催收、呆帳、強制停卡、票據拒絕往來）但目前仍有正常帳戶。<b>聯徵並未針對此類實際評分</b>，不等同真實信用品質為 200。</td></tr>'+
  '<tr><td class="k" style="white-space:nowrap">此次暫時<br>無法評分</td><td>不等於信用不好，常見於「信用白段」。見下方官方情形。</td></tr>'+
  '</table></div>';
 var noscore='<div style="margin-top:12px"><div class="subhd">「暫時無法評分」的官方情形</div>'+
  '<ul style="margin:6px 0 0;padding-left:18px;color:var(--mut);font-size:12.5px;line-height:1.75">'+
  '<li>信用資料不足（3 個月內無交易、或最近一年無交易）</li>'+
  '<li>不適合取得信用（年齡小於 20 歲、受監護宣告）</li>'+
  '<li>當事人非本國人</li>'+
  '<li>信用資料有爭議（爭議中或訴訟中）</li>'+
  '<li>已成為違約者（逾期、催收、呆帳、強制停卡、票據拒絕往來）</li>'+
  '<li>已完成債務協商註記者、或違反還款協議者</li>'+
  '<li>前置協商註記、或更生／清算註記</li>'+
  '<li>純使用授信貸款者中，過去 1 年僅有學生貸款</li>'+
  '</ul></div>';
 var factor='<div style="margin-top:12px"><div class="subhd">評分的四大考量面向</div>'+
  '<div class="hint" style="display:block;margin:6px 0 0;line-height:1.7">① 過去的繳款情況　② 負債狀況　③ 近期資金需求變化（新辦卡／新貸款）　④ 金融機構往來歷史長度。若分數偏低，報告會依序揭露主要原因（最多四項），這四項就是改善的下手點。</div></div>';
 var eff='<div class="hint" style="display:block;margin-top:12px;line-height:1.6">本系統用法：此分數以 (分數−200)/600 正規化後，以 15% 權重計入財務安全度。</div>';
 return head+tbl+note+special+noscore+factor+eff;
}
