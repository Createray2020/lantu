 // 被動作指定的錢用「該動作自己的 growth」滾，全域 ret 只管沒被指定的剩餘資產。
 // ⚠️⚠️ acts 為空時 pots 全空、actIn/actOut/actPay 全 0，下面每一行都退化成改版前的算式
 //     ——「沒有動作時既有客戶數字一位不動」靠這個等價性，有測試守著，不要破壞它。
 var acts=planActionsOn(c), pots={};
 acts.forEach(function(x){pots[x.id]=0});
 var evts=[], legacyTarget=legacyNeed(c);
 for(var age=a0;age<=aEnd;age++){
  var t=age-a0;
  var workIncome=sum(c.incomes,function(i){return (i.type==='工作'&&age>=n(i.start)&&age<=n(i.end))?n(i.amount)*Math.pow(1+n(i.growth)/100,t):0});
  var finIncome=sum(c.incomes,function(i){return (i.type==='理財'&&age>=n(i.start)&&age<=n(i.end))?n(i.amount)*Math.pow(1+n(i.growth)/100,t):0})+assetPassive(c);
  var otherIncome=sum(c.incomes,function(i){return (i.type!=='工作'&&i.type!=='理財'&&age>=n(i.start)&&age<=n(i.end))?n(i.amount)*Math.pow(1+n(i.growth)/100,t):0});
  var income=workIncome+finIncome+otherIncome;
  // 三段式：w＝已退休賺薪成員的支出比例權重。生活/消費依 w 從工作期換到退休期。
  var inflF=Math.pow(1+infl,t);
  var w=retiredWeight(c,age);
  var expense=workPhaseExpense(c,age,inflF,w);
  var debt=sum(c.liabilities,function(l){var sa=n(l.startAge)||a0;var el=(age-sa)*12;return (age>=sa&&(n(l.months)-el)>0)?lPay(l)*12:0});
  var goalOut=sum(c.goals,function(gg){if(!visionOn(gg))return 0;if(age<n(gg.start)||age>n(gg.end))return 0;
    var hit=(n(gg.freq)<=0)?(age===n(gg.start)):(((age-n(gg.start))%n(gg.freq))===0);if(!hit)return 0;
    var gr=gg.growth==='通膨'?infl:(gg.growth==='薪資'?n(c.params.salaryGrowth)/100:(gg.type==='購屋'?n(gg.appreciation)/100:0));
    return n(gg.present)*Math.pow(1+gr,t);});
  var edu=eduByYear[age]||0;
  var life=lifestyleFactor(c,age,Math.pow(1+infl,t));
  var retireDraw=retireAnnual(c,age,inflF)*w;

  // ---- 調整動作 ----
  // 一致性規則：所有流出走 pay*、所有流入走 get*。
  // 保費與貸款月付是「支出」不是投資，所以走 actOut 不進池子。
  var actIn=0,actOut=0,actPay=0;
  acts.forEach(function(x){
   var pf=n(x.payFrom),pt=n(x.payTo)||aEnd,gf=n(x.getFrom),gt=n(x.getTo)||aEnd;
   if(x.cat==='insure'||x.cat==='loan'){
    if(n(x.payMonthly)&&age>=pf&&age<=pt)actOut+=n(x.payMonthly)*12;
    if(n(x.getLump)&&age===pf)actIn+=n(x.getLump);          // 貸款撥款
    return;                                                  // 這兩類沒有自己的資金池
   }
   if(x.cat==='income'||x.cat==='expense'){
    if(n(x.getMonthly)&&age>=gf&&age<=gt)actIn+=n(x.getMonthly)*12;
    return;                                                  // 加薪／省下的錢直接進主池
   }
   if(x.cat==='liquidate'){
    if(n(x.getLump)&&age===pf)actIn+=n(x.getLump);           // 淨變現金額
    return;
   }
   // regular／lump：真的有一個自己的資金池
   var k=x.id;pots[k]=(pots[k]||0)*(1+n(x.growth)/100);
   if(n(x.payMonthly)&&age>=pf&&age<=pt){var mv=n(x.payMonthly)*12;pots[k]+=mv;actPay+=mv;}
   if(n(x.payLump)&&age===pf){pots[k]+=n(x.payLump);actPay+=n(x.payLump);}
   if(n(x.divYear)&&age>=pf){if(x.divMode==='payout')actIn+=n(x.divYear);else pots[k]+=n(x.divYear);}
   if(n(x.getMonthly)&&age>=gf&&age<=gt){var tk=Math.min(pots[k],n(x.getMonthly)*12);pots[k]-=tk;actIn+=tk;}
   if(n(x.getLump)&&age===gt){var tl=Math.min(pots[k],n(x.getLump));pots[k]-=tl;actIn+=tl;}
  });
  var potSum=0;for(var _pk in pots){if(pots.hasOwnProperty(_pk))potSum+=pots[_pk];}

  var bal=income-expense-debt-goalOut-edu-life-retireDraw+actIn-actOut-actPay;
  invest=(invest>0?invest*(1+ret):invest)+bal;
  raw=raw*(1+ret)+bal;
  var df=Math.pow(1+ret,t+1);
  // ⚠️ 缺口一定要看「主池＋分離池」的合計：只看主池，等於分離池裡的錢不存在。
  var rawTot=raw+potSum;
  if(rawTot<0){if(negAge===null)negAge=age;var need_=-rawTot/df;if(need_>shortPV){shortPV=need_;shortAge=age;}}
  // 折現後的支出組成：pvOut 供「一生需求現值」，pvLate 只累計第一個不足年之後的，供缺口歸因。
  var comp={base:expense,debt:debt,goal:goalOut,edu:edu,life:life,retire:retireDraw};
  for(var ck in comp){if(!comp.hasOwnProperty(ck))continue;var cv=comp[ck]/df;pvOut[ck]+=cv;needPV+=cv;if(negAge!==null)pvLate[ck]+=cv;}
  totalOut+=expense+debt+goalOut+edu+life+retireDraw;
  var totalInv=invest+potSum;
  if(turnNeg===null&&totalInv<0)turnNeg=age;
  var remDebt=sum(c.liabilities,function(l){return lRemain(l,age,a0)});
  var netEst=totalInv+fixedAssets-remDebt;
  var planOut=goalOut+edu+life;

  // 願景事件的可負擔性標記。
  // ⚠️ 刻意**不改變現金流**（維持「照付、餘額可以轉負」的既有語意，否則所有既有客戶
  //    的數字都會變）。✕ 的意思是「做完這件事之後總資產掉到零以下」＝要靠借錢才做得到。
  //    這正是 Ray 說的「按時間先到先付」的直接後果：早期的先花掉，晚期的就做不到了。
  (c.goals||[]).forEach(function(gg){
   if(!visionOn(gg))return;
   if(age!==n(gg.start))return;
   evts.push({kind:'goal',age:age,name:(gg.name||gg.type||'目標'),amount:n(gg.present),ok:totalInv>=0});
  });
  planBal=(planBal>0?planBal*(1+planRet):planBal)+planYr;
  var planDraw=Math.max(0,Math.min(planBal,planOut));
  planBal-=planDraw; if(planBal<0)planBal=0; var freeCap=Math.max(0,invest); if(planBal>freeCap)planBal=freeCap;
  rows.push({age:age,income:income,work:workIncome,fin:finIncome,other:otherIncome,expense:expense+edu+retireDraw,debt:debt,goal:goalOut,life:life,bal:bal,invest:invest,pot:potSum,total:totalInv,net:netEst,planBal:planBal,planDraw:planDraw,planOut:planOut});
 }
 // 子女教育是連續好幾年的支出，不是單一事件——逐年插旗會在圖上排出六支「子女教育」，
 // 把整張時間軸擠爆。合併成一個區段：起於第一個繳費年，全程不轉負才算做得到。
 var eduAges=Object.keys(eduByYear).map(Number).filter(function(a){return eduByYear[a]>0}).sort(function(x,y){return x-y});
 if(eduAges.length){
  var eFrom=eduAges[0],eTo=eduAges[eduAges.length-1],eSum=0;
  eduAges.forEach(function(a){eSum+=eduByYear[a]});
  var eBad=rows.some(function(r){return r.age>=eFrom&&r.age<=eTo&&r.total<0});
  evts.push({kind:'edu',age:eFrom,span:eTo,name:'子女教育',amount:eSum,ok:!eBad});
 }

 // 退休生活：不是單一事件，判定是「退休後到預估壽命，資產全程不轉負」。
 var rAge=n(c.profile.retireAge)||65;
 if(rAge<=aEnd){
  var badRetire=rows.some(function(r){return r.age>=rAge&&r.total<0});
  evts.push({kind:'retire',age:rAge,name:'退休生活',amount:0,span:aEnd,ok:!badRetire});
 }
 // 傳承是願景的一部分（客戶可勾選不處理），判定用期末總資產。
 var lastRow=rows[rows.length-1]||{total:0};
 // ⚠️ 傳承只做「旗子標記」，**刻意不進 shortPV**。
 //    legacyNeed 動輒幾千萬（sampleCase 就是 4,000 萬），一旦併進缺口會讓所有既有客戶
 //    的數字一夜暴增。傳承要不要進一生需求是區塊 4 的題目，要先有客戶勾選的動線。
 if(legacyTarget>0){
  evts.push({kind:'legacy',age:aEnd,name:'傳承',amount:legacyTarget,ok:lastRow.total>=legacyTarget});
 }
 evts.sort(function(x,y){return x.age-y.age});
 var firstFail=null;for(var _e=0;_e<evts.length;_e++){if(!evts[_e].ok){firstFail=evts[_e];break;}}

 return {rows:rows,turnNeg:turnNeg,totalOutflow:totalOut,
  shortPV:shortPV,shortAge:shortAge,negAge:negAge,needPV:needPV,pvOut:pvOut,pvLate:pvLate,rate:ret*100,
  events:evts,firstFail:firstFail,urgAge:(negAge!=null?negAge:shortAge),hasActions:acts.length>0};
}

// 啟用中的調整動作。id 缺失的補一個，免得分離池的 key 互相蓋掉。
function planActionsOn(c){
 var out=[],seq=0;
 ((c||{}).actions||[]).forEach(function(x){
  if(!x||x.on===false)return;
  if(!x.id)x.id='_a'+(seq++);
  out.push(x);
 });
 return out;
}
// ===== 調整方案：缺口求解器 =====
//
// 地基語意（動這一段之前務必讀完）：
//
// 1)「現值缺口 shortPV」＝為了讓一生的可投資資產永遠不落到負值，**今天**必須額外
//    放進去的一筆錢。它不是把退休缺口、保障缺口、目標缺口硬加起來——那三個是
//    不同時點、不同性質的數字，相加沒有意義（這是改版前最大的錯）。
//    解法是封閉解，不需要疊代：
//        shortPV = max over t ( −raw_t ÷ (1+r)^(t+1) )，全程為正時取 0
//    其中 raw_t 是 projection() 裡「負餘額也照樣計息」的那條路徑。
//    實際路徑（負餘額不計息）永遠比 raw 好看，所以 shortPV 是保守上界——
//    寧可高估缺口，也不要讓教練規劃不足。
//
// 2) 缺口帳分兩區，**刻意不相加**：
//    ・現金流缺口（flow[]）＝ shortPV 依「第一個負值年之後的折現支出組成」歸因，
//      各列加總＝shortPV，可以放心加。
//    ・即時缺口（now[]）＝保障缺口與緊急預備金。它們是「事件發生才要的錢」與
//      「隨時要能動用的錢」，不是一生現金流的一部分，另列不進總額。
//
// 3) 報酬率假設會自我實現：假設拉高、缺口自然變小。兩道防線——
//    ・CAP_RATE 是求解器能開到的天花板，超過就判「此路不通」。
//    ・同時用保守情境折現率 PLAN_DISCOUNT 再算一次（conservative），
//      兩個數字並列給教練看，假設風險攤在陽光下。
//
// 4) 願景的彈性度**不需要新欄位**——goals 的 minPresent（金額最低）與 imp（重要度）、
//    travel/hobby/luxury 的 minAmount 與 imp 早就存在，只是從來沒有進過計算。
//    goalFloor()/wishFloor() 就是把這批既有資料接上引擎。

// 後台 /admin/categories「規劃求解參數」可覆蓋（走 bizTaxParams 同一張表，grp='規劃求解'）。
var PLAN_DISCOUNT=2.5;      // 保守情境折現率 %（不採客戶自己的預期報酬）
var CAP_INCOME_UP=30;       // 工作收入可調升上限 %
var CAP_EXPENSE_CUT=30;     // 生活/消費可削減上限 %
var CAP_RATE=8;             // 投資報酬率假設上限 %
var CAP_RETIRE_DELAY=10;    // 延後退休上限（年）
var CAP_RETIRE_CUT=25;      // 退休生活水準可調降上限 %
var CAP_VISION_CUT=100;     // 願景下修上限 %（100＝一路走到「金額(最低)」）
var CAP_RATE_STARTER=6;     // 啟程期(C) 的報酬率上限，比一般更保守

// 目前這份規劃實際採用的報酬率假設。
// c.plan.useAllocReturn 打開時才跟著「建議資產配置」的加權報酬走——
// 預設關閉，既有客戶的數字一位都不會動。
function effReturn(c){
 var p=(c||{}).plan||{};
 if(p.useAllocReturn){
  // 新的投資配置表優先（以現值權重加權）；沒有才退回舊的 allocations（比例%）。
  var ap=allocPV(c);
  if(ap.weight>0&&isFinite(ap.wRet))return ap.wRet;
  var al=allocInfo(c);
  if(al.totalPct>0&&isFinite(al.wRet))return al.wRet;
 }
 return n((c.params||{}).invReturn);
}

var GAP_CATS=[['base','日常支出'],['debt','貸款本息'],['goal','人生目標'],['edu','子女教育'],['life','生活願望'],['retire','退休生活']];

function gapPV(c){return projection(c).shortPV}
function gapPVAt(c,rate){return projection(c,0,rate).shortPV}

// 願景達成度。舊公式是「淨資產 ÷ 一生總流出」——分子是存量、分母是流量，
// 而且完全不看未來收入，導致幾乎所有客戶永遠只有兩三成，教練無從判斷嚴重程度。
// 新公式＝1 −（現值缺口 ÷ 一生需求現值），填得平就是 100%。
function visionRateOf(proj){
 if(!proj||!proj.needPV)return 100;
 return Math.round(Math.max(0,Math.min(1,1-proj.shortPV/proj.needPV))*100);
}
function visionRate(c){return visionRateOf(projection(c))}

// ---------- 願景彈性度（沿用既有欄位，不新增） ----------
// 有填「金額(最低)」就以它為下限；沒填則看重要度——5 分視為不可動，其餘可歸零。
function goalFloor(g){var v=n(g.minPresent);if(v>0)return Math.min(v,n(g.present));return n(g.imp)>=5?n(g.present):0}
function wishFloor(w){var v=n(w.minAmount);if(v>0)return Math.min(v,n(w.amount));return n(w.imp)>=5?n(w.amount):0}
// 願景還有多少可壓縮空間（現值口徑的粗估，只用來判斷「這根槓桿有沒有得動」）。
function visionRoom(c){
 var s=sum(c.goals,function(g){return visionOn(g)?Math.max(0,n(g.present)-goalFloor(g)):0});
 [c.travel,c.hobby,c.luxury].forEach(function(arr){s+=sum(arr,function(w){return visionOn(w)?Math.max(0,n(w.amount)-wishFloor(w))*(n(w.freq)||1):0})});
 return s;
}

// ---------- 槓桿 ----------
// 四個方向拆成六根：收入、支出、效率(報酬率)、時間(延後退休)、退休水準、願景。
// ⚠️「時間×報酬」是獨立的一根，不要併進收入——併了會讓歸因整個錯掉。
var LEVERS=[
 {id:'income',     name:'增加收入',     unit:'%',  hint:'工作收入整體調升',        dir:'up'},
 {id:'expense',    name:'減少支出',     unit:'%',  hint:'生活與消費類支出削減',    dir:'up'},
 {id:'rate',       name:'提高報酬',     unit:'%',  hint:'投資報酬率假設',          dir:'abs'},
 // step:1 ＝ 只能整數年。projection() 的時間軸是整數歲，退休年齡帶小數會讓某一年的
 // 退休權重 w 整段跳掉——反解會收斂到「延後 0.0001 年就填平了」這種假答案。
 {id:'retire',     name:'延後退休',     unit:'年', hint:'工作收入延長、退休期縮短',dir:'up',step:1},
 {id:'retireLevel',name:'降低退休水準', unit:'%',  hint:'退休期支出調降',          dir:'up'},
 {id:'vision',     name:'調整願景',     unit:'%',  hint:'目標與生活願望往「最低金額」壓縮',dir:'up'}
];
function leverName(id){for(var i=0;i<LEVERS.length;i++)if(LEVERS[i].id===id)return LEVERS[i].name;return id}
function leverUnit(id){for(var i=0;i<LEVERS.length;i++)if(LEVERS[i].id===id)return LEVERS[i].unit;return ''}

// 財務階段閘門：不同階段允許動的槓桿不一樣。
// 整裝期(D) 收支還沒轉正、基本保障還沒備齊，先談「把報酬率拉高」是本末倒置，
// 也是實務上最容易出事的一種建議 —— 直接鎖起來，並把理由寫在畫面上。
function leverGate(c,grade){
 grade=grade||health(c).grade;
 var block={},reason={};
 if(grade==='D'){block.rate=1;reason.rate='整裝期：收支尚未轉正或基本保障未備，先不談提高報酬率——順序錯了風險會反咬。';}
 var rateCap=(grade==='C')?Math.min(CAP_RATE,CAP_RATE_STARTER):CAP_RATE;
 if(visionRoom(c)<=0){block.vision=1;reason.vision='目標與生活願望都沒有填「金額(最低)」、或重要度都是 5——沒有可壓縮空間。';}
 return {grade:grade,block:block,reason:reason,rateCap:rateCap};
}

function leverRange(c,id,gate){
 gate=gate||leverGate(c);
 if(id==='rate')return {lo:effReturn(c),hi:Math.max(effReturn(c),gate.rateCap),step:0};
 if(id==='retire')return {lo:0,hi:CAP_RETIRE_DELAY,step:1};
 if(id==='income')return {lo:0,hi:CAP_INCOME_UP};
 if(id==='expense')return {lo:0,hi:CAP_EXPENSE_CUT};
 if(id==='retireLevel')return {lo:0,hi:CAP_RETIRE_CUT};
 return {lo:0,hi:CAP_VISION_CUT};
}

// 延後退休：本人與其他賺薪成員一起推，工作收入的結束歲跟著延長。
// scenario() 與 applyLevers() 共用同一份，避免兩邊各推各的。
function applyRetireDelay(c,years){
 years=n(years);if(!years)return c;
 c.profile.retireAge=n(c.profile.retireAge)+years;
 (c.members||[]).forEach(function(m){if(m&&m.role!=='本人'&&n(m.retireAge)>0)m.retireAge=n(m.retireAge)+years});
 (c.incomes||[]).forEach(function(i){if(i.type==='工作'&&n(i.end)<n(c.profile.retireAge))i.end=n(c.profile.retireAge)});
 return c;
}

/** 套用一組槓桿值，回傳新的個案（不動原件）。 */
function applyLevers(c,set){
 set=set||{};
 var a=JSON.parse(JSON.stringify(c));
 var inc=n(set.income);
 if(inc)(a.incomes||[]).forEach(function(i){if(i.type==='工作')i.amount=n(i.amount)*(1+inc/100)});
 var cut=n(set.expense);
 if(cut)(a.expenses||[]).forEach(function(e){if(isLivingCat(e.cat))e.amount=n(e.amount)*(1-cut/100)});
 if(set.rate!==undefined&&set.rate!==null&&set.rate!==''){
  a.params=a.params||{};a.params.invReturn=n(set.rate);
  a.plan=a.plan||{};a.plan.useAllocReturn=false;   // 手動指定報酬率就不再跟著配置走
 }
 if(n(set.retire))applyRetireDelay(a,n(set.retire));
 var rl=n(set.retireLevel)/100;
 if(rl>0){
  (a.retireExpenses||[]).forEach(function(r){r.amount=n(r.amount)*(1-rl)});
  if(a.retire)a.retire.monthLiving=n(a.retire.monthLiving)*(1-rl);
 }
 var vx=n(set.vision)/100;
 if(vx>0){
  (a.goals||[]).forEach(function(g){if(!visionOn(g))return;var f=goalFloor(g);g.present=n(g.present)-vx*Math.max(0,n(g.present)-f)});
  [a.travel,a.hobby,a.luxury].forEach(function(arr){(arr||[]).forEach(function(w){if(!visionOn(w))return;var f=wishFloor(w);w.amount=n(w.amount)-vx*Math.max(0,n(w.amount)-f)})});
 }
 return a;
}

function gapWith(c,set){return projection(applyLevers(c,set)).shortPV}

/**
 * 單槓桿反解：「如果只動這一根，要動到多少才填得平？」
 * 二分法 24 次（≈1e-7 相對精度就夠，畫面只顯示到整數）。
 * 回傳 feasible=false 代表拉到上限仍補不平——這就是「此路不通」，
 * 教練該往下一根、或往調整願景走。
 */
function solveLever(c,id,base,gate){
 base=base||{};gate=gate||leverGate(c);
 var r=leverRange(c,id,gate);
 var mk=function(x){var s={};for(var k in base)if(base.hasOwnProperty(k))s[k]=base[k];s[id]=x;return s};
 var blocked=!!gate.block[id];
 var g0=gapWith(c,mk(r.lo));
 if(g0<=0)return {id:id,name:leverName(id),unit:leverUnit(id),x:r.lo,lo:r.lo,cap:r.hi,gap:0,base:0,needed:false,feasible:true,blocked:blocked,reason:gate.reason[id]||''};
 if(blocked)return {id:id,name:leverName(id),unit:leverUnit(id),x:r.lo,lo:r.lo,cap:r.hi,gap:g0,base:g0,needed:true,feasible:false,blocked:true,reason:gate.reason[id]||'',reduce:0};
 var g1=gapWith(c,mk(r.hi));
 if(g1>0)return {id:id,name:leverName(id),unit:leverUnit(id),x:r.hi,lo:r.lo,cap:r.hi,gap:g1,base:g0,needed:true,feasible:false,blocked:false,reason:'',reduce:g0-g1};
 if(r.step){
  // 整數槓桿：直接掃，二分法在離散軸上會收斂到沒有意義的小數。
  for(var x=r.lo+r.step;x<=r.hi+1e-9;x+=r.step){if(gapWith(c,mk(x))<=0)return {id:id,name:leverName(id),unit:leverUnit(id),x:x,lo:r.lo,cap:r.hi,gap:0,base:g0,needed:true,feasible:true,blocked:false,reason:'',reduce:g0,step:r.step};}
  return {id:id,name:leverName(id),unit:leverUnit(id),x:r.hi,lo:r.lo,cap:r.hi,gap:g1,base:g0,needed:true,feasible:false,blocked:false,reason:'',reduce:g0-g1,step:r.step};
 }
 var lo=r.lo,hi=r.hi;
 for(var i=0;i<24;i++){var mid=(lo+hi)/2;if(gapWith(c,mk(mid))>0)lo=mid;else hi=mid;}
 return {id:id,name:leverName(id),unit:leverUnit(id),x:hi,lo:r.lo,cap:r.hi,gap:0,base:g0,needed:true,feasible:true,blocked:false,reason:'',reduce:g0};
}

/** 六根槓桿各自反解一次——這張表就是「教練該解什麼」的自動提醒。 */
function soloSolve(c){
 var gate=leverGate(c);
 return {gate:gate,rows:LEVERS.map(function(L){return solveLever(c,L.id,{},gate)})};
}

// ---------- 三個處方 ----------
// 模板數量永遠固定三個，內容每次由求解器現算——這樣才不會「模板一多版面就亂」。
var RX_DEFS=[
 {key:'stable',name:'穩健型',desc:'不假設加薪、不拉高報酬率。先從支出與退休水準下手，最後才用時間換。',
  order:['expense','retireLevel','retire']},
 {key:'growth',name:'進取型',desc:'假設職涯與投資都往上走。先要收入，再要報酬，最後用時間補。',
  order:['income','rate','retire']},
 // 第三張刻意從願景開始，而不是「其他都拉到上限之後才調願景」——
 // 教練真正需要當場回答的是「如果什麼都做不到，願景要砍多少才做得到」，
 // 把它擺在最後一位會讓這個答案永遠算不出來。
 {key:'vision',name:'調願景型',desc:'不動收入與支出，先算「願景要壓縮多少才做得到」；壓到上限仍不夠才動其他槓桿。',
  order:['vision','expense','income','rate','retire','retireLevel']}
];

function greedyFill(c,order,gate){
 gate=gate||leverGate(c);
 var set={},steps=[];
 for(var i=0;i<order.length;i++){
  var id=order[i];
  var r=solveLever(c,id,set,gate);
  if(!r.needed){steps.push(r);break;}          // 前面幾根已經填平了
  if(r.blocked){steps.push(r);continue;}        // 階段閘門擋住，跳過但要留痕
  set[id]=r.x;steps.push(r);
  if(r.feasible)break;                          // 這一根就夠了
 }
 var gap=gapWith(c,set);
 return {levers:set,steps:steps,gap:gap,ok:gap<=0.5};
}

function prescriptions(c){
 var gate=leverGate(c);
 return RX_DEFS.map(function(d){
  var r=greedyFill(c,d.order,gate);
  return {key:d.key,name:d.name,desc:d.desc,levers:r.levers,steps:r.steps,gap:r.gap,ok:r.ok};
 });
}

// ---------- 缺口帳 ----------
function gapLedger(c){
 var p=projection(c),m=metrics(c);
 var total=p.shortPV;
 var lateTot=0;GAP_CATS.forEach(function(k){lateTot+=p.pvLate[k[0]]});
 var flow=[];
 GAP_CATS.forEach(function(k){
  var share=lateTot?p.pvLate[k[0]]/lateTot:0;var pvv=total*share;
  if(pvv>0.5)flow.push({key:k[0],name:k[1],pv:pvv,share:share});
 });
 flow.sort(function(a,b){return b.pv-a.pv});
 var now=[];
 var covs={};
 coverageGaps(c).forEach(function(g){if(g.gap>0)covs[g.kind]=(covs[g.kind]||0)+g.gap});
 Object.keys(covs).forEach(function(k){now.push({name:'保障・'+k,amount:covs[k],kind:'保障'})});
 var emReq=m.monthExp*(n(c.params.emergencyMonths)||6),emGap=Math.max(0,emReq-m.cash);
 if(emGap>0)now.push({name:'緊急預備金',amount:emGap,kind:'流動性'});
 now.sort(function(a,b){return b.amount-a.amount});
 // 每年要補多少：用償債基金公式（不是把現值缺口直接除以年數——那會低估到離譜）。
 // 期數取「到退休」與「到第一個不足年」孰早：錢要在缺口發生之前就位，
 // 而退休之後通常也沒有薪資可以再存。
 var a0_=n(c.profile.age)||40,ra_=n(c.profile.retireAge);
 var end_=(p.negAge!=null)?Math.min(p.negAge,ra_):ra_;
 var yrs=Math.max(1,end_-a0_);
 var r_=p.rate/100;
 var annual_=(Math.abs(r_)<1e-9)?(total/yrs):(total*r_/(Math.pow(1+r_,yrs)-1));
 return {total:total,needPV:p.needPV,rate:p.rate,negAge:p.negAge,shortAge:p.shortAge,
  flow:flow,now:now,years:yrs,annual:annual_,
  conservative:gapPVAt(c,PLAN_DISCOUNT),conservativeRate:PLAN_DISCOUNT,
  visionRate:visionRateOf(p),rateOverCap:effReturn(c)>CAP_RATE};
}

// 後台 /admin/categories 的「規劃求解參數」一存，這些上限就會被覆蓋。
// 與 applyBizTax 同一套防呆：只覆蓋「本來就存在、而且是有限數字」的 key。
function applyPlanCaps(values){
 if(!values||typeof values!=='object')return;
 var setters={
  PLAN_DISCOUNT:function(x){PLAN_DISCOUNT=x},CAP_INCOME_UP:function(x){CAP_INCOME_UP=x},
  CAP_EXPENSE_CUT:function(x){CAP_EXPENSE_CUT=x},CAP_RATE:function(x){CAP_RATE=x},
  CAP_RETIRE_DELAY:function(x){CAP_RETIRE_DELAY=x},CAP_RETIRE_CUT:function(x){CAP_RETIRE_CUT=x},
  CAP_VISION_CUT:function(x){CAP_VISION_CUT=x},CAP_RATE_STARTER:function(x){CAP_RATE_STARTER=x}
 };
 Object.keys(setters).forEach(function(k){
  var x=Number(values[k]);
  if(isFinite(x)&&values[k]!==null&&values[k]!==undefined&&values[k]!=='')setters[k](x);
 });
}

// ===== 配置與對帳（缺口 → 用什麼填）=====
//
// Ray 2026/08/23：「缺口跟配置結果出來了之後，底下需要有對應的配置內容跟預期報酬率，
// 然後滿足上面的缺口。不用具體的商品，先予以留空。」
//
// ⚠️ 地基語意（很容易做錯的三件事）：
//
// 1) **只有「新增投入」的錢才算填補缺口。** 「既有轉入」是把本來就在 projection 裡的
//    可投資資產換個地方放——它會改變加權報酬率，但不會憑空多出一塊錢。
//    把既有資產也算成填補來源，等於把同一筆錢用兩次。
//
// 2) **年投入不當成支出。** 它是「從消費轉到投資」，不是消失的錢；真要減少消費是
//    「減少支出」那根槓桿的事。兩邊都算會重複扣。
//    **保費不一樣——那是真的消耗掉的錢**，所以畫面會提醒教練另外登錄到支出→保險。
//
// 3) **保障配置不進現值對帳。** 保額填的是「即時缺口」（事件發生才要的錢），
//    和一生現金流缺口不同性質，所以走另一條逐項掛勾的對帳，不併入總額。
//
// 商品名稱一律留空：嵐途是一般顧問公司，不做商品推薦。這張表登錄的是
// 「結構與條件」（本金/報酬率/保額/條件內容），不是「買哪一張」。

var ALLOC_SRC=['新增投入','既有轉入'];

// 投資型配置＝手填的 c.plan.invest ＋ **調整動作裡的定期定額／單筆投入**。
// 那兩類本來就是投資，理論上就該出現在配置圓餅與加權報酬裡；
// 「建議資產配置」本身是規劃不是現況，所以這裡合併沒有語意衝突
//（跟十字表不一樣——十字表是現況，動作只能疊加顯示、不能寫進去）。
// ⚠️ 動作帶來的列標 `fromAction:true`，畫面上不可編輯，要改請回動作清單。
function allocInvest(c){
 var own=((c.plan||{}).invest)||[];
 var A=n((c||{}).profile&&c.profile.age)||40,R=n((c||{}).profile&&c.profile.retireAge)||65;
 var fromAct=planActionsOn(c).filter(function(a){return a.cat==='regular'||a.cat==='lump'}).map(function(a){
  var from=n(a.payFrom)||A,to=n(a.payTo)||R;
  return {name:((a.name||'').trim()||actCat(a.cat).n),
   kind:(a.tool||'').trim()||'—',
   principal:n(a.payLump),
   yearly:n(a.payMonthly)*12,
   years:Math.max(1,to-from+(a.cat==='lump'?1:0)),
   ret:n(a.growth),
   src:'新增投入',
   fromAction:true,actionId:a.id};
 });
 return own.concat(fromAct);
}
function allocInvestOwn(c){return ((c.plan||{}).invest)||[]}
function allocProtect(c){return ((c.plan||{}).protect)||[]}

/** 這一列的投入年數：留空＝從現在到退休。 */
function allocYears(c,r){
 var y=n(r.years);
 if(y>0)return y;
 return Math.max(1,n(c.profile.retireAge)-(n(c.profile.age)||40));
}

/** 年金現值：每年投入 pmt、共 n 年、折現率 r%。r≈0 時退回單純相乘（不可除以零）。 */
function annuityPV(pmt,yrs,ratePct){
 pmt=n(pmt);yrs=n(yrs);
 if(pmt<=0||yrs<=0)return 0;
 var r=n(ratePct)/100;
 if(Math.abs(r)<1e-9)return pmt*yrs;
 return pmt*(1-Math.pow(1+r,-yrs))/r;
}

/**
 * 每一列投資配置的「現值貢獻」＝這筆新錢今天值多少。
 * 與缺口同為現值口徑，可以直接相比。折現率用**該列自己的預期報酬率**——
 * 那是這筆錢的機會成本，也是教練填在同一列的假設，最不會前後矛盾。
 */
function allocPV(c){
 var rows=allocInvest(c).map(function(r){
  var isNew=(r.src||'新增投入')==='新增投入';
  var yrs=allocYears(c,r);
  var pvPrincipal=isNew?n(r.principal):0;
  var pvYearly=isNew?annuityPV(r.yearly,yrs,r.ret):0;
  var base=n(r.principal)+annuityPV(r.yearly,yrs,r.ret);   // 含既有，只給加權報酬用
  return {row:r,isNew:isNew,years:yrs,pv:pvPrincipal+pvYearly,weight:base};
 });
 var pv=sum(rows,function(x){return x.pv});
 var wTot=sum(rows,function(x){return x.weight});
 var wRet=wTot?sum(rows,function(x){return x.weight*n(x.row.ret)})/wTot:0;
 return {rows:rows,pv:pv,weight:wTot,wRet:wRet,
  yearly:sum(allocInvest(c),function(r){return n(r.yearly)}),
  premium:sum(allocProtect(c),function(r){return n(r.premium)})};
}

/**
 * 對帳：這組配置補得起缺口嗎？
 * set＝拉桿組合（缺口要用「拉桿之後」的，因為配置補的是剩下那一段）。
 */
function allocReconcile(c,set){
 var after=applyLevers(c,set||{});
 var led=gapLedger(after);
 var ap=allocPV(c);
 var gap=led.total;
 // 保障：逐項掛勾。沒有被任何一列指到的即時缺口 → unassigned。
 var byKey={};
 allocProtect(c).forEach(function(r){
  var k=r.gapKey||'';
  if(!k||k==='（未指定）')return;
  byKey[k]=(byKey[k]||0)+n(r.cover);
 });
 var protect=led.now.map(function(x){
  var have=byKey[x.name]||0;
  return {name:x.name,kind:x.kind,need:x.amount,have:have,short:Math.max(0,x.amount-have),ok:have>=x.amount-0.5};
 });
 var unassigned=protect.filter(function(p){return !p.ok});
 var orphan=Object.keys(byKey).filter(function(k){
  for(var i=0;i<led.now.length;i++)if(led.now[i].name===k)return false;
  return true;
 });
 return {gap:gap,pv:ap.pv,alloc:ap,led:led,
  coverRate:gap>0.5?ap.pv/gap:(ap.pv>0?1:1),
  remain:Math.max(0,gap-ap.pv),over:Math.max(0,ap.pv-gap),
  ok:ap.pv>=gap-0.5,
  protect:protect,unassigned:unassigned,orphan:orphan};
}

/** 舊的 allocations（標的/比例%/預期報酬%/效益）搬到新結構。只跑一次，跑完刪掉舊欄位。 */
function migrateAlloc(c){
 if(!c||!c.plan)return c;
 var p=c.plan;
 if(!p.invest)p.invest=[];
 if(!p.protect)p.protect=[];
 if(p.allocations&&p.allocations.length&&!p._allocMigrated){
  // 比例% 換算成本金：以目前的可投資資產為基數，來源標「既有轉入」——
  // 舊表講的本來就是「現有資產怎麼分」，不是「再拿新錢出來」。
  var liquid=sum((c.assets||[]),function(a){return a.cls==='流動'?aVal(a):0});
  p.allocations.forEach(function(a){
   if(!(n(a.pct)>0)&&!a.name)return;
   p.invest.push({kind:'投資',name:a.name||'',src:'既有轉入',
    principal:Math.round(liquid*n(a.pct)/100),yearly:0,years:0,
    ret:n(a.ret),note:a.benefit||''});
  });
  p._allocMigrated=1;
 }
 return c;
}

/** 這份規劃目前採用的槓桿組合（相容舊欄位 plan.retireDelay）。 */
function planLevers(c){
 var p=c.plan||{},s={};
 var lv=p.levers||{};
 for(var k in lv)if(lv.hasOwnProperty(k)&&n(lv[k]))s[k]=n(lv[k]);
 if(n(p.retireDelay)&&!s.retire)s.retire=n(p.retireDelay);
 return s;
}

// ---------- 調整方案 → 具體行動 ----------
// 求解器算出來的是「支出要砍 12.4%」這種比例，但教練跟客戶講的必須是
// 「每個月少花 8,300 元」「換屋從 1,200 萬降到 1,050 萬」。這一段負責翻譯。
// ⚠️ 回傳的是純資料，畫面（分析頁／報告書／方案書）三處共用同一份，不要各自再算一次。

/** 套用某個願景壓縮幅度後，逐項的「理想 → 調整後」。x 為 0~100。 */
function visionChanges(c,x){
 var vx=n(x)/100,out=[];
 if(vx<=0)return out;
 (c.goals||[]).forEach(function(g){
  if(!visionOn(g))return;
  var f=goalFloor(g),from=n(g.present),to=from-vx*Math.max(0,from-f);
  if(from-to>0.5)out.push({kind:'目標',name:(g.name||g.type||'目標'),from:from,to:to,floor:f,unit:'元'});
 });
 [['旅遊',c.travel],['休閒',c.hobby],['奢侈品',c.luxury]].forEach(function(pair){
  (pair[1]||[]).forEach(function(w){
   if(!visionOn(w))return;
   var f=wishFloor(w),from=n(w.amount),to=from-vx*Math.max(0,from-f);
   if(from-to>0.5)out.push({kind:pair[0],name:(w.sub||w.cat||pair[0]),from:from,to:to,floor:f,unit:'元/次'});
  });
 });
 return out;
}

/**
 * 把一組槓桿翻成可執行清單。set 留空＝用這份規劃已採用的方案。
 * 每一列：{axis 面向, title 做什麼, detail 做到什麼程度, note 補充}
 */
function planActions(c,set){
 set=set||planLevers(c);
 var led=gapLedger(c),acts=[],m=metrics(c);
 var after=applyLevers(c,set),gapAfter=projection(after).shortPV;

 if(led.total>0.5){
  acts.push({axis:'累積',title:'把缺口補起來',
   detail:(led.years<=1
     ? '現金流最快在 '+led.negAge+' 歲轉負，'+fmt(led.total)+' 元的缺口沒有攤提空間，必須立即處理'
     : '在 '+led.years+' 年內每年存入 '+fmt(led.annual)+' 元，以 '+(+led.rate.toFixed(2))+'% 複利累積'),
   note:'現值缺口 '+fmt(led.total)+' 元（保守情境 '+fmt(led.conservative)+' 元）'});
 }

 var incNow=sum(c.incomes,function(i){return i.type==='工作'?n(i.amount):0});
 if(n(set.income)){
  var incAdd=incNow*n(set.income)/100;
  acts.push({axis:'收入',title:'提高工作收入',
   detail:'整體調升 '+(+n(set.income).toFixed(1))+'％＝每年多 '+fmt(incAdd)+' 元（每月 '+fmt(incAdd/12)+' 元）',
   note:'目前工作收入合計 '+fmt(incNow)+' 元/年'});
 }
 var expNow=sum(c.expenses,function(e){return isLivingCat(e.cat)?n(e.amount):0});
 if(n(set.expense)){
  var expCut=expNow*n(set.expense)/100;
  acts.push({axis:'支出',title:'降低生活與消費支出',
   detail:'削減 '+(+n(set.expense).toFixed(1))+'％＝每年少花 '+fmt(expCut)+' 元（每月 '+fmt(expCut/12)+' 元）',
   note:'目前生活＋消費 '+fmt(expNow)+' 元/年'});
 }
 if(set.rate!==undefined&&set.rate!==null&&set.rate!==''&&n(set.rate)>effReturn(c)){
  var al=allocInfo(c);
  acts.push({axis:'效率',title:'調整資產配置以提高長期報酬',
   detail:'報酬率假設由 '+(+effReturn(c).toFixed(2))+'％ 提高到 '+(+n(set.rate).toFixed(2))+'％',
   note:(al.totalPct>0?'目前建議配置的加權報酬為 '+al.wRet.toFixed(2)+'％，需要重新檢視配置':'尚未填建議資產配置')+
        '；規劃上限 '+CAP_RATE+'％，此為假設不是承諾'});
 }
 if(n(set.retire)){
  acts.push({axis:'時間',title:'延後退休',
   detail:'退休年齡由 '+n(c.profile.retireAge)+' 歲改為 '+n(after.profile.retireAge)+' 歲（延後 '+Math.round(n(set.retire))+' 年）',
   note:'工作收入同步延長，退休期縮短——這一根同時作用在兩端'});
 }
 if(n(set.retireLevel)){
  var rNow=retireAnnual(c,n(c.profile.retireAge)+1,1);
  acts.push({axis:'願景',title:'調降退休生活水準',
   detail:'退休期支出調降 '+(+n(set.retireLevel).toFixed(1))+'％'+(rNow>0?'＝退休首年由 '+fmt(rNow)+' 元降為 '+fmt(rNow*(1-n(set.retireLevel)/100))+' 元':''),
   note:'退休期支出明細在「退休」分頁逐列調整'});
 }
 var vc=visionChanges(c,set.vision);
 if(vc.length){
  acts.push({axis:'願景',title:'壓縮目標與生活願望',
   detail:'整體壓縮 '+(+n(set.vision).toFixed(1))+'％，共 '+vc.length+' 項調整（逐項見下表）',
   note:'壓縮下限＝各項填的「金額(最低)」；重要度 5 的項目不動'});
 }

 (led.now||[]).forEach(function(x){
  acts.push({axis:(x.kind==='保障'?'保障':'流動性'),

// ===== 稅制常數（每年檢視更新，單點維護）=====
// 綜所稅級距 [淨額上限, 稅率, 累進差額]；適用 2025 年度(2026 申報)。來源：財政部綜所稅稅率級距表。逐年調整時只改此處。
var TAX_BR=[[590000,0.05,0],[1330000,0.12,41300],[2660000,0.2,147700],[4980000,0.3,413700],[1e15,0.4,911700]];
// 遺產稅級距 [課稅淨額上限, 稅率, 累進差額]；免稅額另見下方 estateTax()。逐年調整時只改此處。
var EST_BR=[[56210000,0.10,0],[112420000,0.15,2810500],[1e15,0.20,8431500]];

function bracket(x,br){
 x=Number(x);
 if(!isFinite(x)||x<=0)return {rate:0,ded:0,tax:0};
 for(var i=0;i<br.length;i++){if(x<=br[i][0])return {rate:br[i][1],ded:br[i][2],tax:Math.max(0,x*br[i][1]-br[i][2])}}
 var last=br[br.length-1];
 return {rate:last[1],ded:last[2],tax:Math.max(0,x*last[1]-last[2])};}
// 執行業務者費用標準（財政部「一百十四年度執行業務者費用標準」常用職業別）。
// 執行業務所得＝收入 ×(1−費用率)，走這條路的收入不適用薪資所得特別扣除。
var PROF_EXPENSE=[
 ['律師',30],['律師（法律扶助 / 義務辯護）',50],['會計師',35],['建築師',35],['技師',35],
 ['地政士',30],['記帳士 / 記帳及報稅代理人',35],['保險經紀人',26],['一般經紀人',20],
 ['著作人（稿費 / 版稅）',30],['著作人（自行出版）',75],['表演人',45],
 ['藥師（非健保）',20],['營養師',20],['心理師',20],['命理卜卦',20],['公益彩券經銷商',60],
 ['其他（自行輸入費用率）',null]
];
function profStdRate(name){for(var i=0;i<PROF_EXPENSE.length;i++)if(PROF_EXPENSE[i][0]===name)return PROF_EXPENSE[i][1];return null}
// 費用率：教練手動覆寫優先；否則取職業別標準；都沒有時以一般經紀人 20% 為保守預設。
function profExpenseRate(tp){tp=tp||{};
 if(tp.profRate!=null&&tp.profRate!=='')return n(tp.profRate);
 var s=profStdRate(tp.profOccupation);return s==null?20:s;}
function setProfOccupation(v){var c=activeCase();c.taxParams=c.taxParams||{};c.taxParams.profOccupation=v;
 var s=profStdRate(v);if(s!=null)c.taxParams.profRate=s;save();render();}
function incomeTax(c){
 var tp=c.taxParams||{};
 var work=(c.incomes||[]).filter(function(i){return i.type==='工作'});
 // 子類別＝執行業務所得者走費用率扣除，其餘工作收入走薪資所得特別扣除
 var profGross=sum(work,function(i){return i.subType==='執行業務所得'?n(i.amount):0});
 var salary=sum(work,function(i){return i.subType==='執行業務所得'?0:n(i.amount)});
 var pRate=profExpenseRate(tp);
 var profExpense=Math.round(profGross*pRate/100);
 var profNet=Math.max(0,profGross-profExpense);
 var people=1+(tp.married?1:0)+n(tp.dependents);
 // 薪資特別扣除的人數依申報身分（本人＋有偶）認定，與免稅額/標準扣除同一個來源。
 // 舊版只看「成員中 insSalary>0 的人數」，在「家庭加了有薪配偶但稅賦沒切有偶」時會多扣一份、稅額少算約 5 萬。
 var salaryEarners=Math.max(1,Math.min(1+(tp.married?1:0),(c.members||[]).filter(function(m){return n(m.insSalary)>0}).length||1));
 var exempt=97000*people;
 var stdDed=tp.married?262000:131000;
 var salarySpecial=Math.min(salary,218000*salaryEarners);
 var gross=salary+profNet;
 var net=Math.max(0,gross-exempt-stdDed-salarySpecial-n(tp.otherDeduction));
 var b=bracket(net,TAX_BR);
 return {salary:salary,profGross:profGross,profRate:pRate,profExpense:profExpense,profNet:profNet,
  profOccupation:tp.profOccupation||'',gross:gross,
  exempt:exempt,stdDed:stdDed,salarySpecial:salarySpecial,salaryEarners:salaryEarners,net:net,rate:b.rate,ded:b.ded,tax:b.tax,people:people};
}
// 遺產稅法定扣除額（逐年檢視項）：配偶 553 萬、直系血親卑親屬 56 萬/人、喪葬費 138 萬。
var ESTATE_EXEMPT=13330000, ESTATE_SPOUSE_DED=5530000, ESTATE_LINEAL_DED=560000, ESTATE_FUNERAL_DED=1380000;
// 舊版只扣免稅額、而且誤用綜所稅的 otherDeduction；改為獨立的 taxParams.estateDeduction。
function estateTax(c,netOverride){
 var tp=(c||{}).taxParams||{}, lg=(c||{}).legacy||{};
 var net=(netOverride!=null)?netOverride:metrics(c).net;
 var heirs=Math.max(0,n(lg.heirs));
 var ded={exempt:ESTATE_EXEMPT,spouse:tp.married?ESTATE_SPOUSE_DED:0,
  lineal:heirs*ESTATE_LINEAL_DED,funeral:ESTATE_FUNERAL_DED,other:n(tp.estateDeduction)};
 var totalDed=ded.exempt+ded.spouse+ded.lineal+ded.funeral+ded.other;
 var base=Math.max(0,net-totalDed);
 var b=bracket(base,EST_BR);
 return {base:base,rate:b.rate,tax:b.tax,net:net,heirs:heirs,deductions:ded,totalDeduction:totalDed};
}
function propertyTax(c){var tp=c.taxParams||{};var house=n(tp.houseAssessed)*0.012,land=n(tp.landAssessed)*0.002,car=n(tp.carTax);return {house:house,land:land,car:car,total:house+land+car}}

// 目標金額沿用既有的「繼承人數 × 每人現金傳承」，不需要新欄位。
function legacyNeed(c){var lg=c.legacy||{};if(lg.on===false)return 0;return n(lg.heirs)*n(lg.perHeirCash)}

function scenario(c){
 // 2026/08/23 起「規劃後」＝套用 c.plan.levers 的完整槓桿組合（六根），
 // 不再只有延後退休一根。舊欄位 plan.retireDelay 由 planLevers() 相容進來。
 //
 // 2026/08/24（v2）：調整動作上線後，「規劃前」不再等於 c —— c 本身已經含 actions。
 // ⚠️ 有動作時 before 必須用 baseCase(c)（把 actions 清空的同一份個案），
 //    否則前後對照兩邊都含動作，差額永遠是 0，整張對照表失去意義。
 // 動作與 v1 的 levers 可以並存：levers 仍然套用在「含動作」的個案上。
 var hasAct=planActionsOn(c).length>0;
 var baseC=hasAct?baseCase(c):c;
 var after=applyLevers(c,planLevers(c));
 var before={metrics:metrics(baseC),retire:retireNeed(baseC),health:health(baseC),estate:estateTax(baseC),incomeTax:incomeTax(baseC),gap:gapPV(baseC)};
 var mAfter=metrics(after);
 var netAfter=mAfter.net-n((c.plan||{}).movableToOverseas); // 資產移轉降低境內帳面淨值(遺產稅基)
 var after2={metrics:mAfter,retire:retireNeed(after),health:health(after),estate:estateTax(after,netAfter),incomeTax:incomeTax(after),gap:mAfter.proj.shortPV};
 // afterCase＝套用方案後的完整個案（延後退休已推到每位賺薪成員），供測試與明細追溯。
 // baseCase＝規劃前的那一份（有動作時是清空 actions 的版本）。
 return {before:before,after:after2,afterCase:after,baseCase:baseC,hasActions:hasAct};
}

// 願景時間軸的 hover：十字線＋數字。一張線圖沒有 hover 等於少一半資訊。
function bindVT(){
 document.querySelectorAll('.vtwrap').forEach(function(box){
  var svg=box.querySelector('svg'),tip=box.querySelector('.vttip'),cross=box.querySelector('.vtcross');
  if(!svg||!tip)return;
  svg.querySelectorAll('.vthv rect').forEach(function(r){
   r.addEventListener('mouseenter',function(){
    var x=+r.getAttribute('data-x'),age=r.getAttribute('data-age'),
        b=+r.getAttribute('data-b'),a=+r.getAttribute('data-a');
    if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.setAttribute('opacity','.55')}
    tip.innerHTML='<b style="color:var(--amber2)">'+age+' 歲</b><br>'+
     (b===a?'資產 '+cfAxis(a):'<span style="color:#8ea3b5">現況</span> '+cfAxis(b)+'<br><span style="color:#f0c34e">調整後</span> '+cfAxis(a));
    var bw=box.getBoundingClientRect(),sc=bw.width/980;
    tip.style.opacity=1;
    tip.style.left=Math.min(bw.width-150,Math.max(0,x*sc-70))+'px';
    tip.style.top='30px';
   });
  });
  svg.addEventListener('mouseleave',function(){tip.style.opacity=0;if(cross)cross.setAttribute('opacity','0')});
 });
}

function bindPrioDrag(){var row=document.getElementById('prioRow');if(!row)return;var from=null;
 row.querySelectorAll('.pitem').forEach(function(el){var i=+el.dataset.i;
  el.ondragstart=function(e){from=i;el.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i))}catch(_){}};
  el.ondragend=function(){from=null;el.classList.remove('drag');row.querySelectorAll('.pitem').forEach(function(x){x.classList.remove('over')})};
  el.ondragover=function(e){e.preventDefault();if(from!==null&&from!==i)el.classList.add('over')};
  el.ondragleave=function(){el.classList.remove('over')};
  el.ondrop=function(e){e.preventDefault();el.classList.remove('over');if(from===null)return;var f=from;from=null;dropTarget(f,i)};
 })}

// ===== 家族族譜（樹狀圖）=====
// 關係以 parentA / parentB 指向另一位成員的 mid（穩定 id，刪成員不會錯位）；
// 沒設定時給合理預設：子女＝本人＋配偶。世代由角色決定，有設父母者一律排到父母的下一代。
// ⚠️ 不能用 uid()：它是 performance.now() 截位，同一輪迴圈連續呼叫會撞號（實測三位成員拿到同一個 id，
//    整個族譜疊成一張卡）。這裡用獨立序號＋亂數，並順手把已經撞號的舊資料重新編號。
var _midSeq=0;
function newMid(){_midSeq++;return 'm'+Date.now().toString(36)+'-'+_midSeq.toString(36)+'-'+Math.floor(Math.random()*1e6).toString(36);}
function ensureMemberIds(c){
 var seen={};
 (c.members||[]).forEach(function(m){
  if(!m||typeof m!=='object')return;
  if(!m.mid||seen[m.mid])m.mid=newMid();
  seen[m.mid]=1;
 });
 return c;
}
function memberByMid(c,mid){return (c.members||[]).filter(function(m){return m.mid===mid})[0]||null;}
function primaryIdx(c){var ms=c.members||[];for(var i=0;i<ms.length;i++)if(ms[i].role==='本人')return i;return 0;}
function spouseMember(c){return (c.members||[]).filter(function(m){return m.role==='配偶'})[0]||null;}
function memberLabel(c,m,i){var nm=(i===primaryIdx(c))?((c.profile||{}).name||m.name||'本人'):(m.name||'（未命名）');return nm;}
function effParents(c,m){
 var out=[];
 if(m.parentA){var a=memberByMid(c,m.parentA);if(a&&a!==m)out.push(a);}
 if(m.parentB){var b=memberByMid(c,m.parentB);if(b&&b!==m&&out.indexOf(b)<0)out.push(b);}
 if(!m.parentA&&!m.parentB&&m.role==='子女'){
  var ms=c.members||[],pm=ms[primaryIdx(c)],sp=spouseMember(c);
  if(pm&&pm!==m)out.push(pm);
  if(sp&&sp!==m)out.push(sp);
 }
 return out;
}
function familyGenerations(c){
 ensureMemberIds(c);
 var ms=c.members||[],pi=primaryIdx(c),gen={};
 ms.forEach(function(m,i){
  var r=(i===pi)?'本人':(m.role||'其他');
  gen[m.mid]=(r==='父'||r==='母'||r==='長輩')?0:(r==='子女')?2:1;
 });
 for(var pass=0;pass<3;pass++){
  ms.forEach(function(m){
   var ps=effParents(c,m);if(!ps.length)return;
   var mx=0;ps.forEach(function(x){mx=Math.max(mx,gen[x.mid]||0)});
   if(gen[m.mid]<=mx)gen[m.mid]=mx+1;
  });
 }
 return gen;
}
function familyTreeSVG(c,theme){
 ensureMemberIds(c);
 var ms=c.members||[];
 if(!ms.length)return theme==='light'?'<p style="color:#5a6b72">尚未登錄家庭成員。</p>':'<div class="hint">尚未登錄家庭成員，新增後這裡會自動長出族譜。</div>';
 var dark=theme!=='light',pi=primaryIdx(c),gen=familyGenerations(c);
 var txt=dark?'#eef2f7':'#0d2b45',sub=dark?'#a7bacb':'#5a6b72',line=dark?'rgba(255,255,255,.22)':'rgba(0,0,0,.22)';
 var cardBg=dark?'#12334f':'#f4f7f9',cardBd=dark?'rgba(255,255,255,.14)':'rgba(0,0,0,.12)';
 var selfBd=dark?'#c99a5b':'#a3814a',spouseBd=dark?'#7fa8a0':'#4e7a72';
 var W=150,H=64,GX=20,GY=58,PAD=14;
 var rows={};ms.forEach(function(m,i){var g=gen[m.mid]||0;(rows[g]=rows[g]||[]).push({m:m,i:i});});
 var gks=Object.keys(rows).map(Number).sort(function(a,b){return a-b});
 var maxCols=0;gks.forEach(function(g){maxCols=Math.max(maxCols,rows[g].length)});
 var totalW=PAD*2+maxCols*W+(maxCols-1)*GX;
 var totalH=PAD*2+gks.length*H+(gks.length-1)*GY;
 var pos={};
 gks.forEach(function(g,gi){
  var arr=rows[g],rw=arr.length*W+(arr.length-1)*GX,x0=(totalW-rw)/2,y=PAD+gi*(H+GY);
  arr.forEach(function(o,ci){pos[o.m.mid]={x:x0+ci*(W+GX),y:y};});
 });
 // 連線：由父母卡片底部中點 → 子女卡片頂部中點（直角折線）
 var links='';
 ms.forEach(function(m){
  var ps=effParents(c,m),cp=pos[m.mid];if(!ps.length||!cp)return;
  var px=0,py=0,cnt=0;
  ps.forEach(function(x){var q=pos[x.mid];if(q){px+=q.x+W/2;py=Math.max(py,q.y+H);cnt++;}});
  if(!cnt)return;px/=cnt;
  if(py>=cp.y)return; // 同代或反向，不畫
  var midY=(py+cp.y)/2;
  links+='<path d="M'+px.toFixed(1)+' '+py.toFixed(1)+' V'+midY.toFixed(1)+' H'+(cp.x+W/2).toFixed(1)+' V'+cp.y.toFixed(1)+'" fill="none" stroke="'+line+'" stroke-width="1.4"/>';
  if(ps.length>1){
   var xs=ps.map(function(x){var q=pos[x.mid];return q?q.x+W/2:null}).filter(function(v){return v!=null});
   if(xs.length>1)links+='<line x1="'+Math.min.apply(null,xs)+'" y1="'+py.toFixed(1)+'" x2="'+Math.max.apply(null,xs)+'" y2="'+py.toFixed(1)+'" stroke="'+line+'" stroke-width="1.4"/>';
  }
 });
 var cards=ms.map(function(m,i){
  var q=pos[m.mid];if(!q)return '';
  var isSelf=(i===pi),role=isSelf?'本人':(m.role||'未指定');
  var nm=memberLabel(c,m,i);
  var jt=isSelf?((c.profile||{}).jobType||''):(m.jobType||'');
  if(jt==='其他'){var jo=isSelf?((c.profile||{}).jobTypeOther||''):(m.jobTypeOther||'');if(jo)jt=jo;}
  var age=isSelf?n((c.profile||{}).age):n(m.age);
  var l2=[role,(age?age+' 歲':'')].filter(Boolean).join(' · ');
  var l3=jt||m.insType||'';
  var bd=isSelf?selfBd:(role==='配偶'?spouseBd:cardBd);
  return '<g><rect x="'+q.x+'" y="'+q.y+'" width="'+W+'" height="'+H+'" rx="10" fill="'+cardBg+'" stroke="'+bd+'" stroke-width="'+(isSelf||role==='配偶'?'1.8':'1')+'"/>'+
   '<text x="'+(q.x+12)+'" y="'+(q.y+22)+'" fill="'+txt+'" font-size="13" font-weight="800">'+esc(String(nm).slice(0,9))+'</text>'+
   '<text x="'+(q.x+12)+'" y="'+(q.y+39)+'" fill="'+sub+'" font-size="11">'+esc(l2)+'</text>'+
   '<text x="'+(q.x+12)+'" y="'+(q.y+54)+'" fill="'+sub+'" font-size="11">'+esc(String(l3).slice(0,12))+'</text></g>';
 }).join('');
 return '<div style="overflow-x:auto"><svg viewBox="0 0 '+Math.round(totalW)+' '+Math.round(totalH)+'" width="100%" style="max-width:'+Math.round(totalW)+'px;height:auto;display:block;margin:0 auto">'+links+cards+'</svg></div>';
}

function retirePhaseSegs(c){

 var pts=earnerRetirePoints(c).slice().sort(function(x,y){return x.at-y.at;});
 var bounds=[];
 pts.forEach(function(p){if(p.at>=a0&&p.at<le&&bounds.indexOf(p.at)<0)bounds.push(p.at);});
 var segs=[],st=a0;
 for(var i=0;i<bounds.length;i++){segs.push([st,bounds[i]]);st=bounds[i]+1;}
 segs.push([st,le]);
 return segs.filter(function(g){return g[1]>=g[0];}).map(function(g){
  var w=retiredWeight(c,g[0]);
  var retired=pts.filter(function(p){return g[0]>p.at;}).map(function(p){return p.name||'（未命名）';});
  var work=sum(c.incomes,function(x){return (x.type==='工作'&&g[0]>=n(x.start)&&g[0]<=n(x.end))?n(x.amount):0;});
  var living=0;(c.expenses||[]).forEach(function(e){if(g[0]>=n(e.start)&&g[0]<=n(e.end)&&isLivingCat(e.cat))living+=n(e.amount);});
  var famLiving=living*(1-w)+retireAnnual(c,g[0],1)*w;
  var label=w<=0?'工作期':(w>=1?'全退休':'混合期');
  return {from:g[0],to:g[1],w:w,retired:retired,work:work,famLiving:famLiving,label:label};
 });

// ===== 調整方案：圖表元件 =====
//
// 2026/08/23 第二輪。Ray 的回饋：「有點難看得懂，很多東西不夠簡化，沒有圖表會看得很辛苦。」
// 病因是我把求解器的內部狀態整片攤成表格——那是除錯視角，不是諮詢現場視角。
//
// 顏色語意刻意與既有的現金流投影圖（expenseSourceSVG）一致，不另創一套：
//   #8ea3b5 中性 ＝ 未調整的基準線（它是參照不是主角，所以刻意不搶眼）
//   #f0c34e 強調 ＝ 套用方案後（＝那張圖的「可投資資產本金」同色）
//   #ef6f6f 紅   ＝ 缺口（＝那張圖的「缺口」同色）
// ⚠️ 兩條線一律在線末端直接標名字，不靠顏色分辨（色盲與黑白列印都要讀得出來）。
//
// 深淺兩版共用同一份函式，靠 theme 參數切換——教練端（深色可互動）與
// 調整方案書（淺色可列印）看到的是同一張圖，不會各畫各的。

function planChartColors(theme){
 var dark=theme!=='light';
 return {dark:dark,
  AX:dark?'#6f869c':'#5a6b72', GRID:dark?'rgba(255,255,255,.08)':'rgba(0,0,0,.07)',
  TICK:dark?'#71858c':'#8a9aa2', ZERO:dark?'rgba(255,255,255,.30)':'#b9c6ca',
  BASE:dark?'#8ea3b5':'#5a7186', AFT:dark?'#f0c34e':'#b07d3d', GAP:'#ef6f6f',
  LAB:dark?'#e9f0f2':'#22333a', OK:dark?'#8fc0a3':'#3f7d54', MUT:dark?'#6f869c':'#8a9aa2',
  TRACK:dark?'rgba(255,255,255,.09)':'#e6ecee', AMB:dark?'#c99a5b':'#b07d3d'};
}

/**
 * 座標刻度取「好看的數字」（1/2/2.5/5 × 10^k），而且**一定包含 0**。
 * 直接把 min~max 均分會得到 109萬 / −2894萬 / −5896萬 這種讀不出來的刻度，
 * 而這張圖的全部意義就是「有沒有掉到零以下」，零線沒有標籤等於沒講重點。
 */
function niceTicks(mn,mx,target){
 var span=mx-mn;if(!(span>0))return [0];
 var raw=span/(target||3),mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10));
 var norm=raw/mag,step=(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag;
 var out=[],v=Math.ceil(mn/step-1e-9)*step;
 for(;v<=mx+step*1e-6;v+=step)out.push(Math.abs(v)<step*1e-6?0:v);
 if(mn<0&&mx>0){var has=false;for(var i=0;i<out.length;i++)if(Math.abs(out[i])<step*1e-6)has=true;if(!has)out.push(0);}
 out.sort(function(a,b){return a-b});
 return out;
}

/**
 * 主圖：一生可投資資產曲線 ＋ 缺口陰影。
 * 這張圖就是「你和你想要的未來差多少」的答案——曲線掉到零線以下的那塊紅色，
 * 折現回今天就是現值缺口。拉桿一動，金線會被抬起來、紅色會縮小。
 */
function gapChartSVG(c,set,theme,idKey){
 var K=planChartColors(theme),pb=projection(c),rows=pb.rows;
 if(!rows.length)return '<div class="muted">無資料</div>';
 var hasSet=set&&Object.keys(set).length>0;
 var ra=hasSet?projection(applyLevers(c,set)).rows:null;
 var W=760,H=258,pL=56,pR=78,pT=20,pB=30,plotW=W-pL-pR,plotH=H-pT-pB;
 var vals=rows.map(function(r){return r.invest});
 if(ra)vals=vals.concat(ra.map(function(r){return r.invest}));
 vals.push(0);
 var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),span=(mx-mn)||1;
 function X(i){return pL+(rows.length>1?i/(rows.length-1):0)*plotW}
 function Y(v){return pT+(1-(v-mn)/span)*plotH}
 function path(rs){return rs.map(function(r,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(r.invest).toFixed(1)}).join(' ')}
 var zeroY=Y(0);

 // 缺口區＝基準線落在零線以下的每一段（可能不只一段）
 function seg(a,b){
  var d='M'+X(a).toFixed(1)+' '+zeroY.toFixed(1);
  for(var i=a;i<=b;i++)d+='L'+X(i).toFixed(1)+' '+Y(rows[i].invest).toFixed(1);
  d+='L'+X(b).toFixed(1)+' '+zeroY.toFixed(1)+'Z';
  return '<path d="'+d+'" fill="'+K.GAP+'" fill-opacity="'+(K.dark?0.24:0.17)+'"/>';
 }
 var gapArea='',run=null;
 rows.forEach(function(r,i){
  if(r.invest<0){if(run===null)run=i;}
  else if(run!==null){gapArea+=seg(run,i-1);run=null;}
 });
 if(run!==null)gapArea+=seg(run,rows.length-1);

 // 格線刻意稀疏——這張圖要看的是形狀不是讀數；但 0 那一條一定要標出來。
 var grid='';
 niceTicks(mn,mx,3).forEach(function(v){
  var y=Y(v),isZero=Math.abs(v)<1e-6;
  grid+='<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="'+(isZero?'transparent':K.GRID)+'"/>'+
   '<text x="'+(pL-7)+'" y="'+(y+3).toFixed(1)+'" fill="'+(isZero?K.LAB:K.AX)+'" font-size="'+(isZero?'10.5':'9.5')+'"'+(isZero?' font-weight="800"':'')+' text-anchor="end">'+(isZero?'0':cfAxis(v))+'</text>';
 });
 var ticks='';
 for(var i2=0;i2<rows.length;i2+=10)ticks+='<text x="'+X(i2).toFixed(1)+'" y="'+(H-9)+'" fill="'+K.TICK+'" font-size="9.5" text-anchor="middle">'+rows[i2].age+'</text>';
 ticks+='<text x="'+X(rows.length-1).toFixed(1)+'" y="'+(H-9)+'" fill="'+K.TICK+'" font-size="9.5" text-anchor="middle">'+rows[rows.length-1].age+'</text>';

 // 轉負年標記
 var mark='';
 if(pb.turnNeg!=null){
  var ti=pb.turnNeg-rows[0].age,tx=X(Math.max(0,Math.min(rows.length-1,ti)));
  // 標籤預設放線的右邊；太靠右就翻到左邊，並壓低一點避開最上面那個 Y 軸刻度。
  var flip=tx>W-pR-90,lx=flip?tx-5:tx+5;
  mark='<line x1="'+tx.toFixed(1)+'" y1="'+pT+'" x2="'+tx.toFixed(1)+'" y2="'+(pT+plotH)+'" stroke="'+K.GAP+'" stroke-width="1" stroke-opacity=".55"/>'+
   '<text x="'+lx.toFixed(1)+'" y="'+(pT+26)+'" fill="'+K.GAP+'" font-size="10" font-weight="700" text-anchor="'+(flip?'end':'start')+'">'+pb.turnNeg+' 歲轉負</text>';
 }

 // 線末端直接標名字（不靠顏色分辨）。兩個標籤太近就上下推開。
 var yB=Y(rows[rows.length-1].invest),lab='';
 var xEnd=X(rows.length-1)+7;
 if(ra){
  var yA=Y(ra[ra.length-1].invest);
  if(Math.abs(yA-yB)<15){var mid=(yA+yB)/2;yA=mid-8;yB=mid+8;}
  lab+='<text x="'+xEnd.toFixed(1)+'" y="'+(yA+3.5).toFixed(1)+'" fill="'+K.AFT+'" font-size="10.5" font-weight="800">調整後</text>';
 }
 lab+='<text x="'+xEnd.toFixed(1)+'" y="'+(yB+3.5).toFixed(1)+'" fill="'+K.BASE+'" font-size="10.5" font-weight="700">未調整</text>';

 // 缺口金額直接註記在紅色區塊旁邊——不用去別的地方對數字
 var note='';
 if(pb.shortPV>0.5&&pb.turnNeg!=null){
  var ni=Math.min(rows.length-1,Math.max(0,(pb.shortAge!=null?pb.shortAge:pb.turnNeg)-rows[0].age));
  var nx=Math.min(W-pR-52,Math.max(pL+52,X(ni)));
  // 標在紅色區塊的垂直中央，一眼就知道那塊紅色是什麼
  var ny=Math.min(pT+plotH-6,Math.max(pT+12,(zeroY+Y(rows[ni].invest))/2+4));
  note='<text x="'+nx.toFixed(1)+'" y="'+ny.toFixed(1)+'" fill="'+K.GAP+'" font-size="12" font-weight="800" text-anchor="middle">缺口 '+cfAxis(pb.shortPV)+'</text>';
 }

 var hov='',cursor='',read='';
 if(idKey){
  window.__charts=window.__charts||{};
  window.__charts[idKey]={a0:rows[0].age,rows:rows.map(function(r){return r.invest}),
   after:ra?ra.map(function(r){return r.invest}):null,bals:rows.map(function(r){return r.bal}),
   W:W,pad:pL,padR:pR,n:rows.length,gapChart:true};
  hov=' style="cursor:crosshair;touch-action:none" onmousemove="hoverChart(event,\''+idKey+'\')" ontouchmove="hoverChart(event,\''+idKey+'\')"';
  cursor='<line id="'+idKey+'Cursor" x1="0" y1="'+pT+'" x2="0" y2="'+(pT+plotH)+'" stroke="'+K.LAB+'" stroke-width="1" stroke-opacity=".45" style="display:none"/>';
  read='<div id="'+idKey+'Readout" style="background:#0a1a20;border:1px solid var(--line);border-radius:9px;padding:7px 11px;margin-bottom:7px;font-size:12.5px;color:var(--mut)">移動滑鼠／手指到圖上任一年齡，看該年的可投資資產</div>';
 }

 var legend='<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:'+(K.dark?'var(--mut)':'#5a6b72')+';margin-top:5px">'+
  '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:16px;height:2px;background:'+K.BASE+';display:inline-block"></span>未調整</span>'+
  (ra?'<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:16px;height:3px;background:'+K.AFT+';display:inline-block"></span>調整後</span>':'')+
  '<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:12px;height:10px;border-radius:2px;background:'+K.GAP+';opacity:.45;display:inline-block"></span>缺口（資產轉負的那一段）</span>'+
  '</div>';

 return read+'<svg width="100%" viewBox="0 0 '+W+' '+H+'"'+hov+'>'+
  grid+gapArea+
  '<line x1="'+pL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+zeroY.toFixed(1)+'" stroke="'+K.ZERO+'" stroke-width="1"/>'+
  mark+
  '<path d="'+path(rows)+'" fill="none" stroke="'+K.BASE+'" stroke-width="2" stroke-linejoin="round"/>'+
  (ra?'<path d="'+path(ra)+'" fill="none" stroke="'+K.AFT+'" stroke-width="2.6" stroke-linejoin="round"/>':'')+
  ticks+lab+note+cursor+'</svg>'+legend;
}

/**
 * 六根槓桿量表。一條橫條＝一根槓桿，條長是「要動到多少」、軌道長是規劃上限，
 * 衝出軌道就是紅色的「此路不通」。六根一眼看完，不用一列一列讀文字。
 */
function leverBarsHTML(c,solo,theme,withAct){
 var K=planChartColors(theme);
 var rows=solo.rows.map(function(r){
  var st,col,txt,frac;
  if(!r.needed){st='🟢';col=K.OK;txt='不需動用';frac=0;}
  else if(r.blocked){st='⚪';col=K.MUT;txt='現階段不建議動用';frac=0;}
  else if(r.feasible){st='🟢';col=K.OK;
   frac=Math.max(0.02,Math.min(1,(r.cap-r.lo)>0?(r.x-r.lo)/(r.cap-r.lo):1));
   txt=(r.id==='rate'?('拉到 '+r.x.toFixed(2)+'%'):(r.id==='retire'?('延後 '+Math.round(r.x)+' 年'):((r.id==='income'?'增加':r.id==='expense'?'削減':r.id==='vision'?'壓縮':'調降')+' '+r.x.toFixed(1)+'%')));}
  else {st='🔴';col=K.GAP;frac=1;
   txt='拉到上限仍差 '+cfAxis(r.gap);}
  var capTxt=(r.id==='retire'?r.cap+' 年':(+r.cap.toFixed(1))+'%');
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap">'+
   '<div style="width:104px;flex:none;font-size:13px;color:'+K.LAB+'">'+st+' '+esc(r.name)+'</div>'+
   '<div style="flex:1;min-width:120px;height:12px;border-radius:6px;background:'+K.TRACK+';position:relative;overflow:visible">'+
     '<div style="position:absolute;left:0;top:0;bottom:0;width:'+(frac*100).toFixed(1)+'%;border-radius:6px;background:'+col+(frac>=1&&!r.feasible&&r.needed?';box-shadow:6px 0 0 -2px '+K.GAP:'')+'"></div>'+
   '</div>'+
   '<div style="width:186px;flex:none;font-size:12.5px;color:'+col+';font-weight:700;text-align:right">'+esc(txt)+
     '<span style="color:'+K.MUT+';font-weight:400"> ／上限 '+capTxt+'</span></div>'+
   (withAct&&r.feasible&&r.needed?'<button class="tbtn" style="padding:3px 9px;font-size:12px;flex:none" onclick="adoptSolo(\''+r.id+'\')">套用</button>':'')+
   '</div>'+
   (r.reason?'<div style="font-size:11.5px;color:'+K.MUT+';margin:-4px 0 8px 114px">'+esc(r.reason)+'</div>':'');
 }).join('');
 return '<div>'+rows+'</div>';
}

/** 缺口組成：水平長條（單一顏色，依金額排序）。比堆疊條或圓餅好讀，也不用挑配色。 */
function gapBarsHTML(led,theme){
 var K=planChartColors(theme);
 if(!led.flow.length)return '';
 var mxv=led.flow[0].pv||1;
 return led.flow.map(function(f){
  return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">'+
   '<div style="width:78px;flex:none;font-size:12.5px;color:'+K.LAB+'">'+esc(f.name)+'</div>'+
   '<div style="flex:1;min-width:80px;height:14px;border-radius:4px;background:'+K.TRACK+'">'+
     '<div style="height:100%;width:'+(f.pv/mxv*100).toFixed(1)+'%;border-radius:4px;background:'+K.AMB+'"></div></div>'+
   '<div style="width:132px;flex:none;text-align:right;font-size:12.5px;color:'+K.LAB+'">'+fmt(f.pv)+
     '<span style="color:'+K.MUT+'"> · '+(f.share*100).toFixed(0)+'%</span></div></div>';
 }).join('');
}

/** 調整前後的四個變化。用箭頭與顏色講「往好還是往壞」，不是七列數字表。 */
function deltaCardsHTML(c,set,theme){
 var K=planChartColors(theme);
 var pb=projection(c),after=applyLevers(c,set||{}),pa=projection(after);
 var hb=health(c),ha=health(after);
 var items=[
  {t:'現值缺口',b:fmt(pb.shortPV),a:fmt(pa.shortPV),good:pa.shortPV<pb.shortPV,same:Math.abs(pa.shortPV-pb.shortPV)<0.5,zero:pa.shortPV<=0.5},
  {t:'願景達成度',b:visionRateOf(pb)+'%',a:visionRateOf(pa)+'%',good:visionRateOf(pa)>visionRateOf(pb),same:visionRateOf(pa)===visionRateOf(pb),zero:visionRateOf(pa)>=100},
  {t:'資產轉負年齡',b:pb.turnNeg?pb.turnNeg+' 歲':'無',a:pa.turnNeg?pa.turnNeg+' 歲':'無',
   good:(pa.turnNeg||999)>(pb.turnNeg||999),same:(pa.turnNeg||999)===(pb.turnNeg||999),zero:!pa.turnNeg},
  {t:'財務階段',b:stageName(hb.grade),a:stageName(ha.grade),good:ha.grade<hb.grade,same:ha.grade===hb.grade,zero:false}
 ];
 return '<div style="display:flex;gap:9px;flex-wrap:wrap">'+items.map(function(x){
  var col=x.zero?K.OK:(x.same?K.MUT:(x.good?K.OK:K.GAP));
  var arrow=x.same?'＝':(x.good?'↗':'↘');
  return '<div style="flex:1;min-width:132px;background:'+(K.dark?'#0a1a20':'#f7f4ee')+';border:1px solid '+(K.dark?'var(--line)':'#e4dfd4')+';border-radius:10px;padding:9px 11px">'+
   '<div style="font-size:11.5px;color:'+K.MUT+'">'+x.t+'</div>'+
   '<div style="font-size:12.5px;color:'+K.MUT+';margin-top:3px;text-decoration:'+(x.same?'none':'line-through')+'">'+x.b+'</div>'+
   '<div style="font-size:17px;font-weight:800;color:'+col+';line-height:1.3">'+arrow+' '+x.a+'</div></div>';
 }).join('')+'</div>';
}

// ===== 調整方案：狀態與操作 =====
// 拉桿的當前值存在 c.plan.draft（跟著存檔走，教練切分頁不會掉）。
// c.plan.levers 才是「已採用」的方案——scenario()／報告書／追蹤線吃的是它。
function planDraft(c){var p=c.plan||{};return p.draft||{}}
function setLever(id,v){var c=activeCase();c.plan=c.plan||{};c.plan.draft=c.plan.draft||{};
 var x=n(v);if(id==='rate'&&(v===''||v===null))x='';c.plan.draft[id]=x;save();render();}
function clearDraft(){var c=activeCase();c.plan=c.plan||{};c.plan.draft={};save();render();}
function adoptRx(key){var c=activeCase();var rx=prescriptions(c);
 for(var i=0;i<rx.length;i++)if(rx[i].key===key){c.plan=c.plan||{};c.plan.draft=JSON.parse(JSON.stringify(rx[i].levers));save();render();return;}}
function adoptSolo(id){var c=activeCase();var r=solveLever(c,id,{});
 c.plan=c.plan||{};c.plan.draft={};c.plan.draft[id]=r.x;save();render();}
function adoptDraft(){var c=activeCase();c.plan=c.plan||{};
 c.plan.levers=JSON.parse(JSON.stringify(c.plan.draft||{}));
 // 舊欄位同步，避免報告書與 scenario() 各讀各的
 c.plan.retireDelay=n((c.plan.levers||{}).retire);
 save();render();}
function saveTrial(){var c=activeCase();c.plan=c.plan||{};c.plan.trials=c.plan.trials||[];
 if(c.plan.trials.length>=5){alert('最多存 5 個方案，請先刪掉一個。');return;}
 var d=JSON.parse(JSON.stringify(c.plan.draft||{}));
 c.plan.trials.push({label:'方案 '+String.fromCharCode(65+c.plan.trials.length),levers:d,gap:gapWith(c,d),at:new Date().toISOString().slice(0,10)});
 save();render();}
function useTrial(i){var c=activeCase();var t=(c.plan.trials||[])[i];if(!t)return;
 c.plan.draft=JSON.parse(JSON.stringify(t.levers||{}));save();render();}
function delTrial(i){var c=activeCase();(c.plan.trials||[]).splice(i,1);save();render();}
function renameTrial(i,v){var c=activeCase();var t=(c.plan.trials||[])[i];if(t){t.label=v;save();}}
function setUseAlloc(v){var c=activeCase();c.plan=c.plan||{};c.plan.useAllocReturn=!!v;save();render();}
function useAllocRate(){var c=activeCase();var al=allocInfo(c);if(!(al.totalPct>0))return;
 c.params.invReturn=+al.wRet.toFixed(2);save();render();}

// ===== 調整方案：畫面 =====
// 排版原則（2026/08/23 第二輪重排）：首屏只有「一張圖 ＋ 三個數字 ＋ 拉桿」，
// 其餘一律收合。教練打開這一頁的第一眼要是一張圖，不是一張報表。
function foldSec(title,hint,inner,open){
 return '<div class="sec"><details'+(open?' open':'')+'><summary style="cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:8px">'+
  '<span style="color:var(--amber2);font-weight:700;font-size:14px">'+title+'</span>'+
  (hint?'<span class="hint">'+hint+'</span>':'')+
  '<span style="flex:1"></span><span class="hint">展開 ▾</span></summary>'+
  '<div style="margin-top:12px">'+inner+'</div></details></div>';
}
function leverLabel(id,v){
 if(id==='rate')return (v===''||v==null)?'未指定':(+v).toFixed(2)+'%';
 if(id==='retire')return Math.round(n(v))+' 年';
 return (+n(v)).toFixed(1)+'%';
}
function leverSummary(set){
 var s=[];for(var i=0;i<LEVERS.length;i++){var id=LEVERS[i].id;if(set&&n(set[id]))s.push(LEVERS[i].name+' '+leverLabel(id,set[id]));}
 return s.length?s.join('、'):'未調整';
}

/** 首屏：三個數字 ＋ 主圖 ＋ 拉桿 ＋ 四張變化卡。圖與拉桿必須貼在一起，拉了要當場看到線動。 */
/* ============================================================
   願景時間軸主圖（調整方案 v2 首屏）
   ------------------------------------------------------------
   取代 gapChartSVG 成為 /plan 的首屏主圖。它要一眼回答三件事：
     ① 現況 vs 套用動作後的差距（灰虛線 / 金實線）
     ② 每一件選定的願景做不做得到（旗子）
     ③ 缺口出現在哪一年、急不急（十年分界）

   ⚠️ 旗子一定要同時有 ✓／✕ 符號：綠 #8fc0a3 與紅 #ef6f6f 在紅綠色盲下
      ΔE 只有 7.8（落在「必須加輔助編碼」的區間），光靠顏色分不出來。

   ⚠️ Y 軸下限一定要裁切：現況線常常掉到 −4,000 萬，照實際範圍畫會把
      「調整後」那條線壓成貼著頂端的一條平線——整張圖就沒重點了。
      被裁掉的部分在圖上用文字註明，不是默默切掉。
   ============================================================ */
function visionTimelineSVG(c,theme,idKey){
 var K=planChartColors(theme);
 var pb=projection(baseCase(c)), pa=projection(c);
 var W=980,H=348,L=58,R=18,T=66,B=34,pw=W-L-R,ph=H-T-B;
 var mx=0,realMn=0;
 pb.rows.concat(pa.rows).forEach(function(r){var v=r.total;realMn=Math.min(realMn,v);mx=Math.max(mx,v)});
 mx*=1.12; if(mx<=0)mx=1;
 var mn=Math.max(realMn*1.12,-mx*0.55),clipped=realMn<mn-0.5;
 var a0=n(c.profile.age)||40,aEnd=n(c.params.horizon)||85,span=Math.max(1,aEnd-a0);
 var X=function(a){return L+(a-a0)/span*pw};
 var Y=function(v){return T+ph-(Math.max(mn,Math.min(mx,v))-mn)/(mx-mn)*ph};
 var uid=(idKey||'vt');

 var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="願景歷程資產曲線" style="width:100%;height:auto;overflow:visible">';
 niceTicks(mn,mx,5).forEach(function(v){var y=Y(v);
  s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="'+(Math.abs(v)<1?K.ZERO:K.GRID)+'" stroke-width="'+(Math.abs(v)<1?1.4:1)+'"/>'+
   '<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" fill="'+K.TICK+'" font-size="10.5" text-anchor="end">'+cfAxis(v)+'</text>'});
 for(var ax=a0;ax<=aEnd;ax+=5)
  s+='<text x="'+X(ax).toFixed(1)+'" y="'+(H-11)+'" fill="'+K.TICK+'" font-size="10.5" text-anchor="middle">'+ax+'</text>';

 var x10=X(a0+10);
 if(x10<W-R)s+='<line x1="'+x10.toFixed(1)+'" y1="'+T+'" x2="'+x10.toFixed(1)+'" y2="'+(T+ph)+'" stroke="'+K.MUT+'" stroke-width="1" stroke-dasharray="3 4" opacity=".7"/>'+
  '<text x="'+(x10+5).toFixed(1)+'" y="'+(T+13)+'" fill="'+K.MUT+'" font-size="10">10 年</text>';

 var neg=pa.rows.filter(function(r){return r.total<0});
 if(neg.length){
  var d='M'+X(neg[0].age).toFixed(1)+' '+Y(0).toFixed(1);
  neg.forEach(function(r){d+=' L'+X(r.age).toFixed(1)+' '+Y(r.total).toFixed(1)});
  d+=' L'+X(neg[neg.length-1].age).toFixed(1)+' '+Y(0).toFixed(1)+' Z';
  s+='<path d="'+d+'" fill="'+K.GAP+'" fill-opacity="'+(K.dark?0.22:0.16)+'"/>';
 }
 function line(rows,col,wd,dash){
  return '<path d="'+rows.map(function(r,i){return (i?'L':'M')+X(r.age).toFixed(1)+' '+Y(r.total).toFixed(1)}).join(' ')+
   '" fill="none" stroke="'+col+'" stroke-width="'+wd+'" stroke-linejoin="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>'}
 var same=!pa.hasActions;
 if(!same)s+=line(pb.rows,K.BASE,2,'5 4');
 s+=line(pa.rows,same?K.BASE:K.AFT,2.4);

 var how=ok?'<span style="color:var(--ok)">✅ '+(hasDraft?'這組調整之後':'依目前假設')+'不會轉負。仍請確認下方「缺口組成與即時缺口」裡的保障與預備金。</span>'
  :(led.years<=1?'<b style="color:var(--warn)">現金流最快在 '+led.negAge+' 歲轉負，缺口沒有攤提空間，必須立即處理。</b>'

 var sliders=LEVERS.map(function(L){return leverSliderHTML(c,L.id,gate)}).join('');

/* ============================================================
   調整方案 v2 — 調整動作清單（c.actions[]）
   ------------------------------------------------------------
   Ray 的邏輯：補缺口的手段要記成「一條一條具體動作」，不是「支出砍 12.4%」
   這種比例。教練不填商品細節，只填「使用的工具」與「達到的效果」：
   年期／每月轉換的現金流／每年配息或分紅／增值速度。

   ⚠️⚠️ 三條地基語意，動這張表之前一定要讀完：

   1) 動作記的是「**相對現況的差額**」，不是絕對值。
      客戶原本就有的定期定額寫在 c.savings[]，這裡只記**增加的部分**。
      重複填 = 缺口憑空消失，跟企業主模組「公司股權寫進 c.assets」是同一種雷。

   2) 一致性規則：**所有流出走 pay*、所有流入走 get***。
      七個類別才能共用同一張表；「增加收入」與「刪減支出」都是流入，走 getMonthly。

   3) 每個動作**必須宣告資金來源 src**。這是唯一能看出「客戶根本沒錢做這些動作」
      的一格，區塊 3 的資金勾稽表就是靠它。

   本階段（區塊 1B）只做資料層與輸入介面，**完全不進任何試算**。
   動作要進 projection() 的分離池是區塊 2 的事。
   ============================================================ */

// 動作 id：批次新增時 uid() 會撞號（見家庭成員那次），所以自己帶序號。
var _actSeq=0;
function actId(){_actSeq++;return 'a'+Date.now().toString(36)+_actSeq.toString(36)}

var ACT_CATS=[
 {k:'income',   n:'增加工作收入', lane:'A', hint:'每月增加多少'},
 {k:'expense',  n:'刪減支出',     lane:'C', hint:'每月省下多少', ref:'expenses'},
 {k:'regular',  n:'定期定額',     lane:'B', hint:'每月投入、自帶報酬率'},
 {k:'lump',     n:'單筆投入',     lane:'B', hint:'一次投入、自帶報酬率'},
 {k:'liquidate',n:'資產變現',     lane:'B', hint:'填淨變現金額', ref:'assets'},
 {k:'loan',     n:'貸款取得資金', lane:'B', hint:'利率隱含在月付裡'},
 {k:'insure',   n:'購買保障',     lane:'B', hint:'保額會接回保障缺口'}
];
// 每個類別實際要填哪幾欄（其餘顯示「—」，不佔教練的注意力）
var ACT_FIELDS={
 income:   ['getSpan','getMonthly'],
 expense:  ['ref','getSpan','getMonthly'],
 regular:  ['paySpan','payMonthly','div','growth','src'],
 lump:     ['payFrom','payLump','div','growth','src'],
 liquidate:['ref','payFrom','getLump'],
 loan:     ['getLump','paySpan','payMonthly'],
 insure:   ['paySpan','payMonthly','cover']
};
function actCat(k){for(var i=0;i<ACT_CATS.length;i++)if(ACT_CATS[i].k===k)return ACT_CATS[i];return ACT_CATS[2]}
function actHas(a,f){return (ACT_FIELDS[a.cat]||[]).indexOf(f)>=0}

// 文字欄走 set()（不整頁 render，才不會打斷游標）；
// 數字與下拉走 setAction()（要 render，因為區塊 2 之後每一次改動都會重算主圖）。
function setAction(i,k,v,type){
 var c=activeCase();if(!c)return;var a=(c.actions||[])[i];if(!a)return;
 a[k]=(type==='num')?n(v):(type==='bool'?!!v:v);
 save();render();
}
function toggleAction(i){var c=activeCase();var a=(c.actions||[])[i];if(!a)return;a.on=(a.on===false);save();render()}
// 換類別之後年期要搬到「該類別實際會用的那一組」：
// income／expense 是流入走 get*，其餘走 pay*。不補的話換完類別年期欄會整排空掉。
function actFillSpan(c,a){
 var A=n(c.profile.age)||40, R=n(c.profile.retireAge)||65;
 if(actHas(a,'getSpan')){if(!n(a.getFrom))a.getFrom=A+1;if(!n(a.getTo))a.getTo=R;}
 if(actHas(a,'paySpan')||actHas(a,'payFrom')){if(!n(a.payFrom))a.payFrom=A+1;}
 if(actHas(a,'paySpan')&&!n(a.payTo))a.payTo=R;
 if(!n(a.startY))a.startY=n(a.payFrom)||n(a.getFrom)||A+1;
}
function setActionCat(i,v){
 var c=activeCase();var a=(c.actions||[])[i];if(!a)return;
 a.cat=v;a.ref='';                       // 換類別 ⇒ 指向的明細一定不再適用
 actFillSpan(c,a);
 save();render();
}

function actRefOpts(a,kind){
 var c=activeCase(),list=(kind==='assets'?c.assets:c.expenses)||[];
 var o='<option value="">— 請指定明細列 —</option>';
 list.forEach(function(x,i){
  var key=kind+':'+i, label=(x.name||'').trim()||(x.subCat||x.type||'（未命名）');
  var amt=kind==='assets'?n(x.amount||x.value):n(x.amount);
  o+='<option value="'+key+'" '+(a.ref===key?'selected':'')+'>'+esc(label)+'（'+fmt(amt)+'）</option>';
 });
 return o;
}
function actSrcOpts(a,idx){
 var c=activeCase();
 var base=[['surplus','月結餘'],['cash','現金水位'],['new','新增／自生']];
 var o=base.map(function(p){return '<option value="'+p[0]+'" '+(a.src===p[0]?'selected':'')+'>'+p[1]+'</option>'}).join('');
 (c.actions||[]).forEach(function(x,j){
  if(j===idx||!x.id)return;
  var v='act:'+x.id;
  o+='<option value="'+v+'" '+(a.src===v?'selected':'')+'>↳ '+esc((x.name||'').trim()||actCat(x.cat).n)+'</option>';
 });
 return o;
}

function actNum(i,k,v,ph){
 return '<input type="number" class="actyr" placeholder="'+(ph||'')+'" value="'+esc(v==null?'':v)+
  '" onchange="setAction('+i+',\'' + k + '\',this.value,\'num\')">';
}
function actMoney(i,k,v){
 return moneyCell('onchange="setAction('+i+',\'' + k + '\',this.value,\'num\')"',v);
}
var ACT_DASH='<span class="hint">—</span>';

function actionRowHTML(a,i,c){
 c=c||activeCase();
 var cat=actCat(a.cat), off=(a.on===false);
 var catSel='<select onchange="setActionCat('+i+',this.value)">'+ACT_CATS.map(function(x){
  return '<option value="'+x.k+'" '+(a.cat===x.k?'selected':'')+'>'+x.n+'</option>'}).join('')+'</select>';

 var toolCell = cat.ref
  ? '<select onchange="setAction('+i+',\'ref\',this.value)">'+actRefOpts(a,cat.ref)+'</select>'
  : '<input class="acttool" value="'+esc(a.tool||'')+'" placeholder="商品／管道（不進計算）" '+
    'oninput="setLive(\'actions:'+i+'\',\'tool\',this.value)" onchange="set(\'actions:'+i+'\',\'tool\',this.value)">';

 var span='';
 if(actHas(a,'paySpan')) span=actNum(i,'payFrom',a.payFrom,'起')+' – '+actNum(i,'payTo',a.payTo,'迄');
 else if(actHas(a,'getSpan')) span=actNum(i,'getFrom',a.getFrom,'起')+' – '+actNum(i,'getTo',a.getTo,'迄');
 else if(actHas(a,'payFrom')) span=actNum(i,'payFrom',a.payFrom,'歲');
 else span=ACT_DASH;

 var getCell = actHas(a,'getMonthly') ? actMoney(i,'getMonthly',a.getMonthly)
             : actHas(a,'getLump')    ? actMoney(i,'getLump',a.getLump)
             : ACT_DASH;
 var divCell = actHas(a,'div')
  ? actMoney(i,'divYear',a.divYear)+'<select style="margin-top:4px" onchange="setAction('+i+',\'divMode\',this.value)">'+
    '<option value="reinvest" '+(a.divMode!=='payout'?'selected':'')+'>再投入</option>'+
    '<option value="payout" '+(a.divMode==='payout'?'selected':'')+'>提領</option></select>'
  : ACT_DASH;
 var coverCell = actHas(a,'cover')
  ? actMoney(i,'cover',a.cover)+
    '<select style="margin-top:4px" onchange="setAction('+i+',\'coverKind\',this.value)">'+
    KINDS.map(function(k){return '<option '+(a.coverKind===k?'selected':'')+'>'+k+'</option>'}).join('')+'</select>'+
    '<select style="margin-top:4px" onchange="setAction('+i+',\'member\',this.value)">'+
    (c.members||[]).map(function(mm){return '<option '+((a.member||'')===mm.name?'selected':'')+'>'+esc(mm.name)+'</option>'}).join('')+'</select>'
  : ACT_DASH;

 var r1='<tr class="actrow'+(off?' off':'')+'">'+
  '<td><input type="checkbox" '+(off?'':'checked')+' onchange="toggleAction('+i+')" style="width:17px;height:17px;accent-color:var(--amber)"></td>'+
  '<td>'+catSel+'</td>'+
  '<td><input class="actname" value="'+esc(a.name||'')+'" placeholder="教練自己寫" '+
    'oninput="setLive(\'actions:'+i+'\',\'name\',this.value)" onchange="set(\'actions:'+i+'\',\'name\',this.value)"></td>'+
  '<td>'+toolCell+'</td>'+
  '<td class="actspan">'+span+'</td>'+
  '<td>'+(actHas(a,'payMonthly')?actMoney(i,'payMonthly',a.payMonthly):(actHas(a,'payLump')?actMoney(i,'payLump',a.payLump):ACT_DASH))+'</td>'+
  '<td>'+getCell+'</td>'+
  '<td>'+divCell+'</td>'+
  '<td>'+(actHas(a,'growth')?actNum(i,'growth',a.growth,'%'):ACT_DASH)+'</td>'+
  '<td>'+coverCell+'</td>'+
  '<td>'+(actHas(a,'src')?'<select onchange="setAction('+i+',\'src\',this.value)">'+actSrcOpts(a,i)+'</select>':ACT_DASH)+'</td>'+
  '<td>'+actNum(i,'startY',a.startY,'歲')+'</td>'+
  '<td class="acts"><button class="del" onclick="delRow(\'actions\','+i+')">✕</button></td></tr>';

 var warn='';
 if(cat.ref&&!a.ref) warn='<span style="color:var(--warn)">⚠ 尚未指到明細的某一列——具體刪減／變現哪一項是要跟客戶討論的，不能自由填。</span> ';
 if(a.cat==='liquidate') warn+='<span class="hint">變現金額請填<b>淨額</b>：租金收入消失、貸款提前清償、交易稅費都要先扣掉。</span> ';
 var ctx=off?'':actRowCtx(c,a,i);
 var r2='<tr class="actnote'+(off?' off':'')+'"><td></td><td colspan="12">'+ctx+warn+
  '<input value="'+esc(a.note||'')+'" placeholder="備註（例如：扣款來源＝月結餘、先生轉職年薪由 120 萬提升至 138 萬）" '+
  'oninput="setLive(\'actions:'+i+'\',\'note\',this.value)" onchange="set(\'actions:'+i+'\',\'note\',this.value)" '+
  'style="width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:3px 2px;font-size:12px;color:var(--mut)"></td></tr>';
 return r1+r2;
}

/* ============================================================
   動作清單的「當下脈絡」
   ------------------------------------------------------------
   Ray：「我要新增定期定額，可是不知道它現在的十字表，是不是就得點進去？
   像這些基本資料應該都要在當下就能看得到。」

   兩層：
     ① 表格上方一條固定的「可用資源條」——月結餘／現金水位／保障缺口／負債比
     ② 每一列依類別顯示只有那一類才需要的數字（刪減支出看該項刪完剩多少、
        定期定額看月結餘還夠不夠、單筆看現金水位、保障看該險種缺口）
   目的只有一個：**教練不用跳頁就填得對**。
   ============================================================ */
function actionCtx(c){
 var m=metrics(c),L=actionLedger(c);
 var cov=coverageGaps(c),covGap=0;
 cov.forEach(function(r){if(r.gap>0)covGap+=r.gap});
 var debtRatio=m.assetTotal?m.debtTotal/m.assetTotal:0;
 return {m:m,led:L,covGap:covGap,debtRatio:debtRatio,
  emReq:m.monthExp*(n(c.params.emergencyMonths)||6)};
}
function actionCtxBar(c){
 var X=actionCtx(c),L=X.led;
 function cell(lab,val,sub,bad){
  return '<div class="actctx'+(bad?' bad':'')+'"><div class="l">'+lab+'</div>'+
   '<div class="v">'+val+'</div><div class="s">'+sub+'</div></div>'}
 return '<div class="actctxbar">'+
  cell('月結餘 可再投入',fmt(L.left),'現況 '+fmt(L.base)+'，已排 '+fmt(L.newInv+L.prem),L.monthBad)+
  cell('現金水位 可動用',fmt(L.cashLeft),'預備金門檻 '+fmt(X.emReq),L.cashBad)+
  cell('保障缺口 未補',cfAxis(X.covGap),X.covGap>0?'保障類動作的保額會扣這裡':'已無缺口',X.covGap>0)+
  cell('負債比',(X.debtRatio*100).toFixed(0)+'%','負債 '+cfAxis(X.m.debtTotal)+' / 資產 '+cfAxis(X.m.assetTotal),X.debtRatio>0.6)+
  '</div>';
}

// 每一列的行內脈絡：只講這一類才需要知道的數字。
function actRowCtx(c,a,i){
 var X=actionCtx(c),L=X.led,out=[];
 function ok(t){out.push('<span class="ctxok">'+t+'</span>')}
 function warn(t){out.push('<span class="ctxwarn">⚠ '+t+'</span>')}
 function mut(t){out.push('<span class="hint">'+t+'</span>')}

 if(a.cat==='expense'){
  var e=refRow(c,a.ref);
  if(e){var now=n(e.amount)/12,cut=n(a.getMonthly),left=now-cut;
   mut('此項目前每月 '+fmt(now));
   if(cut>0){ if(left<0)warn('刪減額超過該項金額，最多只能省 '+fmt(now));
              else ok('刪減後每月剩 '+fmt(left)); } }
 }
 else if(a.cat==='income'){
  var w=sum(c.incomes,function(x){return x.type==='工作'?n(x.amount):0})/12;
  mut('目前工作收入每月 '+fmt(w));
  if(n(a.getMonthly)>0)ok('提升後 '+fmt(w+n(a.getMonthly))+'（+'+(w?Math.round(n(a.getMonthly)/w*100):0)+'%）');
 }
 else if(a.cat==='regular'||a.cat==='insure'){
  mut('現況月結餘 '+fmt(L.base)+'，這組動作排完剩 '+fmt(L.left));
  if(L.monthBad)warn('每月已超支 '+fmt(-L.left)+'，這一筆扣不出來');
  if(a.cat==='regular'){
   var sv=(c.savings||[]).filter(function(x){return n(x.amount)>0});
   if(sv.length)mut('客戶原有的儲蓄理財投入：'+sv.slice(0,3).map(function(x){
     return esc((x.name||x.subCat||'未命名'))+' '+fmt(n(x.amount)/12)+'/月'}).join('、')+
     (sv.length>3?' 等 '+sv.length+' 筆':'')+'　←　這裡只填<b>增加的部分</b>');
  }
  if(a.cat==='insure'){
   var kd=a.coverKind||'壽險',pm=(primaryMember(c)||{}).name,who=(a.member||'').trim()||pm;
   var g=0;coverageGaps(c).forEach(function(r){if(r.member===who&&r.kind===kd)g=r.gap});
   if(g>0)warn(who+' 的「'+kd+'」還缺 '+cfAxis(g)+'（此動作的保額已計入）');
   else ok(who+' 的「'+kd+'」已無缺口');
  }
 }
 else if(a.cat==='lump'){
  mut('可動用現金 '+fmt(L.cash)+'，這組動作排完剩 '+fmt(L.cashLeft));
  if(L.cashBad)warn('低於緊急預備金門檻 '+fmt(X.emReq));
 }
 else if(a.cat==='liquidate'){
  var as=refRow(c,a.ref);
  if(as){mut('此資產帳面 '+fmt(aVal(as)));
   var rent=sum(c.incomes,function(x){return (x.type==='理財'&&/租/.test(x.name||''))?n(x.amount):0});
   if(rent>0)warn('注意：目前有租金收入 '+fmt(rent)+'/年，賣掉之後會消失');}
 }
 else if(a.cat==='loan'){
  mut('目前負債 '+cfAxis(X.m.debtTotal)+'，負債比 '+(X.debtRatio*100).toFixed(0)+'%');
  if(X.debtRatio>0.6)warn('負債比已偏高');
 }
 return out.length?'<div class="actrowctx">'+out.join('　')+'</div>':'';
}

/* ============================================================
   調整方案 v2 首屏：主圖 ＋ 三個數字 ＋ 判語 ＋ 動作開關
   ------------------------------------------------------------
   ⚠️ 主數字刻意是「改善了多少」而不是「補平了沒」。
      Ray：「財務規劃不是一次就確保終身沒問題，而是每年動態調整……
      特別是十年後的部分，有些許缺口都是正常的……只要能比原本更優化就可以。」
      一片紅字的缺口讀起來像失敗，但那其實是常態。
   ============================================================ */
function planImprove(c){
 var pb=projection(baseCase(c)),pa=projection(c);
 var imp=pb.shortPV>0.5?Math.max(0,Math.round((1-pa.shortPV/pb.shortPV)*100)):100;
 var okCnt=0,tot=0;
 pa.events.forEach(function(e){tot++;if(e.ok)okCnt++});
 var near=0,far=0,urg=pa.urgAge;
 if(pa.shortPV>0.5){if(urg!=null&&(urg-n(c.profile.age))<=10)near=pa.shortPV;else far=pa.shortPV;}
 return {pb:pb,pa:pa,imp:imp,okCnt:okCnt,total:tot,near:near,far:far,urg:urg};
}

function planHeroV2(c){
 var R=planImprove(c),pb=R.pb,pa=R.pa;

 var big='<div class="big3 v2big">'+

    (pb.shortPV<=0.5?'無缺口':cfAxis(pb.shortPV)+' <span style="opacity:.6">→</span> '+(pa.shortPV<=0.5?'<span style="color:var(--ok)">已補平</span>':cfAxis(pa.shortPV)))+'</div>'+
   '<div class="hint" style="display:block">'+(pb.shortPV<=0.5?'現況即可支撐':(pa.hasActions?'改善 '+R.imp+'%':'尚未排任何動作'))+'</div></div>'+
  '<div class="b"><div class="l">願景達成</div>'+
   '<div class="v" style="color:'+(R.okCnt===R.total?'var(--ok)':'var(--amber2)')+'">'+R.okCnt+' / '+R.total+' 件</div>'+
   '<div class="hint" style="display:block">選定的願景中做得到幾件</div></div></div>';

 var ff=pa.firstFail,vd;
 if(!ff){
  vd='<div class="v2verdict good">✅ <b>選定的願景全部做得到。</b>仍請確認下方的資金勾稽與保障缺口。</div>';
 }else{
  var after=pa.events.filter(function(e){return e.age>ff.age&&!e.ok}).length;
  var body= ff.kind==='legacy'
   ? '基本人生目標都做得到了，<b style="color:#ff9f9f">卡在「傳承」</b> — 期末資產 '+cfAxis((pa.rows[pa.rows.length-1]||{}).total)+'，目標 '+cfAxis(ff.amount)+'。'
   : '照這組動作走，你做得到 <b>'+ff.age+' 歲以前</b>的所有事；第一個做不到的是 <b style="color:#ff9f9f">'+ff.age+' 歲的「'+esc(ff.name)+'」</b>'+(after?'，之後還有 <b>'+after+'</b> 件會落空。':'。');
  vd='<div class="v2verdict">'+body;
  if(R.near>0.5)vd+='<div style="margin-top:6px;color:#ff9f9f">🔴 <b>缺口在 '+R.urg+' 歲就出現（十年內）'+cfAxis(R.near)+'</b>：沒有攤提空間，必須立即處理。</div>';
  if(R.far>0.5)vd+='<div style="margin-top:6px;color:var(--amber2)">🟡 <b>缺口出現在 '+R.urg+' 歲（十年以後）'+cfAxis(R.far)+'</b>：'+
   (R.total-R.okCnt>1?'時點不急，但目前有 <b>'+(R.total-R.okCnt)+' 件</b>願景落空 — 先把它們補回來，再談逐年微調。'
                     :'屬動態調整區，逐年檢視即可，比原本更優化就算有效。')+'</div>';
  vd+='</div>';
 }

 var acts=c.actions||[];
 var chips=acts.length
  ? acts.map(function(a,i){
     var amt=(a.cat==='income'||a.cat==='expense')?'+'+fmt(a.getMonthly)+'/月'

     return '<span class="v2chip'+(a.on===false?'':' on')+'" onclick="toggleAction('+i+')">'+

 return '<div class="sec"><h4>願景歷程 <span class="hint">灰線＝現況、金線＝套用動作後。旗子 ✓ 做得到、✕ 做不到</span></h4>'+
  big+
  '<div style="margin:12px 0 2px">'+visionTimelineSVG(c,'dark','plan')+'</div>'+

   '<div class="v2chips">'+chips+'</div></div></div>';
}

/* ---------- 缺口配額對帳 ----------
   ⚠️ 兩區的數學關係不同，不能長得一樣：
      補缺口三條線是**加總**（共用一個總配額，堆疊起來填）；
      改缺口三根是**替代**（各自回答「單獨動這根要調到多少」），刻意不相加。 */
function quotaAddOf(c){
 var pb=projection(baseCase(c));
 if(pb.shortPV<=0.5)return {need:0};
 var r=pb.rate/100,yrs=Math.max(1,(n(c.profile.retireAge)||65)-(n(c.profile.age)||40)),af=0;
 for(var i=0;i<yrs;i++)af+=Math.pow(1+r,-(i+1));
 return {need:pb.shortPV/af/12};
}
function laneDoneOf(c){
 var out={A:0,B:0,C:0},rAge=n(c.profile.retireAge)||65,a0=n(c.profile.age)||40;
 (c.actions||[]).forEach(function(a){
  if(a.on===false)return;
  var lane=actCat(a.cat).lane;
  if(a.cat==='income'||a.cat==='expense')out[lane]+=n(a.getMonthly);
  else if(a.cat==='regular'||a.cat==='insure'||a.cat==='loan')out[lane]+=n(a.payMonthly);
  else{var yy=Math.max(1,rAge-(n(a.payFrom)||a0));out[lane]+=(n(a.payLump)||n(a.getLump))/yy/12;}
 });
 return out;
}
function quotaV2HTML(c){
 var q=quotaAddOf(c),need=q.need||0,done=laneDoneOf(c);
 var pa=projection(c);
 var LANES=[
  {k:'A',n:'工作收入提升',s:'每月薪資增加',col:'var(--ok)'},
  {k:'B',n:'理財效率提升',s:'月定額＋單筆＋不動產變現',col:'var(--amber)'},
  {k:'C',n:'支出刪減',s:'逐項討論，不用 % 抓',col:'var(--teal)'}];
 var got=LANES.reduce(function(t,L){return t+(done[L.k]||0)},0),left=Math.max(0,need-got);
 var stack=LANES.map(function(L){var wpc=need>0?Math.min(100,(done[L.k]||0)/need*100):0;
  return wpc>0?'<i style="width:'+wpc.toFixed(1)+'%;background:'+L.col+';margin-right:2px"></i>':''}).join('');

 var addHTML='<div class="qrow" style="padding-top:0"><div class="qhead">'+
  '<b style="font-size:14px">總配額 '+fmt(need)+' ／月</b><span class="hint">到 '+(n(c.profile.retireAge)||65)+' 歲為止</span></div>'+
  '<div class="qnums">已排 <b class="done">'+fmt(got)+'</b>'+(left>0?'　·　還差 <b class="left">'+fmt(left)+'</b>':'　·　<b class="done">已達參考量體</b>')+'</div>'+
  '<div class="bar" style="height:9px">'+stack+'</div>'+
  ((left<=0&&pa.shortPV>0.5)?'<div class="qnums" style="margin-top:7px;color:var(--warn);line-height:1.6">⚠ 量體已達，但實際試算仍有缺口 <b>'+cfAxis(pa.shortPV)+'</b>。'+
    '<span class="hint">配額是把現值缺口平均攤到退休前的<b>估算量體</b>；實際動作有各自的年期與複利，兩邊本來就不會相等 — <b>判準以上面那張圖為準</b>。</span></div>':'')+
  '</div>'+
  LANES.map(function(L){var v=done[L.k]||0;
   return '<div class="qrow"><div class="qhead">'+
    '<b><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:'+L.col+';margin-right:6px"></span>'+L.n+'</b>'+
    '<b style="'+(v>0?'color:var(--ok)':'color:var(--mut2);font-weight:400;font-size:11.5px')+'">'+(v>0?fmt(v)+' ／月':'尚未排入')+'</b></div>'+
    '<div class="qnums"><span class="hint">'+L.s+'</span></div></div>'}).join('');

 var gate=leverGate(c),cutHTML;
 if(pa.shortPV<=0.5){
  cutHTML='<div class="qrow" style="padding-top:0"><b style="color:var(--ok)">目前這組動作已經補平，不需要動願景。</b>'+
   '<div class="qnums"><span class="hint">桶子不用變小 — 這是最好的結果。</span></div></div>';
 }else{
  var CUTS=[{k:'retire',n:'延後退休',s:'工作期延長、退休期縮短'},
            {k:'retireLevel',n:'降低退休水準',s:'退休期支出調降'},
            {k:'vision',n:'壓縮願景',s:'往「可接受的最低」壓'}];
  cutHTML='<div class="qrow" style="padding-top:0"><span class="hint">以下三選一 — <b style="color:var(--amber2)">它們是替代方案，不能相加</b>。數字＝在目前已排的動作之上，單獨動這一根要調到多少。</span></div>'+
   CUTS.map(function(Cc){
    var r=solveLever(c,Cc.k,{},gate),txt,cl='var(--amber2)';
    if(r.blocked){txt='此階段鎖住';cl='var(--mut2)';}
    else if(!r.needed){txt='不需要動';cl='var(--ok)';}
    else if(!r.feasible){txt='拉到上限仍補不平';cl='var(--warn)';}
    else txt=leverLabel(Cc.k,r.x);
    return '<div class="qrow"><div class="qhead"><b>'+Cc.n+'</b><b style="color:'+cl+'">'+esc(txt)+'</b></div>'+
     '<div class="qnums"><span class="hint">'+Cc.s+(r.blocked&&gate.reason[Cc.k]?'　'+esc(gate.reason[Cc.k]):'')+'</span></div></div>'}).join('');
 }

 return '<div class="quotaGrid">'+
  '<div class="qcol add"><b>補缺口</b><div class="sub">把水加進來 — 收入與支出兩個模型</div>'+addHTML+'</div>'+
  '<div class="qcol cut"><b>改缺口</b><div class="sub">把桶子變小 — 調整願景本身</div>'+cutHTML+'</div></div>'+
  '<div class="hint" style="margin-top:10px;line-height:1.8">'+
   '<b>補缺口</b>三條線是<b>加總</b>關係，共用一個總配額 — 那是把現值缺口攤到退休前的<b>參考量體</b>，給教練一個「大概要生出多少」的錨，不是精確等式。<br>'+
   '<b>改缺口</b>三根是<b>替代</b>關係，各自回答「單獨動這一根要調到多少」，<b>刻意不相加</b>。<br>'+
   'v1 的求解器程式碼全部留著，只是從「產出方案」降級成「產出配額」 — 真正決定缺口的是動作清單。</div>';
}

/* ---------- 資金勾稽 ----------
   ⚠️「未來缺口沒補平」與「當下每月排不出錢」是兩件事，畫面上一定要分開兩格。
      前者是 Ray 說的動態調整區（琥珀）；後者是這個月就執行不了（紅字）。
      混成一條會讓教練把執行不了的方案交出去。依 Ray 拍板：軟提示、不擋採用。 */
function actionLedger(c){
 var m=metrics(c);
 // ⚠️ metrics() 沒有 monthInc，月結餘要用 save（＝年收入−年支出）÷12。
 //    c.savings[]（儲蓄理財投入）不進總支出，所以 save 已經是「可自由運用的結餘」。
 var base=n(m.save)/12;
 var addInc=0,cutExp=0,newInv=0,prem=0,lumpNeed=0,lumpGot=0;
 (c.actions||[]).forEach(function(a){
  if(a.on===false)return;
  if(a.cat==='income')addInc+=n(a.getMonthly);
  else if(a.cat==='expense')cutExp+=n(a.getMonthly);
  else if(a.cat==='regular')newInv+=n(a.payMonthly);
  else if(a.cat==='insure')prem+=n(a.payMonthly);
  else if(a.cat==='loan'){newInv+=n(a.payMonthly);lumpGot+=n(a.getLump);}
  else if(a.cat==='lump')lumpNeed+=n(a.payLump);
  else if(a.cat==='liquidate')lumpGot+=n(a.getLump);
 });
 var left=base+addInc+cutExp-newInv-prem;
 var emReq=(n(m.monthExp)||0)*(n(c.params.emergencyMonths)||6);
 var cash=n(m.cash),cashLeft=cash+lumpGot-lumpNeed;
 return {base:base,addInc:addInc,cutExp:cutExp,newInv:newInv,prem:prem,left:left,
  cash:cash,lumpGot:lumpGot,lumpNeed:lumpNeed,cashLeft:cashLeft,emReq:emReq,
  monthBad:left<0,cashBad:cashLeft<emReq};
}
function ledgerV2HTML(c){
 var L=actionLedger(c),pa=projection(c);
 function row(l,v,col){return '<div class="ledrow"><span>'+l+'</span><span'+(col?' style="color:'+col+'"':'')+'>'+fmt(v)+'</span></div>'}
 var g='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px" class="ledgrid">'+
  '<div class="led '+(L.monthBad?'bad':'okk')+'"><b style="font-size:13px;color:var(--amber2)">每月資金</b>'+
   row('現況月結餘',L.base)+row('＋ 新增工作收入',L.addInc,'var(--ok)')+row('＋ 刪減支出',L.cutExp,'var(--ok)')+
   row('− 新增投入',L.newInv,'var(--warn)')+row('− 新增保費',L.prem,'var(--warn)')+
   '<div class="ledrow tot"><span>剩餘結餘</span><span style="color:'+(L.monthBad?'var(--gap2)':'var(--ok)')+'">'+fmt(L.left)+'</span></div></div>'+
  '<div class="led '+(L.cashBad?'bad':'okk')+'"><b style="font-size:13px;color:var(--amber2)">單筆資金（現金水位）</b>'+
   row('可動用現金',L.cash)+row('＋ 變現／貸款取得',L.lumpGot,'var(--ok)')+row('− 單筆投入',L.lumpNeed,'var(--warn)')+
   '<div class="ledrow tot"><span>剩餘現金</span><span style="color:'+(L.cashBad?'var(--gap2)':'var(--ok)')+'">'+fmt(L.cashLeft)+'</span></div>'+

   ------------------------------------------------------------
   Ray：「新增一個動作，現在的十字表就直接改變。」

function crossTableAfter(c){
 var x=crossTable(c),acts=planActionsOn(c);
 if(!acts.length)return null;
 var addWork=0,cutLive=0,addSave=0,addIns=0,addLoanPay=0,lumpBorrow=0,liquidated=0;
 acts.forEach(function(a){
  if(a.cat==='income')addWork+=n(a.getMonthly)*12;
  else if(a.cat==='expense')cutLive+=n(a.getMonthly)*12;
  else if(a.cat==='regular')addSave+=n(a.payMonthly)*12;
  else if(a.cat==='insure')addIns+=n(a.payMonthly)*12;
  else if(a.cat==='loan'){addLoanPay+=n(a.payMonthly)*12;lumpBorrow+=n(a.getLump);}
  else if(a.cat==='liquidate')liquidated+=n(a.getLump);
  // lump（單筆投入）＝流動資產內部搬家，十字表的四個總數不變，故不處理
 });
 var y={};for(var k in x){if(x.hasOwnProperty(k))y[k]=x[k];}
 y.incWork=x.incWork+addWork;
 y.incTotal=x.incTotal+addWork;
 y.expLive=Math.max(0,x.expLive-cutLive);
 y.expIns=x.expIns+addIns;
 y.expLoan=x.expLoan+addLoanPay;
 y.expTotal=Math.max(0,x.expTotal-cutLive+addIns+addLoanPay);
 y.saveInvest=x.saveInvest+addSave;
 // 變現＝固定資產換成可投資（總額以淨變現金額計）；貸款＝可投資與負債同增
 y.aSelf=Math.max(0,x.aSelf-liquidated);
 y.aInv=x.aInv+liquidated+lumpBorrow;
 y.aTotal=x.aTotal+lumpBorrow;
 y.dInv=x.dInv+lumpBorrow;
 y.dTotal=x.dTotal+lumpBorrow;
 y.net=y.aTotal-y.dTotal;
 y.monthBal=(y.incTotal-y.expTotal)/12;
 return y;
}
