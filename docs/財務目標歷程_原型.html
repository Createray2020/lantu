/* ── 六、退休與教育 · 退休三段式金流 ─────────────────────────────────────── */
// 退休不是一個時點，是三段：還在工作、剛退休、老後。三段的收支長得完全不一樣。
function rRetireFlow(c){
 var proj=projection(c),ra=n(c.profile.retireAge),a0=n(c.profile.age);
 var from=Math.max(a0,ra-3),to=Math.min(n(c.params.horizon)||85,ra+12);
 var rows=proj.rows.filter(function(r){return r.age>=from&&r.age<=to;});
 if(!rows.length)return '';
 var W=740,H=200,pad=44,bw=Math.max(4,(W-pad*2)/rows.length*0.42);
 var vals=[];rows.forEach(function(r){vals.push(r.work+r.fin,-(r.expense+r.debt+r.goal));});vals.push(0);
 var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),span=(mx-mn)||1;
 function X(i){return pad+(i+0.5)/rows.length*(W-pad*2);}
 function Y(v){return pad+(1-(v-mn)/span)*(H-pad*2);}
 var zeroY=Y(0);
 var bars=rows.map(function(r,i){
  var inc=r.work+r.fin,out=r.expense+r.debt+r.goal,x=X(i);
  return '<rect x="'+(x-bw-1).toFixed(1)+'" y="'+Math.min(Y(inc),zeroY).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.abs(Y(inc)-zeroY).toFixed(1)+'" fill="#6f8f74" rx="1.5"/>'+
   '<rect x="'+(x+1).toFixed(1)+'" y="'+Math.min(Y(-out),zeroY).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.abs(Y(-out)-zeroY).toFixed(1)+'" fill="#c8a08c" rx="1.5"/>';
 }).join('');
 var ticks=rows.map(function(r,i){return (i%2===0||r.age===ra)?'<text x="'+X(i).toFixed(0)+'" y="'+(H-8)+'" fill="#8a97a0" font-size="9.5" text-anchor="middle"'+(r.age===ra?' font-weight="800" fill="#b07d3d"':'')+'>'+r.age+'</text>':'';}).join('');
 var raIdx=rows.map(function(r){return r.age;}).indexOf(ra);
 var raLine=raIdx>=0?'<line x1="'+X(raIdx).toFixed(1)+'" y1="'+pad+'" x2="'+X(raIdx).toFixed(1)+'" y2="'+(H-pad)+'" stroke="#b07d3d" stroke-dasharray="4 3"/><text x="'+X(raIdx).toFixed(1)+'" y="'+(pad-6)+'" fill="#b07d3d" font-size="10" font-weight="700" text-anchor="middle">退休 '+ra+' 歲</text>':'';
 var tbl=rows.map(function(r){
  var out=r.expense+r.debt+r.goal;
  return '<tr'+(r.age===ra?' style="background:#faf3e6"':'')+'><td>'+r.age+(r.age===ra?' 退休':'')+'</td><td style="text-align:right">'+fmt(r.work)+'</td><td style="text-align:right">'+fmt(r.fin)+'</td><td style="text-align:right">'+fmt(out)+'</td><td style="text-align:right;color:'+(r.bal>=0?'#3f7d54':'#b05a4a')+'">'+fmt(r.bal)+'</td></tr>';
 }).join('');
 return rSub('退休前後的三段式金流（'+from+'–'+to+' 歲）')+
  '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px;display:block">'+rAxisY(mn,mx,pad,W,H)+
   '<line x1="'+pad+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-pad)+'" y2="'+zeroY.toFixed(1)+'" stroke="#d9b8ac"/>'+bars+raLine+ticks+'</svg>'+
  '<div style="font-size:12px;color:#33474e;margin-top:4px"><span style="color:#6f8f74;font-weight:700">■ 收入（工作＋理財）</span>　<span style="color:#b0836a;font-weight:700">■ 支出（生活＋負債＋目標）</span></div>'+
  rNote('退休那一年綠色柱會忽然縮短——工作收入停掉，只剩理財收入。這張圖真正要看的是：綠柱縮短之後，橘柱有沒有跟著縮，以及中間那段差距要靠多少資產去填。')+
  rFold('退休前後逐年金流明細','<table><tr><th>年齡</th><th>工作收入</th><th>理財收入</th><th>年支出</th><th>年度結餘</th></tr>'+tbl+'</table>');
}

/* ── 六、退休與教育 · 子女教育逐階段 ─────────────────────────────────────── */
function rEduDetail(c){
 var ed=(c.education||[]).filter(function(e){return n(e.annual)>0||n(e.years)>0;});
 if(!ed.length)return '';
 var g=n(c.params.tuitionGrowth)/100,a0=n(c.profile.age);
 var rows=ed.map(function(e){
  var s=n(e.startIn),yy=n(e.years),an=n(e.annual),t=0;
  for(var k=0;k<yy;k++)t+=an*Math.pow(1+g,s+k);
  return {child:e.child||'子女',stage:e.stage||'',school:e.schoolType||'',annual:an,years:yy,startAge:a0+s,total:t};
 });
 var tblRows=rows.map(function(r){
  return '<tr><td>'+esc(r.child)+'</td><td>'+esc(r.stage)+(r.school?'（'+esc(r.school)+'）':'')+'</td><td>'+r.startAge+' 歲起 '+r.years+' 年</td>'+
   '<td style="text-align:right">'+fmt(r.annual)+'</td><td style="text-align:right">'+fmt(r.total)+'</td></tr>';
 }).join('');
 return rSub('子女教育金逐階段')+
  rAmtBars(rows.map(function(r,i){return {label:r.child+(r.stage?' · '+r.stage:''),val:r.total,note:r.startAge+' 歲起 '+r.years+' 年',color:RCOL[(i+2)%8]};}),' 元')+
  rNote('金額是把今日學費依每年 '+(g*100).toFixed(1)+'% 的上漲率推到實際就讀那幾年之後的合計（終值）。越晚就讀的階段，同樣的學校會貴得越多。')+
  rFold('教育金逐階段明細','<table><tr><th>子女</th><th>階段</th><th>期間</th><th>年費用(現值)</th><th>合計(終值)</th></tr>'+tblRows+'</table>');
}

/* ── 八、保單檢查報告（整章） ───────────────────────────────────────────── */
// 五欄比對表（項目｜HAVE｜NEED｜狀況｜調整方向）的淺色版。
// 深色版在 checkupTable()，兩邊的欄位定義一模一樣，只是換皮。
function rCheckupTable(rows,empty){
 if(!rows||!rows.length)return rEmpty(empty||'尚無可比對的項目。');
 var spanCol=rows.some(function(r){return r.span;});
 var head='<tr><th>項目</th>'+(spanCol?'<th>期間</th>':'')+'<th style="text-align:right">現在保單 HAVE</th><th style="text-align:right">現在需求 NEED</th><th>狀況</th><th>調整方向</th></tr>';
 var body=rows.map(function(r){
  var col=r.state==='mid'?'#3f7d54':(r.state==='low'?'#b05a4a':'#b5852f');
  return '<tr><td>'+esc(r.item)+'</td>'+(spanCol?'<td style="color:#5a6b72;font-size:11.5px">'+esc(r.span||'—')+'</td>':'')+
   '<td style="text-align:right">'+(r.have>0?fmt(r.have)+' '+esc(r.unit):'—')+'</td>'+
   '<td style="text-align:right;color:#b07d3d">'+(r.need>0?fmt(r.need)+' '+esc(r.unit):'—')+'</td>'+
   '<td style="color:'+col+';font-weight:700;white-space:nowrap">'+esc(r.label||'')+'</td>'+
   '<td style="color:'+(r.state==='mid'?'#5a6b72':col)+'">'+esc(checkupDirText(r).replace(/<[^>]*>/g,''))+'</td></tr>';
 }).join('');
 return '<table>'+head+body+'</table>';
}
// 全家保障地圖：成員 × 險種的紅黃綠。這張是「一眼看出誰沒保到什麼」，比任何表都快。
function rCoverageMatrix(c){
 var mtx=coverageMatrix(c);
 if(!mtx.rows.length)return '';
 var MK={g:['✓','#3f7d54','#e8f1ea'],y:['△','#b5852f','#faf1de'],r:['✕','#b05a4a','#f7e7e3'],n:['—','#a9b3b6','#f4f4f2']};
 var head='<tr><th>成員</th>'+mtx.cols.map(function(x){return '<th style="text-align:center;font-size:11.5px">'+esc(x)+'</th>';}).join('')+'</tr>';
 var body=mtx.rows.map(function(r){
  return '<tr><td style="white-space:nowrap">'+esc(r.name)+(r.role?' <span style="color:#5a6b72;font-size:11px">'+esc(r.role)+'</span>':'')+'</td>'+
   r.cells.map(function(cl){var mk=MK[cl.s]||MK.n;
    return '<td style="text-align:center;background:'+mk[2]+';color:'+mk[1]+';font-weight:800">'+mk[0]+'</td>';}).join('')+'</tr>';
 }).join('');
 return rSub('全家保障地圖')+'<div style="overflow-x:auto"><table style="min-width:520px">'+head+body+'</table></div>'+
  rNote('<b style="color:#3f7d54">✓ 足額</b>　<b style="color:#b5852f">△ 不足（已備不到需求的六成）</b>　<b style="color:#b05a4a">✕ 未保</b>　<span style="color:#8a9aa2">— 不適用</span>');
}
function rPolicyCheckup(c){
 var pm=premiumCheckup(c),cov=coverageCheckupRows(c),pay=paybackCheckupRows(c);
 var all=[].concat(pm.rows,cov,pay);
 // ⚠️ 不能只看 all.length：premiumCheckup() 永遠回兩列（保障型／理財型保費），
 //    全新客戶因此永遠「有列」，只是每一列都是 0 對 0。要看的是有沒有任何一個數字。
 if(!all.some(function(r){return n(r.need)>0||n(r.have)>0;}))
  return rEmpty('尚未登錄保單與保障需求，這一章會在資料補齊後自動出現。');
 var todo=all.filter(function(r){return r.state!=='mid'&&(r.need>0||r.have>0);}).length;
 var mtx=coverageMatrix(c),applic=0,green=0;
 mtx.rows.forEach(function(r){r.cells.forEach(function(cl){if(cl.s!=='n'){applic++;if(cl.s==='g')green++;}});});
 var covPct=applic?Math.round(green/applic*100):0;
 var premPct=pm.income>0?Math.round(pm.ratio*1000)/10:0;
 // 保費結構
 var Y=(new Date()).getFullYear();
 var byYear=premiumByYear(c,Y,10);
 var yRows=byYear.map(function(r){return '<tr><td>'+r.year+'</td><td style="text-align:right">'+fmt(r.total)+'</td><td style="text-align:right">'+fmt(r.protect)+'</td><td style="text-align:right">'+fmt(r.invest)+'</td></tr>';}).join('');
 var premPie=(pm.protect>0||pm.invest>0)?rPie([{name:'保障型',pct:pm.protect},{name:'理財型',pct:pm.invest}]):'';
 // $領回
 var pb=policyPaybacks(c);
 var pbRows=pb.map(function(b){
  return '<tr><td>'+esc(b.policy)+'</td><td>'+esc(b.type)+'</td><td>'+esc(b.receiver)+'</td><td>'+b.ageFrom+(b.ageTo!==b.ageFrom?'–'+b.ageTo:'')+' 歲</td>'+
   '<td style="text-align:right">'+fmt(b.amount)+'</td><td style="text-align:right">'+fmt(paybackTotal(b))+'</td></tr>';
 }).join('');
 var pbTotal=sum(pb,function(b){return paybackTotal(b);});
 return rBig([
   ['年繳保費佔年收入',(pm.income>0?premPct+'%':'—'),premPct>13?'#b05a4a':'#0d2b45','保障型 '+fmt(pm.protect)+'／理財型 '+fmt(pm.invest)],
   ['待調整項目',todo+' 項',todo?'#b05a4a':'#3f7d54','共比對 '+all.length+' 項'],
   ['保障覆蓋率',covPct+'%',covPct>=80?'#3f7d54':'#b5852f','綠格 '+green+'/'+applic],
  ])+
  '<div style="margin:4px 0 12px">'+checkupChartSVG(c,'light')+'</div>'+
  rNote('這張圖把「現在的保單」拿去對「現在的需求」：虛線是需求 100%，長條沒碰到線就是不足，衝過頭太多就是重複投保。保障不是越多越好，是剛好對得上。')+
  rSub('1 保費')+rCheckupTable(pm.rows)+
  rSub('2 保障')+rCheckupTable(cov,'尚未建立保障需求。')+
  rNote('「住院醫療」的金額為定額給付＋實支實付的每日病房費。')+
  rSub('3 $領回')+rCheckupTable(pay,'尚未建立退休或理財目標。')+
  rCoverageMatrix(c)+
  rSub('保費結構')+(premPie||rEmpty('尚未登錄保費。'))+
  rFold('未來十年的保費（依生效日與繳別推算）','<table><tr><th>年度</th><th>合計</th><th>保障型</th><th>理財型</th></tr>'+yRows+'</table>')+
  (pb.length?rSub('保單可領回（$生存／$滿期／$祝壽／$年金／$投資）')+
    rBig([['可領回總額',fmt(pbTotal)+' 元','#b07d3d'],['筆數',pb.length+' 筆']])+
    rFold('領回明細','<table><tr><th>保單</th><th>型別</th><th>領受人</th><th>期間</th><th>每次</th><th>合計</th></tr>'+pbRows+'</table>')
   :'');
}

/* ── 十一、傳承規劃 ─────────────────────────────────────────────────────── */
// legacyNeed() 一直都在算，但報告書從來沒有印出來過——客戶看不到自己交代過的那件事。
function rLegacy(c){

   '遺產稅為簡化估算，實際以稽徵機關核定為準。');

/* ── 十三、其他規劃面向（職涯・婚姻・信用・海外） ───────────────────────── */

    ])+

/* ── 十四、缺口帳 ───────────────────────────────────────────────────────── */
// 「總缺口」＝現值缺口 shortPV，不是把退休缺口＋保障缺口＋目標缺口相加。
// 相加會重複計算同一筆錢，而且沒有折現，數字會大到沒有意義。
function rGapLedger(c){
 var g=gapPV(c),rn=retireNeed(c),m=metrics(c);
 if(!(g>0))return rSub('缺口帳')+'<p style="color:#3f7d54;font-size:13px">依目前的收入、支出與資產推算，這份規劃在期間內<b>沒有出現現金流缺口</b>——每一年的支出都支應得過去。</p>';
 var lifeNeedPV=Math.max(1,g+Math.max(0,m.net));
 return rSub('缺口帳：還差多少')+
  rBig([
   ['現值缺口',fmt(g)+' 元','#b05a4a','折現到今天的金額'],
   ['願景達成度',Math.round(Math.max(0,1-g/lifeNeedPV)*100)+'%'],
   ['退休缺口',fmt(rn.gap)+' 元',rn.gap>0?'#b05a4a':'#3f7d54'],
  ])+

/* ── 十五、真實追蹤與人生護照 ───────────────────────────────────────────── */
function rTracking(c){
 var tk=(c.tracking||[]).filter(function(t){return n(t.net)!==0||n(t.age)!==0;});
 var pr=((c.passport||{}).result)||null;
 if(!tk.length&&!pr)return '';
 var out='';
 if(tk.length){
  var proj=projection(c),rows=proj.rows;
  var W=740,H=210,pad=46;
  var all=rows.map(function(r){return r.net;}).concat(tk.map(function(t){return n(t.net);})).concat([0]);
  var mx=Math.max.apply(null,all),mn=Math.min.apply(null,all),span=(mx-mn)||1;
  var a0=rows[0].age,aN=rows[rows.length-1].age;
  function X(ag){return pad+(ag-a0)/((aN-a0)||1)*(W-pad*2);}
  function Y(v){return pad+(1-(v-mn)/span)*(H-pad*2);}
  var line=rows.map(function(r,i){return (i?'L':'M')+X(r.age).toFixed(1)+' '+Y(r.net).toFixed(1);}).join(' ');
  var tline=tk.length>1?'<path d="'+tk.map(function(t,i){return (i?'L':'M')+X(n(t.age)).toFixed(1)+' '+Y(n(t.net)).toFixed(1);}).join(' ')+'" fill="none" stroke="#0d2b45" stroke-width="2.2"/>':'';
  var dots=tk.map(function(t){return '<circle cx="'+X(n(t.age)).toFixed(1)+'" cy="'+Y(n(t.net)).toFixed(1)+'" r="4" fill="#0d2b45"/>';}).join('');
  var ticks='';for(var i=0;i<rows.length;i+=5)ticks+='<text x="'+X(rows[i].age).toFixed(0)+'" y="'+(H-8)+'" fill="#8a97a0" font-size="9.5" text-anchor="middle">'+rows[i].age+'</text>';
  var last=tk[tk.length-1];
  var simAt=rows.filter(function(r){return r.age===n(last.age);})[0];
  var diff=simAt?n(last.net)-simAt.net:0;
  out+=rBig([
    ['最近一次實際淨值',fmt(last.net)+' 元','#0d2b45',n(last.year)+' 年 · '+n(last.age)+' 歲'],
    ['與模擬的差距',(diff>=0?'+':'')+fmt(diff)+' 元',diff>=0?'#3f7d54':'#b05a4a'],
    ['已追蹤',tk.length+' 個年度'],
   ])+
   '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px;display:block">'+rAxisY(mn,mx,pad,W,H)+
    '<line x1="'+pad+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-pad)+'" y2="'+Y(0).toFixed(1)+'" stroke="#d9b8ac" stroke-dasharray="4 4"/>'+
    '<path d="'+line+'" fill="none" stroke="#7f97ac" stroke-width="2.2"/>'+tline+dots+ticks+
    '<text x="'+(W-pad)+'" y="'+(Y(rows[rows.length-1].net)-6).toFixed(1)+'" fill="#7f97ac" font-size="10.5" font-weight="700" text-anchor="end">模擬</text>'+
    '<text x="'+X(n(last.age)).toFixed(1)+'" y="'+(Y(n(last.net))-9).toFixed(1)+'" fill="#0d2b45" font-size="10.5" font-weight="700" text-anchor="middle">實際</text>'+
    '</svg>'+
   rNote('灰藍線是規劃當初的模擬走勢，深藍點是每年實際結算的淨值。兩條線貼在一起代表計畫正在被執行；持續往下偏離，就是該回頭檢視假設或執行方式的訊號。')+
   rFold('逐年實際淨值','<table><tr><th>年度</th><th>年齡</th><th>實際淨資產</th></tr>'+
     tk.map(function(t){return '<tr><td>'+n(t.year)+'</td><td>'+n(t.age)+' 歲</td><td style="text-align:right">'+fmt(t.net)+'</td></tr>';}).join('')+'</table>');
 }
 if(pr){
  // ⚠️ 退休是「每月」、其餘四項是「一次性總額」——量綱不同，不能畫在同一個共用刻度上。
  //    42,000 對 1,200 萬畫在一起，退休那根柱子的長度會是 0.35%，等於整根消失。
  //    退休單獨放一個數字，四項一次性的才畫柱。
  var lump=[
   ['購屋','負擔得起這個價位的房子',pr.house.price],
   ['購車','負擔得起這個價位的車',pr.car.price],
   ['子女','每位養到 '+n(pr.support.raiseToAge)+' 歲的總花費',pr.support.perChildCost],
   ['旅遊','可累積的旅遊基金',pr.travel.fund],
  ].filter(function(x){return n(x[2])>0;});
  var rm=n(pr.retire.presentMonthly);
  if(lump.length||rm>0){
   out+=rSub('人生護照 · 五面向能力分析')+
    (rm>0?rBig([['退休後每月可支應',fmt(Math.round(rm))+' 元','#b07d3d','現值 · '+n(pr.retire.retireAge)+' 歲退休']]):'')+
    (lump.length?rAmtBars(lump.map(function(x,i){return {label:x[0],val:x[2],note:x[1],color:RCOL[(i+1)%8]};}),' 元'):'')+
    rNote('這是你當初在人生護照裡自己填的五個面向，換算成「以目前的存錢速度，各自能做到什麼程度」。它是這份完整規劃的起點，放在最後是為了對照：走了一圈之後，哪幾項已經被正式排進計畫了。');
  }
 }
 return out;
}

(function(){

  if(!EMBED){load();render();return;}
  // role=client → 客戶端唯讀檢視（財務儀表／規劃報告）；否則教練端編輯。
  var CLIENT=/[?&]role=client/.test(location.search);
  document.documentElement.classList.add('embed');
  if(CLIENT){var _rs=document.getElementById('roleSw');if(_rs)_rs.style.display='none';}
  document.querySelectorAll('.top .tbtn').forEach(function(b){if(/匯出|匯入/.test(b.textContent||''))b.style.display='none';});
  // embed 模式＝單一年度版本編輯器，只該有一筆 case；把側欄的新增/切換客戶關掉，
  // 否則 save() 推的與畫面上正在編的會是不同筆，使用者的輸入會被靜默覆蓋掉。
  document.documentElement.classList.add('embed-single');
  // 同源限制：只接受父層 origin 的訊息，也只往父層 origin 送。
  // 舊版入口只比對 e.source、出口用 '*'，任何第三方網站 iframe 這份檔案就能收走整份客戶財務資料。
  var PARENT_ORIGIN=(function(){
    try{
      var ref=document.referrer;
      if(ref){var u=new URL(ref);return u.origin;}
    }catch(e){}
    return location.origin;
  })();
  function toParent(msg){try{parent.postMessage(msg,PARENT_ORIGIN);}catch(e){}}
  // embed：save() 不寫 localStorage，改把「目前正在編輯的那一筆」回傳父層（父層存回 DB）；客戶唯讀不回存。
  save=function(){try{var cur=activeCase();if(!CLIENT&&cur)toParent({type:'lantu:save',data:cur});}catch(e){}};
  var inited=false;
  // 介面縮放（老花友善）。這份是 px 寫死的版面，rem 縮放對它無效，
  // 用 zoom 才會字與版面一起等比放大（Chrome/Safari/Edge/Firefox 126+ 都支援）。
  function applyScale(v){
    v=Math.round(Number(v)||100);
    if(!(v>=100&&v<=200))v=100;
    document.documentElement.style.zoom=(v/100);
  }
  // 到期唯讀：把 save() 關掉，並在頂欄掛一條提示。
  // 只做「不再往父層送」——不改任何輸入框的 disabled，因為 v12 的欄位是整頁重繪出來的，
  // 逐一 disable 會在每次 render 後失效，反而給人「有時能改有時不能」的錯覺。
  var READONLY=false;
  var _save=save;
  save=function(){if(READONLY)return;return _save.apply(this,arguments);};
  // note：唯讀的原因由父層給（期限到期／共同執案的協作教練）。
  // 寫死一句「使用期限已到期」的話，被邀來幫看的教練會看到一則與他無關的警告，
  // 然後跑去找管理員延長一個根本沒到期的期限。
  var RO_NOTE_DEFAULT='唯讀模式：使用期限已到期，這份規劃目前的修改不會被儲存。請聯繫管理員延長期限。';
  function applyReadOnly(on,note){
    READONLY=!!on;
    var bar=document.getElementById('lantuRoBar');
    var text=note||RO_NOTE_DEFAULT;
    if(READONLY&&!bar){
      bar=document.createElement('div');
      bar.id='lantuRoBar';
      bar.style.cssText='position:sticky;top:0;z-index:99;background:#5b1f22;color:#ffd7d8;padding:6px 12px;font-size:13px;font-weight:700';
      bar.textContent=text;
      document.body.insertBefore(bar,document.body.firstChild);
    }else if(READONLY&&bar){bar.textContent=text;
    }else if(!READONLY&&bar){bar.remove();}
  }
  window.addEventListener('message',function(e){
    if(e.source!==parent)return;
    if(e.origin&&PARENT_ORIGIN&&e.origin!==PARENT_ORIGIN)return;
    var m=e.data;if(!m)return;
    if(m.type==='lantu:uiscale'){applyScale(m.scale);return;}
    if(m.type!=='lantu:init')return;
    if(m.uiScale)applyScale(m.uiScale);
    applyReadOnly(m.readOnly,m.readOnlyNote);
    /* 客戶編號（YYMM＋三碼流水號）：只用來印在三份可交付文件的表頭，不進 case 資料、不參與任何計算。
       刻意存成全域而不是塞進 c.*，因為它是 DB 的欄位、不是規劃內容——寫進 case 會被存回 plan.data，
       之後改名／改號就會有兩份真相。*/
    window.LANTU_CLIENT_CODE=m.clientCode||null;
    var c=migrateCase(m.data||{});
    app.cases=[c];app.activeId=c.id;app.role=CLIENT?'client':'coach';app.activeTab=CLIENT?'analysis':'data';
    inited=true;render();
  });
  toParent({type:'lantu:ready'});
  setTimeout(function(){if(!inited)render();},1500);
})();
</script>

var REMOTE = /[?&]embed=1/.test(location.search);
var IS_CLIENT_VIEW = /[?&]role=client/.test(location.search);
LN_REMOTE_STATE = { notes: [], session: null, access: 'owner' };

function C(){ return (typeof activeCase==='function') ? activeCase() : null; }
function allNotes(){
 if(REMOTE) return LN_REMOTE_STATE.notes;
 var c=C(); if(!c)return []; if(!c.notes)c.notes=[]; return c.notes;
}
function sess(){
 if(REMOTE) return LN_REMOTE_STATE.session;

}

/* DB 的欄位名 ↔ 這支檔案內部用的欄位名。
   刻意做成一層對映而不是整份改名：本機模式與 remote 模式共用同一套畫面程式，
   只有這兩支函式知道 DB 長什麼樣。 */
function fromRow(r){
 return {
  id:r.id, block:r.blockKey, kind:r.kind, text:r.body, visible:!!r.visible,
  by:r.authorName||null, access:r.authorAccess||'owner',
  sessId:r.sessionId||null, at:fmtAt(r.createdAt)
 };
}
function toInput(n){ return { blockKey:n.block, kind:n.kind, body:n.text, visible:!!n.visible }; }
function fmtAt(v){
 try{ var d=new Date(v); return p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
 catch(e){ return ''; }
}
function toParentLN(msg){
 try{
  var origin=(function(){ try{ var r=document.referrer; if(r) return new URL(r).origin; }catch(e){} return location.origin; })();
  parent.postMessage(msg, origin);
 }catch(e){}
}
function nid(){ return 'n'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36); }
function persist(){ try{ if(typeof save==='function') save(); }catch(e){} }

 return LN.role==='client' ? !!CLIENT_WRITABLE[key] : true;
}

function W(v){ try{ return (typeof wan==='function') ? wan(v) : Math.round(n(v)/10000); }catch(e){ return Math.round((v||0)/10000); } }
function F(v){ try{ return fmt(v); }catch(e){ return String(v); } }

function B(s){ return '<b>'+s+'</b>'; }
/* 現值缺口住在 projection() 的回傳裡，metrics() 只把它掛在 .proj 底下 */
/* 開場釘住的還原點：整份 case 的深拷貝，但不含註記與場次本身
   （否則按下還原會把這一場談出來的東西一起抹掉——那是誰都不想要的） */
function snapCase(c){
 try{
  var keep={notes:c.notes, sess:c.sess, sessions:c.sessions};
  c.notes=undefined; c.sess=undefined; c.sessions=undefined;
  var j=JSON.stringify(c);
  c.notes=keep.notes; c.sess=keep.sess; c.sessions=keep.sessions;
  return j;
 }catch(e){ return null; }
}
function snapMetrics(c){
 try{ var m=metrics(c); return { shortPV:num(m.proj&&m.proj.shortPV), net:num(m.net) }; }
 catch(e){ return {shortPV:0, net:0}; }
}
LN.restore=function(sessId){
 var c=C(); if(!c) return;
 if(REMOTE){
  if(!confirm('把資料回到那一場諮詢開始時的狀態？\n（註記會保留；還原本身也會記一版，中間的編輯回得去）')) return;
  toParentLN({ type:'lantu:session', op:'restore', sessionId:sessId });
  flash('還原中…');
  return;
 }
 var s = (c.sess&&c.sess.id===sessId) ? c.sess : (c.sessions||[]).filter(function(x){return x.id===sessId})[0];
 if(!s||!s.snap){ flash('這一場沒有可還原的快照'); return; }
 if(!confirm('把資料回到 '+(s.date||'')+' '+(s.start||'')+' 諮詢開始時的狀態？\n（這一場記下的註記會保留）')) return;
 var keep={notes:c.notes, sess:c.sess, sessions:c.sessions};
 var old=JSON.parse(s.snap);
 Object.keys(c).forEach(function(k){ if(k!=='notes'&&k!=='sess'&&k!=='sessions') delete c[k]; });
 Object.keys(old).forEach(function(k){ c[k]=old[k]; });
 c.notes=keep.notes; c.sess=keep.sess; c.sessions=keep.sessions;
 persist(); redraw(); flash('已回到該場諮詢開始時的狀態');
};

/* ───────── 註記帶 ───────── */
function d(key){
 if(!LN.draft[key]) LN.draft[key]={kind:'decision', visible:false, open:false, text:''};
 return LN.draft[key];
}
function esc2(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]}); }

function barHTML(key){
 var mine=allNotes().filter(function(x){return x.block===key && canSee(x)});
 var st=d(key), writable=canWrite(key);
 if(!writable && !mine.length) return '';

 var alert = isAlert(key) && LN.role!=='client' && !mine.length;
 var pre = prefillOf(key);

 var head='<div class="lnhead" onclick="LN.toggle(\''+key+'\')">'+
   '<span class="lnpen">✎</span><span>註記</span>'+
   (mine.length ? '<span class="lncnt">已記 '+mine.length+' 則</span>'
                : (alert ? '<span class="lnneed">建議記一句</span>'
                         : '<span class="lnpeek">'+esc2(strip(pre).slice(0,30))+'…</span>'))+
   '<span class="lnsp"></span><span class="lnfold">'+(st.open?'收起 ▴':'展開 ▾')+'</span></div>';

 var body='';
 if(st.open){
  if(writable){
   var tags=KINDS.map(function(k){
     return '<button class="lntag'+(st.kind===k[0]?' on':'')+'" title="'+k[2]+'" onclick="LN.kind(\''+key+'\',\''+k[0]+'\')">'+k[1]+'</button>';
   }).join('');
   var vis = canVisible()
    ? '<label class="lnchk"><input type="checkbox" '+(st.visible?'checked':'')+' onchange="LN.vis(\''+key+'\',this.checked)"> 客戶可見<span class="lnhint">（預設關）</span></label>'
    : '<label class="lnchk lock" title="'+(LN.role==='viewer'?'唯讀協作教練的註記不會流到客戶端':'客戶寫的註記不會印進報告書')+'"><input type="checkbox" disabled> 客戶可見<span class="lnhint">（'+(LN.role==='viewer'?'協作教練不可勾':'客戶不可勾')+'）</span></label>';
   body+='<div class="lntags">'+tags+'</div>'+
     (pre?'<div class="lnpre">💬 '+pre+'</div>':'')+
     '<textarea class="lnta" id="lnta_'+key+'" placeholder="'+(LN.role==='client'?'補充說明…':'接著寫…')+'" oninput="LN.typing(\''+key+'\',this.value)">'+esc2(st.text)+'</textarea>'+
     '<div class="lnrow">'+vis+'<span class="lnsp"></span>'+
     '<button class="lnbtn pri" onclick="LN.add(\''+key+'\')">記下</button></div>';
  }
  if(mine.length){
   body+='<div class="lnlist">'+mine.map(function(x){
    var cls=x.access==='client'?' cli':(x.access==='viewer'?' other':'');
    var del=(x.access===LN.role||LN.role==='owner'&&x.access==='owner')
      ? '<button class="lnx" title="刪除" onclick="LN.del(\''+x.id+'\')">✕</button>' : '';
    return '<div class="lnitem'+cls+'"><span class="lnpill '+x.kind+'">'+KN[x.kind]+'</span>'+
      '<span class="lntx">'+esc2(x.text)+(x.by?' <span class="lnby">· '+esc2(x.by)+'</span>':'')+
      '<span class="lnat">'+esc2(x.at||'')+'</span></span>'+
      (LN.role==='client'?'':'<span class="lneye '+(x.visible?'on':'off')+'" title="'+(x.visible?'客戶可見':'僅對內')+'">'+(x.visible?'👁':'🔒')+'</span>')+
      del+'</div>';
   }).join('')+'</div>';
  }
 }
 return '<div class="lnwrap'+(alert?' alert':'')+'">'+head+'<div class="lnopen'+(st.open?'':' hide')+'">'+body+'</div></div>';
}
function strip(s){ return String(s||'').replace(/<[^>]+>/g,''); }
function isAlert(key){
 var c=C(); if(!c) return false;
 try{
  if(key==='coverage.five') return gapLines(c).length>0;
  if(key==='plan.gap'||key==='plan.quota'||key==='plan.vision') return shortPVof(c)>0;
  if(key==='retire.flow'){ var r=retireNeed(c); return num(r.gap!=null?r.gap:r.shortage)>0; }
 }catch(e){}
 return false;
}

/* ───────── 掛載（零侵入：render 後掃 DOM） ───────── */
function mount(){
 var root=document.getElementById('app'); if(!root) return;
 LN.mountedKeys=[];
 var tab=(window.app&&app.dataTab)||'';
 if(window.app&&app.activeTab==='report'){ try{ mountReport(); }catch(e){} mountSessBar(); return; }
 if(!(window.app&&app.activeTab==='data')) { mountSessBar(); return; }

 var secs=[].slice.call(root.querySelectorAll('.sec'));
 MOUNTS().forEach(function(m){
  if(m.tab!==tab) return;
  var host=null;
  for(var i=0;i<secs.length;i++){
   if(secs[i].__lnUsed) continue;
   if(m.match==null){ host=secs[i]; break; }
   var h=secs[i].querySelector('h4, summary');
   var t=(h?(h.textContent||''):'').replace(/\s+/g,' ').trim();
   if(t.indexOf(m.match)>=0){ host=secs[i]; break; }
  }
  if(!host) return;
  host.__lnUsed=true;
  var html=barHTML(m.key);
  if(!html) return;
  var w=document.createElement('div');
  w.innerHTML=html;
  host.appendChild(w.firstChild);
  LN.mountedKeys.push(m.key);
 });

 // 保單列級：在保單分頁替每張保單加一顆 ✎

/* ───────── 客戶報告書：註記貼在對應章節下面 ─────────
   刻意不集中成一章——集中會變成一份「顧問備忘錄」，貼在章節下才像是在解釋那一段。
   只印勾了「客戶可見」的；主責教練以外的人寫的永遠不會走到這裡（visible 恆為 false）。 */
var CHAPTER_MAP = [
 {chap:'收支與資產結構', keys:['fin.hub','fin.income','fin.expense','fin.asset','fin.liability']},
 {chap:'財務目標歷程',   keys:['goals.list','intent.main','intent.issues','lifestyle.main']},
 {chap:'退休與教育需求', keys:['retire.flow','retire.timing','retire.expenses','retire.pension','edu.main']},
 {chap:'風險保障缺口',   keys:['coverage.five','coverage.map','coverage.diag']},
 {chap:'保單檢查報告',   keys:['coverage.checkup','coverage.policies']},
 {chap:'稅賦分析',       keys:['tax.income','tax.estate']},
 {chap:'傳承規劃',       keys:['legacy.main','biz.exit']},
 {chap:'投資風險屬性',   keys:['risk.main','credit.main']},
 {chap:'規劃執行建議',   keys:['plan.vision','plan.actions','plan.quota','plan.funding','plan.gap']}
];
function mountReport(){
 var root=document.getElementById('app'); if(!root) return;
 var h2s=[].slice.call(root.querySelectorAll('h2'));
 if(!h2s.length) return;
 // 先清掉上一輪插的，避免重複
 [].slice.call(root.querySelectorAll('.lnrp')).forEach(function(e){ e.parentNode.removeChild(e); });

 CHAPTER_MAP.forEach(function(m){
  var host=null;
  for(var i=0;i<h2s.length;i++){ if((h2s[i].textContent||'').indexOf(m.chap)>=0){ host=h2s[i]; break; } }
  if(!host) return;
  var vis=allNotes().filter(function(x){ return x.visible && m.keys.indexOf(x.block)>=0; });
  if(!vis.length) return;
  // 插在「下一個 h2 之前」＝這一章的結尾
  var stop=host.nextElementSibling, last=host;
  while(stop && stop.tagName!=='H2'){ last=stop; stop=stop.nextElementSibling; }
  var box=document.createElement('div');
  box.className='lnrp';
  box.innerHTML=vis.map(function(x){
   return '<div class="lnrpn"><b>顧問註記　</b>'+esc2(x.text)+'</div>';
  }).join('');
  last.parentNode.insertBefore(box, last.nextSibling);
 });

 // 諮詢紀要：把最近一場的待辦印成一段
 var recent=(C()&&(C().sessions||[])[0])||null;
 if(recent){
  var h=null;
  for(var i=0;i<h2s.length;i++){ if((h2s[i].textContent||'').indexOf('執行行動清單')>=0){ h=h2s[i]; break; } }
  var todos=allNotes().filter(function(x){ return x.kind==='todo' && x.sessId===recent.id; });
  if(h && todos.length){
   var stop=h.nextElementSibling, last=h;
   while(stop && stop.tagName!=='H2'){ last=stop; stop=stop.nextElementSibling; }
   var box2=document.createElement('div'); box2.className='lnrp';
   box2.innerHTML='<div class="lnrph">'+(recent.date||'')+' 諮詢後的追蹤事項</div>'+
     '<ol class="lnrpo">'+todos.map(function(x){return '<li>'+esc2(x.text)+'</li>'}).join('')+'</ol>';
   last.parentNode.insertBefore(box2, last.nextSibling);
  }
 }
}

/* ───────── 對外 API ───────── */
LN.toggle=function(k){ d(k).open=!d(k).open; redraw(); };
LN.open=function(k){ if(!d(k).open){ d(k).open=true; redraw(); } };   // 冪等：連按不會反而收起來
LN.kind=function(k,v){ d(k).kind=v; redraw(); };
LN.vis=function(k,v){ d(k).visible=v; };
LN.typing=function(k,v){ d(k).text=v; };

LN.add=function(k){
 var st=d(k), txt=(st.text||'').trim();
 if(!txt){ flash('先寫點什麼'); return; }
 var s=sess();
 var draftNote={ block:k, kind:st.kind, text:txt, visible: canVisible() && !!st.visible };
 if(REMOTE){
  // 樂觀更新：先畫出來，父層存完會用 lantu:notes 把真的那一列推回來覆蓋。
  toParentLN({ type:'lantu:note', op:'add', input: toInput(draftNote) });
  LN_REMOTE_STATE.notes = LN_REMOTE_STATE.notes.concat([{
   id:'tmp_'+nid(), block:k, kind:st.kind, text:txt,
   visible:draftNote.visible, by:meName(), access:LN.role, sessId:s?s.id:null, at:stamp(), pending:true
  }]);
 }else{
  allNotes().push({
   id:nid(), block:k, kind:st.kind, text:txt,
   visible: draftNote.visible,                 // 非主責一律 false（資料層強制）
   by: meName(), access: LN.role,
   sessId: s?s.id:null,
   at: stamp()
  });
  persist();
 }
 st.text=''; st.visible=false;
 redraw();
 flash(s?'已記入這一場諮詢':'已記入「日常維護」');

LN.del=function(id){
 var arr=allNotes(), i=-1;
 for(var j=0;j<arr.length;j++) if(arr[j].id===id) i=j;
 if(i<0) return;
 if(!confirm('刪除這則註記？')) return;
 if(REMOTE){
  toParentLN({ type:'lantu:note', op:'del', noteId:id });
  LN_REMOTE_STATE.notes = LN_REMOTE_STATE.notes.filter(function(x){return x.id!==id});
 }else{
  arr.splice(i,1); persist();
 }
 redraw();
};

LN.session=function(){
 if(LN.role!=='owner'){ flash('只有主責教練能開始／結束諮詢'); return; }
 if(REMOTE && LN_REMOTE_STATE.access!=='owner'){ flash('只有主責教練能開始／結束諮詢'); return; }
 var c=C(); if(!c) return;
 if(!sess()){
  var loose=allNotes().filter(function(x){return !x.sessId});
  var adopt = loose.length ? confirm('上次諮詢後你記了 '+loose.length+' 則，要帶進這一場當議程嗎？') : false;
  if(REMOTE){
   toParentLN({ type:'lantu:session', op:'start', adoptLoose:adopt });
   flash('正在開場…已釘住目前的規劃版本');
   return;
  }
  c.sess={ id:'s'+Date.now().toString(36), start:hhmm(), date:today(),
           before: snapMetrics(c), snap: snapCase(c) };
  if(adopt) loose.forEach(function(x){ x.sessId=c.sess.id; });
  persist(); redraw(); flash('已釘住目前的規劃版本，這就是還原點');
 }else{
  openPick();
 }
};

/* 結束諮詢：批次勾「客戶可見」 */
function openPick(){
 var c=C(), s=c.sess;
 var ds=allNotes().filter(function(x){return x.sessId===s.id && x.kind==='decision'});
 if(!ds.length){ finish(); return; }
 var m=document.getElementById('lnMask')||mkMask();
 m.querySelector('.lnmodal').innerHTML=

  ds.map(function(x){
   var lock=x.access!=='owner';
   return '<label class="lnpick"'+(lock?' style="opacity:.5"':'')+'><input type="checkbox" data-nid="'+x.id+'" '+(x.visible?'checked':'')+(lock?' disabled':'')+'>'+
    '<span>'+esc2(x.text)+'<span class="lnsrc">來自：'+esc2(nameOf(x.block))+(lock?'　🔒 '+esc2(x.by)+' 寫的，不可對客戶公開':'')+'</span></span></label>';
  }).join('')+
  '<div class="lnwarn">⚠️ 勾選的內容會印進帶公司抬頭的客戶文件。<b>不得含商品推薦或投資建議</b>。</div>'+
  '<div class="lnrow" style="justify-content:flex-end">'+
   '<button class="lnbtn" onclick="LN.closeMask()">取消</button>'+
   '<button class="lnbtn pri" onclick="LN.finish()">產生摘要</button></div>';
 m.classList.add('on');
}
LN.finish=function(){
 var m=document.getElementById('lnMask');
 [].slice.call(m.querySelectorAll('.lnpick input')).forEach(function(cb){
  if(cb.disabled) return;
  var arr=allNotes();
  for(var i=0;i<arr.length;i++) if(arr[i].id===cb.dataset.nid) arr[i].visible=cb.checked;
 });
 finish();
};
function finish(){
 var c=C(); if(!c) return;
 var s=sess(); if(!s) return;
 if(REMOTE){
  // 批次勾選的結果一起送出去；伺服器端定案可見性 → 產 review → 產 action_items。
  var ids=[];
  var mask=document.getElementById('lnMask');
  if(mask) [].slice.call(mask.querySelectorAll('.lnpick input')).forEach(function(cb){
   if(!cb.disabled && cb.checked) ids.push(cb.dataset.nid);
  });
  toParentLN({ type:'lantu:session', op:'end', sessionId:s.id, input:{ visibleNoteIds:ids } });
  LN.closeMask();
  flash('摘要產生中…待辦會進追蹤');
  return;
 }
 if(!c.sessions) c.sessions=[];
 s.end=hhmm();
 s.after=snapMetrics(c);
 s.notes=allNotes().filter(function(x){return x.sessId===s.id}).length;
 c.sessions.unshift(s);
 c.sess=null;
 persist(); LN.closeMask(); redraw();
 LN.summary(s);
 flash('摘要已產生；待辦已進追蹤');
}
LN.closeMask=function(){ var m=document.getElementById('lnMask'); if(m) m.classList.remove('on'); };

/* ───────── 摘要 ───────── */
LN.summary=function(s){
 var c=C(); if(!c) return;
 s = (s && s.id) ? s : (c.sess || (c.sessions||[])[0]);
 var scope = s ? allNotes().filter(function(x){return x.sessId===s.id}) : allNotes();
 var g={decision:[],basis:[],todo:[]};
 scope.forEach(function(x){ g[x.kind].push(x); });
 var blocks={}; scope.forEach(function(x){ blocks[x.block]=1; });

 var m=document.getElementById('lnMask')||mkMask();
 m.querySelector('.lnmodal').innerHTML=
  '<h3>'+(s?(s.date||today()):today())+' 諮詢摘要</h3>'+
  '<div class="lnhint" style="margin-bottom:14px">'+(s?((s.start||'')+(s.end?'–'+s.end:'')+' · '):'')+
   '客戶：'+esc2(c.profile.name)+'</div>'+
  '<div class="lnkpis">'+
   kpi('這次動了', Object.keys(blocks).length, '個區塊')+
   kpi('產生待辦', g.todo.length, '項，已進追蹤')+
   gapKPI2(c, s)+
  '</div>'+
  grp('◆ 決定', g.decision, '勾了客戶可見的會印進報告書')+
  grp('◆ 依據', g.basis, '')+
  grp('◆ 待辦', g.todo, '直接進 action_items 追蹤')+
  '<div class="lnrow" style="margin-top:16px">'+
   '<button class="lnbtn pri" onclick="LN.flash(\'已存進客戶的諮詢時間軸\')">存成諮詢紀錄</button>'+
   '<button class="lnbtn" onclick="window.print()">匯出 PDF</button>'+
   '<button class="lnbtn" onclick="LN.copy()">複製摘要（貼 LINE）</button>'+
   '<span class="lnsp"></span><button class="lnbtn" onclick="LN.closeMask()">關閉</button>'+
  '</div>'+
  '<pre class="lncopy" id="lnCopy" style="display:none"></pre>';
 m.classList.add('on');
};
function kpi(l,v,d2){ return '<div class="lnkpi"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="d">'+d2+'</div></div>'; }
/* Ray 的核心命題：評判標準是「比原本更優化」，不是「補平」。
   所以摘要的第三格不是「缺口多少」，是「這一場改善了多少」。 */
function gapKPI2(c, s){
 var now=shortPVof(c);
 var before = s && s.before ? num(s.before.shortPV) : null;
 if(before==null || before===now){
  return kpi('總缺口', (now>0?'<span style="color:var(--gap2)">'+W(now)+'</span>':'<span style="color:var(--ok)">0</span>')+
    ' <span style="font-size:13px;color:var(--mut2)">萬</span>', now>0?'萬元':'目前無缺口');
 }
 var d=before-now, better=d>0;
 return kpi('總缺口',
  '<span style="color:var(--gap2)">'+W(before)+'</span>'+
  ' <span style="font-size:14px;color:var(--mut2)">→</span> '+
  '<span style="color:'+(better?'var(--ok)':'var(--gap2)')+'">'+W(now)+'</span>',
  (better?'萬元 · 改善 '+W(d)+' 萬':'萬元 · 增加 '+W(-d)+' 萬'));
}
function grp(title, arr, hint){
 return '<div class="lngrp"><h5>'+title+(hint?' <span class="lnhint">'+hint+'</span>':'')+'</h5>'+
  (arr.length ? arr.map(function(x){
    return '<div class="lnsum">'+esc2(x.text)+'<span class="lnsrc"> · '+esc2(nameOf(x.block))+
      (x.by?' · '+esc2(x.by):'')+(x.visible?' · 👁 客戶可見':'')+'</span></div>';
  }).join('') : '<div class="lnhint">—</div>')+'</div>';
}
LN.copy=function(){
 var c=C(); var vis=allNotes().filter(function(x){return x.visible});
 var t='【'+today()+' 諮詢摘要】'+c.profile.name+'\n\n';
 var d2=vis.filter(function(x){return x.kind==='decision'});
 var w=allNotes().filter(function(x){return x.kind==='todo'});
 if(d2.length) t+='◆ 這次的決定\n'+d2.map(function(x,i){return (i+1)+'. '+x.text}).join('\n')+'\n\n';
 if(w.length)  t+='◆ 接下來要做的\n'+w.map(function(x,i){return (i+1)+'. '+x.text}).join('\n')+'\n';
 var el=document.getElementById('lnCopy');
 el.textContent=t; el.style.display='block';
 try{ navigator.clipboard.writeText(t); flash('已複製到剪貼簿'); }catch(e){ flash('已產生純文字，可直接選取複製'); }
};

/* ───────── 接收父層（embed 模式）─────────
   父層是唯一的資料來源：它查 DB、它寫 DB，這裡只負責畫。
   只認 parent 且比對 origin —— 少了這道，任何網站把這份檔案 iframe 進去就能塞假註記。 */
function listenParent(){
 if(!REMOTE) return;
 var ORIGIN=(function(){ try{ var r=document.referrer; if(r) return new URL(r).origin; }catch(e){} return location.origin; })();
 window.addEventListener('message', function(e){
  if(e.source!==parent) return;
  if(e.origin && ORIGIN && e.origin!==ORIGIN) return;
  var m=e.data; if(!m || (m.type!=='lantu:init' && m.type!=='lantu:notes')) return;
  if(Array.isArray(m.notes)) LN_REMOTE_STATE.notes = m.notes.map(fromRow);
  if(m.session!==undefined){
   LN_REMOTE_STATE.session = m.session ? {
    id:m.session.id, start:fmtAt(m.session.startedAt), date:(m.session.startedAt||'').toString().slice(0,10),
    before:m.session.metricsBefore||null
   } : null;
  }
  if(Array.isArray(m.past)) LN_REMOTE_STATE.past = m.past;
  if(m.noteAccess) {
   LN_REMOTE_STATE.access = m.noteAccess;
   // 協作教練看到的是同一個畫面，差別在「客戶可見」鎖住、註記標名字。
   LN.role = m.noteAccess==='client' ? 'client' : (m.noteAccess==='viewer' ? 'viewer' : 'owner');
  }
  try{ if(typeof render==='function') render(); else mount(); }catch(err){}
 });
}

/* ───────── 啟動 ───────── */
function boot(){
 var st=document.createElement('style'); st.id='lnCSS'; st.textContent=CSS;
 document.head.appendChild(st);
 listenParent();

 // wrap render：零侵入
 if(typeof window.render==='function'){
  var orig=window.render;
  window.render=function(){ var r=orig.apply(this,arguments); try{ mount(); }catch(e){ console.error('[LN]',e); } return r; };
 }
 try{ if(typeof render==='function') render(); else mount(); }catch(e){ mount(); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();

};
function jnIconSVG(key,col){return (JN_ICONS[key]||JN_ICONS.flag).replace(/@C/g,col);}

/* 類別 → icon。名稱裡的關鍵字優先（客戶把「飼養黃金獵犬」寫在「其他」也給得出狗掌）。 */
function jnIconKey(cat,name){
 var s=String(name||'')+' '+String(cat||'');
 if(/犬|狗|貓|寵物|毛小孩|飼養/.test(s))return 'paw';
 if(/創業|合夥|開店|股份|接班|副業/.test(s))return 'brief';
 if(/運動|健身|體能|馬拉松|重訓|登山|球/.test(s))return 'dumb';
 if(/留學|進修|學位|考照|課程|教育/.test(s))return 'cap';
 if(/醫療|健康|療養|手術|長照/.test(s))return 'med';
 if(/保險|保障/.test(s))return 'shield';
 if(/移民|海外置產|國外資產/.test(s))return 'globe';
 if(/旅遊|旅行|出國/.test(s))return 'plane';
 if(/車/.test(s))return 'car';
 if(/屋|房|宅|置產/.test(s))return 'house';
 if(/婚|結婚|喜宴/.test(s))return 'rings';
 if(/孝親|孝養|奉養|父母/.test(s))return 'hands';
 if(/傳承|遺產|贈與/.test(s))return 'tree';
 if(/退休/.test(s))return 'sun';
 var m={'購屋':'house','置產':'house','購車':'car','婚姻':'rings','孝親':'hands','旅遊':'plane','休閒':'dumb','奢侈品':'gem','傳承':'tree','退休':'sun','教育':'cap','職涯':'brief','其他':'flag'};
 return m[cat]||'flag';
}

/* 四個群組四個顏色，兩種呈現共用；深淺兩套主題各一組。 */
var JN_GROUPS={
 goal :{t:'人生目標', light:'#b07d3d', dark:'#e0bd8b'},
 life :{t:'生活願望', light:'#5f7f96', dark:'#a9bccf'},
 edu  :{t:'子女教育', light:'#4f7a5c', dark:'#8dbb9c'},
 retire:{t:'退休',    light:'#0d2b45', dark:'#cfe0ea'}
};

/* 全部節點的唯一真相。age 是「本人幾歲」，year 換算成西元年。 */
function journeyItems(c){
 var A=n((c.profile||{}).age)||0, Y0=(new Date()).getFullYear(), out=[];
 function push(o){o.year=Y0+(o.age-A);o.icon=jnIconKey(o.cat,o.title);out.push(o);}

 (c.goals||[]).forEach(function(g){
  if(!visionOn(g))return;
  var t=g.type||'其他', one=(n(g.freq)<=0), d=[];
  if(n(g.present)>0)d.push((one?'預計準備 ':'每次 ')+fmt(n(g.present))+' 元');
  if(!one)d.push('每 '+n(g.freq)+' 年一次，至 '+n(g.end)+' 歲');
  if(t==='購屋'||t==='置產'){
   var yr=Math.max(0,n(g.start)-A), fv=n(g.present)*Math.pow(1+n(g.appreciation)/100,yr);
   if(n(g.appreciation)>0)d.push('屆時預估 '+fmt(fv)+' 元');
   if(n(g.loanRatio)>0)d.push('可貸 '+n(g.loanRatio)+'%');
  }
  if(n(g.prepared)>0)d.push('已備 '+fmt(n(g.prepared))+' 元');
  push({age:n(g.start),grp:'goal',cat:t,title:(g.name||t),detail:d.join('・'),amount:n(g.present),
        brief:(n(g.present)>0?(one?'預計準備 ':'每次 ')+fmt(n(g.present))+' 元':'')});
 });

 if((c.marriage||{}).plan==='是'&&n(c.marriage.age)>0)
  push({age:n(c.marriage.age),grp:'goal',cat:'婚姻',title:'結婚',
        detail:(n(c.marriage.budget)>0?'預計花費 '+fmt(n(c.marriage.budget))+' 元':'尚未估算預算'),amount:n(c.marriage.budget)});

 var ca=c.career||{};
 if(ca.plan&&ca.plan!=='無'&&n(ca.switchAge)>0)
  push({age:n(ca.switchAge),grp:'goal',cat:'職涯',title:ca.plan+(ca.startupType?'－'+ca.startupType:''),
        detail:(n(ca.startupFund||ca.startupBudget||ca.switchFund)>0?'預先準備 '+fmt(n(ca.startupBudget||ca.switchFund))+' 元':'轉換期間的收入空窗要先備妥'),
        amount:n(ca.startupBudget||ca.switchFund)});

 [['travel','旅遊'],['hobby','休閒'],['luxury','奢侈品']].forEach(function(pr){
  (c[pr[0]]||[]).forEach(function(x){
   if(!visionOn(x))return;
   var f=n(x.freq)||1, d=[];
   d.push('每次 '+fmt(n(x.amount))+' 元・'+(f>=12?'每月':(f>1?'每年 '+f+' 次':'每年 1 次')));
   if(n(x.end)>n(x.start))d.push(n(x.start)+'–'+n(x.end)+' 歲・年支出 '+fmt(n(x.amount)*f)+' 元');
   push({age:n(x.start),grp:'life',cat:pr[1],title:(pr[1]==='旅遊'?(x.cat||'')+'旅遊':(x.sub||pr[1]))+(pr[1]==='旅遊'&&x.sub?'（'+x.sub+'）':''),
         detail:d.join('・'),amount:n(x.amount)*f,
         brief:'每次 '+fmt(n(x.amount))+' 元・'+(f>=12?'每月':(f>1?'每年 '+f+' 次':'每年 1 次'))});
  });
 });

 (c.education||[]).forEach(function(e){
  if(!(n(e.annual)>0||n(e.years)>0))return;
  var yy=n(e.years)||1;
  push({age:A+n(e.startIn),grp:'edu',cat:'教育',title:(e.child||'子女')+'・'+(e.stage||'就學'),
        detail:'每年 '+fmt(n(e.annual))+' 元 × '+yy+' 年・現值合計 '+fmt(n(e.annual)*yy)+' 元',amount:n(e.annual)*yy,
        brief:'每年 '+fmt(n(e.annual))+' 元 × '+yy+' 年'});
 });

 var hasR=(c.retire&&n(c.retire.monthLiving)>0)||((c.retireExpenses||[]).length);
 if(hasR){
  var mth=n((c.retire||{}).monthLiving);
  if(!mth&&(c.retireExpenses||[]).length)
   mth=Math.round(retireAnnual(c,n(c.profile.retireAge)+1,1)/12);
  var pts=earnerRetirePoints(c);
  if(pts.length)pts.forEach(function(p){
   push({age:p.at,grp:'retire',cat:'退休',title:(p.name||'')+(p.primary?'':' ')+'退休',
         detail:(p.primary&&mth>0?'月退休生活費 '+fmt(mth)+' 元':'家計負擔 '+n(p.share)+'%，退休後由資產接手'),amount:0});
  });
  else push({age:n(c.profile.retireAge),grp:'retire',cat:'退休',title:'退休',
             detail:(mth>0?'月退休生活費 '+fmt(mth)+' 元':''),amount:0});
 }

 out.sort(function(a,b){return (a.age-b.age)||(a.grp<b.grp?-1:1);});
 return out;
}

/* ── 分析頁：依歲數排序的表格 ───────────────────────────────────────────── */
function goalJourneyTable(c,theme){
 var items=journeyItems(c), light=(theme==='light');
 if(!items.length)return '<div class="muted"'+(light?' style="color:#5a6b72"':'')+'>尚無已選定的目標；請到「資料 → 目標 / 置產 / 願望」勾選要納入的項目。</div>';
 var A=n((c.profile||{}).age)||0, mut=light?'#5a6b72':'var(--mut)';
 var rows=items.map(function(it,i){
  var first=(i===0)||(items[i-1].age!==it.age);
  var g=JN_GROUPS[it.grp], col=light?g.light:g.dark;
  return '<tr'+(first&&i?' style="border-top:2px solid '+(light?'#e4dccf':'rgba(255,255,255,.14)')+'"':'')+'>'+
   '<td style="white-space:nowrap;color:'+(first?(light?'#0d2b45':'var(--amber2)'):(light?'#93a3ab':'#67797f'))+';font-weight:'+(first?'800':'400')+'">'+it.age+' 歲</td>'+
   '<td style="white-space:nowrap;color:'+mut+'">'+it.year+'</td>'+
   '<td style="white-space:nowrap;color:'+mut+'">'+(it.age-A<=0?'現在':'+'+(it.age-A)+' 年')+'</td>'+
   '<td><span style="display:inline-flex;align-items:center;gap:6px">'+
     '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="'+col+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex:none">'+jnIconSVG(it.icon,col)+'</svg>'+
     '<b>'+esc(it.title)+'</b></span></td>'+
   '<td style="white-space:nowrap;color:'+col+'">'+esc(g.t)+'</td>'+
   '<td style="color:'+mut+'">'+esc(it.detail||'—')+'</td></tr>';
 }).join('');
 var span=items[0].age+'–'+items[items.length-1].age+' 歲';
 return '<table class="rtable"><tr><th>年齡</th><th>年份</th><th>距今</th><th>目標</th><th>類別</th><th>內容</th></tr>'+rows+'</table>'+
  '<div class="hint" style="display:block;margin-top:6px;color:'+mut+'">共 '+items.length+' 項，橫跨 '+span+'。只列入「已選定」的目標——沒勾選的不進需求試算，也不會出現在這裡。</div>';
}

/* ── 報告書：獨立一頁的路徑圖 ───────────────────────────────────────────────
   三件事讓它不平面：
   ① 路面是「沿法線外擴的多邊形」，寬度用 (1-u)^1.7 收窄＝真正的透視衰減，不是線性。
   ② 中線的白虛線是逐段自己畫的多邊形，愈遠愈短愈細——這才是眼睛判斷遠近的主要線索。
   ③ 路面下方壓一層同形狀、往下位移的暗色＝路基厚度；加上由近到遠的霧化漸層。
   幾何刻意不對稱：每一列的左右端點、彎幅、迴轉外擴、節點落點都各自不同（固定亂數表，
   不用 Math.random，才不會每次 render 都跳動、測試也才釘得住）。
   起點在畫面底部（現在），一路往上走到最上面的願景。
   ───────────────────────────────────────────────────────────────────────── */
function jnQuad(p0,cp,p1,t){var u=1-t;return {x:u*u*p0.x+2*u*t*cp.x+t*t*p1.x,y:u*u*p0.y+2*u*t*cp.y+t*t*p1.y};}
function jnCubic(p0,c1,c2,p1,t){
 var u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
 return {x:a*p0.x+b*c1.x+c*c2.x+d*p1.x, y:a*p0.y+b*c1.y+c*c2.y+d*p1.y};
}
/* 固定的「不規則」表：讓每一列長得不一樣，但每次 render 都一樣。 */
var JN_JIT=[
 {l: 0, r: 0,  bow: 34, bulge: 74, t0:0.24, t1:0.74},
 {l:26, r:14,  bow:-22, bulge: 92, t0:0.30, t1:0.79},
 {l:10, r:38,  bow: 40, bulge: 88, t0:0.21, t1:0.69},
 {l:34, r: 6,  bow:-30, bulge: 88, t0:0.28, t1:0.77},
 {l: 4, r:28,  bow: 26, bulge: 80, t0:0.25, t1:0.71},
 {l:22, r:18,  bow:-38, bulge: 72, t0:0.32, t1:0.76}
];
/* CJK 換行：中文算 1、半形算 0.55。優先在「・」切段，避免把 36,569,833 這種數字攔腰斷掉。 */
function jnW(s){var w=0;for(var i=0;i<s.length;i++)w+=(s.charCodeAt(i)<128?0.55:1);return w;}
function jnWrap(s,per,maxLines){
 s=String(s||'');if(!s)return [];
 var segs=s.split('・'),lines=[],cur='';
 for(var i=0;i<segs.length;i++){
  var seg=segs[i]+(i<segs.length-1?'・':'');
  if(!cur){cur=seg;}
  else if(jnW(cur+seg)<=per){cur+=seg;}
  else {lines.push(cur);cur=seg;}
  while(jnW(cur)>per){
   var t='',w=0,k=0;
   for(;k<cur.length;k++){var cw=(cur.charCodeAt(k)<128?0.55:1);if(w+cw>per)break;t+=cur.charAt(k);w+=cw;}
   lines.push(t);cur=cur.slice(k);
  }
 }
 if(cur)lines.push(cur);
 if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+'…';}
 return lines;
}
/* halo＝跟頁面同色的描邊：文字疊到路面上時仍然讀得到（paint-order 讓描邊畫在字下面）。 */
function jnText(x,y,lines,col,size,weight,lh,halo){
 return lines.map(function(l,i){
  return '<text x="'+x.toFixed(1)+'" y="'+(y+i*lh).toFixed(1)+'" fill="'+col+'" font-size="'+size.toFixed(1)+'" '+
   (weight?'font-weight="'+weight+'" ':'')+
   (halo?'paint-order="stroke" stroke="'+halo+'" stroke-width="3.4" stroke-linejoin="round" ':'')+
   'text-anchor="middle">'+esc(l)+'</text>';
 }).join('');
}
function jnLegend(items,light,sub){
 var ks=Object.keys(JN_GROUPS).filter(function(k){return items.some(function(i){return i.grp===k;});});
 return '<div style="display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:2px;font-size:11.5px;color:'+sub+'">'+
  ks.map(function(k){var g=JN_GROUPS[k],gc=light?g.light:g.dark;
   return '<span style="display:inline-flex;align-items:center;gap:6px"><svg width="11" height="11"><circle cx="5.5" cy="5.5" r="4.4" fill="none" stroke="'+gc+'" stroke-width="2"/></svg>'+esc(g.t)+'</span>';}).join('')+
  '</div>';
}
function jnPolyD(pts){return pts.map(function(p,i){return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);}).join('');}
/* 每個取樣點的單位法線；路面、路肩、虛線全部共用同一組。 */
function jnNormals(pts){
 var out=[];
 for(var i=0;i<pts.length;i++){
  var a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
  var tx=b.x-a.x, ty=b.y-a.y, len=Math.sqrt(tx*tx+ty*ty)||1;
  out.push({x:-ty/len, y:tx/len});
 }
 return out;
}
function jnBand(pts,nrm,from,to,hArr,dyArr){
 var L=[],R=[];
 for(var i=from;i<=to;i++){
  var h=hArr[i], oy=dyArr?dyArr[i]:0;
  L.push({x:pts[i].x+nrm[i].x*h, y:pts[i].y+nrm[i].y*h+oy});
  R.push({x:pts[i].x-nrm[i].x*h, y:pts[i].y-nrm[i].y*h+oy});
 }
 return jnPolyD(L)+jnPolyD(R.reverse()).replace('M','L')+'Z';
}
/* 外擴後會不會自己打結，看的是「半寬有沒有超過當地轉彎半徑」。
   用三點外接圓求半徑，超過就把半寬壓下來——U 形彎的蝴蝶結就是這樣長出來的。 */
function jnCurveR(pts,i){
 var a=pts[Math.max(0,i-3)], b=pts[i], c=pts[Math.min(pts.length-1,i+3)];
 var ab=Math.hypot(b.x-a.x,b.y-a.y), bc=Math.hypot(c.x-b.x,c.y-b.y), ca=Math.hypot(a.x-c.x,a.y-c.y);
 var ar=Math.abs((b.x-a.x)*(c.y-a.y)-(c.x-a.x)*(b.y-a.y))/2;
 if(ar<1e-6)return 1e9;
 return (ab*bc*ca)/(4*ar);
}
/* 參考圖的立體感不是「打光」，是「緞帶在空間裡轉」：直線段寬、彎道段窄。
   所以半寬＝深度基準 ×（彎得愈急愈窄），再加硬箝制保證不自交。
   兩端另外收尖，路才不會是被切斷的方塊。 */
function jnHalfArr(pts,fn,cap){
 var out=[],last=pts.length-1;
 for(var i=0;i<=last;i++){
  var h=fn(i/last);
  if(cap){
   var R=jnCurveR(pts,i);
   h*=Math.min(1,0.42+0.58*Math.min(1,R/150));   // 彎道收窄
   h=Math.min(h,0.60*R);                          // 保證不自交
  }
  out.push(h);
 }
 if(cap){                                          // 兩端收尖
  var tip=Math.round(last*0.035)||6;
  for(var e=0;e<=tip;e++){
   var f=0.30+0.70*(e/tip);
   out[e]*=f; out[last-e]*=f;
  }
 }
 // 抹平箝制造成的階梯，路緣才不會有折角
 for(var p2=0;p2<8;p2++){
  var cp2=out.slice();
  for(var j=1;j<last;j++)out[j]=(cp2[j-1]+cp2[j]*2+cp2[j+1])/4;
 }
 return out;
}
/* 中線虛白線：逐段自己畫，愈遠愈短、愈細。 */
function jnDashes(pts,nrm,dashAt,gapAt,hArr){
 var out=[],mode=1,rem=dashAt(0),start=0;
 for(var i=0;i<pts.length-1;i++){
  var u=i/(pts.length-1);
  var dx=pts[i+1].x-pts[i].x, dy=pts[i+1].y-pts[i].y;
  rem-=Math.sqrt(dx*dx+dy*dy);
  if(rem<=0){
   if(mode&&i>start)out.push(jnBand(pts,nrm,start,i,hArr));
   mode=1-mode; start=i+1; rem=(mode?dashAt(u):gapAt(u));
  }
 }
 if(mode&&pts.length-1>start)out.push(jnBand(pts,nrm,start,pts.length-1,hArr));
 return out;
}

function goalJourneyPathSVG(c,theme,style){
 var ribbon=(style==='ribbon');
 var items=journeyItems(c), light=(theme!=='dark');
 if(!items.length)return '<div style="color:'+(light?'#5a6b72':'var(--mut)')+'">尚無已選定的目標。</div>';
 var col=light
  ?{near:'#2f3b41',far:'#8d979b',base:'#1b2429',kerb:'#e8dcc6',dash:'#fbf3df',ring:'#ffffff',title:'#0d2b45',sub:'#5a6b72',flag:'#1e6b6b',flagT:'#ffffff',mark:'#0d2b45',hint:'#8a7a63',bg:'#fdfbf6'}
  :{near:'#141d22',far:'#4a585e',base:'#070d10',kerb:'#3c4a50',dash:'#e6cfa6',ring:'#12222a',title:'#e9f0f2',sub:'#9db2b9',flag:'#2e8b8b',flagT:'#04181b',mark:'#c99a5b',hint:'#9db2b9',bg:'#0a1a20'};
 var A=n((c.profile||{}).age)||0;
 var W=760, MX=74, ROWH=186, PER=2, MAX_ROWS=6;
 var chunk=PER*MAX_ROWS, np=Math.max(1,Math.ceil(items.length/chunk));
 var per=Math.ceil(items.length/np); if(per%PER)per++;
 var pages=[]; for(var s0=0;s0<items.length;s0+=per)pages.push(items.slice(s0,s0+per));

 return pages.map(function(list,pi){
  var rows=Math.ceil(list.length/PER);
  var TOPPAD=88, BOT=130;
  var H=(rows-1)*ROWH+TOPPAD+BOT;
  var bottomY=H-BOT, topY=bottomY-(rows-1)*ROWH, spanY=(bottomY-topY)||1;
  var uid2='j'+pi;

  /* ① 中心線（由下往上）：先擺控制點，再用 Catmull-Rom 一次串成整條樣條。
        重點是「一條」——逐段各畫各的會在接縫處切線不連續，外擴時就冒出尖角。 */
  var wps=[], markA=[], markB=[];
  for(var r=0;r<rows;r++){
   var J=JN_JIT[r%JN_JIT.length], y=bottomY-r*ROWH, ltr=(r%2===0);
   var xa=MX+J.l, xb=W-MX-J.r, sX=ltr?xa:xb, eX=ltr?xb:xa;
   markA.push(wps.length); wps.push({x:sX,y:y});
   wps.push({x:(sX+eX)/2+(ltr?-26:26), y:y+J.bow*0.6});
   markB.push(wps.length); wps.push({x:eX,y:y});
   if(r<rows-1)wps.push({x:eX+(ltr?J.bulge:-J.bulge), y:y-ROWH/2});
  }
  var pts=[], wpAt=[];
  (function(){
   function P(i){return wps[Math.max(0,Math.min(wps.length-1,i))];}
   for(var i=0;i<wps.length-1;i++){
    var p0=P(i-1), p1=P(i), p2=P(i+1), p3=P(i+2);
    var c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6};
    var c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
    if(i===0){wpAt[0]=0; pts.push(p1);}
    for(var k=1;k<=34;k++)pts.push(jnCubic(p1,c1,c2,p2,k/34));
    wpAt[i+1]=pts.length-1;
   }
  })();
  var nodePos=[];
  for(var r2=0;r2<rows;r2++){
   var J2=JN_JIT[r2%JN_JIT.length], iA=wpAt[markA[r2]], iB=wpAt[markB[r2]];
   for(var m=0;m<PER;m++){
    var idx=r2*PER+m; if(idx>=list.length)break;
    var t=(m===0?J2.t0:J2.t1), q=pts[Math.round(iA+(iB-iA)*t)];
    nodePos.push({it:list[idx], x:q.x, y:q.y});
   }
  }
  var nrm=jnNormals(pts);

  /* ② 透視：寬度、路基厚度、虛線長寬全部跟著 u 走（u=0 近、u=1 遠） */
  var wNear=56, wFar=13;
  function halfW(u){return (wFar+(wNear-wFar)*Math.pow(1-u,1.7))/2;}
  function dashHalf(u){return Math.max(0.7,(1.2+3.4*Math.pow(1-u,1.7)))/2;}
  function dashLen(u){return 8+26*Math.pow(1-u,1.6);}
  function gapLen(u){return 7+21*Math.pow(1-u,1.6);}
  var last=pts.length-1;
  var hArr=jnHalfArr(pts,halfW,true);
  var dhArr=hArr.map(function(h,i){var u=i/last;return Math.min(dashHalf(u), h*0.16);});
  var roadD=jnBand(pts,nrm,0,last,hArr);
  var kerbL=[],kerbR=[];
  for(var i2=0;i2<=last;i2++){var h2=hArr[i2];
   kerbL.push({x:pts[i2].x+nrm[i2].x*h2,y:pts[i2].y+nrm[i2].y*h2});
   kerbR.push({x:pts[i2].x-nrm[i2].x*h2,y:pts[i2].y-nrm[i2].y*h2});}
  var dashes=jnDashes(pts,nrm,dashLen,gapLen,dhArr).map(function(d){
   return '<path d="'+d+'" fill="url(#'+uid2+'dash)"/>';}).join('');

  /* ③ 節點：近大遠小，字級也跟著（但收斂，遠端仍讀得到） */
  var nodes=nodePos.map(function(np2){
   var it=np2.it, g=JN_GROUPS[it.grp], gc=light?g.light:g.dark, px=np2.x, py=np2.y;
   var u=(bottomY-py)/spanY, sc=1-0.26*u;                    // 1.00 → 0.74
   var R2=31*sc, fs=14*(1-0.14*u), fs2=12*(1-0.12*u);
   var ft=it.age+' 歲', fw=(jnW(ft)*11+16)*sc, fh=20*sc, pole=(52+R2*0.1)*sc;
   var titleLines=jnWrap(it.title,17,2);
   var ty=py+R2+22;
   return '<g>'+
    '<path d="M'+(px-R2-10).toFixed(1)+' '+(py+8*sc).toFixed(1)+'V'+(py-pole).toFixed(1)+'" stroke="'+col.flag+'" stroke-width="'+(2.4*sc).toFixed(1)+'" stroke-linecap="round"/>'+
    '<path d="M'+(px-R2-10).toFixed(1)+' '+(py-pole).toFixed(1)+'h'+fw.toFixed(1)+'v'+fh.toFixed(1)+'h-'+fw.toFixed(1)+'z" fill="'+col.flag+'"/>'+
    '<text x="'+(px-R2-10+fw/2).toFixed(1)+'" y="'+(py-pole+fh*0.72).toFixed(1)+'" fill="'+col.flagT+'" font-size="'+(12*sc).toFixed(1)+'" font-weight="800" text-anchor="middle">'+esc(ft)+'</text>'+
    '<ellipse cx="'+px.toFixed(1)+'" cy="'+(py+R2*0.82).toFixed(1)+'" rx="'+(R2*0.86).toFixed(1)+'" ry="'+(R2*0.24).toFixed(1)+'" fill="rgba(0,0,0,.20)"/>'+
    '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+R2.toFixed(1)+'" fill="'+col.ring+'" stroke="'+gc+'" stroke-width="'+(2.4*sc).toFixed(1)+'"/>'+
    '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+(R2+4.5*sc).toFixed(1)+'" fill="none" stroke="'+gc+'" stroke-width="1" opacity=".3"/>'+
    '<g transform="translate('+(px-12*sc*1.35).toFixed(1)+' '+(py-12*sc*1.35).toFixed(1)+') scale('+(sc*1.35).toFixed(3)+')" fill="none" stroke="'+gc+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+jnIconSVG(it.icon,gc)+'</g>'+
    jnText(px,ty,titleLines,col.title,fs,'800',fs+3.5,col.bg)+
    jnText(px,ty+titleLines.length*(fs+3.5),jnWrap(it.year+'　'+(it.brief||it.detail||''),23,2),col.sub,fs2,'',fs2+3,col.bg)+
    '</g>';
  }).join('');

  /* ④ 起點（最下）與終點（最上） */
  var sx=pts[0].x, sy=pts[0].y, ex=pts[last].x, ey=pts[last].y;
  var start=(pi===0)
   ? '<g><g transform="translate('+(sx-56)+' '+(sy-6)+')" stroke="'+col.mark+'" stroke-width="2.8" stroke-linecap="round" fill="none">'+
      '<circle cx="10" cy="-32" r="5" fill="'+col.mark+'" stroke="none"/>'+
      '<path d="M10 -26v12M10 -22.5l-6.5-4.5M10 -22.5l6.5 3.5M10 -14l-5.5 13M10 -14l6 12"/></g>'+
     '<text x="'+(sx-48)+'" y="'+(sy+26)+'" fill="'+col.mark+'" font-size="12" font-weight="800" text-anchor="middle" letter-spacing=".18em">START</text>'+
     '<text x="'+(sx-48)+'" y="'+(sy+42)+'" fill="'+col.sub+'" font-size="11" text-anchor="middle">現在 '+A+' 歲</text>'+
     '<path d="M'+(sx-26)+' '+(sy+2)+'h15" stroke="'+col.mark+'" stroke-width="2.2" stroke-linecap="round" marker-end="url(#'+uid2+'arw)"/></g>'
   : '<text x="'+sx.toFixed(1)+'" y="'+(sy+46).toFixed(1)+'" fill="'+col.hint+'" font-size="11" text-anchor="middle">（續前頁）</text>';
  var end=(pi===pages.length-1)
   ? '<g><path d="M'+ex.toFixed(1)+' '+(ey+5).toFixed(1)+'V'+(ey-44).toFixed(1)+'" stroke="'+col.mark+'" stroke-width="2.4" stroke-linecap="round"/>'+
     '<path d="M'+ex.toFixed(1)+' '+(ey-43).toFixed(1)+'h27l-6 7.6 6 7.6H'+ex.toFixed(1)+'z" fill="'+col.mark+'"/>'+
     '<text x="'+(ex+14).toFixed(1)+'" y="'+(ey-53).toFixed(1)+'" fill="'+col.mark+'" font-size="12" font-weight="800" text-anchor="middle">願景達成</text></g>'
   : '<text x="'+ex.toFixed(1)+'" y="'+(ey-28).toFixed(1)+'" fill="'+col.hint+'" font-size="11" text-anchor="middle">（接下頁）</text>';

  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-width:'+W+'px;display:block;margin:0 auto'+(pi?';page-break-before:always':'')+'">'+
   '<defs>'+
    '<linearGradient id="'+uid2+'road" x1="0" y1="'+bottomY+'" x2="0" y2="'+(topY-40)+'" gradientUnits="userSpaceOnUse">'+
     '<stop offset="0" stop-color="'+col.near+'"/><stop offset="1" stop-color="'+col.far+'"/></linearGradient>'+
    '<linearGradient id="'+uid2+'dash" x1="0" y1="'+bottomY+'" x2="0" y2="'+(topY-40)+'" gradientUnits="userSpaceOnUse">'+
     '<stop offset="0" stop-color="'+col.dash+'"/><stop offset="1" stop-color="'+col.dash+'" stop-opacity=".55"/></linearGradient>'+
    '<marker id="'+uid2+'arw" markerWidth="7" markerHeight="7" refX="5" refY="3.2" orient="auto"><path d="M0 0.4 6.4 3.2 0 6" fill="'+col.mark+'"/></marker>'+
   '</defs>'+
   (ribbon
     ? '<path d="'+roadD+'" fill="'+col.near+'"/>'
     : '<path d="'+roadD+'" fill="url(#'+uid2+'road)"/>'+
       '<path d="'+jnPolyD(kerbL)+'" fill="none" stroke="'+col.kerb+'" stroke-width="1.4" opacity=".55"/>'+
       '<path d="'+jnPolyD(kerbR)+'" fill="none" stroke="'+col.kerb+'" stroke-width="1.4" opacity=".55"/>'+
       dashes)+
   start+end+nodes+'</svg>';
 }).join('')+jnLegend(items,light,col.sub);
}

</script>
<script>
/* ── 原型預覽殼：把兩種呈現並排畫出來，不影響 app 本身 ── */
window.addEventListener('load',function(){
 var c=migrateCase(sampleCase());
 // 為了看清楚 icon 與路徑的樣貌，把示範客戶的目標補到接近真實諮詢的密度。
 c.profile.name='王大明'; c.profile.age=40; c.profile.retireAge=65;
 c.goals=[

  {on:true,name:'飼養黃金獵犬',type:'其他',present:50000,start:41,end:41,freq:0,growth:'固定',imp:2,prepared:0},
