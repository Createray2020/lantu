 ['購屋規劃','goals','目標/置產','房價・成數','購屋'],
 ['子女教養規劃','education','子女教育','學程・學費'],
 ['孝親規劃','goals','目標/置產','奉養・醫療','孝親'],
 ['婚姻規劃','intent','意圖/生涯','年齡・預算'],
 ['旅遊規劃','goals','目標/置產','頻率・預算','旅遊'],
 ['休閒興趣規劃','goals','目標/置產','年度預算','休閒'],
 ['奢侈品購買規劃','goals','目標/置產','品項・金額','奢侈品'],
 ['退休生活規劃','retire','退休','年齡・月費'],
 ['傳承規劃','intent','意圖/生涯','繼承人・金額','傳承'],
 ['報酬結構優化','bizcomp','報酬結構','薪資・股利・租金','','company'],
 ['企業風險保障','bizrisk','企業保障','關鍵人・股東','','company'],
 ['事業退場規劃','bizexit','退場傳承','接班・出售・清算','','company']];
var TARGETS=TARGET_META.map(function(x){return x[0]});
// 地基層：不受目標勾選影響，一律要填，缺一塊人生模擬就失真。
var BASE_TABS=[['family','家庭 / 參數'],['finance','收支資債'],['coverage','保障中心'],['credit','信用/海外'],['tax','稅賦']];
// 企業主體開啟時追加的地基層分頁。不把公司拉進來看，算出來的個人資產負債表就是假的。
var BIZ_BASE_TABS=[['company','公司概況'],['linkage','公私勾稽'],['bizgate','合規閘']];
// 勾這些議題＝自動開對應主體（和「人生模擬→目標全選」同一種捷徑）。
var PURPOSE_TO_ENTITY={'想處理公司與個人的財務界線':'company','想評估稅務合規風險':'company'};
function targetMeta(t){for(var i=0;i<TARGET_META.length;i++)if(TARGET_META[i][0]===t)return TARGET_META[i];return null}
// ===== 主體（企業）=====
function entityOn(c,k){return !!(((c||{}).intent||{}).entities||{})[k]}
// 這份規劃「可選」的人生目標：帶主體的只在該主體開啟時出現。
function visibleTargets(c){return TARGET_META.filter(function(x){return !x[5]||entityOn(c,x[5])})}
// 這份規劃的地基層分頁（企業主體開了就追加第 ④ 群）。
function baseTabsOf(c){return entityOn(c,'company')?BASE_TABS.concat(BIZ_BASE_TABS):BASE_TABS.slice()}
// 主體開關：關掉時要一併取消把它打開的議題，否則 normalizeIntent 下一輪又會開起來。
function toggleEntity(k){var c=activeCase();var it=normalizeIntent(c);
 var on=!!(it.entities||{})[k];
 if(on&&!confirm('關閉後，「企業」分頁與相關目標會收合、不再列入資料完整度。\n已填的公司資料一律保留，隨時可以再開。\n\n確定關閉嗎？'))return;
 it.entities=it.entities||{};
 if(on){it.entities[k]=false;it.purposes=it.purposes.filter(function(p){return PURPOSE_TO_ENTITY[p]!==k});}
 else it.entities[k]=true;
 save();render()}

// 舊值遷移對照（2026-08-16 三區塊整併前的資料）
var PURPOSE_TO_TARGETS={'想買車、買房，進行置產':['購車規劃','購屋規劃']};
var TARGET_TO_PURPOSES={'人生模擬':[ALL_SIM]};
function uniqArr(a){var o=[],s={};a.forEach(function(x){if(!s[x]){s[x]=1;o.push(x)}});return o}

// 冪等地把 intent 正規化到新模型（遷移舊字串、丟掉不存在的選項、mustHave 與 targets 合成同一組有序集合）。
function normalizeIntent(c){
 var it=c.intent=c.intent||{purposes:[],targets:[],mustHave:[],entities:{}};
 var purposes=uniqArr(Array.isArray(it.purposes)?it.purposes:[]);
 var targets=uniqArr(Array.isArray(it.targets)?it.targets:[]);
 var must=uniqArr(Array.isArray(it.mustHave)?it.mustHave:[]);
 var addT=[],addP=[];
 purposes=purposes.filter(function(p){if(PURPOSE_TO_TARGETS[p]){addT=addT.concat(PURPOSE_TO_TARGETS[p]);return false}return true});
 targets=targets.concat(addT);must=must.concat(addT);
 function mapT(a){return a.filter(function(t){if(TARGET_TO_PURPOSES[t]){addP=addP.concat(TARGET_TO_PURPOSES[t]);return false}return true})}
 targets=mapT(targets);must=mapT(must);purposes=purposes.concat(addP);
 purposes=uniqArr(purposes).filter(function(p){return PURPOSES.indexOf(p)>=0});
 targets=uniqArr(targets).filter(function(t){return TARGETS.indexOf(t)>=0});
 must=uniqArr(must).filter(function(t){return TARGETS.indexOf(t)>=0});
 var union=uniqArr(must.concat(targets));
 var ordered=must.filter(function(t){return union.indexOf(t)>=0});
 var rest=union.filter(function(t){return ordered.indexOf(t)<0}).sort(function(a,b){return TARGETS.indexOf(a)-TARGETS.indexOf(b)});
 // 主體：只留認得的 key、值正規化成 boolean；再讓 PURPOSE_TO_ENTITY 的議題把對應主體打開。
 var rawEnt=(it.entities&&typeof it.entities==='object')?it.entities:{};
 var ent={};
 ['company'].forEach(function(k){if(rawEnt[k])ent[k]=true});
 purposes.forEach(function(p){var k=PURPOSE_TO_ENTITY[p];if(k)ent[k]=true});
 // 主體沒開 → 它帶出的目標退出必達清單（等同「取消勾選」，已填的公司資料一律保留）。
 // 一定要在這裡剔除，否則 mustHave 裡混著看不見的項目，優先序的 index 會對不上（拖曳會排錯人）。
 var entTarget={};TARGET_META.forEach(function(x){if(x[5])entTarget[x[0]]=x[5]});
 var keep=function(t){var k=entTarget[t];return !k||!!ent[k]};
 var finalMust=ordered.concat(rest).filter(keep);
 it.purposes=purposes;it.mustHave=finalMust;it.targets=finalMust.slice();it.entities=ent;
 return it;
}
// 目標是否已選（＝必須達成）
function targetOn(c,t){return ((c.intent||{}).mustHave||[]).indexOf(t)>=0}

function toggleIntent(field,val){var c=activeCase();c.intent=c.intent||{purposes:[],targets:[]};var a=c.intent[field]=c.intent[field]||[];var i=a.indexOf(val);if(i<0)a.push(val);else a.splice(i,1);save();render()}

// 關注議題：勾「人生模擬」＝目標全選
function togglePurpose(val){var c=activeCase();var it=normalizeIntent(c);var i=it.purposes.indexOf(val);
 if(i<0){it.purposes.push(val);
  var ek=PURPOSE_TO_ENTITY[val];if(ek){it.entities=it.entities||{};it.entities[ek]=true}
  if(val===ALL_SIM){var vt=visibleTargets(c).map(function(x){return x[0]});it.mustHave=vt;it.targets=vt.slice()}}
 else{it.purposes.splice(i,1);
  // 取消議題要一併關掉它帶出來的主體，否則 normalizeIntent 下一輪又會打開
  var k2=PURPOSE_TO_ENTITY[val];
  if(k2&&!it.purposes.some(function(p){return PURPOSE_TO_ENTITY[p]===k2})){it.entities=it.entities||{};it.entities[k2]=false}}
 save();render()}

// 目標二態切換：選了＝必達（推到優先序最後），取消＝移除（資料保留、仍列入模擬）
function toggleTarget(t){var c=activeCase();var it=normalizeIntent(c);var i=it.mustHave.indexOf(t);
 if(i<0){it.mustHave.push(t);seedGoalRow(c,t)}
 else{
  if(t===DEFAULT_TARGET&&!confirm('退休幾乎是必然會發生的。\n取消後，人生模擬將不會列入退休金需求。\n\n確定取消嗎？'))return;
  it.mustHave.splice(i,1);
  var pi=it.purposes.indexOf(ALL_SIM);if(pi>=0)it.purposes.splice(pi,1);
 }
 it.targets=it.mustHave.slice();save();render()}

function moveTarget(i,d){var c=activeCase();var it=normalizeIntent(c);var j=i+d;
 if(j<0||j>=it.mustHave.length)return;
 var x=it.mustHave[i];it.mustHave[i]=it.mustHave[j];it.mustHave[j]=x;
 it.targets=it.mustHave.slice();save();render()}

function dropTarget(from,to){var c=activeCase();var it=normalizeIntent(c);
 if(from===to||from<0||to<0||from>=it.mustHave.length||to>=it.mustHave.length)return;
 var x=it.mustHave.splice(from,1)[0];it.mustHave.splice(to,0,x);
 it.targets=it.mustHave.slice();save();render()}

function selectAllTargets(){var c=activeCase();var it=normalizeIntent(c);
 var vt=visibleTargets(c).map(function(x){return x[0]});
 it.mustHave=vt;it.targets=vt.slice();
 if(it.purposes.indexOf(ALL_SIM)<0)it.purposes.push(ALL_SIM);
 save();render()}  // 全選不 seed goals 列，避免一次灌入 8 筆空資料；逐項勾選才帶一列

function clearTargets(){var c=activeCase();var it=normalizeIntent(c);
 it.mustHave=[DEFAULT_TARGET];it.targets=[DEFAULT_TARGET];
 var pi=it.purposes.indexOf(ALL_SIM);if(pi>=0)it.purposes.splice(pi,1);
 save();render()}

// 勾選目標時，若對應 goals 類型尚無資料列，自動帶出一列（不覆蓋既有資料）
function seedGoalRow(c,t){var m=targetMeta(t);if(!m||!m[4])return;
 c.goals=c.goals||[];
 if(c.goals.some(function(g){return g.type===m[4]}))return;
 var age=n((c.profile||{}).age)||30;
 c.goals.push({on:true,name:m[0].replace('規劃',''),type:m[4],present:0,minPresent:0,start:age+3,end:age+3,freq:0,growth:'通膨',appreciation:0,loanRatio:0,imp:3,prepared:0});
}
// 跳到指定資料子分頁（未選目標的收合列「展開並納入」用）
function gotoDataTab(t){var c=activeCase();if(!targetOn(c,t))toggleTarget(t);var m=targetMeta(t);
 if(m&&m[1]!=='intent'){app.activeTab='data';app.dataTab=m[1]}render()}
function jumpTab(tab){app.activeTab='data';app.dataTab=tab;render()}
// 必達優先序的「填細節 →」：跳到該目標所屬分頁並捲到該區塊（同頁的三個目標也會捲＋閃一下）
function gotoGoal(t){var c=activeCase();var m=targetMeta(t);if(!m)return;
 if(!targetOn(c,t))toggleTarget(t);
 if(m[4])seedGoalRow(c,t);          // goals 類：確保表裡有一列可填
 app.activeTab='data';app.dataTab=m[1];save();render();
 setTimeout(function(){var el=document.querySelector('[data-goalanchor="'+t+'"]');if(!el)return;
  if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('goalflash');setTimeout(function(){el.classList.remove('goalflash')},1700);},40);}
// 已選為必達、但 goals 表裡沒有對應列（舊資料或「全選」進來的）→ 補一列
function addGoalRowFor(t){var c=activeCase();seedGoalRow(c,t);save();render();}
function goalRowMissing(c,t){var m=targetMeta(t);if(!m||!m[4])return false;
 return !(c.goals||[]).some(function(g){return g.type===m[4]});}
// 舊資料可能把布林存成 'true'/'false' 字串（見 ofld 的註解）。讀取一律過這支。
function boolish(v,dflt){
 if(v==null)return dflt!==false;
 if(typeof v==='boolean')return v;
 var t=String(v).trim().toLowerCase();
 return !(t==='false'||t==='0'||t===''||t==='否');
}
function setObj(obj,k,v,type){var c=activeCase();c[obj]=c[obj]||{};c[obj][k]=(type==='num')?n(v):v;save();if(app.role==='client')render()}
function chips(field,opts,sel,handler){return '<div style="display:flex;flex-wrap:wrap;gap:8px">'+opts.map(function(o){var on=(sel||[]).indexOf(o)>=0;
 var call=handler?handler+'(\''+o.replace(/'/g,"")+'\')':'toggleIntent(\''+field+'\',\''+o.replace(/'/g,"")+'\')';
 return '<button onclick="'+call+'" style="background:'+(on?'var(--amber)':'var(--card)')+';color:'+(on?'#08202a':'var(--mut)')+';border:1px solid '+(on?'var(--amber)':'var(--line)')+';border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer">'+(on?'✓ ':'')+o+'</button>'}).join('')+'</div>'}

// ── 人生目標與優先序（二態卡片＋必達拖曳列）──
function prioRowHTML(c){var must=(c.intent||{}).mustHave||[];
 if(!must.length)return '<div class="prow"><div style="color:var(--mut2);font-size:12.5px;padding:4px 2px">尚未選擇任何人生目標——這份規劃只會跑現況與收支結構，不含任何未來目標。</div></div>';
 return '<div class="prow" id="prioRow">'+must.map(function(t,i){
  var m=targetMeta(t);
  return '<div class="pitem" draggable="true" data-i="'+i+'">'+
   '<span class="g">⣿</span><span class="n">'+(i+1)+'</span><span class="t">'+t+'</span>'+
   '<button class="go" title="前往填寫此目標的細節" onclick="event.stopPropagation();gotoGoal(\''+t+'\')">填細節 →<span class="tb"> '+(m?m[2]:'')+'</span></button>'+
   '<span class="mv"><button title="往前" onclick="event.stopPropagation();moveTarget('+i+',-1)">◀</button>'+
   '<button title="往後" onclick="event.stopPropagation();moveTarget('+i+',1)">▶</button></span>'+
   '<button class="x" title="移除" onclick="event.stopPropagation();toggleTarget(\''+t+'\')">✕</button></div>';
 }).join('')+'</div>'}

function goalGridHTML(c){var must=(c.intent||{}).mustHave||[];
 return '<div class="gwrap">'+visibleTargets(c).map(function(x){var t=x[0],i=must.indexOf(t),sel=i>=0;
  return '<button class="gcard'+(sel?' on':'')+'" onclick="toggleTarget(\''+t+'\')">'+
   (sel?'<span class="ord">'+(i+1)+'</span>':'')+
   '<div class="nm">'+t+'</div><div class="sub">'+
   (sel&&t===DEFAULT_TARGET?'<span class="lock">預設必達</span> · ':'')+x[3]+' · '+x[2]+'</div></button>';
 }).join('')+'</div>'}

// ── 規劃主體（家庭 ＋ 可選的企業）──
// 語意：企業財務不是第 12 個人生目標，是「第二個主體」——企業主有兩張資產負債表且互相勾稽。
function entitySec(c){
 var on=entityOn(c,'company'),co=mainCompany(c);
 var badge=on?'<span class="tagMust">已啟動</span>':'<span class="tagOff">未啟動</span>';
 var body=on
  ? '<div class="hint" style="margin-top:6px">已解鎖第 ④ 群「企業」（公司概況／公私勾稽／合規閘），並可在下方選擇三個企業目標。'+
    (co&&co.name?'目前主體公司：<b>'+esc(co.name)+'</b>。':'請先到「公司概況」填第一批五個數字。')+'</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:9px">'+
    '<button class="tbtn amber" onclick="jumpTab(\'company\')">公司概況 →</button>'+
    '<button class="tbtn" onclick="jumpTab(\'linkage\')">公私勾稽 →</button>'+
    '<button class="tbtn" onclick="jumpTab(\'bizgate\')">合規閘 →</button>'+
    '<button class="tbtn" onclick="toggleEntity(\'company\')">關閉企業主體</button></div>'
  : '<div class="hint" style="margin-top:6px">客戶是企業主、且願意把公司一起納入規劃時才開啟。開啟後會多出三個地基層分頁與三個企業目標；<b>不開就完全不影響現有流程</b>。</div>'+
    '<button class="tbtn amber" style="margin-top:9px" onclick="toggleEntity(\'company\')">啟動企業財務規劃</button>';
 return '<div class="sec"><h4>規劃主體 '+badge+' <span class="hint">家庭主體永遠存在；企業是可選的第二主體</span></h4>'+
  '<div style="font-size:13.5px;color:var(--mut);line-height:1.8">企業主的資產通常有 60～90% 是自家公司股權——不流通、不可分割、估值困難，而且高度依賴他本人。'+
  '更麻煩的是收入與資產同源：公司出事，收入和資產會同時消失。<b>不把公司拉進來看，算出來的個人資產負債表就是假的。</b></div>'+
  body+'</div>';
}
function goalsSec(c){
 return '<div class="sec"><h4>人生目標與優先序 <span class="hint">選了＝必須達成，沒選＝不列入規劃、對應欄位收合；順序＝資源不足時的取捨依據</span></h4>'+
  '<div class="prio"><div class="ph"><b>必須達成 · 優先序</b><span class="hint">拖曳排序，或用 ◀ ▶ 微調（平板／手機用）</span>'+
  '<span style="flex:1"></span><button class="tbtn amber" onclick="selectAllTargets()">全選 · 人生模擬</button>'+
  '<button class="tbtn" onclick="clearTargets()">清除</button></div>'+prioRowHTML(c)+'</div>'+
  goalGridHTML(c)+
  '<div class="hint" style="margin-top:9px">※ 取消勾選不會刪除已填資料，該筆仍會列入現金流模擬——只是欄位收合、不再追問。</div></div>';
}

// 未選目標 → 該區塊收合成一行（可展開並納入）
function foldedGoal(c,t,extra){
 return '<div class="folded">'+t.replace('規劃','')+'<span class="tagOff">客戶未選此目標</span>· 點此仍可規劃 '+
  '<button class="tbtn" onclick="gotoDataTab(\''+t+'\')">展開並納入</button>'+
  (extra?'<span>'+extra+'</span>':'')+'</div>';
}
function mustBadge(c,t){var i=((c.intent||{}).mustHave||[]).indexOf(t);
 return i<0?'':'<span class="tagMust">必須達成 · 第 '+(i+1)+' 順位</span>'}
// 已選目標分頁的頁首（顯示順位）
function goalHead(c,t){return '<div class="folded" data-goalanchor="'+esc(t)+'" style="border-style:solid;border-color:rgba(143,192,163,.32);color:var(--mut)">'+t+' '+mustBadge(c,t)+'<span>依「意圖 / 生涯」的優先序排定；資源不足時，順位在後的會先被調整。</span></div>'}
// 目標/置產分頁的頁首：這頁一次容納多種目標類型，逐一列出已選／未選
function goalsTabHead(c){
 var rows=TARGET_META.filter(function(x){return x[1]==='goals'});
 var onList=rows.filter(function(x){return targetOn(c,x[0])});
 var offList=rows.filter(function(x){return !targetOn(c,x[0])});
 var onTxt=onList.length?onList.map(function(x){
   var miss=goalRowMissing(c,x[0]);
   return '<span class="tagMust" data-goalanchor="'+esc(x[0])+'">'+x[0].replace('規劃','')+' · 第 '+(((c.intent||{}).mustHave||[]).indexOf(x[0])+1)+' 順位</span>'+
    (miss?' <button class="tbtn" style="padding:1px 8px;font-size:11.5px" onclick="addGoalRowFor(\''+x[0]+'\')">＋ 新增一列</button>':'');
  }).join(' '):'<span style="color:var(--mut2)">尚未選擇任何置產／生活類目標</span>';
 var missAny=onList.some(function(x){return goalRowMissing(c,x[0])});
 var offTxt=offList.length?'<div class="folded" style="margin-top:8px">未選：'+offList.map(function(x){
   return '<button class="tbtn" onclick="gotoDataTab(\''+x[0]+'\')">＋ '+x[0].replace('規劃','')+'</button>'}).join(' ')+
   '<span>點下去即納入規劃並帶出一列；未選的既有資料仍保留、仍列入模擬。</span></div>':'';
 return '<div class="folded" style="border-style:solid;border-color:rgba(143,192,163,.32);color:var(--mut);display:block">'+
  '<div style="margin-bottom:2px">此分頁的必達目標：'+onTxt+'</div>'+
  (missAny?'<div style="margin-top:5px;font-size:12px;color:var(--amber2)">※ 標示「＋ 新增一列」的目標已選為必達，但下表尚無對應列——點一下即補上可填的一列。</div>':'')+
  '</div>'+offTxt;
}

// ── 報告書／缺口總表：吃必達優先序 ──
function orderedMustText(c){var must=((c.intent||{}).mustHave||[]);
 return must.map(function(t,i){return (i+1)+'. '+t}).join(' · ')}
// 缺口列依必達順位排序；沒被選為必達的目標，缺口仍列出但排在後面並標「未列為必達」
function gapRowsByPriority(c,rn,m){
 var must=((c.intent||{}).mustHave||[]);

function tabFilled(c,tab){

 if(tab==='finance')return ((c.incomes||[]).length+(c.expenses||[]).length+(c.assets||[]).length+(c.liabilities||[]).length)>0;
 if(tab==='coverage')return ((c.policies||[]).length+(c.coverages||[]).length)>0;
 if(tab==='credit')return n((c.credit||{}).cards)>0||!!(c.credit||{}).score||(c.overseas||{}).hasAssets==='是';
 if(tab==='tax')return !!(c.taxParams&&Object.keys(c.taxParams).length)&&(n((c.taxParams||{}).dependents)>0||!!(c.taxParams||{}).married||n((c.taxParams||{}).houseAssessed)>0||n((c.taxParams||{}).otherDeduction)>0);
 if(tab==='retire')return n((c.profile||{}).retireAge)>0&&(n((c.retire||{}).monthLiving)>0||((c.retireExpenses||[]).length>0));
 if(tab==='education')return ((c.education||[]).length>0)||((c.children||[]).length>0);
 if(tab==='goals')return (c.goals||[]).some(function(g){return n(g.present)>0});
 if(tab==='intent')return n((c.legacy||{}).heirs)>0||(c.career||{}).plan!=='無'||(c.marriage||{}).plan==='是';
 if(tab==='lifestyle')return ((c.travel||[]).length+(c.hobby||[]).length+(c.luxury||[]).length)>0;
 // 企業：門檻刻意壓低——E1 只要「第一批五個數字」有填到營收或淨值就算填了。
 // 把三年財報＋六期 401 當成必填，只會讓完整度永遠亮紅、教練乾脆整組跳過。
 if(tab==='company'){var co=mainCompany(c);return !!co&&(n(co.annualRevenue)>0||n(co.netProfit)>0||n(co.totalAsset)>0);}
 if(tab==='linkage')return ((c.ownerLoans||[]).length+(c.guarantees||[]).length+(c.bizAssets||[]).length+(c.channels||[]).length)>0;
 if(tab==='bizgate')return !!(c.bizGate&&Object.keys(c.bizGate.ans||{}).length);
 return false;
}

function setRiskAns(qi,oi){var c=activeCase();if(!c.riskQuiz)c.riskQuiz={ans:{}};
 if(RISK_Q[qi].multi){var L=riskAnsList(c.riskQuiz.ans,qi);var k=L.indexOf(oi);
  if(k<0)L.push(oi);else L.splice(k,1);

function riskConflicts(c){var a=(c.riskQuiz&&c.riskQuiz.ans)||{};var out=[];

 function worst(qi){var L=riskAnsList(a,qi);return L.length?Math.min.apply(null,L):null;}
 var loss=one(9),combo=one(10),purpose=one(2),horizon=one(3),drop=one(8),urgent=one(11);
 if(loss===0&&combo!=null&&combo>=3)out.push('第 10 題答「不能接受任何虧損」，第 11 題卻偏好最差 -25% 以上的組合——兩者互斥。');
 if(purpose===0&&combo!=null&&combo>=3)out.push('第 3 題答「保本，絕不能虧損」，第 11 題卻選了高波動組合——請確認客戶真正的底線。');
 if(horizon!=null&&horizon<=1&&combo!=null&&combo>=3)out.push('資金 3 年內就要動用，卻偏好高波動組合——短期資金不宜承擔此波動。');
 if(drop===0&&loss!=null&&loss>=3)out.push('第 9 題答「下跌就全部贖回」，第 10 題卻能接受 20% 以上虧損——實際行為與自評不一致。');

/* ===================== 第 ④ 群：企業 =====================
   E1 公司概況 / E2 公私勾稽。設計依據見專案記憶「企業主模組設計提案」。
   兩個地基級語意，改之前務必先讀：
   1) 公司股權與股東往來**不寫進 c.assets / c.liabilities**，一律由 ownerBalanceSheet() 現算。
   2) 第一批只要五個數字就算「填了」——輸入量一大就沒人填，模組會空轉。

/* ── 財報勾稽檢核（驗算層）──
   唯一真相在 src/lib/bizAudit.ts；這裡是 lantu-app.html 用的鏡像實作，
   src/lib/bizModule.test.ts 會「跑同一份 fixture 比對兩邊輸出」，改一邊沒改另一邊測試會紅。

   為什麼要有這一層：財報與 401 是少數「可以自我驗算」的文件。有恆等式在，
   一個 key 錯的數字（78,000,000 打成 7,800,000）當場就會露餡；沒有的話，
   它會安靜地把整合式個人資產負債表、股權估值、遺產稅全部帶偏，畫面上完全看不出來。

   這一層也是「財報拍照擷取」的落地基礎（見專案記憶 財報擷取_待金鑰）：
   擷取只是換掉輸入方式，回來的數字一樣要跑這一套才准自動填。

   三個語意原則（別「順手優化」掉）：
     1. 原料不足一律 'na'，絕不當成 'ok'。
     2. 只說「對不起來」，不改資料、不擋存檔。
     3. 「對不起來不是罪，說不出理由才是」——填了原因就從 fail 降成 warn。 */
var AUDIT_TOL=1000, AUDIT_TOL_RATE=0.02;
var RECONCILE_REASONS=['開票時點與收入認列時點差異','外銷零稅率（收入認列與報關時點不同）','非營業收入（利息、租金、處分資產）未開發票','預收款已開票但尚未認列收入','視為銷貨（自用、贈送、樣品）','跨期折讓與退回','免稅銷售額','其他（請於備註說明）'];
var AUDIT_ID_TITLE={'vat.outTax':'銷項稅額 ＝（銷售額 − 零稅率）× 5%','vat.payable':'111 本期應納 ≤ 107 − 108（上期留抵會再抵掉一段）','vat.exclusive':'應納與留抵不會同時大於 0','vat.zero':'零稅率銷售額 ≤ 總銷售額'};

function aHas(v){return v!==''&&v!==null&&v!==undefined&&isFinite(Number(v))}

function aFmt(v){return Math.round(v).toLocaleString('zh-TW')}

function crossCheck(c){
 var years=Array.isArray(c&&c.bizYears)?c.bizYears:[];
 var vats=Array.isArray(c&&c.vat401)?c.vat401:[];
 var recs=Array.isArray(c&&c.reconcile)?c.reconcile:[];
 var empty={vatTotal:0,bookRev:0,diff:0,rate:0,explained:0,unexplained:0,year:0};
 if(!vats.length||!years.length)return Object.assign({},empty,{status:'na',detail:(!vats.length?'尚未填 401 期別':'尚未填三年財務摘要')});
 var latest=years.slice().sort(function(a,b){return n(b.year)-n(a.year)})[0];
 var year=n(latest.year),bookRev=n(latest.rev);
 if(!bookRev)return Object.assign({},empty,{status:'na',year:year,detail:year+' 年度尚未填營收'});
 var vatTotal=sum(vats,function(v){return n(v.sales)});
 var diff=vatTotal-bookRev;
 var explained=sum(recs,function(r){return n(r.year)===year?n(r.amount):0});
 var unexplained=diff-explained;
 var rate=aRate(unexplained,bookRev);
 var status=rate<=AUDIT_TOL_RATE?'ok':(rate<=0.1?'warn':'fail');
 return {status:status,vatTotal:vatTotal,bookRev:bookRev,diff:diff,rate:rate,explained:explained,unexplained:unexplained,year:year,detail:''};
}

function bizAudit(c){

 var sorted=years.slice().sort(function(a,b){return n(b.year)-n(a.year)});

 }else{

   for(var i=0;i<sorted.length-1;i++){var ya=sorted[i],yb=sorted[i+1];
    if(aHas(ya.rev)&&aHas(yb.rev)&&n(yb.rev)>0&&aRate(n(ya.rev)-n(yb.rev),n(yb.rev))>0.5)jumps.push(n(yb.year)+'→'+n(ya.year)+' 營收 '+aFmt(n(yb.rev))+' → '+aFmt(n(ya.rev)));}
   push('is.trend','損益表','三年趨勢無異常跳動',jumps.length?'fail':'ok',
    jumps.length?jumps.join('；'):sorted.length+' 個年度，年增率都在 ±50% 以內',
    '單年變動超過五成通常有事（單一大案、業務轉型、或 key 錯位數），請確認並說明');}
 }

 if(!vats.length){
  ['vat.outTax','vat.payable','vat.exclusive','vat.zero'].forEach(function(id){
   push(id,'401 內部',AUDIT_ID_TITLE[id],'na','尚未填 401 期別','在公司概況的「近 6 期 401」補上')});
 }else{
  var withTax=vats.filter(function(v){return aHas(v.outTax)});
  if(!withTax.length)push('vat.outTax','401 內部',AUDIT_ID_TITLE['vat.outTax'],'na','尚未填「銷項稅額(107)」（選填）','填了才驗得動 5% 這條');
  else{var wrong=withTax.filter(function(v){return !aNear(n(v.outTax),(n(v.sales)-n(v.zeroRate))*0.05)});
   push('vat.outTax','401 內部',AUDIT_ID_TITLE['vat.outTax'],wrong.length?'fail':'ok',
    wrong.length?wrong.map(function(v){return v.period+'：應稅 '+aFmt(n(v.sales)-n(v.zeroRate))+' × 5% ＝ '+aFmt((n(v.sales)-n(v.zeroRate))*0.05)+'，表上是 '+aFmt(n(v.outTax))}).join('；')
     :withTax.length+' 期都對得上',
    '二聯式發票金額是含稅的，換算時要除以 1.05——這是最常見的填報錯誤之一');}

  var withBoth=vats.filter(function(v){return aHas(v.outTax)&&aHas(v.inTax)});
  if(!withBoth.length)push('vat.payable','401 內部',AUDIT_ID_TITLE['vat.payable'],'na','尚未填銷項(107)與進項(108)稅額（選填）','兩欄都填了才驗得動這條');
  // 刻意只驗上界，不驗等號：111 還會被**上期留抵**再抵掉一段，
  // 而表上只有「本期累積留抵(115)」、沒有「上期留抵」，硬要求相等會把正常的案子誤判成錯。
  else{var w2=withBoth.filter(function(v){var net=n(v.outTax)-n(v.inTax);return net>=0?n(v.payable)>net+AUDIT_TOL:!aNear(n(v.payable),0)});
   push('vat.payable','401 內部',AUDIT_ID_TITLE['vat.payable'],w2.length?'fail':'ok',
    w2.length?w2.map(function(v){return v.period+'：107 '+aFmt(n(v.outTax))+' − 108 '+aFmt(n(v.inTax))+' ＝ '+aFmt(n(v.outTax)-n(v.inTax))+'，111 卻填 '+aFmt(n(v.payable))}).join('；')
     :withBoth.length+' 期都在合理範圍',
    '應納稅額不可能超過「銷項減進項」；進項大於銷項時 111 應為 0，差額走 112 溢付與 115 留抵');}

  var both=vats.filter(function(v){return n(v.payable)>0&&n(v.carry)>0});
  push('vat.exclusive','401 內部',AUDIT_ID_TITLE['vat.exclusive'],both.length?'fail':'ok',
   both.length?both.map(function(v){return v.period+'：應納 '+aFmt(n(v.payable))+' 與留抵 '+aFmt(n(v.carry))+' 同時大於 0'}).join('；')
    :vats.length+' 期都沒有同時出現',
   '同一期要嘛應納、要嘛留抵，不會兩個都有——通常是把不同期的數字填在同一列');

  var zb=vats.filter(function(v){return n(v.zeroRate)>n(v.sales)+AUDIT_TOL});
  push('vat.zero','401 內部',AUDIT_ID_TITLE['vat.zero'],zb.length?'fail':'ok',
   zb.length?zb.map(function(v){return v.period+'：零稅率 '+aFmt(n(v.zeroRate))+' > 銷售額 '+aFmt(n(v.sales))}).join('；')
    :vats.length+' 期的零稅率都在銷售額之內',
   '零稅率銷售額是總銷售額的一部分，不可能比它大');
 }

 var rc=crossCheck(c);
 if(rc.status==='na')push('x.vat-vs-is','跨文件','6 期 401 銷售額合計 vs 損益表營業收入','na',rc.detail,'兩邊都填了才對得起來');
 else push('x.vat-vs-is','跨文件','6 期 401 銷售額合計 vs 損益表營業收入',rc.status,
  '401 合計 '+aFmt(rc.vatTotal)+'　帳載營收 '+aFmt(rc.bookRev)+'　差額 '+aFmt(rc.diff)+'（'+(rc.rate*100).toFixed(1)+'%）'+
  (rc.explained?'　已說明 '+aFmt(rc.explained)+'　未解釋 '+aFmt(rc.unexplained):''),
  '這是國稅局最基本的查核動作。對不起來不是罪，說不出理由才是——用下方的差異調節表逐項說明');

 var b1=[['年營收',co.annualRevenue,'rev'],['稅後淨利',co.netProfit,'net'],['總資產',co.totalAsset,'asset'],['總負債',co.totalDebt,'debt']];
 var latest=sorted[0];
 if(!latest)push('x.batch1','跨文件','第一批五個數字 vs 三年財務摘要','na','尚未填三年財務摘要','補上最新年度即可比對');
 else{var mm=b1.filter(function(f){return aHas(f[1])&&aHas(latest[f[2]])&&!aNear(n(f[1]),n(latest[f[2]]))});
  push('x.batch1','跨文件','第一批五個數字 vs 三年財務摘要',mm.length?'fail':'ok',
   mm.length?mm.map(function(f){return f[0]+'：第一批 '+aFmt(n(f[1]))+'　'+n(latest.year)+' 年度 '+aFmt(n(latest[f[2]]))}).join('；')
    :'與 '+n(latest.year)+' 年度一致',
   '兩邊指的是同一年就該一樣。常見成因是先填了第一批，後來補三年財報時改了數字卻沒回頭改');}
 return out;
}
function auditSummary(items){

 return {ok:by('ok'),warn:by('warn'),fail:by('fail'),na:by('na'),total:items.length};
}

// ── E2 公私勾稽：整合式個人資產負債表的原料 ──

 var ch=tableSec('五條資金通道','channels',c.channels,[['kind','通道','sel:薪資,董監酬勞,盈餘分配(股利),租金,借款,費用報銷'],['annual','年金額','money'],['withhold','扣繳','sel:已辦,未辦,不適用'],['doc','書面憑證','sel:齊全,部分,無'],['note','備註','text']],
  '公司的錢合法變成你的錢只有這五條路，<b>不能有第六種</b>。原則是「先定性、再匯款」——沒有名目就不要匯。這一版只登錄與檢核，不進個人現金流試算（回流留待「報酬結構」那一波）。');
 var warn=[];
 (c.ownerLoans||[]).forEach(function(x){
  if(x.dir==='公司借我'&&n(x.amount)>0&&x.interest!=='是')warn.push('股東往來有「公司借我」'+fmt(x.amount)+' 且未計息 → 依所得稅法可能被<b>設算利息收入課稅</b>（公司要為你沒付的利息繳稅）。');
  if(x.dir==='公司借我'&&n(x.amount)>0&&x.crossYear==='是')warn.push('「公司借我」跨年度掛帳 → 金額大且長期不還，可能被認定為<b>變相盈餘分配</b>，補課股利所得稅。建議至少每年結清一次。');

 });

// ── 整合式個人資產負債表 ──
// 刻意是「現算的衍生視圖」而不是寫進 c.assets/c.liabilities：
// 股權不流通、不可分割、估值困難，進了那兩個陣列就會被引擎當成可變現資產，退休缺口會憑空消失。
function ownerBalanceSheet(c){
 var A=[],L=[];
 var personalAsset=sum(c.assets,function(a){return aVal(a)});
 var ownHouse=sum(c.assets,function(a){return (a.type==='不動產'&&a.mainCat==='自用資產')?aVal(a):0});
 var equity=equityTotal(c);
 var loanNet=ownerLoanNet(c);            // 正＝公司欠我（債權）；負＝我欠公司（債務）
 var personalDebt=sum(c.liabilities,function(l){return lBal(l)});
 var guarantee=guaranteeTotal(c);
 A.push({label:'個人資產（收支資債頁登錄）',v:personalAsset,note:'現金、金融資產、不動產等'});
 if(equity)A.push({label:'自家公司股權',v:equity,note:'以'+((mainCompany(c)||{}).valueMethod||'淨值法')+'估算',illiquid:true});
 if(loanNet>0)A.push({label:'對公司的債權（股東往來）',v:loanNet,note:'實質上是應收——但收得回來嗎？',illiquid:true});
 L.push({label:'個人負債（收支資債頁登錄）',v:personalDebt,note:'房貸、車貸、信貸等'});
 if(loanNet<0)L.push({label:'對公司的債務（股東往來）',v:-loanNet,note:'公司借給你的錢'});
 var at=sum(A,function(x){return x.v}),lt=sum(L,function(x){return x.v});
 var net=at-lt;
 var liquidNet=net-equity-ownHouse-(loanNet>0?loanNet:0);
 return {A:A,L:L,assetTotal:at,liabTotal:lt,net:net,liquidNet:liquidNet,equity:equity,ownHouse:ownHouse,
  guarantee:guarantee,coverage:guarantee>0?liquidNet/guarantee:null,loanNet:loanNet};
}

 bs=bs||ownerBalanceSheet(c);

  '<table class="rtable"><tr><th>資產</th><th>金額</th><th>備註</th></tr>'+bs.A.map(row).join('')+

  '<tr><td class="k"><b>負債合計</b></td><td><b>'+fmt(bs.liabTotal)+'</b></td><td></td></tr>'+
  '<tr><td class="k">個人連帶保證</td><td style="color:var(--warn)">'+fmt(bs.guarantee)+'</td><td class="muted" style="font-size:12px"><b>或有負債，不計入淨值但必須揭露</b></td></tr></table>'+
  '<div class="big3" style="margin-top:12px">'+
   '<div class="b"><div class="l">淨值</div><div class="v">'+fmt(bs.net)+'</div></div>'+
   '<div class="b"><div class="l">流動性淨值</div><div class="v" style="color:var(--amber2)">'+fmt(bs.liquidNet)+'</div></div>'+

  detailBox('這兩個數字怎麼算的',kvTbl([
   ['淨值 ＝ 資產合計 − 負債合計',Math.round(bs.net)],
   ['減：自家公司股權（不流通、不可分割）',-Math.round(bs.equity)],
   ['減：自住不動產（賣掉就沒地方住）',-Math.round(bs.ownHouse)],
   ['減：對公司的債權（收回時點不由你決定）',-Math.round(bs.loanNet>0?bs.loanNet:0)],
   ['＝ 流動性淨值　←　這才是真正可以動用的',Math.round(bs.liquidNet),'var(--amber2)'],
   ['連帶保證總額',Math.round(bs.guarantee)],

  '<div class="hint" style="margin-top:8px">多數企業主從來沒有一張真實的個人資產負債表。<b>做出這張表本身就是高價值的交付物</b>——而當客戶看到「流動性淨值」那個數字時，規劃需求通常就自己浮現了。覆蓋率遠低於 1，代表這個家庭暴露在極大的風險中。'+
  '<br>※ 股權與股東往來只在這張表上呈現，<b>不會被寫進「收支資債」</b>，也不會被當成可投資資產拿去跑退休現金流。請不要在收支資債頁重複登錄。</div></div>';
}

  S(4,'負債比高且借款有個人連帶保證',debtRatio==null?null:(debtRatio>0.6&&guaTot>0),'個人實質上承擔無限責任——有限責任是假的','保障規劃（壽險額度須覆蓋保證債務）、負債重整、保證條件談判','linkage'),
  S(5,'未分配盈餘連年累積、金額龐大',has(co.retained)?(n(co.retained)>0&&n(co.retained)>=n(co.netProfit)*3):null,'每年被加徵 5%；且股權價值同步墊高 → 未來遺贈稅負增加','盈餘分配策略、傳承時程規劃、產創條例實質投資減除評估','company'),
  S(6,'公司名下持有非營運資產',(c.bizAssets||[]).some(function(x){return n(x.value)>0}),'持有主體選擇可能未經評估；營運風險與資產風險沒有隔離','資產持有主體規劃（公司 vs 個人 vs 控股）、風險隔離','linkage'),

/* ── E3 報酬結構 ──
   五條通道的最適化不是「哪一條最省稅」，是「總稅負 ＋ 總保障 ＋ 總退休準備」一起看。
   例如：薪資可以壓低營所稅，但會拉高個人綜所稅與勞健保成本——
   同時它也是唯一能累積勞保勞退年資、撐起貸款條件的一條。沒有標準答案。
   ⚠️ 專業邊界：本區塊只做結構試算與取捨呈現，不對具體稅額或申報方式做保證。 */
function compScenario(c,s){
 var tp=c.taxParams||{};
 var salary=n(s.salary),div=n(s.dividend),rent=n(s.rent);
 // 公司端：薪資與租金可列費用（連同雇主負擔的勞退），股利來自稅後盈餘、不可列費用
 var pension=Math.min(salary,LABOR_PENSION_CAP*12)*0.06;   // 雇主勞退提繳 6%，上限吃月提繳工資 15 萬
 var deductible=salary+rent+pension;
 var corpSave=deductible*PROFIT_TAX_RATE;
 // 個人端：薪資走薪資特別扣除，租金可減除必要費用，股利兩制擇優
 var rentNet=rent*(1-RENT_EXPENSE_RATE);
 var people=1+(tp.married?1:0)+n(tp.dependents);
 // 這三個數字與 incomeTax() 用的是同一組（免稅額 / 標準扣除 / 薪資特別扣除）
 var exempt=97000*people;
 var stdDed=tp.married?262000:131000;
 var salarySpecial=Math.min(salary,218000);
 var baseNet=function(extra){return Math.max(0,salary+rentNet+extra-exempt-stdDed-salarySpecial-n(tp.otherDeduction))};
 var merged=bracket(baseNet(div),TAX_BR).tax-Math.min(div*DIVIDEND_CREDIT_RATE,DIVIDEND_CREDIT_CAP);
 var separate=bracket(baseNet(0),TAX_BR).tax+div*DIVIDEND_SEPARATE_RATE;
 var mergedBetter=merged<=separate;
 var incomeTaxAmt=Math.max(0,Math.min(merged,separate));
 // 二代健保補充保費：股利單筆達門檻才扣
 var nhi=div>=NHI_SUPP_MIN?div*NHI_SUPP_RATE:0;
 var personal=incomeTaxAmt+nhi;
 return {name:s.name,salary:salary,dividend:div,rent:rent,pension:pension,
  deductible:deductible,corpSave:corpSave,rentNet:rentNet,
  merged:merged,separate:separate,mergedBetter:mergedBetter,incomeTax:incomeTaxAmt,nhi:nhi,
  personal:personal,netCost:personal-corpSave,
  takeHome:salary+div+rent-personal,
  loanCapacity:salary*8,                       // 銀行常用的年收入倍數，粗估
  hasPension:salary>0};
}
/* 五條資金通道 → 收支資債的收入列。

var CHANNEL_INCOME_MAP={
 '薪資':{type:'工作',subType:'薪資',name:'公司薪資'},

};

 (c.channels||[]).forEach(function(x){

  out.push({src:'ch:'+x.kind,name:m.name,owner:pm.name||'本人',type:m.type,subType:m.subType,
   period:'年',amount:n(x.annual),growth:m.type==='工作'?2:0,start:age,end:m.type==='工作'?retire:n((c.params||{}).horizon)||85});
 });
 return out;
}

 c.incomes=(c.incomes||[]).filter(function(i){return String(i.src||'').indexOf('ch:')!==0}).concat(rows);

function channelSyncStatus(c){

/* ── E6 退場與傳承 ──

 return '<div class="folded" style="border-style:solid;border-color:rgba(143,192,163,.32);color:var(--mut);display:block">'+
   '企業主體 · 退場與傳承<span>「如果明天你想退休，這家公司在沒有你的情況下還值多少錢？」——多數企業主答不出來，而這個答案決定了他的退休金到底存不存在。</span></div>'+

 var pnl=sum(c.assets,function(a){return (n(a.value)-n(a.cost))*(n(a.fxRate)||1)});
 var pas=assetPassive(c);
 return '<div class="sec"><h4>資產總覽（換算台幣）</h4><div class="big3"><div class="b"><div class="l">資產總額</div><div class="v">'+fmt(tot)+'</div></div><div class="b"><div class="l">流動(可投資)</div><div class="v">'+fmt(liq)+'</div></div><div class="b"><div class="l">被動現金流(年)</div><div class="v">'+fmt(pas)+'</div></div><div class="b"><div class="l">未實現損益</div><div class="v" style="color:'+(pnl>=0?'var(--ok)':'var(--warn)')+'">'+fmt(pnl)+'</div></div></div><div class="hint" style="margin-top:8px">現值、購入價、被動現金流以「原幣」輸入，系統依匯率換算台幣統計。</div></div>'+tbl;

// months<=0 時分母 (1+i)^0−1 = 0 → Infinity，會原字串印到畫面（「月繳 Infinity」）。
function pmt(bal,rate,months){months=n(months);if(!(months>0))return 0;var i=n(rate)/12/100;if(i<=0)return n(bal)/months;return n(bal)*i*Math.pow(1+i,months)/(Math.pow(1+i,months)-1)}
// 貸款剩餘本金（本息攤還）。舊版用「餘額 − 月繳×12×年數」線性遞減，把每期利息也當本金攤掉，
// 2% 的 1000 萬房貸第 10 年會少算約 170 萬負債，生涯藍圖的淨資產因此系統性樂觀。
function lRemain(l,age,a0){
 var sa=n(l.startAge)||a0; if(age<sa)return 0;
 var P=lBal(l); if(P<=0)return 0;
 var k=Math.max(0,Math.round((age-sa)*12));
 var total=n(l.months); if(total>0)k=Math.min(k,total);
 var i=n(l.rate)/12/100, pay=lPay(l);
 if(pay<=0)return P;
 if(i<=0)return Math.max(0,P-pay*k);
 var f=Math.pow(1+i,k);
 return Math.max(0,Math.min(P,P*f-pay*(f-1)/i));
}

 // 保費類型留空＝由 premiumType() 依險種細分推，教練可在保單卡上覆寫。

 ['surrender','benefits','paybacks'].forEach(function(k){if(!Array.isArray(p[k]))p[k]=[];});
 return p;}

// 附約要掛在哪張主約底下（同一位被保人的主約優先列出）。
function riderParentSel(c,p,i){
 var mains=(c.policies||[]).map(function(x,j){return [x,j];}).filter(function(q){
  return q[0]!==p&&q[0].policyKind!=='附約';
 });
 mains.sort(function(a,b){
  var sa=(a[0].insured===p.insured)?0:1,sb=(b[0].insured===p.insured)?0:1;return sa-sb;
 });
 var opts='<option value="">（未指定主約）</option>'+mains.map(function(q){
  var x=q[0];
  return '<option value="'+esc(x.pid)+'" '+(p.riderOf===x.pid?'selected':'')+'>'+esc(x.name||x.subtype||'未命名')+(x.insured?'（'+esc(x.insured)+'）':'')+'</option>';
 }).join('');
 return '<div class="f"><label>所屬主約</label><select onchange="set(\'policies:'+i+'\',\'riderOf\',this.value)">'+opts+'</select></div>';
}

// 從主約卡片直接長一張附約：被保人／要保人／保險公司都跟著主約走，省得重打。
function addRider(i){
 var c=activeCase();if(!c)return;
 var main=(c.policies||[])[i];if(!main)return;
 ensurePolicy(main);
 addRow('policies');
 var p=c.policies[c.policies.length-1];
 p.policyKind='附約';p.riderOf=main.pid;
 p.insured=main.insured;p.owner=main.owner;p.insurer=main.insurer;
 p.bigCat=main.bigCat;
 p.subtype=(POLICY_SUB[main.bigCat]||[])[0]||'';
 p.name='';
 save();render();
 setTimeout(function(){jumpPolicy(c.policies.length-1);},0);
}
function jumpPolicy(j){
 var el=document.querySelector('.pcard[data-polidx="'+j+'"]');
 if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
}
function policiesSec(c){
 c.policies=c.policies||[];
 ensurePolicies(c);
 // 顯示順序：主約 → 掛在它底下的附約 → …… → 孤兒附約（沒指定主約的）排最後。
 var idx=c.policies.map(function(p,i){return [p,i];});
 var seq=[],used={};
 idx.forEach(function(q){
  if(q[0].policyKind==='附約')return;
  seq.push(q);used[q[1]]=1;
  idx.forEach(function(r){if(r[0].policyKind==='附約'&&r[0].riderOf===q[0].pid){seq.push(r);used[r[1]]=1;}});
 });
 idx.forEach(function(q){if(!used[q[1]])seq.push(q);});
 var cards=seq.map(function(q){return policyCard(c,q[0],q[1]);}).join('')||'<div class="sec"><div class="muted" style="padding:6px">尚無保單，點下方「＋ 新增保單」逐張登錄。</div></div>';

 var mems=[...new Set((c.policies||[]).map(function(p){return p.insured}).filter(Boolean))];
 var stat=mems.map(function(mm){var cells=KINDS.map(function(k){var f=POLICY_MAP[k];return '<td>'+fmt(sum(c.policies,function(p){return p.insured===mm?n(p[f]):0}))+'</td>'}).join('');
  return '<tr><td class="k">'+esc(mm)+'</td>'+cells+'</tr>'}).join('');
 var totPrem=sum(c.policies,function(p){return n(p.premium)});
 var propPrem=sum(c.policies,function(p){return p.bigCat==='產物'?n(p.premium):0});
 var statTbl=mems.length?'<div class="sec"><h4>人身保障統計 <span class="hint">年繳保費合計 '+fmt(totPrem)+'（其中產險 '+fmt(propPrem)+'）</span></h4><table class="rtable"><tr><th>被保人</th>'+KINDS.map(function(k){return '<th>'+k+'</th>'}).join('')+'</tr>'+stat+'</table></div>':'';
 return '<div class="ppband">現有保單 <span class="hint">逐張加厚登錄：人身／產物 · 主附約 · 關係人 · 期間狀態 · 理賠條件</span></div>'+cards+addBtn+statTbl;
}

// ===== 保單檢查報告 UI（2026/08/24）=====
// 版面規矩沿用專案通則：首屏＝一張主圖 ＋ 3 個數字，其餘一律 <details> 收合。
// 主圖刻意做成「以 NEED 為 100% 的達成率棒」，因為三張表的單位不同（元／元每日／元每月），
// 直接畫金額會讓「住院醫療 9,600 元/日」看起來比「人壽 920 萬」小到不存在。
function checkupTone(state,K){return state==='low'?K.GAP:(state==='high'?K.AMB:K.OK);}
function checkupPill(r){
 var cls=r.state==='low'?'ck-low':(r.state==='high'?'ck-high':'ck-mid');
 return '<span class="ckpill '+cls+'">'+r.label+'</span>';
}
function checkupDirText(r){
 if(r.state==='mid')return '不須調整';
 return r.dir+' '+fmt(r.delta)+' '+esc(r.unit);
}
// 五欄比對表：項目｜現在保單 HAVE｜現在需求 NEED｜狀況｜調整方向 READJUST
function checkupTable(rows,opts){
 opts=opts||{};
 if(!rows.length)return '<div class="muted" style="padding:8px">'+(opts.empty||'尚無可比對的項目。')+'</div>';
 var spanCol=rows.some(function(r){return r.span;});
 var head='<tr><th>項目</th>'+(spanCol?'<th>期間</th>':'')+
  '<th class="ckn">現在保單 <span class="ckhv">HAVE</span></th>'+
  '<th class="ckn">現在需求 <span class="cknd">NEED</span></th>'+
  '<th>狀況</th><th>調整方向 <span class="ckrj">READJUST</span></th></tr>';
 var body=rows.map(function(r){
  return '<tr><td class="k">'+esc(r.item)+'</td>'+
   (spanCol?'<td class="muted" style="font-size:11.5px">'+esc(r.span||'—')+'</td>':'')+
   '<td class="ckn ckhave">'+(r.have>0?fmt(r.have)+' '+esc(r.unit):'—')+'</td>'+
   '<td class="ckn ckneed">'+(r.need>0?fmt(r.need)+' '+esc(r.unit):'—')+'</td>'+
   '<td>'+checkupPill(r)+'</td>'+
   '<td class="'+(r.state==='mid'?'muted':'ckdir')+'">'+checkupDirText(r)+'</td></tr>';
 }).join('');
 return '<div class="cktblwrap"><table class="rtable cktbl">'+head+body+'</table></div>';
}
// SVG 沒有自動換行，也沒有 text-overflow：字太長就直接畫到 viewBox 外面被裁掉。
// 2026/08/25 Ray 回報主圖左側標籤被切成「平面車位・屋齡5-10年）」「低標準 中古車 180 萬）」——
// 目標名稱是教練自己打的，長度不受控，光靠加寬左欄永遠會有更長的一個。
// 估寬：CJK／全形標點約等於字級，半形字母數字約 0.55 倍（在 12px 下實測夠準）。
function svgTextW(str,fs){
 var w=0;str=String(str||'');
 for(var i=0;i<str.length;i++){
  var ch=str.charCodeAt(i);
  w+=(ch>0x2e80)?fs:fs*0.55;   // 0x2E80 以上＝中日韓與全形標點
 }
 return w;
}
// 截到放得下為止，尾巴補刪節號。回傳 {text, full, cut}
function svgFitText(str,maxW,fs){
 str=String(str||'');
 if(svgTextW(str,fs)<=maxW)return {text:str,full:str,cut:false};
 var ell=svgTextW('…',fs),out='',w=0;
 for(var i=0;i<str.length;i++){
  var cw=svgTextW(str.charAt(i),fs);
  if(w+cw+ell>maxW)break;
  out+=str.charAt(i);w+=cw;
 }
 return {text:out+'…',full:str,cut:true};
}
// 主圖：每一列一條軌，NEED 在 62.5% 處畫一條目標線，HAVE 依達成率填色。
// ⚠️ W 必須與 CSS 的 .ckchart svg{max-width} 同一個值：SVG 的字級是使用者單位，
//    容器一旦比 viewBox 寬，字就跟著等比放大（見 .ckchart 的註解）。改一邊要改兩邊，
//    policyCheckupUI.test.ts 釘住。
function checkupChartSVG(c,theme){
 var K=planChartColors(theme);
 var rows=[].concat(premiumCheckup(c).rows,coverageCheckupRows(c),paybackCheckupRows(c))
   .filter(function(r){return r.need>0||r.have>0;});
 if(!rows.length)return '<div class="muted" style="padding:14px">先在「保障需求」建立需求、在「現有保單」登錄保單，這張圖就會出現。</div>';
 // LBW＝左側標籤欄寬。加寬只是治標（名稱長度不受控），真正的防線是下面的 svgFitText()。
 var LBW=210,PR=104,W=900,rowH=26,pT=26,pB=18,LBFS=12,LBMAX=LBW-10;
 var H=pT+rows.length*rowH+pB;
 var trackW=W-LBW-PR,needX=LBW+trackW*0.625;
 var out=['<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="保單檢查：現在保單對現在需求">'];
 out.push('<text x="'+LBW+'" y="14" font-size="10.5" fill="'+K.MUT+'">以「現在需求 NEED」為 100%</text>');
 out.push('<line x1="'+needX.toFixed(1)+'" y1="18" x2="'+needX.toFixed(1)+'" y2="'+(H-pB+4)+'" stroke="'+K.ZERO+'" stroke-dasharray="3 3"/>');
 out.push('<text x="'+(needX+4).toFixed(1)+'" y="14" font-size="10" fill="'+K.LAB+'" font-weight="700">NEED</text>');
 rows.forEach(function(r,i){
  var y=pT+i*rowH,bh=11,by=y+4;
  var pct=r.need>0?r.have/r.need:(r.have>0?1.6:0);
  var w=Math.max(0,Math.min(pct,1.6))*trackW*0.625;
  var col=checkupTone(r.state,K);
  out.push('<rect x="'+LBW+'" y="'+by+'" width="'+trackW.toFixed(1)+'" height="'+bh+'" rx="4" fill="'+K.TRACK+'"/>');
  if(w>0)out.push('<rect x="'+LBW+'" y="'+by+'" width="'+w.toFixed(1)+'" height="'+bh+'" rx="4" fill="'+col+'"/>');
  var lb=svgFitText(r.item,LBMAX,LBFS);
  out.push('<text x="'+(LBW-8)+'" y="'+(by+9)+'" font-size="'+LBFS+'" fill="'+K.LAB+'" text-anchor="end">'+
   (lb.cut?'<title>'+esc(lb.full)+'</title>':'')+esc(lb.text)+'</text>');
  out.push('<text x="'+(W-PR+8)+'" y="'+(by+9)+'" font-size="11.5" fill="'+col+'" font-weight="700">'+
   (r.need>0?Math.round(pct*100)+'%':'—')+'</text>');
 });
 out.push('</svg>');
 return '<div class="ckchart">'+out.join('')+'</div>';
}
// 調整方式：一句自動生成的調整重點 ＋ 逐險種手法 ＋ 可調整的契約明細。

        down:'先動定期壽險（降低保額、縮短保障期間），因其現金價值低、調降的損失也低；不夠再考慮終身型（降低保額、增值型改平準型、改定期型）。'},
 '意外傷殘':{up:'直接從保單中意外險的契約著手調整，或新加保意外險契約；同時檢視被保人職業等級是否登錄正確。',
        down:'意外險保費低、槓桿高，通常不建議調降；若確實過高，先減額而非解約。'},

 '初次罹癌':{up:'一次金補的是治療與生活重整，優先於住院日額。',down:'先減額，保留一次金的核心額度。'},

 '理財型保費':{up:'從保單中理財型的部份調高，或新加保理財型契約；另可檢視為親屬繳費的保單是否有可調低的部份。',down:'理財型保費偏高時，先確認保障是否已足額——保障不足卻先做理財，順序是反的。'}
};
function checkupAdviceHTML(c,rows,title){
 var bad=rows.filter(function(r){return r.state!=='mid';});
 if(!bad.length)return '<div class="ckok">此區各項落在適中帶內，不須調整。</div>';
 var lows=bad.filter(function(r){return r.state==='low';}).map(function(r){return r.item;});
 var highs=bad.filter(function(r){return r.state==='high';}).map(function(r){return r.item;});
 // 截長補短：先把偏高的調低，才有預算把偏低的調高。
 var lead='<div class="cklead"><b>調整重點</b>　'+
  (highs.length?'可先將 <em>'+highs.map(esc).join('、')+'</em> 的部份<b>調低</b>':'')+
  (highs.length&&lows.length?'，再依據自己的預算將 ':(lows.length?'可依據自己的預算將 ':''))+
  (lows.length?'<em>'+lows.map(esc).join('、')+'</em> 的部份<b>調高</b>':'')+'。</div>';
 var blocks=bad.map(function(r){
  var how=(READJUST_HOW[r.item]||{})[r.state==='low'?'up':'down']||'';
  return '<div class="ckblk"><div class="ckblkh">'+esc(r.item)+' · '+(r.state==='low'?'調高':'調低')+'的方式</div>'+
   (how?'<p>'+esc(how)+'</p>':'')+
   checkupContractsHTML(c,r.item)+'</div>';
 }).join('');
 return '<details class="ckadv"><summary>'+esc(title)+'：調整方式（含可調整的契約明細）</summary><div class="ckadvbody">'+lead+blocks+'</div></details>';
}
// 可調整的契約明細：把「該調多少」變成「該動哪一列」。
// 只列該險種底下實際有保額的契約，契約被保人限「保戶、配偶」（子女不分擔家庭責任）。
function checkupContractsHTML(c,kind){
 var f=POLICY_MAP[kind];
 var earners=(c.members||[]).filter(function(m){return isEarnerRole(m.role);}).map(function(m){return m.name;});
 var list;
 if(f){
  list=(c.policies||[]).map(function(p,i){return [p,i];}).filter(function(q){
   return policyActive(q[0])&&n(q[0][f])>0&&(!earners.length||earners.indexOf(q[0].insured)>=0);
  });
 }else{
  var want=(kind==='理財型保費')?'理財型':'保障型';
  list=(c.policies||[]).map(function(p,i){return [p,i];}).filter(function(q){
   return policyActive(q[0])&&premiumType(q[0])===want&&n(q[0].premium)>0;
  });
 }
 if(!list.length)return '<div class="muted" style="font-size:12px;padding:4px 0">目前沒有可直接調整的契約——需要新加保。</div>';
 var rows=list.map(function(q){
  var p=q[0],i=q[1];
  return '<tr><td class="k">'+esc(p.name||p.subtype||'（未命名）')+'</td>'+
   '<td>'+esc(p.insurer||'—')+'</td><td>'+esc(p.insured||'—')+'</td>'+
   '<td>'+esc(p.policyKind||'主約')+'</td><td>'+esc(p.effDate||'—')+'</td>'+
   '<td class="calc">'+(f?fmt(n(p[f])):fmt(n(p.premium)))+'</td>'+
   '<td>'+esc(premiumType(p))+'</td>'+
   '<td><button class="tbtn" onclick="jumpPolicy('+i+')">前往編輯</button></td></tr>';
 }).join('');
 return '<div class="ckconwrap"><table class="rtable ckcon"><tr><th>契約名稱</th><th>公司</th><th>被保人</th><th>主/附</th><th>生效日</th><th>'+(f?'保額':'年繳保費')+'</th><th>保費類型</th><th></th></tr>'+rows+'</table></div>';
}
// 保單運算日／需求統計日：需求資料多舊，用「距離今天」講清楚。
function checkupDatesHTML(c){
 var today=new Date();
 var run=today.getFullYear()+'. '+(today.getMonth()+1)+'. '+today.getDate();
 var raw=(c.needsAt||'').toString().slice(0,10);
 if(!raw)return '<div class="ckdates"><span>保單運算日 <b>'+run+'</b></span>'+
  '<span>需求統計日 <b>尚未統計</b><span class="ckaway">先到下方「保障需求」建一張</span></span></div>';
 var d0=new Date(raw.replace(/-/g,'/'));
 var away='';
 if(!isNaN(d0.getTime())){
  var days=Math.max(0,Math.floor((today-d0)/86400000));
  // 每隔 2 年（或情況改變）就該重跑一次需求——超過就把這一行變成警示色。
  var stale=days>=365*2;
  away='<span class="ckaway"'+(stale?' style="color:var(--warn)"':'')+'>距離今天 '+
   Math.floor(days/30)+' 個月 '+(days%30)+' 天'+(stale?'（建議重跑需求）':'')+'</span>';
 }
 return '<div class="ckdates"><span>保單運算日 <b>'+run+'</b></span><span>需求統計日 <b>'+
  esc(raw.replace(/-/g,'. '))+'</b>'+away+'</span></div>';
}

 var chart='<div class="sec ckhero"><h4>保單檢查報告 <span class="hint">現在的保單狀況，是否符合現在的需求</span></h4>'+

 var t1='<div class="sec"><h4>1 保費 <span class="hint">依理財金三角：保障型佔年收入 '+TRIANGLE_RISK+'%、理財型 '+TRIANGLE_INVEST+'%</span></h4>'+

 var t2='<div class="sec"><h4>2 保障 <span class="hint">需求來自「保障需求」三大塊；已備來自逐張保單與已備補充</span></h4>'+
  checkupTable(cov,{empty:'尚未建立保障需求。到下方「保障需求」為每位需要保障的成員建一張。'})+
  '<div class="hint">「住院醫療」之金額為定額給付＋實支實付之每日病房費。</div>'+
  checkupAdviceHTML(c,cov,'2 保障')+'</div>';
 var t3='<div class="sec"><h4>3 $領回 <span class="hint">理財目標所需 vs 已備＋保單可領回（$生存/$滿期/$祝壽/$年金/$投資）</span></h4>'+
  checkupTable(pay,{empty:'尚未建立退休或理財目標。'})+

 return chart+t1+t2+t3;
}

// ===== $領回報表（波3）=====
function paybackReportSec(c){
 var list=policyPaybacks(c);
 if(!list.length)return '<details class="ckfold"><summary>$領回報表 <span class="hint">尚未登錄任何領回</span></summary><div class="ckfoldbody"><div class="muted">在下方每張保單的「$領回」子表登錄：型別、領受人、起訖歲、金額。登錄後這裡會出現目錄／各保單／各年／領受人四張表。</div></div></details>';
 var A=n(c.profile.age),LE=n(c.profile.lifeExp)||90;
 var dir=list.map(function(b){
  return '<tr><td class="k">'+esc(b.policy)+'</td><td>'+esc(b.insurer||'—')+'</td><td>'+esc(b.type)+'</td>'+
   '<td>'+esc(b.receiver||'—')+'</td><td>'+b.ageFrom+(b.ageTo>b.ageFrom?'~'+b.ageTo:'')+' 歲</td>'+
   '<td>'+(b.freq>0?'每 '+b.freq+' 年':'一次')+'</td><td class="calc">'+fmt(b.amount)+'</td><td class="calc">'+fmt(paybackTotal(b))+'</td></tr>';
 }).join('');
 var byType={},tOrd=[];
 list.forEach(function(b){if(!byType[b.type]){byType[b.type]={t:b.type,total:0,n:0};tOrd.push(b.type);}byType[b.type].total+=paybackTotal(b);byType[b.type].n++;});
 var tRows=tOrd.map(function(k){var o=byType[k];return '<tr><td class="k">'+esc(o.t)+'</td><td>'+o.n+' 筆</td><td class="calc">'+fmt(o.total)+'</td></tr>';}).join('');
 var byRcv={},rOrd=[];
 list.forEach(function(b){var k=b.receiver||'（未指定）';if(!byRcv[k]){byRcv[k]={r:k,total:0,n:0};rOrd.push(k);}byRcv[k].total+=paybackTotal(b);byRcv[k].n++;});
 var rRows=rOrd.map(function(k){var o=byRcv[k];return '<tr><td class="k">'+esc(o.r)+'</td><td>'+o.n+' 筆</td><td class="calc">'+fmt(o.total)+'</td></tr>';}).join('');
 var yr=[];
 for(var a=A;a<=LE;a+=5){
  var a2=Math.min(a+4,LE);
  var amt=policyPaybackBetween(c,a,a2);
  if(amt>0)yr.push('<tr><td class="k">'+a+'~'+a2+' 歲</td><td class="calc">'+fmt(amt)+'</td></tr>');
 }
 var yRows=yr.join('')||'<tr><td colspan="2" class="muted">此區間無領回。</td></tr>';
 return '<details class="ckfold"><summary>$領回報表 <span class="hint">目錄 · 型別 · 各年 · 領受人（共 '+list.length+' 筆）</span></summary><div class="ckfoldbody">'+
  '<h5>領回目錄</h5><div style="overflow-x:auto"><table class="rtable"><tr><th>保單</th><th>公司</th><th>型別</th><th>領受人</th><th>年齡</th><th>頻率</th><th>每次</th><th>合計</th></tr>'+dir+'</table></div>'+

// ===== 保障中心：地圖 + 產險涵蓋 + 健檢報告 =====
function isEarnerRole(r){return r==='本人'||r==='配偶';}
function polSum(c,member,fields){return sum(c.policies||[],function(p){return p.insured===member?fields.reduce(function(s,f){return s+n(p[f]);},0):0;});}
function memberHasSub(c,member,subs){return (c.policies||[]).some(function(p){return p.insured===member&&subs.indexOf(p.subtype)>=0;});}
function hhHasSub(c,subs){return (c.policies||[]).some(function(p){return subs.indexOf(p.subtype)>=0;});}
function covSignals(c){
 var hasCar=hhHasSub(c,['汽車強制','汽車第三人責任','汽車車體','汽車竊盜','機車強制','機車第三人'])||(c.assets||[]).some(function(a){return /車/.test((a.type||'')+(a.name||''));});
 var hasHouse=(c.liabilities||[]).some(function(l){return l.mainCat==='房貸';})||(c.assets||[]).some(function(a){return /房|宅|不動產|自住/.test((a.type||'')+(a.name||''));})||hhHasSub(c,['住宅火險','地震險']);
 var isOwner=(c.profile&&c.profile.jobType==='企業主')||(c.members||[]).some(function(m){return m.jobType==='企業主';});
 var goesAbroad=((c.travel||[]).some(function(t){return t.cat==='國外';}))||(c.overseas&&(c.overseas.hasAssets==='是'||c.overseas.identity==='是'));
 return {hasCar:hasCar,hasHouse:hasHouse,isOwner:isOwner,goesAbroad:goesAbroad};
}
function propertyChecklist(c){
 var s=covSignals(c),rows=[];
 function due(subs){var p=(c.policies||[]).filter(function(x){return subs.indexOf(x.subtype)>=0&&x.termEnd;})[0];return p?p.termEnd:'';}
 if(s.hasCar){var third=hhHasSub(c,['汽車第三人責任','機車第三人']);rows.push({scene:'有汽/機車',should:'強制險＋第三人責任＋車體',key:'car',status:third?'have':'miss',adeq:third?'檢視第三人責任是否增額至超額責任':'僅強制險，建議加保第三人/車體',due:due(['汽車第三人責任','汽車車體','汽車強制','機車強制','機車第三人'])});}
 else rows.push({scene:'有汽/機車',should:'強制險＋第三人責任＋車體',key:'car',status:'thin',adeq:'如有車輛，建議完整投保',due:''});
 if(s.hasHouse){var fire=hhHasSub(c,['住宅火險']),quake=hhHasSub(c,['地震險']);rows.push({scene:'有自住房',should:'住宅火險＋地震(基本/超額)',key:'house',status:fire?'have':'miss',adeq:quake?'地震已保，可評估超額地震':'建議加保地震(基本+超額)',due:due(['住宅火險','地震險'])});}
 else rows.push({scene:'有自住房',should:'住宅火險＋地震',key:'house',status:'thin',adeq:'如有自住房，建議投保',due:''});
 var trip=hhHasSub(c,['旅平險','海外突發疾病']);rows.push({scene:'旅遊/出國',should:'旅平險＋海外突發疾病',key:'travel',status:trip?'have':(s.goesAbroad?'miss':'thin'),adeq:s.goesAbroad?'常出國，建議每趟或年約投保':'出國前投保',due:''});
 if(s.isOwner){var biz=hhHasSub(c,['商業火險','公共意外','雇主責任']);rows.push({scene:'企業主',should:'商業火險＋公共意外/雇主責任',key:'biz',status:biz?'have':'miss',adeq:'營業場所財損與員工職災責任',due:due(['商業火險','公共意外','雇主責任'])});}
 var liab=hhHasSub(c,['個人責任','居家綜合']);rows.push({scene:'家庭日常',should:'個人責任/居家綜合',key:'personal',status:liab?'have':'thin',adeq:'日常致第三人賠償責任',due:''});

function coverageMatrix(c){
 var members=c.members||[];
 var rd=coverageReadiness(c);
 // ⚠️ 一律過 kindNorm()：HCOLS 曾經寫改名前的「意外險」，而 coverageReadiness 產的是「意外傷殘」，
 // 嚴格比對永遠回 null → 黃燈判斷被整段跳過，只要 accident>0 就直接綠，連帶讓 KPI 覆蓋率高估。
 function rdRatio(member,kind){if(!kind)return null;var kk=kindNorm(kind);
  var o=rd.filter(function(x){return x.member===member&&kindNorm(x.kind)===kk;})[0];return o?o.ratio:null;}
 var pc=propertyChecklist(c);
 function pcStatus(key){var r=pc.filter(function(x){return x.key===key;})[0];if(!r)return 'n';return r.status==='have'?'g':r.status==='miss'?'r':'y';}
 var sig=covSignals(c);
 var HCOLS=[
  {lb:'壽險',kind:'壽險',fields:['life'],app:function(m){return isEarnerRole(m.role);}},
  {lb:'醫療',kind:'住院醫療',fields:['medical'],app:function(){return true;}},
  {lb:'意外',kind:'意外傷殘',fields:['accident'],app:function(){return true;}},
  {lb:'癌症',kind:null,fields:['firstCancer','cancerHosp'],app:function(){return true;}},
  {lb:'重疾',kind:'重病給付',fields:['critical'],app:function(){return true;}},
  {lb:'長照/失能',kind:'每月照護',fields:['monthCare'],app:function(m){return m.role!=='子女';}},
  {lb:'年金',kind:null,fields:[],sub:['年金'],app:function(m){return isEarnerRole(m.role);}}
 ];
 var PCOLS=[['汽/機車','car'],['住宅','house'],['責任',sig.isOwner?'biz':'personal'],['旅平','travel']];
 var rows=members.map(function(m,idx){
  var isPrimary=(m.role==='本人')||(idx===0&&!members.some(function(x){return x.role==='本人';}));
  var cells=HCOLS.map(function(col){
   if(!col.app(m))return {s:'n'};
   var have=col.fields.length?polSum(c,m.name,col.fields):(memberHasSub(c,m.name,col.sub||[])?1:0);
   if(have<=0)return {s:'r'};
   var ratio=col.kind?rdRatio(m.name,col.kind):null;
   if(ratio!=null&&ratio<0.6)return {s:'y'};
   return {s:'g'};
  });
  var pcells=PCOLS.map(function(pcx){return isPrimary?{s:pcStatus(pcx[1])}:{s:'n'};});
  return {name:m.name,role:isPrimary?'本人':(m.role||''),cells:cells.concat(pcells)};
 });
 return {cols:HCOLS.map(function(x){return x.lb;}).concat(PCOLS.map(function(x){return x[0];})),rows:rows};
}
function coverageCheckup(c){
 var totPrem=sum(c.policies||[],function(p){return n(p.premium);});
 var ct=crossTable(c);var income=n(ct.incTotal);
 var premRatio=income>0?totPrem/income:0;
 var lifeTotal=sum(c.policies||[],function(p){return n(p.life);});
 var rd=coverageReadiness(c);
 var humanGaps=rd.filter(function(o){return o.need>0&&o.ratio<1;}).map(function(o){return {member:o.member,kind:o.kind,ratio:o.ratio};}).sort(function(a,b){return a.ratio-b.ratio;});
 var pc=propertyChecklist(c);var propMiss=pc.filter(function(r){return r.status==='miss';});
 var dupMap={},dups=[];(c.policies||[]).forEach(function(p){if(!p.insured||!p.subtype)return;var k=p.insured+'|'+p.subtype;dupMap[k]=(dupMap[k]||0)+1;});
 Object.keys(dupMap).forEach(function(k){if(dupMap[k]>1){var a=k.split('|');dups.push(a[0]+' 的 '+a[1]+'（'+dupMap[k]+' 張）');}});
 var now=new Date();var nowM=now.getFullYear()*12+now.getMonth();
 var due=[];(c.policies||[]).forEach(function(p){if(p.bigCat==='產物'&&p.termEnd){var mch=(''+p.termEnd).match(/(\d{3,4})\D+(\d{1,2})/);if(mch){var yy=+mch[1];if(yy<1911)yy+=1911;/* 民國年 */var months=(yy*12+(+mch[2]-1))-nowM;if(months<=4&&months>=-2)due.push({name:p.name||p.subtype,when:p.termEnd,months:months});}}});
 return {totPrem:totPrem,income:income,premRatio:premRatio,lifeTotal:lifeTotal,lifeVsIncome:income>0?lifeTotal/income:0,humanGaps:humanGaps,propMiss:propMiss,dups:dups,due:due};
}

//
// 原本這一頁是一長串固定順序、一次全部算完、全部展開的卡片。兩個問題：
//   1. 資料多的客戶，光是進頁面就要跑完蒙地卡羅 1000 條路徑＋十幾張 SVG，等很久。
//   2. 每位教練習慣先看的東西不一樣，順序寫死等於強迫所有人用同一套思路談。
// 改成：每張卡是一個模組 —— 標題留著、內容收合，展開才算；順序可拖曳、可隱藏。
//
// 偏好存 localStorage 且 **逐客戶** 記憶（key 帶 case id）：
// 這是「這位教練看這位客戶時的角度」，不是規劃資料本身。寫進 plan data 的話，
// 版本比較的 diff 會被排版偏好洗版，客戶端也會莫名其妙跟著教練的排序跑。
// ══════════════════════════════════════════════════════════════════════════

// ⚠️ key 在 2026/08/25 換版（lantu.an. → lantu.an2.）。
// 理由：後台預設上線之前，每位教練每位客戶都已經存過一份「完整」偏好（舊的 anPatch
// 會把三個維度一起寫回去），而「存過就不覆蓋」是刻意的語意 —— 不換版的話，
// 後台設什麼都不會生效。換版＝上線那一天所有人一次性回到後台預設，之後才開始各自記憶。
function anPrefKey(c){return 'lantu.an2.'+((c&&c.id)||'default');}

// 後台（/admin/analysis）定的全平台預設，經 /api/finance-categories 的 an 送進來。
// 拿不到（還沒回來、離線、API 壞了）就回落空陣列，等於照模組表本身的順序——畫面不會壞。
function anDefault(){
 var d=window.LANTU_AN_DEFAULT;
 if(!d||typeof d!=='object')return {order:[],hidden:[]};
 return {order:Array.isArray(d.order)?d.order:[],hidden:Array.isArray(d.hidden)?d.hidden:[]};
}

// 這台電腦、這位客戶存過的偏好原文；沒存過回 null。
// 「沒存過」跟「存了空的」是兩件事：前者要吃後台預設，
// 後者是教練自己把預設隱藏的那幾個都叫回來了，不能被預設蓋回去。
function anStored(c){
 try{var raw=localStorage.getItem(anPrefKey(c));var p=raw?JSON.parse(raw):null;return (p&&typeof p==='object')?p:null;}catch(e){return null;}
}

// 三層：後台預設 → 教練在這位客戶調過的 → 當下畫面。逐維度各自判斷有沒有被調過。
function anPref(c){
 var raw=anStored(c)||{},d=anDefault();
 return {
  order:(Array.isArray(raw.order)&&raw.order.length)?raw.order:d.order,
  hidden:Array.isArray(raw.hidden)?raw.hidden:d.hidden,
  open:Array.isArray(raw.open)?raw.open:[]
 };
}
function anSave(c,p){try{localStorage.setItem(anPrefKey(c),JSON.stringify(p));}catch(e){}}
// ⚠️ 只寫被動到的那一維（原本是把整份正規化過的偏好寫回去）：
// 否則「只點過展開」會順手把 hidden 寫成 []，看起來就像教練明確取消了後台的預設隱藏。
function anPatch(k,v){var c=activeCase();var raw=anStored(c)||{};raw[k]=v;anSave(c,raw);}

// 目前這一頁的模組表（給 anFill／anExpandAll 用）。每次 analysisPane() 重畫時更新。
var AN_VIEW=null;

// 依偏好排序：存過的順序優先，沒存過的新模組接在後面（改版加模組時不會消失）。
function anOrdered(mods,pref){
 var byK={};mods.forEach(function(x){byK[x.k]=x});
 var out=[],seen={};
 (pref.order||[]).forEach(function(k){if(byK[k]&&!seen[k]){out.push(byK[k]);seen[k]=1;}});
 mods.forEach(function(x){if(!seen[x.k])out.push(x);});
 return out;
}

function analysisPane(c){
 var m=metrics(c),rn=retireNeed(c),proj=m.proj;
 var kp=[['淨資產',fmt(m.net),'資產−負債'],['年結餘',fmt(m.save),m.save>=0?'收入>支出':'入不敷出'],
  ['退休缺口',fmt(rn.gap),'總需求 '+fmt(rn.total)],['資產轉負',proj.turnNeg?proj.turnNeg+' 歲':'無','可投資本金']]
  .map(function(k){return '<div class="kpi"><div class="lb">'+k[0]+'</div><div class="vv">'+k[1]+'</div><small>'+k[2]+'</small></div>'}).join('');

 var pref=anPref(c);
 var mods=anOrdered(analysisModules(c),pref);
 var hidden={};(pref.hidden||[]).forEach(function(k){hidden[k]=1});
 var open={};(pref.open||[]).forEach(function(k){open[k]=1});

 AN_VIEW={map:{},order:mods.map(function(x){return x.k})};
 mods.forEach(function(x){AN_VIEW.map[x.k]=x.html;});

 var cards=mods.map(function(x){
  if(hidden[x.k])return '';
  var hint=typeof x.hint==='function'?x.hint():x.hint;
  return '<details class="anmod" id="anmod_'+x.k+'" data-k="'+x.k+'"'+(open[x.k]?' open':'')+' ontoggle="anToggled(this)">'+
   '<summary><span class="ant">'+x.t+'</span>'+(hint?'<span class="hint">'+hint+'</span>':'')+'</summary>'+
   '<div class="anbody" id="anbody_'+x.k+'"></div></details>';
 }).join('');

 return '<div class="kpis">'+kp+'</div>'+anBarHTML(mods,hidden)+financeNavHTML()+cards;
}

// 蒙地卡羅那類昂貴模組因此不再是「進分析頁」的必經成本。
function anFill(k){
 var host=document.getElementById('anbody_'+k);
 if(!host||host.getAttribute('data-filled')==='1')return;
 var f=AN_VIEW&&AN_VIEW.map[k];
 if(!f)return;
 try{host.innerHTML=f();}catch(e){host.innerHTML='<div class="muted">這個模組算不出來：'+esc(String(e&&e.message||e))+'</div>';}
 host.setAttribute('data-filled','1');
}

function anToggled(el){
 var k=el.getAttribute('data-k');
 if(el.open)anFill(k);
 var openKeys=[];
 document.querySelectorAll('.anmod').forEach(function(d){if(d.open)openKeys.push(d.getAttribute('data-k'));});
 anPatch('open',openKeys);
}

function anExpandAll(on){
 document.querySelectorAll('.anmod').forEach(function(d){d.open=!!on;if(on)anFill(d.getAttribute('data-k'));});
 var openKeys=[];
 if(on)document.querySelectorAll('.anmod').forEach(function(d){openKeys.push(d.getAttribute('data-k'));});
 anPatch('open',openKeys);
}

function anJump(k){
 var d=document.getElementById('anmod_'+k);
 if(!d)return;
 if(!d.open){d.open=true;anFill(k);}
 try{d.scrollIntoView({behavior:'smooth',block:'start'});}catch(e){d.scrollIntoView();}
}

function anToggleHide(k){
 var c=activeCase(),p=anPref(c);
 var h=(p.hidden||[]).slice();
 var i=h.indexOf(k);
 if(i>=0)h.splice(i,1);else h.push(k);
 anPatch('hidden',h);render();
}

// 恢復預設＝把這位客戶的個人偏好整個拿掉，回到後台定的預設（不是程式寫死的那一份）。
// 後台之後又改了預設，也是靠這個鈕才吃得到新的——後台不會回頭覆蓋教練已經調過的客戶。
function anResetPref(){
 var c=activeCase();
 try{localStorage.removeItem(anPrefKey(c));}catch(e){}
 render();
}

// 模組列拖曳排序。沿用必達優先序那套 HTML5 拖曳的作法。
function bindAnalysisDrag(){
 var row=document.getElementById('anChips');if(!row)return;
 var from=null;
 row.querySelectorAll('.anchip').forEach(function(el){
  var i=+el.dataset.i;
  el.ondragstart=function(e){from=i;el.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i))}catch(_){}};
  el.ondragend=function(){from=null;el.classList.remove('drag');row.querySelectorAll('.anchip').forEach(function(x){x.classList.remove('over')})};
  el.ondragover=function(e){e.preventDefault();if(from!==null&&from!==i)el.classList.add('over')};
  el.ondragleave=function(){el.classList.remove('over')};
  el.ondrop=function(e){e.preventDefault();el.classList.remove('over');if(from===null)return;var f=from;from=null;anMove(f,i);};
 });
}

function anMove(from,to){
 if(!AN_VIEW||from===to)return;
 var order=AN_VIEW.order.slice();
 var moved=order.splice(from,1)[0];
 order.splice(to,0,moved);
 anPatch('order',order);
 render();
}

// 展開狀態是存起來的，重畫後要把已展開的內容補回去（details 帶 open 屬性不會觸發 ontoggle）。
function bindAnalysis(){
 bindAnalysisDrag();
 document.querySelectorAll('.anmod').forEach(function(d){if(d.open)anFill(d.getAttribute('data-k'));});
}

function deathProjection(c,mb){var base=projection(c),a0=n(c.profile.age),infl=n(c.params.inflation)/100,ret=n(c.params.invReturn)/100;
 var liquid0=sum(c.assets,function(a){return a.cls==='流動'?aVal(a):0});
 var lump=existingCover(c,mb.name,'壽險');
 var funeral=sum((c.needs||[]),function(nd){return nd.member===mb.name?n(nd.funeral):0});
 var premium=sum((c.policies||[]),function(p){return p.insured===mb.name?n(p.premium):0});
 var expRatio=n(mb.expRatio)/100;
 // 財務獨立歲：其他被撫養成員到達獨立歲後，其支出比例份額自家庭生活費移除（責任遞減）
 var deps=(c.members||[]).filter(function(x){return x.name!==mb.name&&x.indepAge!==''&&x.indepAge!=null&&n(x.expRatio)>0;});
 var asset=liquid0,rows=[],depletedAge=null;
 base.rows.forEach(function(br,i){var age=br.age,t=age-a0;
  var mWork=sum(c.incomes,function(inc){return (inc.owner===mb.name&&inc.type==='工作'&&age>=n(inc.start)&&age<=n(inc.end))?n(inc.amount)*Math.pow(1+n(inc.growth)/100,t):0;});
  var hLiving=sum(c.expenses,function(e){return (e.cat==='生活'&&age>=n(e.start)&&age<=n(e.end))?n(e.amount)*(e.infl?Math.pow(1+infl,t):1):0;});
  var indepFrac=0;deps.forEach(function(d){if(n(d.age)+t>=n(d.indepAge))indepFrac+=n(d.expRatio)/100;});
  var removeFrac=Math.min(1,expRatio+indepFrac);
  var totalOut=br.income-br.bal;
  var income=br.income-mWork+(i===0?lump:0);
  var expense=Math.max(0,totalOut-(hLiving+n(br.goal))*removeFrac-premium)+(i===0?funeral:0);
  asset=(asset>0?asset*(1+ret):asset)+(income-expense);
  if(depletedAge===null&&asset<0)depletedAge=age;
  rows.push({age:age,income:income,expense:expense,asset:asset});
 });
 return {rows:rows,depletedAge:depletedAge,protectYears:depletedAge?depletedAge-a0:null};
}

/* ============================================================

var RP={ok:'#3f7d54',bad:'#b05a4a',amb:'#c99a5b',mut:'#5a6b72',line:'#dfe6e8'};

function rpTable(head,rows,empty){
 if(!rows)return '<p style="font-size:13px;color:'+RP.mut+'">'+(empty||'（無資料）')+'</p>';
 return '<table><tr>'+head+'</tr>'+rows+'</table>';
}

/* 一、願景清單：選了哪些、做不做得到 */
function planVisionReportHTML(c){
 var pa=projection(c),okMap={};
 pa.events.forEach(function(e){okMap[e.name]=e.ok});
 var rows='',offNames=[],hasFlow=false;
 // 判定欄有三種：✓／✕（單一時點的事件）與「已計入現金流」（週期性的生活願望）。
 // ⚠️ 週期性支出沒有單一時點的成敗，逐年攤在曲線上——顯示「—」會被誤讀成漏算。
 function push(name,when,amt,on,flow){
  if(!on){offNames.push(name);return}
  var st=okMap[name],mark;
  if(flow){mark='<span style="color:'+RP.mut+'">已計入現金流</span>';hasFlow=true;}
  else mark='<span style="font-weight:700;color:'+(st===false?RP.bad:RP.ok)+'">'+(st===false?'✕ 做不到':'✓ 做得到')+'</span>';
  rows+='<tr><td>'+esc(name)+'</td><td>'+when+'</td><td style="text-align:right">'+(amt?fmt(amt):'—')+'</td>'+
   '<td style="text-align:center">'+mark+'</td></tr>';
 }
 (c.goals||[]).forEach(function(g){push((g.name||g.type||'目標'),n(g.start)+' 歲',n(g.present),visionOn(g))});
 [['travel','旅遊'],['hobby','休閒'],['luxury','奢侈品']].forEach(function(pr){
  (c[pr[0]]||[]).forEach(function(w){
   var nm=[w.cat,w.sub].filter(Boolean).join('·')||pr[1];
   push(nm+'（'+pr[1]+'）',n(w.start)+'–'+n(w.end)+' 歲，每年 '+(n(w.freq)||1)+' 次',n(w.amount),visionOn(w),true);
  });
 });
 var rAge=n(c.profile.retireAge)||65;
 push('退休生活',rAge+' 歲起',0,true);
 var lg=c.legacy||{},lgNeed=legacyNeed(c);
 if(lgNeed>0||n(lg.heirs)>0)push('傳承',' 期末',lgNeed,lg.on!==false);

 return rpTable('<th>願景</th><th>時點</th><th style="text-align:right">金額</th><th style="text-align:center">目前判定</th>',rows,'尚未設定任何願景。')+
  (hasFlow?'<p style="font-size:12px;color:'+RP.mut+';margin-top:6px">旅遊、休閒、奢侈品是<b>週期性</b>的支出，逐年攤在現金流裡，沒有單一時點的成敗——做不做得到已經反映在上面那條曲線上。</p>':'')+
  (offNames.length?'<p style="font-size:12px;color:'+RP.mut+';margin-top:6px">本次<b>不納入</b>規劃：'+esc(offNames.join('、'))+'。這是共同決定不做的，不是做不到——資料仍然保留，未來想恢復隨時可以。</p>':'')+
  '<p style="font-size:12px;color:'+RP.mut+';margin-top:6px">「做不到」的意思是：做完那件事之後，可投資資產會掉到零以下——也就是得靠借錢才辦得到。選定的願景按<b>時間先到先支付</b>，所以早期的花掉了，晚期的就會落空。</p>';
}

 return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+t1+t2+'</div>'+al;

/* 四、執行時序 */
function planFlowReportHTML(c){
 var A=n(c.profile.age)||40;
 var acts=planActionsOn(c).slice().sort(function(x,y){return (n(x.startY)||99)-(n(y.startY)||99)});
 if(!acts.length)return '<p style="font-size:14px">目前沒有待執行的動作。</p>';
 var group={},order=[];
 acts.forEach(function(a){
  var sy=n(a.startY)||n(a.payFrom)||n(a.getFrom)||A;
  var key=sy<=A+1?'現在起':(sy+' 歲（'+Math.max(0,sy-A)+' 年後）');
  if(!group[key]){group[key]=[];order.push(key)}
  group[key].push(a);
 });
 return order.map(function(k){
  return '<h3 style="margin-top:14px;color:'+RP.amb+'">'+esc(k)+'</h3><ul style="padding-left:2px;font-size:14px;line-height:1.85">'+
   group[k].map(function(a){
    var w=[];
    if(a.tool&&a.tool!=='—')w.push(a.tool);
    if(n(a.payMonthly))w.push('每月 '+fmt(a.payMonthly));
    if(n(a.payLump))w.push('單筆 '+fmt(a.payLump));
    if(n(a.getMonthly))w.push(a.cat==='expense'?'每月省下 '+fmt(a.getMonthly):'每月 +'+fmt(a.getMonthly));
    if(n(a.cover))w.push('保額 '+fmt(a.cover));
    return '<li style="list-style:none;margin-bottom:7px"><span style="display:inline-block;width:13px;height:13px;border:1.5px solid #0d2b45;border-radius:3px;margin-right:8px;vertical-align:-2px"></span>'+
     '<b>'+esc(actCat(a.cat).n)+'｜'+esc((a.name||'').trim()||'（未命名）')+'</b>'+
     (w.length?' — '+esc(w.join('　·　')):'')+'</li>'}).join('')+'</ul>';
 }).join('');
}

/* 五、如果還要更多：三個替代方案 */
function planCutReportHTML(c){
 var gate=leverGate(c),pa=projection(c);
 if(pa.shortPV<=0.5)return '<p style="font-size:14px;color:'+RP.ok+'">這一組動作已經把缺口補平，不需要再調整願景本身。</p>';
 var CUTS=[{k:'retire',n:'延後退休'},{k:'retireLevel',n:'降低退休水準'},{k:'vision',n:'壓縮願景'}];
 var rows=CUTS.map(function(Cc){
  var r=solveLever(c,Cc.k,{},gate),txt,col=RP.amb;
  if(r.blocked){txt='此階段建議先不動';col=RP.mut}
  else if(!r.needed){txt='不需要動';col=RP.ok}
  else if(!r.feasible){txt='拉到上限仍補不平';col=RP.bad}
  else txt=leverLabel(Cc.k,r.x);
  return '<tr><td style="white-space:nowrap;font-weight:700">'+Cc.n+'</td><td style="color:'+col+';font-weight:700">'+esc(txt)+'</td>'+
   '<td style="color:'+RP.mut+';font-size:12px">'+(r.blocked&&gate.reason[Cc.k]?esc(gate.reason[Cc.k]):'')+'</td></tr>';
 }).join('');
 return rpTable('<th>做法</th><th>要調到多少</th><th>備註</th>',rows)+
  '<p style="font-size:12px;color:'+RP.mut+';margin-top:6px">這三條是<b>互相替代</b>的選項，不是要一起做——每一條都是「其他都不動、只動這一項」的答案。'+
  '在目前已排的動作之上計算。</p>';
}

 return '<div class="report"><div class="rc"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><div><div class="k">嵐途 LAN TU · 全方位財務規劃</div><h1>調整方案書</h1></div>'+

  '<div style="margin-top:8px;font-size:13px">謹致 '+esc(p.name)+'　現年 '+n(p.age)+' 歲　目前階段：'+stageName(hb.grade)+docCodeHTML()+'</div></div>'+

  '所以這份方案書要看的不是「補平了沒」，而是<b>比原本改善了多少</b>，然後每年再調整一次。</p>'+
  '<div style="margin:14px 0 6px">'+visionTimelineSVG(c,'light','rp')+'</div>'+
  '<table><tr><td>一生願景需要的資金（折現到今天）</td><td style="text-align:right;font-weight:700">'+fmt(pa.needPV)+' 元</td></tr>'+
  '<tr><td>現況的缺口</td><td style="text-align:right;font-weight:700">'+fmt(pb.shortPV)+' 元</td></tr>'+
  (hasAct?'<tr><td>套用本次方案之後</td><td style="text-align:right;font-weight:800;color:'+col(pa.shortPV<=0.5)+'">'+
    (pa.shortPV<=0.5?'已補平':fmt(pa.shortPV)+' 元')+'（改善 '+imp+'%）</td></tr>':'')+

function rBars(items){return items.map(function(it){var v=Math.max(0,Math.min(100,it.val));return '<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#33474e"><span>'+it.label+'</span><span>'+Math.round(v)+'%</span></div><div style="height:8px;background:#e2e8ea;border-radius:5px;overflow:hidden"><div style="height:100%;width:'+v+'%;background:'+(it.color||'#6f8f74')+'"></div></div></div>'}).join('')}
function rPie(list){list=(list||[]).filter(function(x){return n(x.pct)>0});if(!list.length)return '<p style="color:#5a6b72">—</p>';
 var tot=sum(list,function(x){return n(x.pct)})||1,cx=80,cy=80,rr=72,acc=0;
 var segs=list.map(function(x,i){var frac=n(x.pct)/tot,a0=acc*2*Math.PI-Math.PI/2;acc+=frac;var a1=acc*2*Math.PI-Math.PI/2;var large=frac>0.5?1:0;
  var x0=cx+rr*Math.cos(a0),y0=cy+rr*Math.sin(a0),x1=cx+rr*Math.cos(a1),y1=cy+rr*Math.sin(a1);

 var leg=list.map(function(x,i){return '<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#33474e;margin-bottom:3px"><span style="width:10px;height:10px;border-radius:2px;background:'+RCOL[i%8]+'"></span>'+esc(x.name)+' <b>'+(n(x.pct)/tot*100).toFixed(0)+'%</b></div>'}).join('');
 return '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center"><svg width="160" height="160" viewBox="0 0 160 160">'+segs+'</svg><div style="flex:1;min-width:150px">'+leg+'</div></div>';}
// 報告書用的收入逐筆明細（淺色列印版）。與分析頁的 incomeDetailHTML 同一份資料，換皮而已。
function rIncomeDetail(c){
 var incs=c.incomes||[];
 if(!incs.length)return '';
 var body=incomeRows(c).map(function(r){
  if(!r.item){
   return '<tr style="background:#f2f6f7"><td colspan="3" style="font-weight:700;color:#0d2b45">'+esc(r.group)+'收入</td><td style="font-weight:700;text-align:right">'+fmt(r.total)+'</td></tr>';
  }

function rCross(ct){function box(t,rows,tot,cl){return '<div style="border:1px solid #dfe7e9;border-radius:8px;padding:10px;background:#f7fafb"><div style="color:'+cl+';font-weight:700;font-size:13px;margin-bottom:4px">'+t+'</div>'+rows+'<div style="border-top:1px solid #dfe7e9;margin-top:5px;padding-top:4px;font-weight:700;font-size:13px">合計 '+fmt(tot)+'</div></div>'}
 function r(l,v){return '<div style="display:flex;justify-content:space-between;font-size:12px;color:#5a6b72"><span>'+l+'</span><span style="color:#22333a">'+fmt(v)+'</span></div>'}
 return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+

  box('資產',r('自用',ct.aSelf)+r('可投資',ct.aInv),ct.aTotal,'#7f97ac')+

  '</div><div style="text-align:center;margin-top:8px;color:#5a6b72;font-size:12.5px">保險居中 ｜ 淨資產 <b style="color:#0d2b45">'+fmt(ct.net)+'</b></div>';}
function rTimeline(c){return timelineHTML(c,'light');}
// 報告書版的 Y 軸金額刻度（淺色版型）。原本 rLine / rFan 只有年齡 ticks，
// 客戶拿到的報告書上那兩張圖讀不出金額。
function rAxisY(mn,mx,pad,W,H){var out='';for(var g=0;g<=4;g++){var v=mx-(mx-mn)*g/4,y=pad+(1-(v-mn)/((mx-mn)||1))*(H-pad*2);

  '<text x="'+(pad-5)+'" y="'+(y+3).toFixed(1)+'" fill="#8a97a0" font-size="8.5" text-anchor="end">'+cfAxis(v)+'</text>';}
 return out;}
function rLine(proj){var rows=proj.rows;if(!rows.length)return '';var W=740,H=180,pad=40;
 var vals=rows.map(function(r){return r.invest}),mx=Math.max.apply(null,vals.concat([0])),mn=Math.min.apply(null,vals.concat([0])),span=(mx-mn)||1;
 function X(i){return pad+i/(rows.length-1)*(W-pad*2)}function Y(v){return pad+(1-(v-mn)/span)*(H-pad*2)}
 var zeroY=Y(0),path=rows.map(function(r,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(r.invest).toFixed(1)}).join(' ');
 var tn=proj.turnNeg,tnx=tn?X(rows.findIndex(function(r){return r.age===tn})):null,ticks='';
 for(var i=0;i<rows.length;i+=5)ticks+='<text x="'+X(i).toFixed(0)+'" y="'+(H-6)+'" fill="#8a97a0" font-size="9.5" text-anchor="middle">'+rows[i].age+'</text>';
 return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+rAxisY(mn,mx,pad,W,H)+'<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="#d9b8ac" stroke-dasharray="4 4"/><path d="'+path+'" fill="none" stroke="#6f8f74" stroke-width="2.5"/>'+(tnx!==null?'<line x1="'+tnx.toFixed(0)+'" y1="'+pad+'" x2="'+tnx.toFixed(0)+'" y2="'+(H-pad)+'" stroke="#b05a4a" stroke-dasharray="3 3"/><text x="'+tnx.toFixed(0)+'" y="'+(pad-3)+'" fill="#b05a4a" font-size="10" text-anchor="middle">轉負'+tn+'歲</text>':'')+ticks+'</svg>';}
function rFan(mc){var W=740,H=180,pad=40,years=mc.years,all=[];mc.bands.forEach(function(b){all.push(b[0],b[2])});all.push(0);
 var mx=Math.max.apply(null,all),mn=Math.min.apply(null,all),span=(mx-mn)||1;
 function X(i){return pad+i/(years-1)*(W-pad*2)}function Y(v){return pad+(1-(v-mn)/span)*(H-pad*2)}
 var top=mc.bands.map(function(b,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(b[2]).toFixed(1)}).join(' ');
 var bot=mc.bands.map(function(b,i){return 'L'+X(years-1-i).toFixed(1)+' '+Y(mc.bands[years-1-i][0]).toFixed(1)}).join(' ');
 var med=mc.bands.map(function(b,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(b[1]).toFixed(1)}).join(' ');
 var zeroY=Y(0),ticks='';for(var i=0;i<years;i+=5)ticks+='<text x="'+X(i).toFixed(0)+'" y="'+(H-6)+'" fill="#8a97a0" font-size="9.5" text-anchor="middle">'+(mc.a0+i)+'</text>';
 return '<svg width="100%" viewBox="0 0 '+W+' '+H+'">'+rAxisY(mn,mx,pad,W,H)+'<path d="'+top+' '+bot+' Z" fill="rgba(201,154,91,.14)"/><line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="#d9b8ac" stroke-dasharray="4 4"/><path d="'+med+'" fill="none" stroke="#c99a5b" stroke-width="2.5"/>'+ticks+'</svg>';}
function rGapBars(gaps){var pos=gaps.filter(function(g){return g.gap>0});if(!pos.length)return '<p style="color:#6f8f74">目前無明顯保障缺口，現有保障大致足夠。</p>';
 var mx=Math.max.apply(null,pos.map(function(g){return g.gap}))||1;
 return pos.map(function(g){var w=g.gap/mx*100;return '<div style="margin-bottom:6px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#33474e"><span>'+g.member+' · '+g.kind+'</span><span style="color:#b05a4a;font-weight:700">缺口 '+fmt(g.gap)+'</span></div><div style="height:8px;background:#e2e8ea;border-radius:5px"><div style="height:100%;width:'+w.toFixed(0)+'%;background:#b05a4a;border-radius:5px"></div></div></div>'}).join('');}

/* ══════════════════════════════════════════════════════════════════════════
   報告書 · 各分類的「結果」章節（2026/08/24）

   Ray 的規則：有「輸入」的面向不必給客戶看，但**輸入完會產生結果的，全部要放出來**。
   在這之前，客戶版報告書只有十四章，教練端算出來的結果有一半以上客戶看不到——
   保單檢查五欄表（8/24 才做的）、財務三表、置產缺口、退休三段式金流、生活願望、
   傳承規劃（legacyNeed 早就在算，報告書一行都沒用到）、職涯與婚姻、信用與海外、
   真實追蹤、人生護照五面向，全部只活在教練的螢幕上。

   每一節照 [[feedback_圖表優先]] 走：**一張圖 ＋ ≤3 個數字，明細一律 <details> 收合**。
   把教練端的表格原封不動搬過來會得到一份沒有人讀得完的東西——那不叫「呈現結果」。
   ══════════════════════════════════════════════════════════════════════════ */

// 章節編號與目錄：章名只寫一次（<h2>§、章名</h2>），編號依實際印出來的順序自動填。
// 為什麼不寫死：有些章是「有資料才出現」的（真實追蹤、人生護照…），
// 寫死編號的話，目錄會列出一個翻不到的章，而且往中間插一章要手改十幾個地方。
var CN_NUM=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四'];
function rNumberSections(body){
 var titles=[],k=0;
 var html=String(body).replace(/<h2>\u00a7\u3001([^<]*)<\/h2>/g,function(m,t){
  titles.push(t);
  return '<h2>'+(CN_NUM[k++]||(k))+'\u3001'+t+'</h2>';
 });
 return {html:html,titles:titles};
}
function rTOC(titles){
 if(!titles.length)return '';
 return '<div style="margin:14px 0 6px;padding:14px 16px;background:#faf7f1;border:1px solid #e4dccf;border-radius:10px">'+
  '<b style="color:#0d2b45">目錄</b><ol style="color:#33474e;font-size:13px;margin:8px 0 0;padding-left:20px;line-height:1.9;column-count:2;column-gap:28px">'+
  titles.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ol></div>';
}
// 報告書的三個數字：一排 KPI，不要更多。超過三個就是還沒想清楚哪個最重要。
function rBig(items){
 return '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 12px">'+items.map(function(x){
  return '<div style="flex:1;min-width:150px;border:1px solid #e4dccf;background:#faf7f1;border-radius:10px;padding:10px 13px">'+
   '<div style="color:#5a6b72;font-size:11.5px">'+esc(x[0])+'</div>'+
   '<div style="font-size:20px;font-weight:800;color:'+(x[2]||'#0d2b45')+';line-height:1.3">'+x[1]+'</div>'+
   (x[3]?'<div style="color:#5a6b72;font-size:11px;margin-top:2px">'+x[3]+'</div>':'')+'</div>';
 }).join('')+'</div>';
}

// 收合的明細。教練要查得到，客戶不必先讀完。
function rFold(title,body){

  '<div style="padding:2px 12px 12px">'+body+'</div></details>';
}
function rSub(t){return '<div style="color:#0d2b45;font-weight:700;font-size:13px;margin:12px 0 4px">'+esc(t)+'</div>';}
function rNote(t){return '<div style="color:#5a6b72;font-size:12px;margin-top:6px;line-height:1.7">'+t+'</div>';}

// 金額長條：比大小用的。rBars 只吃百分比，這一支直接吃金額並把數字寫在旁邊。
function rAmtBars(items,unit){

 if(!items.length)return '';

   '<span style="font-weight:700;color:'+(x.color||RCOL[i%8])+'">'+fmt(v)+(unit||'')+'</span></div>'+
   '<div style="height:9px;background:#e9edee;border-radius:5px;overflow:hidden"><div style="height:100%;width:'+w.toFixed(1)+'%;background:'+(x.color||RCOL[i%8])+'"></div></div></div>';
 }).join('');
}

/* ── 四、財務三表與資產布局 ───────────────────────────────────────────────── */
// 結論先講：資產是怎麼分層的（一張圓餅），以及緊急預備金夠不夠幾個月。
// 資產負債表／現金流量表本來就是逐列資料，收進 <details>。
function rThreeTables(c){
 var ct=crossTable(c),m=metrics(c),lay=assetLayout(c);
 var order=['核心','衛星','短期保留','生活用'];
 var tot=sum(c.assets,function(a){return aVal(a)});

 var months=m.monthExp>0?m.liquid/m.monthExp:0;
 var bal=ct.incTotal-ct.expTotal-n(ct.saveInvest);
 var pie=tot>0?rPie(order.map(function(k){return {name:k,pct:lay[k]||0};})):rEmpty('尚未登錄資產。');
 function row(l,v,bold,col){
  return '<tr><td'+(bold?' style="font-weight:800"':'')+'>'+l+'</td><td style="text-align:right'+(bold?';font-weight:800':'')+(col?';color:'+col:'')+'">'+fmt(v)+'</td></tr>';
 }
 var bs='<table style="flex:1;min-width:240px"><tr><th colspan="2">資產負債表</th></tr>'+
  row('自用資產',ct.aSelf)+row('可投資資產',ct.aInv)+row('資產合計',ct.aTotal,true)+
  row('消費型負債',ct.dCons)+row('投資型負債',ct.dInv)+row('負債合計',ct.dTotal,true)+
  row('淨值',ct.net,true,'#b07d3d')+'</table>';
 var cf='<table style="flex:1;min-width:240px"><tr><th colspan="2">現金流量表（年）</th></tr>'+
  row('工作收入',ct.incWork)+row('理財收入',ct.incFin)+row('其他收入',ct.incOther)+row('收入合計',ct.incTotal,true)+
  row('生活支出',ct.expLive)+row('貸款支出',ct.expLoan)+row('撫育／孝親',ct.expSupport)+row('保險費',ct.expIns)+row('稅賦',ct.expTax)+row('娛樂＆雜費',ct.expOther)+row('支出合計',ct.expTotal,true)+
  row('儲蓄理財投入',ct.saveInvest)+row('年度結餘',bal,true,bal>=0?'#3f7d54':'#b05a4a')+'</table>';
 var layRows=order.map(function(k){

  return '<tr><td>'+k+'</td><td style="text-align:right">'+fmt(v)+'</td><td style="text-align:right">'+(tot>0?(v/tot*100).toFixed(1):'0.0')+'%</td><td style="color:#5a6b72">'+(items||'—')+'</td><td style="color:#5a6b72;font-size:11.5px">'+esc(LAYER_DESC[k]||'')+'</td></tr>';
 }).join('');
 return rBig([
   ['淨值',fmt(ct.net)+' 元','#b07d3d'],

  rFold('財務三表明細（資產負債表・現金流量表・資產布局逐層）',
    '<div style="display:flex;gap:16px;flex-wrap:wrap">'+bs+cf+'</div>'+
    '<div style="margin-top:12px"><table><tr><th>層級</th><th>金額</th><th>佔比</th><th>包含項目</th><th>定義</th></tr>'+layRows+'</table></div>');

/* ── 五、財務目標歷程 · 生活願望 ─────────────────────────────────────────── */
// 旅遊／休閒／奢侈品：這些是「錢要花在哪裡才像自己」的答案，不是可有可無的裝飾。
// 客戶端只給結果：現在一年花多少、一生累計多少、哪一類佔最多。
function rLifestyle(c){
 var a0=n(c.profile.age),hz=n(c.params.horizon)||n(c.profile.lifeExp)||85;
 var groups=[['旅遊',c.travel],['休閒興趣',c.hobby],['奢侈品',c.luxury]];
 var any=groups.some(function(g){return (g[1]||[]).length;});
 if(!any)return '';
 function annualAt(list,age){
  return sum(list||[],function(it){
   if(!visionOn(it))return 0;
   return (age>=n(it.start)&&age<=n(it.end))?n(it.amount)*(n(it.freq)||1):0;
  });
 }
 function lifetime(list){var t=0;for(var a=a0;a<=hz;a++)t+=annualAt(list,a);return t;}
 var bars=groups.map(function(g,i){return {label:g[0],val:annualAt(g[1],a0),note:'一生累計 '+fmt(lifetime(g[1])),color:RCOL[(i+1)%8]};})
   .filter(function(x){return n(x.val)>0;});
 var nowTotal=sum(groups,function(g){return annualAt(g[1],a0);});
 var lifeTotal=sum(groups,function(g){return lifetime(g[1]);});
 var cnt=sum(groups,function(g){return (g[1]||[]).filter(visionOn).length;});
 var rows=[];
 groups.forEach(function(g){
  (g[1]||[]).forEach(function(it){
   rows.push('<tr><td>'+g[0]+'</td><td>'+esc(it.sub||it.cat||'')+'</td><td>'+n(it.start)+'–'+n(it.end)+' 歲</td>'+
    '<td style="text-align:right">'+fmt(n(it.amount))+'</td><td style="text-align:right">'+(n(it.freq)||1)+' 次/年</td>'+
    '<td>'+(visionOn(it)?'納入':'<span style="color:#8a9aa2">暫不納入</span>')+'</td></tr>');
  });
 });
 return rSub('生活願望（旅遊・休閒・奢侈品）')+
  rBig([
   ['現在每年',fmt(nowTotal)+' 元','#b07d3d'],

  ])+

  rNote('這些是週期性支出，已經整筆計入現金流投影——不是「有餘力再說」的額外項目，而是這份規劃本來就替你留下的預算。')+
  rFold('生活願望逐項明細','<table><tr><th>分類</th><th>類型</th><th>期間</th><th>每次預算</th><th>頻率</th><th>本次規劃</th></tr>'+rows.join('')+'</table>');
}

/* ── 五、財務目標歷程 · 置產缺口 ─────────────────────────────────────────── */
function rPropertyGap(c){
